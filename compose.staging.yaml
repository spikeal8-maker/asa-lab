name: ${COMPOSE_PROJECT_NAME:-asa-lab-staging}

services:
  postgres:
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the private staging environment}

  migration:
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?set a dedicated migration URL in the private staging environment}
      MIGRATION_EXPECT_DATABASE: ${MIGRATION_EXPECT_DATABASE:?attest the exact staging database name}
      MIGRATION_CONFIRM: ${MIGRATION_CONFIRM:?confirm the exact staging database as APPLY:name}
      ASA_APP_DB_PASSWORD: ${ASA_APP_DB_PASSWORD:?set ASA_APP_DB_PASSWORD in the private staging environment}
      ASA_SEED_DEV: 'false'

  api:
    restart: always
    environment:
      NODE_ENV: production
      APP_DATABASE_URL: ${APP_DATABASE_URL:?set APP_DATABASE_URL in the private staging environment}
      ASA_SETTINGS_ENCRYPTION_KEY: ${ASA_SETTINGS_ENCRYPTION_KEY:?set ASA_SETTINGS_ENCRYPTION_KEY in the private staging environment}

  web:
    restart: always
