      - TST-R0-OWNER-DECISION-001
      - TST-R0-POST-MERGE-001
      - TST-R0-GITHUB-STATE-001
      - TST-R0-LEGACY-TRACEABILITY-001
      - TST-R0-REVIEW-PACKETS-001
      - TST-R0-SURFACE-CATALOG-001
      - TST-R0-ELECTRONICS-CATALOG-001
      - TST-R0-FUNCTIONAL-PARITY-SCOPE-001
      - TST-R0-INTERFACE-VIEWER-001
    required_artifacts:
      - docs/delivery/R0_OWNER_DECISION.md
      - docs/delivery/R0_OWNER_DECISION.yaml
      - docs/delivery/R0_VALIDATION_MATRIX.md
      - docs/delivery/R0_FOUNDATION_REVIEW_PR34.md
      - docs/delivery/R0_R1_CANDIDATE_SELECTION.md
      - docs/product/ASA_TINKERCAD_100_PERCENT_SCOPE.yaml
      - docs/product/ASA_PRODUCT_SURFACE_CATALOG.yaml
      - docs/product/ASA_ELECTRONICS_TOOL_CATALOG.yaml
      - docs/product/ASA_ADMIN_CONSOLE_SPEC.md
      - docs/product/ASA_STUDENT_EXPERIENCE_SPEC.md
      - docs/product/interface-catalog.html
    owner_flow: Review six target decisions, all page and tool catalogs, unresolved reference-evidence items and the R0 branch-convergence order.

