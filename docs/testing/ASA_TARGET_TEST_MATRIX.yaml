schema_version: 1.0.0
matrix_id: asa-target-platform-r0-r10-tests
status: inactive_until_r0a_contract_activation
source_execution_plan: docs/delivery/ASA_TARGET_PLATFORM_EXECUTION_PLAN.yaml
source_blueprint: docs/product/ASA_TARGET_PLATFORM_BLUEPRINT.yaml
source_surface_catalog: docs/product/ASA_PRODUCT_SURFACE_CATALOG.yaml
source_functional_parity_scope: docs/product/ASA_TINKERCAD_100_PERCENT_SCOPE.yaml
source_electronics_catalog: docs/product/ASA_ELECTRONICS_TOOL_CATALOG.yaml
activation_transition: R0A_CONTRACT_ACTIVATION

result_states:
  PASS: command or owner gate actually passed
  FAIL: required assertion or command failed
  BLOCKED: mandatory environment or reference evidence unavailable
  NOT_RUN: test was not executed

profiles:
  governance_common:
    tests:
      - TST-TARGET-CONTRACT-001
      - TST-PARITY-CONTRACT-001
      - TST-PROJECT-MAP-001
      - TST-TEST-CATALOG-001
  code_common:
    tests:
      - TST-FORMAT-001
      - TST-LINT-001
      - TST-TYPE-001
      - TST-BOUNDARY-001
      - TST-BUILD-001
      - TST-CONTRACT-001
      - TST-UNIT-001
      - TST-SECRET-001
      - TST-DEPENDENCY-001
      - TST-PORTS-001
      - TST-STARTUP-001
  migration_common:
    tests:
      - TST-MIGRATION-EMPTY-001
      - TST-MIGRATION-EXISTING-001
      - TST-MIGRATION-REPEAT-001
      - TST-MIGRATION-PRESERVATION-001
  security_common:
    tests:
      - TST-TENANT-CONTEXT-001
      - TST-RLS-001
      - TST-AUTHZ-001
      - TST-AUDIT-001
  browser_common:
    tests:
      - TST-A11Y-001
      - TST-BROWSER-CONSOLE-001
      - TST-RESPONSIVE-001
      - TST-DEEP-LINK-001
  owner_evidence:
    owner_gate: true
    tests:
