schema_version: 1.0.0
task_selection_source: docs/execution/current.yaml
registry_scope: supplemental_execution_tests
source_of_truth: docs/testing/active-task-tests.yaml
result_states: [PASS, FAIL, NOT_RUN, BLOCKED]
tests:
  - id: TST-ACCOUNT-CONFIRMATION-UNIT-001
    title: Confirmation deadline, outage fallback, provider proofs and browser state
    suite: authorization
    level: unit
    phase_available: PHASE-12
    required_for: [TASK-ACCOUNT-CONFIRMATION-001]
    command: pnpm test:auth-confirmation
    timeout_seconds: 300
    owner: admin-auth
    artifacts: [auth-confirmation-unit.json]

  - id: TST-ACCOUNT-CONFIRMATION-PG-001
    title: Real PostgreSQL policy, pairing lifecycle, session restrictions and HTTP access
    suite: authorization
    level: system
    phase_available: PHASE-12
    required_for: [TASK-ACCOUNT-CONFIRMATION-001]
    command: pnpm test:auth-confirmation:pg
    timeout_seconds: 600
    owner: admin-auth
    artifacts: [auth-confirmation-postgres.json]

  - id: TST-ACCOUNT-CONFIRMATION-UI-001
    title: Built sign-in and admin confirmation interface at 1440, 1024, 390 and 320 pixels
    suite: e2e
    level: system
    phase_available: PHASE-12
    required_for: [TASK-ACCOUNT-CONFIRMATION-001]
    command: pnpm e2e:auth-confirmation
    timeout_seconds: 1200
    owner: admin-auth
    artifacts: [playwright-report, auth-confirmation-screenshots, exact-build-metadata]

  - id: TST-ACCOUNT-CONFIRMATION-INSTALL-001
    title: Preserve authentication secrets during Windows and Linux installation
    suite: authorization
    level: system
    phase_available: PHASE-12
    required_for: [TASK-ACCOUNT-CONFIRMATION-001]
    command: pnpm test:auth-confirmation:installation
    timeout_seconds: 300
    owner: admin-auth
    artifacts: [installer-fixture-test-output]

  - id: TST-ASA-ACCESS-A-CORE-001
    title: Access A identity, account, authorization, fresh schema and supported upgrade
    suite: authorization
    level: system
    phase_available: PHASE-12
    required_for: [TASK-ACCOUNT-CONFIRMATION-001]
    command: pnpm test:access-a
    timeout_seconds: 1800
    owner: access-a
    artifacts: [vitest-report, migration-report, authorization-matrix]

  - id: TST-ASA-ACCESS-A-E2E-001
    title: Real Access A browser A-J and Account C1, including Seat logout isolation
    suite: e2e
    level: system
    phase_available: PHASE-12
    required_for: [TASK-ACCOUNT-CONFIRMATION-001]
    command: pnpm e2e:access-a
    timeout_seconds: 1800
    owner: access-a
    artifacts: [playwright-report, access-a-desktop-screenshot, access-a-mobile-screenshot]

  - id: TST-ASA-ACCESS-A-REPOSITORY-001
    title: Full integrated repository gate on isolated test data; no production access
    suite: integration
    level: system
    phase_available: PHASE-12
    required_for: [TASK-ACCOUNT-CONFIRMATION-001]
    command: pnpm gate:repository
    timeout_seconds: 3600
    owner: access-a
    artifacts: [repository-report, ci-candidate-sha, migration-report]

  - id: TST-ACCOUNT-SETTINGS-UI-001
    title: Account and Seat settings drafts, routes, keyboard focus and responsive layout
    suite: e2e
    level: system
    phase_available: PHASE-12
    required_for: [TASK-ACCOUNT-CONFIRMATION-001]
    command: pnpm e2e:settings-ui
    timeout_seconds: 1200
    owner: admin-auth
    artifacts: [playwright-report, account-settings-screenshots, seat-settings-screenshots]

  - id: TST-LRN-COURSE-E1-CORE-001
    title: Learning E1 focused canonical direct project and learner access checks
    suite: integration
    level: system
    phase_available: PHASE-12
    required_for: [TASK-LRN-COURSE-001]
    command: pnpm test:learning-vs-002
    timeout_seconds: 1800
    owner: learning
    artifacts: [vitest-report, learning-migration-report, authorization-report]

  - id: TST-LEARNING-CREDENTIAL-READINESS-001
    title: Independent production credentials and sanitized readiness fail before startup or update
    suite: security
    level: unit
    phase_available: PHASE-12
    required_for: [TASK-LRN-COURSE-001]
    command: pnpm exec vitest run apps/api/src/classroom-code-secret.spec.ts apps/api/src/credential-configuration.spec.ts apps/api/src/student-code-protection.spec.ts apps/api/src/health.spec.ts tests/production/credential-readiness.spec.ts
    timeout_seconds: 120
    owner: learning
    artifacts: [vitest-report, credential-readiness-report]

  - id: TST-LRN-COURSE-E1-E2E-001
    title: Learning E1 real learner project submit browser journey
    suite: e2e
    level: system
    phase_available: PHASE-12
    required_for: [TASK-LRN-COURSE-001]
    command: pnpm e2e:learning-vs-002
    timeout_seconds: 1800
    owner: learning
    artifacts: [playwright-report, learning-browser-evidence]

  - id: TST-LRN-COURSE-E1-REPOSITORY-001
    title: Learning E1 final integrated repository gate
    suite: integration
    level: system
    phase_available: PHASE-12
    required_for: [TASK-LRN-COURSE-001]
    command: pnpm gate:repository
    timeout_seconds: 3600
    owner: learning
    artifacts: [repository-report, migration-report, candidate-sha]

  - id: TST-ASA-OBSERVABILITY-CORE-001
    title: Application log collection and browser diagnostics contracts
    suite: integration
    level: system
    phase_available: PHASE-12
    required_for: [TASK-OBSERVABILITY-001]
    command: pnpm test:admin-logs
    timeout_seconds: 1800
    owner: observability
    artifacts: [vitest-report, collector-report]

  - id: TST-ASA-OBSERVABILITY-REPOSITORY-001
    title: Integrated observability repository gate on isolated CI data
    suite: integration
    level: system
    phase_available: PHASE-12
    required_for: [TASK-OBSERVABILITY-001]
    command: pnpm gate:repository
    timeout_seconds: 3600
    owner: observability
    artifacts: [repository-report, ci-candidate-sha]
