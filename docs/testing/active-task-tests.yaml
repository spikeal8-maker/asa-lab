schema_version: 1.0.0
task_selection_source: docs/execution/current.yaml
registry_scope: supplemental_execution_tests
source_of_truth: docs/testing/active-task-tests.yaml
result_states: [PASS, FAIL, NOT_RUN, BLOCKED]
tests:
  - id: TST-ADMIN-AUTH-MAX-CORE-001
    title: Integrated Admin authorization, PostgreSQL isolation and MAX signature boundary
    suite: authorization
    level: system
    phase_available: PHASE-12
    required_for: [TASK-ADMIN-AUTH-STABILITY-001]
    command: pnpm gate:admin-control-plane
    timeout_seconds: 1800
    owner: admin-auth
    artifacts: [vitest-report, migration-report, authorization-matrix]

  - id: TST-ADMIN-AUTH-MAX-E2E-001
    title: Admin navigation and scoped management browser baseline
    suite: e2e
    level: system
    phase_available: PHASE-12
    required_for: [TASK-ADMIN-AUTH-STABILITY-001]
    command: pnpm e2e:admin-control-plane
    timeout_seconds: 1800
    owner: admin-auth
    artifacts: [playwright-report, admin-desktop-screenshot, admin-mobile-screenshot]

  - id: TST-ADMIN-AUTH-MAX-PRODUCTION-001
    title: Durable owner session, real MAX client and exact production revision
    suite: recovery
    level: system
    phase_available: PHASE-12
    required_for: [TASK-ADMIN-AUTH-STABILITY-001]
    command: pnpm gate:repository
    timeout_seconds: 3600
    owner: admin-auth
    artifacts: [owner-evidence-report, production-version-report, recovery-report]
