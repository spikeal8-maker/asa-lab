schema_version: 1.0.0
context: learning
surfaces:
- id: SURF-CLASSROOM-GRADEBOOK
  routes:
  - '#/classrooms/:classroomId'
  implementation:
    files:
    - apps/web/src/pages/ClassroomPage.tsx
    - apps/web/src/components/ClassroomGradebook.tsx
    - apps/web/src/api.ts
    - apps/api/src/learning-assessments.controller.ts
    - apps/api/src/learning-canonical-projection.service.ts
  invariants:
  - LRN-ATT-001
  - LRN-ATT-002
  - LRN-SUB-001
  - LRN-ASM-001
  - LRN-SEL-001
  - LRN-GRD-001
  - LRN-AUTH-001
  - LRN-FBK-001
  tests:
  - TST-LRN-COURSE-E1-CORE-001
  - TST-LRN-COURSE-E1-E2E-001
  controls:
  - id: CTRL-GRADEBOOK-REVIEW
    label: Review or return a learner submission
    change_class: L3_CRITICAL
    files:
    - apps/web/src/components/ClassroomGradebook.tsx
    - apps/web/src/api.ts
    - apps/api/src/learning-assessments.controller.ts
    - apps/api/src/learning-canonical-projection.service.ts
    invariants:
    - LRN-ATT-001
    - LRN-ATT-002
    - LRN-SUB-001
    - LRN-ASM-001
    - LRN-SEL-001
    - LRN-GRD-001
    - LRN-AUTH-001
    tests:
    - TST-LRN-COURSE-E1-CORE-001
    - TST-LRN-COURSE-E1-E2E-001
    commands:
    - review_attempt
    - return_for_revision
  - id: CTRL-GRADEBOOK-SCHEME
    label: Change grading scheme for future work
    change_class: L2_DOMAIN_MUTATION
    files:
    - apps/web/src/components/ClassroomGradebook.tsx
    - apps/web/src/api.ts
    - apps/api/src/learning-assessments.controller.ts
    invariants:
    - LRN-GRD-001
    - LRN-SEL-001
    - LRN-AUTH-001
    tests:
    - TST-LRN-COURSE-E1-CORE-001
    commands:
    - publish_grading_scheme
- id: SURF-AUTHOR-LEARNING-LIBRARY
  routes:
  - '#/challenges'
  implementation:
    files:
    - apps/web/src/App.tsx
    - apps/web/src/pages/AssignmentLibraryPage.tsx
    - apps/web/src/pages/AuthoredMaterialsPage.tsx
    - apps/web/src/components/CoursesPanel.tsx
    - apps/web/src/api.ts
    - apps/api/src/learning-activities.controller.ts
    - apps/api/src/courses.controller.ts
  invariants:
  - LRN-ARCH-001
  - LRN-VER-001
  - LRN-RUN-001
  - LRN-AUTH-001
  - LRN-PRV-001
  tests:
  - TST-LRN-COURSE-E1-CORE-001
  - TST-LRN-COURSE-E1-E2E-001
  controls:
  - id: CTRL-AUTHOR-CREATE-MATERIAL
    label: Create a private authored learning material
    change_class: L2_DOMAIN_MUTATION
    files:
    - apps/web/src/pages/AuthoredMaterialsPage.tsx
    - apps/web/src/api.ts
    - apps/api/src/learning-activities.controller.ts
    invariants:
    - LRN-VER-001
    - LRN-AUTH-001
    tests:
    - TST-LRN-COURSE-E1-CORE-001
    commands:
    - create_authored_activity
  - id: CTRL-AUTHOR-COURSE-BUILDER
    label: Edit and publish course content
    change_class: L2_DOMAIN_MUTATION
    files:
    - apps/web/src/pages/AssignmentLibraryPage.tsx
    - apps/web/src/components/CoursesPanel.tsx
    - apps/web/src/api.ts
    - apps/api/src/courses.controller.ts
    invariants:
    - LRN-ARCH-001
    - LRN-VER-001
    - LRN-RUN-001
    - LRN-AUTH-001
    tests:
    - TST-LRN-COURSE-E1-CORE-001
    - TST-LRN-COURSE-E1-E2E-001
    commands:
    - course_save
    - course_publish
    - course_assign
  - id: CTRL-AUTHOR-DRAFT-FROM-PUBLISHED-VERSION
    label: Create an editable draft of the same root from one exact published version
    change_class: L3_CRITICAL
    files:
    - apps/web/src/components/AuthorVersionHistory.tsx
    - apps/web/src/components/CoursesPanel.tsx
    - apps/web/src/pages/AuthoredMaterialsPage.tsx
    - apps/web/src/api.ts
    - apps/api/src/courses.controller.ts
    - apps/api/src/learning-activities.controller.ts
    - migrations/0137_author_draft_from_published_version.sql
    - tests/courses/author-draft-from-version.pg.spec.ts
    - tests/courses/author-draft-upgrade.pg.spec.ts
    - e2e/learning-author-preview.spec.ts
    invariants:
    - LRN-VER-001
    - LRN-RUN-001
    - LRN-AUTH-001
    tests:
    - TST-LRN-COURSE-E1-CORE-001
    - TST-LRN-COURSE-E1-E2E-001
    commands:
    - course_save
    - course_publish
  - id: CTRL-AUTHOR-PREVIEW-AS-LEARNER
    label: Preview one exact authored activity as a learner without creating learner runtime state
    change_class: L3_CRITICAL
    files:
    - apps/web/src/pages/AuthoredMaterialsPage.tsx
    - apps/web/src/components/AssignmentView.tsx
    - apps/web/src/api.ts
    - apps/api/src/learning-activities.controller.ts
    invariants:
    - LRN-VER-001
    - LRN-PRV-001
    - LRN-AUTH-001
    tests:
    - TST-LRN-COURSE-E1-CORE-001
    - TST-LRN-COURSE-E1-E2E-001
    commands:
    - preview_authored_activity_as_learner
