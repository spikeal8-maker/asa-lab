schema_version: 1.0.0
context: identity
surfaces:
  - id: SURF-STUDENT-PROJECT-DISTRIBUTION
    routes:
      - /api/project-distribution/classrooms/:classroomId/policy
      - /api/project-distribution/classrooms/:classroomId/seats/:seatId
      - /api/projects/:projectId/publication
    implementation:
      files:
        - apps/api/src/project-distribution.controller.ts
        - apps/api/src/public-projects.controller.ts
        - apps/web/src/components/ClassroomProjectSettings.tsx
        - migrations/0273_student_project_distribution.sql
    invariants: [IDA-AUTH-001, IDA-SEAT-PUBLIC-001, IDA-SEAT-PROJECT-001, IDA-REV-001, IDA-CTX-001]
    tests: [TST-STUDENT-PROJECT-POLICY-UNIT-001, TST-STUDENT-PROJECT-POLICY-PG-001, TST-STUDENT-PROJECT-POLICY-E2E-001]
    controls:
      - id: CTRL-STUDENT-PROJECT-DISTRIBUTION
        label: Audited class and Seat distribution policy and explicit immutable publication
        change_class: L3_CRITICAL
        files:
          - apps/api/src/project-distribution.controller.ts
          - apps/api/src/public-projects.controller.ts
          - apps/web/src/components/ClassroomProjectSettings.tsx
          - migrations/0273_student_project_distribution.sql
        commands: [classroom_project_policy_read, classroom_project_policy_write, project_publication_publish_seat, project_distribution_seat_lock, classroom_project_admission_lock]
        invariants: [IDA-AUTH-001, IDA-SEAT-PUBLIC-001, IDA-SEAT-PROJECT-001, IDA-REV-001]
        tests: [TST-STUDENT-PROJECT-POLICY-UNIT-001, TST-STUDENT-PROJECT-POLICY-PG-001, TST-STUDENT-PROJECT-POLICY-E2E-001]
