          - apps/web/src/projects-public/PublicationPanel.tsx
          - apps/web/src/projects-public/CopyPublicProject.tsx
        commands: [classroom_project_policy_read, classroom_project_policy_write, project_publication_publish_seat, project_distribution_seat_lock, classroom_project_admission_lock, admin_publication_acquisition_write, project_publication_acquisition_write, public_project_copy_source_seat]
