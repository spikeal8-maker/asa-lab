        tests: [TST-STUDENT-PROJECT-POLICY-UNIT-001, TST-STUDENT-PROJECT-POLICY-PG-001, TST-STUDENT-PROJECT-POLICY-E2E-001, TST-PROJECT-ACQUISITION-UNIT-001, TST-PROJECT-ACQUISITION-PG-001, TST-PROJECT-ACQUISITION-E2E-001]
