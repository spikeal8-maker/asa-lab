schema_version: 1.0.0
context: identity
surfaces:
  - id: SURF-STUDENT-GAME-ADMISSION
    routes:
      - '#/games'
      - '#/games/:game/:projectId'
      - '#/chess/:projectId/:page'
      - '#/classrooms/:classroomId'
      - /api/games/access
      - /api/games/classrooms/:classroomId/policy
      - /api/games/classrooms/:classroomId/seats/:seatId
      - /api/modules
      - /api/projects
      - /api/projects/:projectId
      - /api/projects/:projectId/draft
      - /api/projects/:projectId/snapshot
      - /api/projects/:projectId/versions
      - /api/projects/:projectId/versions/:versionId/restore
      - /api/projects/:projectId/checkpoints
      - /api/projects/:projectId/duplicate
      - /api/projects/:projectId/status
      - /api/projects/:projectId/properties
      - /api/gallery/:projectId/copy
    implementation:
      files:
        - apps/api/src/app.module.ts
        - apps/api/src/games-access.ts
        - apps/api/src/games-access.controller.ts
        - apps/api/src/games-project-guard.ts
        - apps/api/src/modules.controller.ts
        - apps/api/src/projects.controller.ts
        - apps/api/src/gallery.controller.ts
        - apps/api/src/chess-live.controller.ts
        - apps/api/src/checkers-classroom.controller.ts
        - contexts/projects/application/ports.ts
        - contexts/projects/infrastructure/pg-project.repository.ts
        - contexts/projects/index.ts
        - migrations/0222_classroom_games_policy.sql
        - migrations/0223_classroom_games_admission_transaction.sql
        - migrations/0224_classroom_new_seat_learner_identity.sql
        - apps/web/src/games/game-access-api.ts
        - apps/web/src/games/open-game.ts
        - apps/web/src/pages/GamesPage.tsx
        - apps/web/src/pages/games.css
        - apps/web/src/pages/ClassroomPage.tsx
        - apps/web/src/pages/ClassroomStudentPage.tsx
        - apps/web/src/components/ClassroomGamesSettings.tsx
        - apps/web/src/components/classroom-games-settings.css
        - apps/web/src/modules/ModuleEditorHost.tsx
        - apps/web/src/chess/ChessModuleExperience.tsx
        - apps/web/src/chess/ChessHome.tsx
        - tests/portal/analytics-delivery.pg.spec.ts
    invariants:
      - IDA-AUTH-001
      - IDA-SCOPE-001
      - IDA-SEAT-001
      - IDA-SEAT-PROJECT-001
      - IDA-SEAT-PUBLIC-001
      - IDA-REV-001
      - IDA-CTX-001
    tests:
      - TST-GAMES-ADMISSION-CORE-001
      - TST-GAMES-ADMISSION-PG-001
      - TST-GAMES-ADMISSION-E2E-001
      - TST-PROJECT-SLICE-001
      - TST-OBS-ANALYTICS-DELIVERY-001
    controls:
      - id: CTRL-GAMES-NEW-SEAT-IDENTITY
        label: Initialize canonical learner identity only when issuing a genuinely new StudentCode Seat
        change_class: L3_CRITICAL
        files:
          - migrations/0224_classroom_new_seat_learner_identity.sql
          # Historical denial and first-use principal races remain unchanged.
          - tests/portal/analytics-delivery.pg.spec.ts
        commands: [classroom_management_add_seat]
        invariants: [IDA-SEAT-001, IDA-SCOPE-001, IDA-REV-001]
        tests: [TST-GAMES-ADMISSION-CORE-001, TST-GAMES-ADMISSION-PG-001, TST-GAMES-ADMISSION-E2E-001, TST-OBS-ANALYTICS-DELIVERY-001]
      - id: CTRL-GAMES-CURRENT-ADMISSION
        label: Resolve current Seat before Account and open only verified offline game surfaces
        change_class: L3_CRITICAL
        files:
          - apps/api/src/games-access.ts
          - apps/api/src/games-access.controller.ts
          - apps/api/src/modules.controller.ts
          - apps/web/src/games/game-access-api.ts
          - apps/web/src/games/open-game.ts
          - apps/web/src/pages/GamesPage.tsx
          - apps/web/src/modules/ModuleEditorHost.tsx
          - apps/web/src/chess/ChessModuleExperience.tsx
          - apps/web/src/chess/ChessHome.tsx
        commands:
          - classroom_games_admission_snapshot
        invariants: [IDA-AUTH-001, IDA-SEAT-001, IDA-SEAT-PROJECT-001, IDA-REV-001, IDA-CTX-001]
        tests: [TST-GAMES-ADMISSION-CORE-001, TST-GAMES-ADMISSION-PG-001, TST-GAMES-ADMISSION-E2E-001]
      - id: CTRL-GAMES-CLASS-POLICY
        label: Exact-class teacher sets allow, deny or current participant rating threshold with version conflict handling
        change_class: L3_CRITICAL
        files:
          - apps/api/src/games-access.controller.ts
          - migrations/0222_classroom_games_policy.sql
          - migrations/0223_classroom_games_admission_transaction.sql
          - apps/web/src/components/ClassroomGamesSettings.tsx
          - apps/web/src/pages/ClassroomPage.tsx
          - apps/web/src/games/game-access-api.ts
        commands: [classroom_games_policy_read, classroom_games_policy_write]
        invariants: [IDA-AUTH-001, IDA-SCOPE-001, IDA-REV-001, IDA-CTX-001]
        tests: [TST-GAMES-ADMISSION-CORE-001, TST-GAMES-ADMISSION-PG-001, TST-GAMES-ADMISSION-E2E-001]
      - id: CTRL-GAMES-SEAT-OVERRIDE
        label: Exact-class teacher sets inherit, allow or deny for one Seat independently of SafeMode
        change_class: L3_CRITICAL
        files:
          - apps/api/src/games-access.controller.ts
          - migrations/0222_classroom_games_policy.sql
          - migrations/0223_classroom_games_admission_transaction.sql
          - apps/web/src/components/ClassroomGamesSettings.tsx
          - apps/web/src/pages/ClassroomStudentPage.tsx
          - apps/web/src/games/game-access-api.ts
        commands: [classroom_games_policy_write, classroom_games_teacher_seat_snapshot]
        invariants: [IDA-AUTH-001, IDA-SCOPE-001, IDA-REV-001, IDA-CTX-001]
        tests: [TST-GAMES-ADMISSION-CORE-001, TST-GAMES-ADMISSION-PG-001, TST-GAMES-ADMISSION-E2E-001]
      - id: CTRL-GAMES-PROJECT-ENFORCEMENT
        label: Keep current admission and Project ACL inside each game operation transaction, including lists and replay
        change_class: L3_CRITICAL
        files:
          - apps/api/src/app.module.ts
          - apps/api/src/games-project-guard.ts
          - apps/api/src/projects.controller.ts
          - contexts/projects/application/ports.ts
          - contexts/projects/infrastructure/pg-project.repository.ts
          - contexts/projects/index.ts
          - migrations/0223_classroom_games_admission_transaction.sql
          - apps/api/src/gallery.controller.ts
          - apps/api/src/chess-live.controller.ts
          - apps/api/src/checkers-classroom.controller.ts
        commands: [classroom_games_admission_lock]
        invariants: [IDA-AUTH-001, IDA-SCOPE-001, IDA-SEAT-PROJECT-001, IDA-SEAT-PUBLIC-001, IDA-REV-001]
        tests: [TST-GAMES-ADMISSION-PG-001, TST-PROJECT-SLICE-001]
