schema_version: 1.0.0
contract_id: CAPACITY-DOMAIN
domain: capacity
registry_document_id: CAPACITY-DOMAIN-CONTRACT
master_documents:
  - CAPACITY-SLO-STANDARD

invariants:
  - id: CAP-CORE-001
    level: MUST
    statement: C3000 means 3000 simultaneously active authenticated users and is the platform design target; it does not define minimum developer hardware, require immediate topology expansion or block ordinary coding on a smaller stand.
    master_refs:
      - document: CAPACITY-SLO-STANDARD
        section: "## 2. Обязательный owner capacity contract"
    applies_to: [platform, modules, infrastructure, performance]
    forbid: [treat_idle_tabs_as_c3000, use_p1500_as_current_target, claim_c3000_without_load_evidence, c3000_hardware_as_coding_gate, c3000_topology_as_immediate_migration]

  - id: CAP-AMP-001
    level: MUST
    statement: Every periodic polling, autosave, retry, asset, session refresh, realtime or background operation must calculate amplification at 3000 active users before acceptance.
    master_refs:
      - document: CAPACITY-SLO-STANDARD
        section: "### 2.1. Нормативное правило для разработки"
    applies_to: [polling, autosave, retry, assets, sessions, realtime, background_jobs]
    forbid: [unmeasured_per_user_periodic_work, heavy_full_project_idle_polling, unbounded_retry]

  - id: CAP-LOCAL-001
    level: MUST
    statement: Interactive Scratch, Electronics, 3D and ordinary game execution remains local-first where safe; the generic API is not the per-frame or per-step compute loop for each user.
    master_refs:
      - document: CAPACITY-SLO-STANDARD
        section: "## 3. Принцип local-first"
    applies_to: [scratch, electronics, three_d, games, editor_runtime]
    forbid: [generic_api_per_frame_compute, generic_api_per_step_vm, move_safe_browser_compute_to_core]

  - id: CAP-SLO-001
    level: MUST
    statement: C3000 acceptance must satisfy the canonical latency, error, DB-pool, CPU, RAM and network SLO and accepts zero unexpected logout, zero acknowledged-project loss and zero DB pool timeout.
    master_refs:
      - document: CAPACITY-SLO-STANDARD
        section: "## 5. Core SLO для C3000"
    applies_to: [load_test, release_claim, capacity_acceptance]
    forbid: [capacity_pass_with_project_loss, capacity_pass_with_mass_logout, capacity_pass_with_db_pool_timeout]

  - id: CAP-POLL-001
    level: MUST
    statement: Steady-state change detection must not repeatedly load a full project and history; use realtime invalidation, a lightweight revision endpoint, conditional request or bounded low-frequency fallback.
    master_refs:
      - document: CAPACITY-SLO-STANDARD
        section: "### 6.1. Запрет full-open polling"
    applies_to: [project_sync, electronics, scratch, three_d, games]
    forbid: [periodic_full_open_project_for_change_detection, periodic_full_history_reload]

  - id: CAP-DEV-001
    level: MUST
    statement: Ordinary coding, review, preview and focused tests must not be refused because the available stand is below C3000 load-test hardware; physical C3000 execution is a separate explicit capacity task.
    master_refs:
      - document: CAPACITY-SLO-STANDARD
        section: "## 0. Как читать этот документ — обязательно для агентов"
    applies_to: [development, review, preview, focused_test, ci]
    forbid: [refuse_code_for_c3000_hardware, require_load_host_for_unit_test, require_target_topology_for_preview]

  - id: CAP-HW-001
    level: SHOULD
    statement: Hardware profiles apply only to an explicitly selected development, functional-run, load-benchmark or production-provisioning profile; C3000 reference hardware is not a generic product minimum.
    master_refs:
      - document: CAPACITY-SLO-STANDARD
        section: "## 7. Hardware profiles: development ≠ capacity certification"
    applies_to: [capacity_acceptance, load_benchmark, production_provisioning]
    forbid: [capacity_claim_from_hardware_specs_only, apply_c3000_hardware_to_dev_minimum]

  - id: CAP-TOPO-001
    level: SHOULD
    statement: Additional API replicas, PgBouncer, Redis, realtime gateways and worker pools are optional scaling steps introduced only by a concrete feature need, owner task or measured bottleneck; the capacity target alone does not mandate them.
    master_refs:
      - document: CAPACITY-SLO-STANDARD
        section: "## 9. Возможная mature C3000 topology — не план немедленной миграции"
    applies_to: [api, ingress, pgbouncer, redis, postgres, realtime, workers]
    forbid: [per_process_shared_rate_limit_assumption, api_memory_as_system_source_of_truth, premature_topology_expansion]

  - id: CAP-DB-001
    level: MUST
    statement: Database scale is achieved through bounded pools, pooling, query plans, indexes and measured query reduction; blindly increasing PostgreSQL or API connection counts is not an accepted capacity repair.
    master_refs:
      - document: CAPACITY-SLO-STANDARD
        section: "## 11. Database contract"
    applies_to: [postgres, pgbouncer, api_pool, query_optimization]
    forbid: [blind_pool_growth, unbounded_query, report_reads_starve_classroom_writes]

  - id: CAP-GAME-001
    level: MUST
    statement: If authoritative multiplayer runtime is implemented, its game loop must not become an unbounded generic-API loop; dedicated room partitioning is introduced when that feature requires server authority.
    master_refs:
      - document: CAPACITY-SLO-STANDARD
        section: "## 14. Games architecture"
    applies_to: [games, multiplayer, realtime]
    forbid: [global_game_tick_in_generic_api, unpartitioned_global_room_runtime]

  - id: CAP-THREED-001
    level: MUST
    statement: Interactive 3D work remains browser-local; if a future 3D operation is too heavy for the synchronous API budget, that operation moves to an asynchronous worker rather than forcing worker infrastructure into unrelated tasks.
    master_refs:
      - document: CAPACITY-SLO-STANDARD
        section: "## 15. 3D architecture"
    applies_to: [three_d, render, export, geometry_worker]
    forbid: [multi_second_3d_compute_in_generic_api_request]

  - id: CAP-AI-001
    level: MUST
    statement: If AI inference is introduced, it must be isolated from core authentication and project persistence; this invariant does not require an AI gateway, queue or GPU worker before an AI feature is implemented.
    master_refs:
      - document: CAPACITY-SLO-STANDARD
        section: "## 16. AI architecture"
    applies_to: [ai, gpu, text_generation, image_generation, embeddings]
    forbid: [ai_inference_in_generic_api, gpu_model_in_core_container, ai_failure_breaks_core]

  - id: CAP-EVID-001
    level: MUST
    statement: Capacity PASS requires exact-SHA evidence for CCU, module mix, RPS, latency, CPU, RAM, DB pool, query amplification, save traffic, object storage, transport, cache, retry, queues, logout and project loss.
    master_refs:
      - document: CAPACITY-SLO-STANDARD
        section: "## 18. Observability required for capacity"
    applies_to: [capacity_test, review, release_claim]
    forbid: [capacity_pass_without_exact_sha, capacity_pass_without_metrics, capacity_pass_by_linear_extrapolation]

  - id: CAP-SCALE-001
    level: SHOULD
    statement: Distributed 10k+ topology is introduced only after C3000 optimization and evidence show the single-host failure or resource envelope is exhausted; premature distribution is not a substitute for fixing amplification.
    master_refs:
      - document: CAPACITY-SLO-STANDARD
        section: "## 21. When single-host topology is exhausted"
    applies_to: [scaling, distributed_topology, architecture]
    forbid: [premature_kubernetes_as_capacity_fix, distribute_before_measuring_hotspot]

capacity_profiles:
  class_30: {active_ccu: 30}
  c500: {active_ccu: 500}
  c3000: {active_ccu: 3000, class_size: 30, simultaneous_classes: 100}
  s4500: {active_ccu: 4500}
  t5000: {active_ccu: 5000}
  distributed_next: {active_ccu_min: 10000}

core_slo:
  api_read_p95_ms_max: 400
  api_write_p95_ms_max: 700
  api_p99_ms_max: 1500
  login_p95_ms_max: 2000
  durable_save_p95_ms_max: 1500
  save_error_rate_max: 0.001
  http_5xx_rate_max: 0.001
  unexpected_logout_accepted: 0
  project_loss_after_ack_accepted: 0
  db_pool_timeout_accepted: 0
  db_pool_wait_p95_ms_max: 50
  db_pool_wait_p99_ms_max: 250
  event_loop_lag_p99_ms_max: 100

development_profiles:
  dev_min:
    cpu_cores: 4
    ram_gb: 8
    free_ssd_gb: 30
    network_mbps: 10
    c3000_hardware_gate: false
  dev_recommended:
    cpu_cores_min: 6
    cpu_cores_max: 8
    ram_gb: 16
    free_ssd_gb: 60
  run_min:
    cpu_cores: 4
    ram_gb: 8
    free_ssd_gb: 40
    api_replicas: 1
    redis_required: false
    pgbouncer_required: false

reference_hardware:
  applies_only_to_explicit_capacity_or_provisioning_task: true
  c3000_load_reference:
    cpu_cores: 24
    ram_gb: 128
    public_symmetric_gbps: 1
    fixed_object_storage_size_required: false
  t5000_stress_reference:
    cpu_cores: 32
    ram_gb_min: 192
    ram_gb_preferred: 256
    public_symmetric_gbps: 2.5

implementation_policy:
  current_simple_compose_is_allowed: true
  capacity_target_does_not_authorize_infrastructure_migration: true
  new_service_requires_feature_need_owner_task_or_measured_bottleneck: true
  ordinary_development_must_not_stop_for_c3000_hardware: true
