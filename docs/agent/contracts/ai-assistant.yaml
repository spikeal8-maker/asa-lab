schema_version: 1.0.0
contract_id: AI-DOMAIN
domain: ai-assistant
registry_document_id: AI-ASSISTANT-DOMAIN-CONTRACT
master_documents: [AI-ASSISTANT-SPEC, IDENTITY-ACCESS-V22]
invariants:
  - id: AI-OWNER-001
    statement: A conversation has one immutable Account or StudentSeat principal owner. School history stays with that Seat after Account linkage; personal Account history and quotas remain separate. The current signed session and canonical active linkage authorize each selected school scope, never a client principal or teacher role.
    master_refs:
      - document: AI-ASSISTANT-SPEC
        section: 4 / 12
      - document: IDENTITY-ACCESS-V22
        section: INV-07 / INV-11
    applies_to: [chat_history, chat_message, chat_request_quota, scope_selection, seat_account_link]
    forbid: [account_required_for_seat, history_move_on_link, teacher_private_chat_read, selector_as_authority, cross_owner_retry]
  - id: AI-ADMISSION-001
    statement: School generation is denied by default. An exact-class owner or co-teacher chooses deny, allow or existing participant-rating threshold, with inherit/allow/deny Seat overrides. Inactive Seat/Class and global provider disable cannot be overridden. Teacher rules change admission only; they do not grant chat-content access or change safe-mode/game policies.
    master_refs:
      - document: AI-ASSISTANT-SPEC
        section: 11 / 12
      - document: IDENTITY-ACCESS-V22
        section: INV-11 / INV-12
    applies_to: [school_chat_create, school_chat_send, classroom_ai_settings, participant_rating]
    forbid: [browser_only_permission, global_role_as_class_teacher, null_rating_as_zero, rating_recalculation, ai_permission_as_content_permission]
  - id: AI-REPLAY-001
    statement: New generation rechecks teacher admission at the SQL boundary before shared paid reservation. A durable request ID is single-use per stable owner; replay returns the existing result without a provider call. Deletion, cancellation, linking and policy changes do not refund quota. Exact teacher writes use revision checks and immutable request receipts.
    master_refs:
      - document: AI-ASSISTANT-SPEC
        section: 13 / Проверяемое включение текстового чата
      - document: IDENTITY-ACCESS-V22
        section: INV-11
    applies_to: [provider_admission, request_replay, quota, policy_write]
    forbid: [automatic_paid_retry, delete_refunds_quota, reused_request_changes_payload, lost_response_new_mutation]
  - id: AI-SESSION-001
    statement: AI resolves existing Seat principals through the same trusted session use case without initializing or repairing identity. Missing principals, invalid/expired/revoked sessions and wrong class lineage fail closed. Revoked AI permission preserves own history and Stop, but forbids new generation; an already admitted operation may finish.
    master_refs:
      - document: AI-ASSISTANT-SPEC
        section: 12 / 13
      - document: IDENTITY-ACCESS-V22
        section: INV-07 / INV-11
    applies_to: [seat_session, principal_resolution, account_verification_guard, ai_revocation, stream_stop]
    forbid: [identity_repair_on_read, stale_cookie_account_fallback, teacher_revoke_erases_history]
  - id: AI-UI-SCOPE-001
    statement: Changing personal/school chat scope replaces the conversation state, including draft, history cursors, request IDs and stream. The permission state remains actionable at supported widths; teacher settings expose admission and rating, never private messages.
    master_refs:
      - document: AI-ASSISTANT-SPEC
        section: 3 / 4 / 13
      - document: IDENTITY-ACCESS-V22
        section: §31
    applies_to: [chat_scope_selector, chat_composer, classroom_ai_settings]
    forbid: [stale_scope_response, cross_scope_draft_send, teacher_message_preview]
