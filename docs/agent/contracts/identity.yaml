schema_version: 1.0.0
contract_id: IDA-DOMAIN
domain: identity
registry_document_id: IDENTITY-DOMAIN-CONTRACT
master_documents:
  - IDENTITY-ACCESS-V22

invariants:
  - id: IDA-ACC-001
    statement: A personal Account and Personal Workspace do not require a school or organization.
    master_refs:
      - document: IDENTITY-ACCESS-V22
        section: INV-01
    applies_to: [account, personal_workspace, registration]
    forbid: [school_required_for_account, organization_as_account_parent]

  - id: IDA-SCOPE-001
    statement: One Account may combine activities, but every privileged responsibility is scoped; personae and UI modes are never global authorization roles.
    master_refs:
      - document: IDENTITY-ACCESS-V22
        section: INV-03 / INV-04 / INV-05
    applies_to: [account, grants, capabilities, navigation]
    forbid: [global_user_role, persona_as_authority, ui_mode_as_grant]
  - id: IDA-AUTH-001
    statement: Sensitive access is decided server-side from the authenticated actor, trusted resource lineage, active grants, safety policy and current resource state; client IDs and hidden buttons are not authority.
    master_refs:
      - document: IDENTITY-ACCESS-V22
        section: INV-11 / INV-12
    applies_to: [authorization, resource_access, mutation, navigation]
    forbid: [client_claimed_scope, client_claimed_role, hidden_button_as_authorization]

  - id: IDA-CAP-001
    statement: Content authoring and teaching are separate capabilities; enabling either preserves the same Account and personal work and does not grant unrelated roster or content rights.
    master_refs:
      - document: IDENTITY-ACCESS-V22
        section: INV-04 / INV-05
    applies_to: [content_author, educator, account_capability]
    forbid: [author_implies_teacher, teacher_implies_author, capability_switch_replaces_account]

  - id: IDA-PRODUCT-001
    statement: ASA Lab starts from one personal Account shell; learner, author, educator and organization duties are additive contexts, never replacement account types or a registration-time role choice. After proven Seat-to-Account linking, school learning appears inside the ordinary Account shell and personal projects/community/knowledge remain independent.
    master_refs:
      - document: IDENTITY-ACCESS-V22
        section: §7 / §10
    applies_to: [account, navigation, student_seat, account_link, capabilities]
    forbid: [registration_role_picker, student_account_type, teacher_account_type, linked_seat_replaces_personal_account]

  - id: IDA-SEAT-PUBLIC-001
    statement: A StudentSeat without Account may read public Community and Knowledge content when safety/publication policy allows; long-lived personal actions outside school scope require an Account or an explicitly approved Seat policy, while school assignments remain available through the learner context.
    master_refs:
      - document: IDENTITY-ACCESS-V22
        section: §7 / §11
    applies_to: [student_seat, public_knowledge, public_projects, account_link]
    forbid: [registration_required_for_public_read, seat_publication_as_account, seat_global_personal_storage_by_default]

  - id: IDA-SEAT-PROJECT-001
    statement: StudentSeat project create, duplicate, restore and save operations always resolve to an exact assignment, class-scoped learner project or explicitly allowed safe-practice scope; they never create an Account Personal Workspace or public Account identity implicitly.
    master_refs:
      - document: IDENTITY-ACCESS-V22
        section: §7 / §12 / §33
    applies_to: [student_seat, project_create, project_duplicate, project_restore, editor_host]
    forbid: [seat_creates_personal_workspace, seat_project_action_implies_public_identity, implicit_cross_scope_project_copy]

  - id: IDA-SEAT-001
    statement: StudentSeat access works without prior Account registration; a class code locates a class but does not by itself authenticate an arbitrary learner profile.
    master_refs:
      - document: IDENTITY-ACCESS-V22
        section: INV-02 / UI-06
    applies_to: [student_seat, class_code, classroom_entry]
    forbid: [account_required_for_seat, class_code_as_personal_credential, child_list_from_class_code]
  - id: IDA-CRED-001
    statement: The current Student Code is repeat-readable and printable only by the authorized credential manager of the exact class; readback and printing never rotate credentials or alter sessions/history. Account passwords and temporary activation tokens remain separate mechanisms.
    master_refs:
      - document: IDENTITY-ACCESS-V22
        section: '### 9.4.'
    applies_to: [student_seat, credential_issue, credential_reset, roster_batch]
    forbid: [unauthorized_code_readback, credential_in_logs, student_code_in_class_qr, silent_reset_on_lost_response, print_rotates_code]

  - id: IDA-LINK-001
    statement: Linking a StudentSeat to an Account preserves the same verified scoped learning history and never creates or silently merges a second history.
    master_refs:
      - document: IDENTITY-ACCESS-V22
        section: INV-07
    applies_to: [student_seat, account_link, learner_history]
    forbid: [merge_by_name, merge_by_email_guess, duplicate_history_on_link]

  - id: IDA-REV-001
    statement: Revoking one scoped access path does not delete the Account, independent grants or historical records; stale sessions, caches or UI state cannot continue the revoked authority.
    master_refs:
      - document: IDENTITY-ACCESS-V22
        section: INV-08 / INV-11
    applies_to: [grant, membership, session, revocation]
    forbid: [revoke_deletes_history, stale_token_bypasses_revoke, cross_scope_revoke]

  - id: IDA-CTX-001
    statement: Workspace and context navigation is derived from server-issued scopes; delayed responses from an old context must not populate a newly selected context.
    master_refs:
      - document: IDENTITY-ACCESS-V22
        section: '§31'
    applies_to: [workspace_switch, context_switch, navigation_cache]
    forbid: [client_invented_workspace, stale_context_response, organization_required_for_teaching]
  - id: IDA-PROFILE-001
    statement: Profile data, avatar, presentation preferences and access capabilities are separate operations; the profile form has no role picker and must not grant permissions.
    master_refs:
      - document: IDENTITY-ACCESS-V22
        section: UI-01 / §36
    applies_to: [account_profile, avatar, preferences, capabilities]
    forbid: [profile_role_picker, profile_save_grants_access, avatar_update_overwrites_profile]

  - id: IDA-SESSION-001
    statement: Authentication methods and active sessions use server state; disconnect/revoke is explicit and must not silently remove the last usable login/recovery path.
    master_refs:
      - document: IDENTITY-ACCESS-V22
        section: UI-02
    applies_to: [login_method, account_session, password, max_provider]
    forbid: [provider_guess_as_state, revoke_wrong_session, disconnect_last_login_silently]

  - id: IDA-ORG-001
    statement: Organization membership is optional and scoped; organization administration never inherits employees' personal projects or all learner detail automatically.
    master_refs:
      - document: IDENTITY-ACCESS-V22
        section: INV-09
    applies_to: [organization, organization_membership, personal_workspace]
    forbid: [organization_owns_personal_projects, org_admin_reads_all_learning, school_name_grants_rights]

  - id: IDA-ORG-002
    statement: Organization is a workspace opened by the same Account, never a separate account type. Its People view separates staff from scoped learner profiles, and its classes/courses/learning/analytics pages are scoped views of canonical resources rather than a second learning backend.
    master_refs:
      - document: IDENTITY-ACCESS-V22
        section: §14 / §17 / UI-33–UI-37
    applies_to: [organization, navigation, organization_analytics, classroom, course_run]
    forbid: [organization_account_type, global_school_user_directory, duplicate_org_grade_engine, organization_workspace_in_personal_profile_only]

  - id: IDA-MAX-001
    statement: MAX is an Account authentication or delivery provider, not a StudentSeat credential or school role. Seat-to-Account linking never binds MAX automatically, and login through MAX never opts the Account into all external notifications.
    master_refs:
      - document: IDENTITY-ACCESS-V22
        section: §10 / §16
    applies_to: [account, max_provider, student_seat, notifications]
    forbid: [max_required_for_student_seat, max_as_school_identity, max_login_implies_all_notifications]
  - id: IDA-CRED-002
    statement: Automatically generated Student Codes are six characters by default, use cryptographic randomness and the
      approved mixed-case safe alphabet without visually confusable symbols, and are not derived from learner names,
      UUIDs or row indexes. Student Code lookup and uniqueness are case-sensitive. Authorized exact-class staff may
      replace a code with an A-Z/a-z/0-9 value of length 4..10; automatic safe-alphabet restrictions do not apply to
      staff-selected replacements. Rotation invalidates the previous code and active Seat sessions without changing
      learner identity or history.
    master_refs:
    - document: IDENTITY-ACCESS-V22
      section: §9.2 / §9.4
    applies_to:
    - student_code
    - roster_batch
    - credential_rotation
    forbid:
    - public_seed_credential
    - plaintext_log
    - rotation_changes_learner_identity
  - id: IDA-SEAT-002
    statement: StudentSeat admission uses failure-only rate budgets of 60 invalid resolve/source/10m, 5 invalid
      candidate/class/10m, 180 invalid source+class/10m and 300 invalid source/10m; valid requests do not consume those
      budgets, and the class-only QR uses https://asa-lab.ru without Student Code.
    master_refs:
    - document: IDENTITY-ACCESS-V22
      section: §9.2 / §9.3
    applies_to:
    - class_qr
    - student_seat_sign_in
    - rate_limit
    forbid:
    - wrong_public_origin
    - qr_contains_student_code
    - normal_class_batch_lockout
  - id: IDA-CRED-003
    statement: Current Student Code readback, rotation and session revocation are separate class-scoped permissions.
      Protected storage is AES-256-GCM plus separate HMAC-SHA-256 lookup keys outside the database; retired codes
      cannot be reused in the same class and replaying an older rotation never reveals stale plaintext as current.
    master_refs:
    - document: IDENTITY-ACCESS-V22
      section: AES-256-GCM
    applies_to:
    - student_code_storage
    - credential_readback
    - credential_rotation
    - seat_session_revocation
    forbid:
    - roster_read_implies_code_read
    - encryption_key_in_database
    - retired_code_reuse
    - stale_rotation_reactivates_code
  - id: IDA-CRED-004
    statement: Student Code issue/readback/rotation/session-revocation authority follows active exact-class staff scope,
      not a hard-coded owner-only role. Existing owner and co-teacher class memberships remain authorized. Coordinator,
      curator, school/organization manager or administrator roles receive credential authority only when their effective
      grant includes the exact class. A temporary substitute uses the same class-scoped staff grant with an explicit
      validity window; expiry or revoke ends credential authority fail-closed. Production Class Code secret remains
      explicit, stable and independent from DB credentials, and protected-code rollout fences legacy writers.
    master_refs:
    - document: IDENTITY-ACCESS-V22
      section: 'Матрица управления Student Code (TARGET E1)'
    - document: IDENTITY-ACCESS-V22
      section: '#### 9.4.1. Class Code secret and deployment secret boundary'
    applies_to:
    - classroom_owner
    - classroom_co_teacher
    - class_scoped_staff
    - temporary_substitute_staff
    - organization_staff
    - student_code_storage
    - class_code_secret
    - deployment_recovery
    forbid:
    - role_name_without_exact_class_scope_grants_credentials
    - organization_membership_without_class_scope_grants_credentials
    - expired_or_revoked_class_grant_keeps_credentials
    - owner_only_regression_for_existing_co_teacher_access
    - database_password_as_production_class_code_secret
    - old_writer_during_protected_code_backfill
    - installed_acceptance_with_legacy_predictable_codes
