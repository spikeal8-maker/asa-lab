<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASA Lab — карта проекта</title>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.34.0/dist/cytoscape.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <style>
    :root { color-scheme: dark; --bg:#101216; --panel:#181c22; --panel2:#202630; --text:#eef2f6; --muted:#aeb8c5; --border:#333c49; --accent:#8db6ff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    header { display:flex; align-items:center; gap:16px; padding:14px 18px; border-bottom:1px solid var(--border); background:var(--panel); }
    header h1 { margin:0; font-size:18px; white-space:nowrap; }
    #focusText { color:var(--muted); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    main { display:grid; grid-template-columns:310px minmax(0,1fr) 360px; height:calc(100vh - 57px); }
    aside { overflow:auto; padding:14px; background:var(--panel); }
    aside.left { border-right:1px solid var(--border); }
    aside.right { border-left:1px solid var(--border); }
    #cy { min-width:0; min-height:0; }
    label { display:block; margin:12px 0 6px; color:var(--muted); font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; }
    input,select,button { width:100%; border:1px solid var(--border); border-radius:8px; background:var(--panel2); color:var(--text); padding:9px 10px; font:inherit; }
    button { cursor:pointer; margin-top:8px; }
    button:hover { border-color:var(--accent); }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px; }
    .stat { border:1px solid var(--border); border-radius:8px; padding:10px; background:var(--panel2); }
    .stat b { display:block; font-size:20px; }
    .stat span,.muted { color:var(--muted); font-size:12px; }
    .legend { display:grid; gap:7px; margin-top:8px; }
    .legend-item { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:13px; }
    .dot { width:11px; height:11px; border-radius:50%; flex:0 0 auto; }
    .queue { margin:8px 0 0; padding:0; list-style:none; display:grid; gap:7px; }
    .queue li { border:1px solid var(--border); border-radius:8px; padding:8px; background:var(--panel2); font-size:12px; color:var(--muted); cursor:pointer; }
    .queue strong { color:var(--text); }
    .detail-empty { color:var(--muted); line-height:1.5; }
    .detail h2 { margin:0 0 6px; font-size:20px; }
    .badge { display:inline-block; margin:3px 5px 3px 0; padding:3px 7px; border:1px solid var(--border); border-radius:999px; color:var(--muted); font-size:12px; }
    .detail p { color:var(--muted); line-height:1.55; }
    .detail dl { display:grid; grid-template-columns:105px 1fr; gap:7px 10px; font-size:13px; }
    .detail dt { color:var(--muted); }
    .detail dd { margin:0; word-break:break-word; }
    .links { margin:10px 0 0; padding-left:18px; color:var(--muted); font-size:13px; }
    #notice { display:none; padding:12px 18px; background:#6b3030; color:white; }
    @media (max-width:1100px) { main { grid-template-columns:260px 1fr; } aside.right { display:none; } }
    @media (max-width:720px) { main { grid-template-columns:1fr; } aside.left { display:none; } }
  </style>
</head>
<body>
  <div id="notice"></div>
  <header><h1>ASA Lab — карта проекта</h1><div id="focusText"></div></header>
  <main>
    <aside class="left">
      <label for="search">Поиск</label><input id="search" type="search" placeholder="класс, задача, PostgreSQL…">
      <label for="status">Статус</label><select id="status"><option value="">Все статусы</option></select>
      <label for="layer">Слой</label><select id="layer"><option value="">Все слои</option></select>
      <label for="kind">Тип узла</label><select id="kind"><option value="">Все типы</option></select>
      <div class="row"><button id="fit">Показать всё</button><button id="focus">Текущий фокус</button></div>
      <div class="row"><button id="layout">Перестроить</button><button id="reset">Сбросить</button></div>
      <div class="stats"><div class="stat"><b id="nodeCount">0</b><span>узлов видно</span></div><div class="stat"><b id="edgeCount">0</b><span>связей видно</span></div></div>
      <label>Статусы</label><div id="legend" class="legend"></div>
      <label>Очередь исполнения</label><ol id="queue" class="queue"></ol>
    </aside>
    <div id="cy" aria-label="Интерактивный граф проекта"></div>
    <aside class="right"><div id="detail" class="detail-empty">Выберите узел. Здесь появятся назначение, статус, путь, фаза и связи.</div></aside>
  </main>
<script>
const statusColors={planned:'#6f7b8a',blocked:'#c65f5f',ready:'#4ca66b',in_progress:'#d6a84d',in_review:'#7e79d6',done:'#3aa6a0',deprecated:'#555b64'};
const kindShapes={actor:'ellipse',platform:'round-rectangle',plane:'round-rectangle',application:'round-rectangle',bounded_context:'round-rectangle',worker_pool:'hexagon',data_store:'barrel',integration:'diamond',observability:'diamond',sdk:'round-rectangle',subject_module:'round-rectangle',document:'rectangle',roadmap_phase:'tag',task:'round-tag'};
let map,cy;
const $=id=>document.getElementById(id);
function fail(message){$('notice').textContent=message;$('notice').style.display='block';}
function unique(field){return [...new Set(map.nodes.map(n=>n[field]).filter(Boolean))].sort();}
function addOptions(id,values){const select=$(id);for(const value of values){const option=document.createElement('option');option.value=value;option.textContent=value;select.append(option);}}
function runLayout(){cy.layout({name:'cose',animate:false,fit:true,padding:36,nodeRepulsion:9500,idealEdgeLength:110,edgeElasticity:120,nestingFactor:1.2,numIter:1200,randomize:false}).run();}
function visibleCounts(){$('nodeCount').textContent=cy.nodes(':visible').length;$('edgeCount').textContent=cy.edges(':visible').length;}
function applyFilters(){
  const query=$('search').value.trim().toLowerCase(),status=$('status').value,layer=$('layer').value,kind=$('kind').value;
  cy.batch(()=>{
    cy.elements().show();
    cy.nodes().forEach(node=>{
      const text=[node.id(),node.data('label'),node.data('summary'),node.data('path'),node.data('phase')].join(' ').toLowerCase();
      const show=(!query||text.includes(query))&&(!status||node.data('status')===status)&&(!layer||node.data('layer')===layer)&&(!kind||node.data('kind')===kind);
      if(!show)node.hide();
    });
    cy.edges().forEach(edge=>{if(edge.source().hidden()||edge.target().hidden())edge.hide();});
  });
  visibleCounts();
}
function selectNode(id){const node=cy.getElementById(id);if(!node.length)return;cy.elements().unselect();node.select();cy.animate({center:{eles:node},zoom:Math.max(cy.zoom(),1.15)},{duration:250});showDetail(node);}
function showDetail(node){
  const data=node.data(),incoming=node.incomers('edge').map(e=>`${e.source().data('label')} → ${e.data('type')}`),outgoing=node.outgoers('edge').map(e=>`${e.data('type')} → ${e.target().data('label')}`);
  const external=data.issue?`<a href="${data.issue}" target="_blank" rel="noopener">Открыть Issue/PR</a>`:'';
  $('detail').className='detail';
  $('detail').innerHTML=`<h2>${escapeHtml(data.label)}</h2><span class="badge">${escapeHtml(data.id)}</span><span class="badge">${escapeHtml(data.kind)}</span><span class="badge">${escapeHtml(data.status)}</span><p>${escapeHtml(data.summary||'')}</p><dl><dt>Слой</dt><dd>${escapeHtml(data.layer||'—')}</dd><dt>Фаза</dt><dd>${escapeHtml(data.phase||'—')}</dd><dt>Путь</dt><dd>${escapeHtml(data.path||'—')}</dd><dt>Ссылка</dt><dd>${external||'—'}</dd></dl><label>Входящие связи</label><ul class="links">${incoming.length?incoming.map(x=>`<li>${escapeHtml(x)}</li>`).join(''):'<li>нет</li>'}</ul><label>Исходящие связи</label><ul class="links">${outgoing.length?outgoing.map(x=>`<li>${escapeHtml(x)}</li>`).join(''):'<li>нет</li>'}</ul>`;
}
function escapeHtml(value){return String(value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
async function init(){
  if(typeof cytoscape==='undefined'||typeof jsyaml==='undefined')throw new Error('Не загрузились Cytoscape.js или js-yaml. Проверьте сеть.');
  const response=await fetch('project-map.yaml',{cache:'no-store'});if(!response.ok)throw new Error(`Не удалось загрузить project-map.yaml: HTTP ${response.status}`);
  map=jsyaml.load(await response.text());
  const nodeIds=new Set(map.nodes.map(n=>n.id));for(const edge of map.edges){if(!nodeIds.has(edge.from)||!nodeIds.has(edge.to))throw new Error(`Некорректная связь ${edge.from} → ${edge.to}`);}
  const elements=[...map.nodes.map(n=>({data:{...n}})),...map.edges.map((e,i)=>({data:{id:`edge-${i}`,source:e.from,target:e.to,type:e.type,label:e.label||e.type}}))];
  cy=cytoscape({container:$('cy'),elements,wheelSensitivity:.2,minZoom:.07,maxZoom:3,style:[
    {selector:'node',style:{'background-color':e=>statusColors[e.data('status')]||'#6f7b8a',label:'data(label)',color:'#eef2f6','font-size':11,'text-wrap':'wrap','text-max-width':115,'text-valign':'center','text-halign':'center','border-width':1,'border-color':'#d8dee8','border-opacity':.35,width:60,height:60,shape:e=>kindShapes[e.data('kind')]||'ellipse'}},
    {selector:'node[kind="platform"]',style:{width:92,height:92,'font-size':14,'font-weight':700}},
    {selector:'node[kind="task"]',style:{width:98,height:56,'font-size':10}},
    {selector:'edge',style:{width:1.2,'line-color':'#657184','target-arrow-color':'#657184','target-arrow-shape':'triangle','curve-style':'bezier',opacity:.58}},
    {selector:'edge[type="depends_on"]',style:{'line-style':'dashed','line-color':'#c65f5f','target-arrow-color':'#c65f5f'}},
    {selector:':selected',style:{'border-width':4,'border-color':'#ffffff','line-color':'#ffffff','target-arrow-color':'#ffffff',opacity:1}},
    {selector:'.faded',style:{opacity:.12}}
  ]});
  addOptions('status',unique('status'));addOptions('layer',unique('layer'));addOptions('kind',unique('kind'));
  for(const [status,description] of Object.entries(map.status_definitions||{})){const item=document.createElement('div');item.className='legend-item';item.innerHTML=`<span class="dot" style="background:${statusColors[status]||'#777'}"></span><span><strong>${escapeHtml(status)}</strong> — ${escapeHtml(description)}</span>`;$('legend').append(item);}
  for(const item of (map.execution_queue||[])){const li=document.createElement('li');const task=map.nodes.find(n=>n.id===item.task_id);li.innerHTML=`<strong>${item.position}. ${escapeHtml(item.task_id)}</strong><br>${escapeHtml(task?.label||item.instruction)}`;li.onclick=()=>selectNode(item.task_id);$('queue').append(li);}
  $('focusText').textContent=`Фокус: ${map.project.current_focus} · версия карты ${map.map_version}`;
  ['search','status','layer','kind'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',applyFilters));
  $('fit').onclick=()=>cy.fit(cy.elements(':visible'),40);$('focus').onclick=()=>selectNode(map.project.current_focus);$('layout').onclick=runLayout;$('reset').onclick=()=>{['search','status','layer','kind'].forEach(id=>$(id).value='');applyFilters();runLayout();};
  cy.on('tap','node',event=>showDetail(event.target));cy.on('mouseover','node',event=>{const n=event.target;cy.elements().addClass('faded');n.removeClass('faded');n.connectedEdges().removeClass('faded');n.neighborhood('node').removeClass('faded');});cy.on('mouseout','node',()=>cy.elements().removeClass('faded'));
  runLayout();visibleCounts();selectNode(map.project.current_focus);
}
init().catch(error=>{console.error(error);fail(`${error.message} Запускайте viewer через HTTP: python -m http.server 8080`);});
</script>
</body>
</html>
