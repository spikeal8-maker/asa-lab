<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASA Lab — Project Map</title>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.34.0/dist/cytoscape.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <style>
    :root{color-scheme:dark;--bg:#10151b;--panel:#182029;--line:#344150;--text:#eef4f8;--muted:#aab8c4;--accent:#6eb7de;--bad:#e57c7c}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}
    header{display:flex;justify-content:space-between;gap:20px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
    header h1{margin:0;font-size:18px} #focusText{color:var(--muted)}
    main{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 54px)}
    aside{padding:14px;overflow:auto;border-right:1px solid var(--line);background:var(--panel)}
    #cy{min-width:0;min-height:0}.card{padding:10px;margin-bottom:8px;border:1px solid var(--line);border-radius:9px;background:#202a35}
    .card.current{border-color:var(--accent)}.card b{display:block}.card small{color:var(--muted)}
    label{display:block;margin:14px 0 6px;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase}
    input,select,button{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:#202a35;color:var(--text)}
    button{cursor:pointer;margin-top:8px} #notice{display:none;padding:12px;background:#702f35;color:white}
    @media(max-width:760px){main{grid-template-columns:1fr}aside{display:none}}
  </style>
</head>
<body>
  <div id="notice"></div>
  <header><h1>ASA Lab — карта проекта</h1><div id="focusText"></div></header>
  <main>
    <aside>
      <label for="search">Поиск</label>
      <input id="search" type="search" placeholder="Account, Portal, Electronics…">
      <label for="status">Статус</label>
      <select id="status"><option value="">Все</option></select>
      <button id="fit">Показать всё</button>
      <label>Execution queue</label>
      <div id="queue"></div>
    </aside>
    <div id="cy" aria-label="Интерактивная карта ASA Lab"></div>
  </main>
<script>
const statusColors={planned:'#6f7b8a',blocked:'#c65f5f',ready:'#4ca66b',in_progress:'#d6a84d',in_review:'#7e79d6',done:'#3aa6a0',deprecated:'#555b64'};
const $=id=>document.getElementById(id);
let map,manifest,cy;
function fail(message){$('notice').textContent=message;$('notice').style.display='block';throw new Error(message);}
function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function validateContracts(){
  if(!map?.project||!Array.isArray(map.nodes)||!Array.isArray(map.edges)||!Array.isArray(manifest?.tasks))fail('Некорректный project map или EXECUTION_MANIFEST.yaml.');
  const ids=new Set(map.nodes.map(node=>node.id));
  for(const edge of map.edges){if(!ids.has(edge.from)||!ids.has(edge.to))fail(`Некорректная связь ${edge.from} → ${edge.to}`);}
  const manifestOrder=[...manifest.tasks].sort((a,b)=>a.position-b.position).map(task=>task.task_id);
  const mapOrder=[...(map.execution_queue||[])].sort((a,b)=>a.position-b.position).map(task=>task.task_id);
  if(JSON.stringify(manifestOrder)!==JSON.stringify(mapOrder))fail(`Queue mismatch: manifest=${manifestOrder.join(' → ')}; map=${mapOrder.join(' → ')}`);
  for(const task of manifest.tasks){if(!ids.has(task.task_id))fail(`Отсутствует task node ${task.task_id}`);}
  const focus=map.project.current_focus;
  if(focus===null){
    const unfinished=manifest.tasks.filter(task=>task.status!=='done').map(task=>task.task_id);
    if(unfinished.length)fail(`current_focus null, но queue не завершена: ${unfinished.join(', ')}`);
  }else if(!manifestOrder.includes(focus)){
    fail(`current_focus ${focus} отсутствует в execution manifest`);
  }
}
function renderQueue(){
  const focus=map.project.current_focus;
  $('queue').innerHTML=[...manifest.tasks].sort((a,b)=>a.position-b.position).map(task=>`<div class="card ${task.task_id===focus?'current':''}" data-task="${escapeHtml(task.task_id)}"><b>${escapeHtml(task.task_id)}</b><small>${escapeHtml(task.status||'unknown')} · ${escapeHtml(task.delivery_stage)} · architecture_horizon=${escapeHtml(task.architecture_horizon)}</small></div>`).join('');
  document.querySelectorAll('[data-task]').forEach(card=>card.addEventListener('click',()=>selectNode(card.dataset.task)));
}
function selectNode(id){const node=cy.getElementById(id);if(!node.length)return;cy.elements().unselect();node.select();cy.animate({center:{eles:node},zoom:Math.max(cy.zoom(),1.1)},{duration:250});}
function applyFilters(){
  const query=$('search').value.trim().toLowerCase();const status=$('status').value;
  cy.batch(()=>{cy.elements().show();cy.nodes().forEach(node=>{const text=[node.id(),node.data('label'),node.data('summary')].join(' ').toLowerCase();if((query&&!text.includes(query))||(status&&node.data('status')!==status))node.hide();});cy.edges().forEach(edge=>{if(edge.source().hidden()||edge.target().hidden())edge.hide();});});
}
async function init(){
  if(typeof cytoscape==='undefined'||typeof jsyaml==='undefined')fail('Не загрузились Cytoscape.js или js-yaml.');
  const [mapResponse,manifestResponse]=await Promise.all([fetch('project-map.yaml',{cache:'no-store'}),fetch('../delivery/EXECUTION_MANIFEST.yaml',{cache:'no-store'})]);
  if(!mapResponse.ok||!manifestResponse.ok)fail('Не удалось загрузить Project Map или Execution Manifest.');
  map=jsyaml.load(await mapResponse.text());manifest=jsyaml.load(await manifestResponse.text());validateContracts();
  const statuses=[...new Set(map.nodes.map(node=>node.status))].sort();for(const value of statuses){const option=document.createElement('option');option.value=value;option.textContent=value;$('status').append(option);}
  const elements=[...map.nodes.map(node=>({data:{...node}})),...map.edges.map((edge,index)=>({data:{id:`edge-${index}`,source:edge.from,target:edge.to,type:edge.type,label:edge.label||edge.type}}))];
  cy=cytoscape({container:$('cy'),elements,style:[
    {selector:'node',style:{label:'data(label)','background-color':node=>statusColors[node.data('status')]||'#6f7b8a',color:'#eef4f8','font-size':11,'text-wrap':'wrap','text-max-width':110,'text-valign':'center','text-halign':'center','border-width':1,'border-color':'#d9e2e8',width:66,height:66}},
    {selector:'node[kind="task"]',style:{shape:'round-rectangle',width:118,height:58}},
    {selector:'node[kind="program"]',style:{shape:'star',width:92,height:92}},
    {selector:'edge',style:{width:1.2,'line-color':'#657184','target-arrow-color':'#657184','target-arrow-shape':'triangle','curve-style':'bezier',opacity:.65}},
    {selector:'edge[type="depends_on"]',style:{'line-style':'dashed','line-color':'#c65f5f','target-arrow-color':'#c65f5f'}},
    {selector:':selected',style:{'border-width':4,'border-color':'#ffffff'}}
  ],layout:{name:'cose',animate:false,padding:35}});
  $('focusText').textContent=map.project.current_focus===null?'Активной задачи нет · queue completed':`Текущий focus: ${map.project.current_focus}`;
  renderQueue();$('search').addEventListener('input',applyFilters);$('status').addEventListener('change',applyFilters);$('fit').addEventListener('click',()=>cy.fit(undefined,35));
}
init().catch(error=>{console.error(error);if(!$('notice').textContent){$('notice').textContent=error.message;$('notice').style.display='block';}});
</script>
</body>
</html>
