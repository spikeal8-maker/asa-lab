  - {id: MOD-ELECTRONICS, label: Electronics M1, kind: subject_module, layer: modules, status: in_progress, summary: "The real project editor groups owner production assets into deterministic categories, families and persisted physical variants; unsupported candidates are isolated and disabled. Draft saves are ordered and the saved indicator reports only the document the server actually holds. main carries the canonical owner runtime assets and the audit material that records their provenance, 697 files in all, each verified byte-exact against the hash one of the two owner manifests records for it.", path: contexts/electronics}
  - {id: MOD-CHESS, label: ASA Chess, kind: subject_module, layer: modules, status: in_progress, summary: "Existing Chess and Chess Online must remain reachable.", path: contexts/chess}
  - {id: MOD-CHECKERS, label: ASA Checkers, kind: subject_module, layer: modules, status: in_progress, summary: "Independent Russian-draughts learning, assignments, bots, review and safe class play.", path: contexts/checkers}
  - {id: MOD-BLOCKS, label: Block Coding, kind: subject_module, layer: modules, status: planned, summary: "Future module."}
  - {id: MOD-3D, label: 3D Design, kind: subject_module, layer: modules, status: done, summary: "ASA-native M0 foundation is merged by PR #95, active in the module registry and creatable from the main Portal.", path: contexts/three-d}
  - {id: MOD-ROBOTICS, label: Robotics, kind: subject_module, layer: modules, status: planned, summary: "Future module."}

