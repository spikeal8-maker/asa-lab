  - {id: TASK-CI-001, label: Разблокировать Architecture CI, kind: task, layer: delivery, status: done, summary: Local-first exit gate - TST-ARCH-001, TST-MAP-001, TST-CATALOG-001 проходят локально; GitHub-hosted CI отклонён из-за billing-blocker., phase: PHASE-0, issue: https://github.com/spikeal8-maker/asa-lab/issues/13}
  - {id: TASK-GOV-001, label: Bot Runbook and Test Registry, kind: task, layer: delivery, status: done, summary: Регламент ботов, test catalog, quality graph и единый локальный task test runner., phase: PHASE-0, issue: https://github.com/spikeal8-maker/asa-lab/issues/9}
  - {id: TASK-ARCH-001, label: Принять Architecture Foundation PR, kind: task, layer: delivery, status: done, summary: PR №1 объединён в main (merge d93899b)., phase: PHASE-0, issue: https://github.com/spikeal8-maker/asa-lab/pull/1}
  - {id: TASK-BOOT-001, label: Bootstrap monorepo, kind: task, layer: delivery, status: done, summary: "pnpm+Nx foundation в PR 14 - все обязательные Bootstrap-тесты PASS, 0 FAIL; readiness 503, runnable API (serve + HTTP smoke), safe-by-default OTel, pg migration runner (apply доказан на встроенном Postgres через TST-MIGRATION-EMBEDDED-001), compose структура через TST-COMPOSE-STRUCTURE-001; реальные Docker/Postgres smoke вынесены в TASK-ENV-001", phase: PHASE-0, issue: https://github.com/spikeal8-maker/asa-lab/issues/2}
  - {id: TASK-ENV-001, label: Local Integration Environment, kind: task, layer: delivery, status: deprecated, summary: "Реальная локальная среда: PostgreSQL, Redis, MinIO, Compose CLI; закрывает TST-COMPOSE-001 и внешний TST-MIGRATION-001", phase: PHASE-0, issue: https://github.com/spikeal8-maker/asa-lab/issues/15}
  - {id: TASK-TEN-001, label: Tenant context vertical slice, kind: task, layer: delivery, status: in_progress, summary: Первый пользовательский срез - педагог входит и создаёт класс (локальный PostgreSQL)., phase: PHASE-1, issue: https://github.com/spikeal8-maker/asa-lab/issues/3}
  - {id: TASK-CLS-001, label: Педагог создаёт класс, kind: task, layer: delivery, status: blocked, summary: Первый Classroom use case end-to-end., phase: PHASE-2, issue: https://github.com/spikeal8-maker/asa-lab/issues/4}
  - {id: TASK-SEAT-001, label: StudentSeat import and login, kind: task, layer: delivery, status: blocked, summary: Импорт мест и вход ребёнка без email., phase: PHASE-2, issue: https://github.com/spikeal8-maker/asa-lab/issues/7}
  - {id: TASK-MOD-001, label: Module SDK and Project envelope, kind: task, layer: delivery, status: blocked, summary: Два модуля без предметных imports в Classroom., phase: PHASE-3, issue: https://github.com/spikeal8-maker/asa-lab/issues/5}
  - {id: TASK-ACT-001, label: Первое задание и сдача, kind: task, layer: delivery, status: blocked, summary: Assignment и immutable Submission end-to-end., phase: PHASE-4, issue: https://github.com/spikeal8-maker/asa-lab/issues/8}
  - {id: TASK-ELEC-001, label: Первая электронная схема, kind: task, layer: delivery, status: blocked, summary: Источник, резистор, LED, провод и DC solver., phase: PHASE-5, issue: https://github.com/spikeal8-maker/asa-lab/issues/6}
