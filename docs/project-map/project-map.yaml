status_definitions:
  planned: Зафиксировано в roadmap, но не активировано.
  blocked: Требуется зависимость или owner activation.
  ready: Разрешено начать.
  in_progress: Выполняется один task.
  in_review: Результат находится в review.
  done: Gate принят и переход завершён.
  deprecated: Сохранено только для истории.

relation_definitions:
  contains: Логически содержит.
  uses: Использует публичный контракт.
  depends_on: Зависит от завершения целевого узла.
  produces: Создаёт результат.
  implements: Реализует capability, phase или gate.
  governs: Устанавливает правила.
  observes: Экспортирует телеметрию.
  stores_in: Хранит данные.
  queues_to: Передаёт задание.
  serves: Предоставляет интерфейс.
  next: Следующий roadmap-этап.

