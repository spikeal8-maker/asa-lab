schema_version: 1.0.0
map_version: 2026.07.19-7
project:
  id: asa-lab
  name: ASA Lab
  repository: spikeal8-maker/asa-lab
  current_focus: TASK-PORTAL-001
  source_of_truth: docs/project-map/project-map.yaml
status_definitions:
  planned: Зафиксировано в плане, но ещё не готово к работе.
  blocked: Есть незавершённая обязательная зависимость.
  ready: Можно выдавать coding-агенту.
  in_progress: Один исполнитель работает над задачей.
  in_review: Результат находится в Pull Request.
  done: Exit gate подтверждён тестами и merge.
  deprecated: Узел сохранён только для истории.
relation_definitions:
  contains: Логически содержит.
  uses: Использует через публичный контракт.
  depends_on: Исходный узел не может завершиться раньше целевого.
  produces: Создаёт результат.
  implements: Реализует фазу, track, capability или quality gate.
  governs: Устанавливает обязательные правила.
  observes: Экспортирует техническую телеметрию.
  stores_in: Хранит данные.
  queues_to: Передаёт вычислительное задание.
  serves: Предоставляет интерфейс актору.
  next: Следующий этап.
nodes:
  - {id: ASA, label: ASA Lab, kind: platform, layer: root, status: in_progress, summary: "Единая образовательная workspace platform с Classroom Core, проектами и предметными модулями.", path: README.md}

  - {id: ACT-STUDENT, label: Ученик, kind: actor, layer: actors, status: planned, summary: "Входит без обязательного email, работает над проектами, сдаёт версии и получает обратную связь."}
  - {id: ACT-TEACHER, label: Педагог, kind: actor, layer: actors, status: planned, summary: "Управляет классами, проектами, заданиями, проверкой, оценками и достижениями."}
  - {id: ACT-SCHOOL-ADMIN, label: Администратор школы, kind: actor, layer: actors, status: planned, summary: "Управляет педагогами, периодами, модулями и политиками школы."}
  - {id: ACT-PLATFORM-ADMIN, label: Администратор платформы, kind: actor, layer: actors, status: planned, summary: "Управляет tenants, эксплуатацией, версиями модулей, тарифами и инцидентами."}
  - {id: ACT-METHODIST, label: Методист, kind: actor, layer: actors, status: planned, summary: "Создаёт программы, ActivityVersion, rubrics и методические материалы."}
  - {id: ACT-AGENT, label: Coding-агент, kind: actor, layer: actors, status: ready, summary: "Выполняет только current_focus и связанную executable Issue по Development Program."}

  - {id: PLANE-EXPERIENCE, label: Experience Plane, kind: plane, layer: architecture, status: planned, summary: "Пользовательские кабинеты и предметные редакторы."}
  - {id: APP-WEB, label: Web/PWA, kind: application, layer: experience, status: in_progress, summary: "Teacher Portal, Child Dashboard и module host.", path: apps/web}
  - {id: APP-ADMIN, label: Admin Console, kind: application, layer: experience, status: planned, summary: "Школьная и платформенная админка.", path: apps/admin}
  - {id: APP-SITE, label: Public Site, kind: application, layer: experience, status: planned, summary: "Публичная информация и подключение организаций.", path: apps/site}

  - {id: PLANE-CONTROL, label: Modular Monolith Control Plane, kind: plane, layer: architecture, status: planned, summary: "Транзакционно целостное образовательное ядро bounded contexts."}
