  - {id: DOC-TASKS, label: Task System, kind: document, layer: governance, status: done, summary: Правила постановки и выдачи задач., path: docs/project-map/TASK_SYSTEM.md}
  - {id: DOC-QUALITY-MAP, label: Quality Map, kind: document, layer: governance, status: done, summary: Граф задач, тестов и quality gates., path: docs/project-map/QUALITY_MAP.md}
