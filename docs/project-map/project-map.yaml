  - {id: WORK-SIM, label: Simulation Workers, kind: worker_pool, layer: compute, status: planned, summary: "Детерминированная серверная симуляция.", path: apps/simulation-worker}
  - {id: WORK-GRADER, label: Autograder Workers, kind: worker_pool, layer: compute, status: planned, summary: "Публичные и скрытые структурные и поведенческие проверки.", path: apps/autograder-worker}
  - {id: WORK-RENDER, label: Render Workers, kind: worker_pool, layer: compute, status: planned, summary: "Preview, изображения, 3D export и документы.", path: apps/worker-runtime}
