schema_version: 1.0.0
map_version: 2026.07.19-10
project:
  id: asa-lab
  name: ASA Lab
  repository: spikeal8-maker/asa-lab
  current_focus: TASK-PRODUCT-DOC-001
  source_of_truth: docs/project-map/project-map.yaml
status_definitions:
  planned: Зафиксировано в плане, но ещё не готово к работе.
  blocked: Есть незавершённая обязательная зависимость.
  ready: Можно выдавать coding-агенту.
  in_progress: Один исполнитель работает над задачей.
  in_review: Результат находится в Pull Request.
  done: Exit gate подтверждён тестами и merge.
  deprecated: Узел сохранён только для истории.
relation_definitions:
  contains: Логически содержит.
  uses: Использует через публичный контракт.
  depends_on: Исходный узел не может завершиться раньше целевого.
  produces: Создаёт результат.
  implements: Реализует фазу, элемент или quality gate.
  governs: Устанавливает обязательные правила.
  observes: Экспортирует техническую телеметрию.
  stores_in: Хранит данные.
  queues_to: Передаёт вычислительное задание.
  serves: Предоставляет интерфейс актору.
  next: Следующая фаза.
nodes:
  - {id: ASA, label: ASA Lab, kind: platform, layer: root, status: in_progress, summary: Единая образовательная workspace platform с Classroom Core, заданиями, оцениванием и предметными модулями., path: README.md}
  - {id: ACT-STUDENT, label: Ученик, kind: actor, layer: actors, status: planned, summary: Входит без обязательного email, выполняет задания, сдаёт проекты и получает обратную связь.}
  - {id: ACT-TEACHER, label: Педагог, kind: actor, layer: actors, status: planned, summary: Управляет классами, заданиями, проверкой, оценками и достижениями.}
  - {id: ACT-SCHOOL-ADMIN, label: Администратор школы, kind: actor, layer: actors, status: planned, summary: Управляет педагогами, периодами, модулями и политиками школы.}
  - {id: ACT-PLATFORM-ADMIN, label: Администратор платформы, kind: actor, layer: actors, status: planned, summary: Управляет tenants, эксплуатацией, модулями, тарифами и инцидентами.}
  - {id: ACT-METHODIST, label: Методист, kind: actor, layer: actors, status: planned, summary: Создаёт программы, активности, рубрики и методические материалы.}
  - {id: ACT-AGENT, label: Coding-агент, kind: actor, layer: actors, status: ready, summary: Выполняет только готовую Issue по Product Blueprint, capability map и BOT_RUNBOOK.}

  - {id: PLANE-EXPERIENCE, label: Experience Plane, kind: plane, layer: architecture, status: planned, summary: Пользовательские кабинеты и редакторы.}
  - {id: APP-WEB, label: Web/PWA, kind: application, layer: experience, status: planned, summary: Ученический и педагогический кабинеты., path: apps/web}
  - {id: APP-ADMIN, label: Admin Console, kind: application, layer: experience, status: planned, summary: Школьная и платформенная админка., path: apps/admin}
  - {id: APP-SITE, label: Public Site, kind: application, layer: experience, status: planned, summary: Публичный сайт и подключение организаций., path: apps/site}

  - {id: PLANE-CONTROL, label: Modular Monolith Control Plane, kind: plane, layer: architecture, status: planned, summary: Транзакционно целостное образовательное ядро bounded contexts.}
  - {id: CTX-IDENTITY, label: Identity, kind: bounded_context, layer: control, status: planned, summary: Взрослые аккаунты, StudentSeat, credentials, sessions и external identity., path: contexts/identity}
  - {id: CTX-ORG, label: Organizations, kind: bounded_context, layer: control, status: planned, summary: Tenant, организация, школа, здания, периоды и TenantPlacement., path: contexts/organization}
  - {id: CTX-CLASSROOM, label: Classroom, kind: bounded_context, layer: control, status: planned, summary: Классы, memberships, группы, соучителя и Safe Mode., path: contexts/classroom}
  - {id: CTX-CONTENT, label: Learning Content, kind: bounded_context, layer: control, status: planned, summary: Programs, courses, lessons, activity templates и versions., path: contexts/content}
  - {id: CTX-PROJECTS, label: Projects, kind: bounded_context, layer: control, status: planned, summary: Project envelope, autosave, checkpoints и immutable ProjectVersion., path: contexts/projects}
  - {id: CTX-ACTIVITIES, label: Assignments, kind: bounded_context, layer: control, status: planned, summary: ActivityVersion, audience, deadlines, attempts и assignment policies., path: contexts/activities}
  - {id: CTX-ASSESSMENT, label: Assessment, kind: bounded_context, layer: control, status: planned, summary: Submission, review, comments, rubric, grade, badges и progress., path: contexts/assessment}
  - {id: CTX-MODULES, label: Module Registry, kind: bounded_context, layer: control, status: planned, summary: Module SDK, manifests, admission, schemas и compatibility., path: contexts/modules}
  - {id: CTX-NOTIFICATIONS, label: Notifications, kind: bounded_context, layer: control, status: planned, summary: Безопасные in-app уведомления о заданиях и проверке., path: contexts/notifications}
  - {id: CTX-BILLING, label: Billing, kind: bounded_context, layer: control, status: planned, summary: Entitlements, quotas и usage ledger., path: contexts/billing}
  - {id: CTX-SAFETY, label: Safety and Audit, kind: bounded_context, layer: control, status: planned, summary: Детская безопасность, модерация, retention и immutable audit., path: contexts/safety}

  - {id: PLANE-COMPUTE, label: Isolated Compute Plane, kind: plane, layer: architecture, status: planned, summary: Изолированные и независимо масштабируемые вычисления.}
  - {id: WORK-COMPILER, label: Compiler Workers, kind: worker_pool, layer: compute, status: planned, summary: Компиляция Arduino и пользовательского кода., path: apps/compiler-worker}
  - {id: WORK-SIM, label: Simulation Workers, kind: worker_pool, layer: compute, status: planned, summary: Детерминированная серверная симуляция., path: apps/simulation-worker}
  - {id: WORK-GRADER, label: Autograder Workers, kind: worker_pool, layer: compute, status: planned, summary: Публичные и скрытые структурные и поведенческие проверки., path: apps/autograder-worker}
  - {id: WORK-RENDER, label: Render Workers, kind: worker_pool, layer: compute, status: planned, summary: Preview, изображения, 3D export и документы., path: apps/worker-runtime}
  - {id: WORK-ROBOTICS, label: Robotics Physics Workers, kind: worker_pool, layer: compute, status: planned, summary: Физическая симуляция миров и роботов., path: apps/worker-runtime}

  - {id: DATA-PG, label: PostgreSQL, kind: data_store, layer: data, status: planned, summary: Основные транзакционные tenant-owned данные.}
  - {id: DATA-REDIS, label: Redis, kind: data_store, layer: data, status: planned, summary: Кэш, rate limits, sessions и coordination.}
  - {id: DATA-S3, label: S3-compatible Storage, kind: data_store, layer: data, status: planned, summary: Project payloads, assets, previews, exports и certificates.}
  - {id: DATA-OUTBOX, label: Transactional Outbox, kind: integration, layer: data, status: planned, summary: Надёжная публикация событий после commit.}
  - {id: DATA-QUEUE, label: Job Queue, kind: integration, layer: data, status: planned, summary: Очередь задач Compute Plane.}
  - {id: OBS-OTEL, label: OpenTelemetry, kind: observability, layer: operations, status: planned, summary: Traces, metrics и logs без детского содержимого.}

  - {id: SDK-MODULE, label: Module SDK, kind: sdk, layer: modules, status: planned, summary: Версионированный контракт предметных редакторов., path: packages/module-sdk}
  - {id: MOD-ELECTRONICS, label: Электронная лаборатория, kind: subject_module, layer: modules, status: planned, summary: Редактор схем, simulation, Arduino, instruments и autograding., phase: PHASE-5, path: modules/electronics}
  - {id: MOD-BLOCKS, label: Блочное программирование, kind: subject_module, layer: modules, status: planned, summary: Scratch-подобные sprites, stage, blocks и безопасные class projects., phase: PHASE-12, path: modules/block-coding}
  - {id: MOD-3D, label: 3D-моделирование, kind: subject_module, layer: modules, status: planned, summary: Scene graph и подготовка файлов к печати., phase: PHASE-12, path: modules/3d}
  - {id: MOD-ROBOTICS, label: Виртуальная робототехника, kind: subject_module, layer: modules, status: planned, summary: Мир, робот, физика и программирование., phase: PHASE-12, path: modules/robotics}
  - {id: MOD-CHESS, label: Шахматы и шашки, kind: subject_module, layer: modules, status: planned, summary: Позиции, партии, задачи, комментарии и проверка решений., phase: PHASE-12, path: modules/chess}
  - {id: MOD-DRAWING, label: Рисование и черчение, kind: subject_module, layer: modules, status: planned, summary: Векторные и технические учебные документы., phase: PHASE-12, path: modules/drawing}

