  - {id: CTX-ORG, label: Organizations, kind: bounded_context, layer: control, status: in_progress, summary: "Tenant, organization, school, period и TenantPlacement.", path: contexts/organization}
  - {id: CTX-CLASSROOM, label: Classroom, kind: bounded_context, layer: control, status: in_progress, summary: "Classroom, memberships, roster, groups и Safe Mode.", path: contexts/classroom}
  - {id: CTX-CONTENT, label: Learning Content, kind: bounded_context, layer: control, status: planned, summary: "ActivityTemplate и immutable ActivityVersion.", path: contexts/content}
  - {id: CTX-PROJECTS, label: Projects, kind: bounded_context, layer: control, status: planned, summary: "Universal Project, draft, checkpoint и immutable ProjectVersion.", path: contexts/projects}
  - {id: CTX-ACTIVITIES, label: Assignments, kind: bounded_context, layer: control, status: planned, summary: "Assignment, audience, deadlines, policies и AssignmentWork.", path: contexts/activities}
  - {id: CTX-ASSESSMENT, label: Assessment, kind: bounded_context, layer: control, status: planned, summary: "Submission, comments, review, rubric, grade, badge и progress.", path: contexts/assessment}
  - {id: CTX-MODULES, label: Module Registry, kind: bounded_context, layer: control, status: planned, summary: "Module SDK, manifests, schemas, providers и compatibility.", path: contexts/modules}
  - {id: CTX-NOTIFICATIONS, label: Notifications, kind: bounded_context, layer: control, status: planned, summary: "Безопасные in-app уведомления об учебных событиях.", path: contexts/notifications}
  - {id: CTX-BILLING, label: Billing, kind: bounded_context, layer: control, status: planned, summary: "Entitlements, quotas и usage ledger.", path: contexts/billing}
  - {id: CTX-SAFETY, label: Safety and Audit, kind: bounded_context, layer: control, status: planned, summary: "Child safety, moderation, retention и immutable audit.", path: contexts/safety}

  - {id: PLANE-COMPUTE, label: Isolated Compute Plane, kind: plane, layer: architecture, status: planned, summary: "Изолированные и независимо масштабируемые вычисления."}
