  - {id: DOC-README, label: README, kind: document, layer: governance, status: done, summary: "Repository state.", path: README.md}
  - {id: DOC-MANIFEST, label: Execution Manifest, kind: document, layer: governance, status: done, summary: "Executable queue and active Checkers M1 system.", path: docs/delivery/EXECUTION_MANIFEST.yaml}
  - {id: DOC-PROGRAM, label: Development Program, kind: document, layer: governance, status: done, summary: "Human-readable delivery program.", path: docs/delivery/DEVELOPMENT_PROGRAM_V1.md}
  - {id: DOC-MAP, label: Project Map, kind: document, layer: governance, status: done, summary: "Machine-readable current state.", path: docs/project-map/project-map.yaml}
  - {id: DOC-QUALITY, label: Quality Map, kind: document, layer: governance, status: done, summary: "Checkers M1 focused gate.", path: docs/project-map/QUALITY_MAP.md}
  - {id: DOC-TESTS, label: Test Catalog, kind: document, layer: governance, status: done, summary: "Stable test IDs.", path: docs/testing/test-catalog.yaml}
  - {id: DOC-PORTS, label: Port Policy, kind: document, layer: governance, status: done, summary: "Ports 4610/4611/4612.", path: docs/delivery/LOCAL_PORT_POLICY.md}
  - {id: QG-LOCAL, label: Local Gate, kind: quality_gate, layer: governance, status: in_progress, summary: "Focused Checkers rules, project, learning, bots, class safety and browser tests run before owner acceptance."}
  - {id: QG-HOSTED, label: Hosted Actions, kind: quality_gate, layer: governance, status: blocked, summary: "External runner/settings blocker."}

  - {id: PROGRAM-ALPHA-001, label: Product Alpha, kind: program, layer: delivery, status: in_progress, summary: "The owner prioritised a complete educational Checkers system after the accepted Portal shell and R3A gateway."}
  - {id: TRACK-TECH-ALPHA, label: Technical Alpha, kind: delivery_track, layer: delivery, status: done, summary: "Foundation, Portal and Account C1 merged."}
  - {id: TRACK-ROADMAP, label: Product Roadmap, kind: delivery_track, layer: delivery, status: in_progress, summary: "Portal, R3A and 3D M0 are merged; Electronics corrective work is paused; Checkers M1 remains active."}
  - {id: PHASE-0, label: Foundation, kind: roadmap_phase, layer: roadmap, status: done, summary: "Foundation complete."}
  - {id: PHASE-1, label: Account C1, kind: roadmap_phase, layer: roadmap, status: done, summary: "Identity/security slice complete."}
  - {id: PHASE-R2, label: R2 Creator Portal, kind: roadmap_phase, layer: roadmap, status: done, summary: "Portal shell accepted and merged by PR #71."}
  - {id: PHASE-R3, label: R3 Project Lifecycle, kind: roadmap_phase, layer: roadmap, status: in_progress, summary: "R3A gateway done; R3B remains blocked and deferred."}
  - {id: PHASE-R4, label: R4 Electronics Parity, kind: roadmap_phase, layer: roadmap, status: in_progress, summary: "Post-merge M1 corrective work aligns physical pins, breadboard footprints and live LED evidence; M2 remains blocked."}
  - {id: PHASE-R10, label: R10 3D Foundation, kind: roadmap_phase, layer: roadmap, status: in_progress, summary: "The ASA-native 3D M0 slice is merged and deployed; later R10 CAD capabilities remain blocked pending separate owner activation."}
  - {id: PHASE-R11, label: R11 Educational Checkers, kind: roadmap_phase, layer: roadmap, status: done, summary: "Independent Russian-draughts rules, learning, assignments, bots, review and safe class play."}
