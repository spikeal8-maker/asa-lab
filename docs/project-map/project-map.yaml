schema_version: 1.0.0
map_version: 2026.08.12-1
project:
  id: asa-lab
  name: ASA Lab
  repository: spikeal8-maker/asa-lab
  # current_focus and active_checkpoint mirror docs/execution/current.yaml, which
  # is the single source of execution state; validate_control_plane.py enforces
  # the match. Executor and lease live only in that file.
  current_focus: TASK-ADMIN-AUTH-STABILITY-001
  active_checkpoint: build_identity_verified_on_backup
  canonical_branch: main
  product_merge_sha: 20986b1c8aa023b8359008d55c82393cc0426954
  verified_account_sha: 35c06c42012672b9b4cb2626b85ba1f21b973bc0
  source_of_truth: docs/project-map/project-map.yaml
  execution_state_source: docs/execution/current.yaml

status_definitions:
  planned: Roadmap only.
  blocked: Dependency or owner activation missing.
  ready: Published and executable.
  in_progress: One executor is working.
  in_review: Result is in review.
  done: Gate accepted.
  deprecated: Historical traceability only.

relation_definitions:
  contains: Contains.
  uses: Uses a public contract.
  depends_on: Requires completion of target.
  produces: Produces.
  implements: Implements.
  governs: Governs.
  observes: Observes.
  stores_in: Stores data in.
  queues_to: Sends work to.
  serves: Serves actor.
  next: Next roadmap stage.

nodes:
  - {id: ASA, label: ASA Lab, kind: platform, layer: root, status: in_progress, summary: "Working Alpha platform; the independent educational Checkers M1 system is active.", path: README.md}
  - {id: ACT-CREATOR, label: Creator, kind: actor, layer: actors, status: in_progress, summary: "Uses Creator Home and personal projects."}
  - {id: ACT-EDUCATOR, label: Educator, kind: actor, layer: actors, status: in_progress, summary: "Uses capability-aware Classes and creator surfaces."}
  - {id: ACT-STUDENT, label: Student, kind: actor, layer: actors, status: in_progress, summary: "Uses the Checkers learning path, assignments, bots and safe class play within existing account and class contracts."}
  - {id: ACT-ADMIN, label: Administrator, kind: actor, layer: actors, status: in_progress, summary: "Uses server-issued platform or organization administration grants inside the shared ASA Lab Web application."}
  - {id: ACT-AGENT, label: Coding Agent, kind: actor, layer: actors, status: in_progress, summary: "Owner-authorised Admin, session and MAX stabilisation is active; see docs/execution/current.yaml."}

  - {id: PLANE-EXPERIENCE, label: Experience Plane, kind: plane, layer: architecture, status: in_progress, summary: "Public entry, Creator Portal, Account and editors."}
  - {id: PLANE-CONTROL, label: Control Plane, kind: plane, layer: architecture, status: in_progress, summary: "Modular monolith API and bounded contexts."}
  - {id: PLANE-COMPUTE, label: Compute Plane, kind: plane, layer: architecture, status: planned, summary: "Future isolated workers."}
  - {id: APP-WEB, label: Web PWA, kind: application, layer: experience, status: in_progress, summary: "Creator Portal, subject editors and the integrated protected Admin surface.", path: apps/web}
  - {id: APP-API, label: API, kind: application, layer: control, status: in_progress, summary: "Server-authorized identity, workspace and project API.", path: apps/api}
  - {id: APP-ADMIN, label: Admin Surface, kind: surface, layer: experience, status: in_progress, summary: "Protected routes inside APP-WEB; not a separate service, deployment, database or port.", path: apps/web/src/admin}
  - {id: APP-SITE, label: Public Site, kind: application, layer: experience, status: planned, summary: "Future public content."}

  - {id: CTX-IDENTITY, label: Identity, kind: bounded_context, layer: control, status: done, summary: "Account, Profile, Principal, capabilities and sessions_v2.", path: contexts/identity}
  - {id: CTX-ORG, label: Workspaces, kind: bounded_context, layer: control, status: done, summary: "Workspace membership and ActiveContext.", path: contexts/organization}
  - {id: CTX-CLASSROOM, label: Classroom, kind: bounded_context, layer: control, status: done, summary: "Teacher Portal baseline and classes.", path: contexts/classroom}
  - {id: CTX-PROJECTS, label: Projects, kind: bounded_context, layer: control, status: in_progress, summary: "Module-neutral project lifecycle is preserved for the independent Checkers module.", path: contexts/projects}
  - {id: CTX-MODULES, label: Module Registry, kind: bounded_context, layer: control, status: in_progress, summary: "R3A gateway is verified; remaining R3B work is deferred."}
  - {id: CTX-CONTENT, label: Learning Content, kind: bounded_context, layer: control, status: planned, summary: "Future content model; R2 exposes honest navigation only."}
  - {id: CTX-NOTIFICATIONS, label: Notifications, kind: bounded_context, layer: control, status: planned, summary: "Future notification backend; R2 may expose honest empty surface."}
  - {id: CTX-ACTIVITIES, label: Assignments, kind: bounded_context, layer: control, status: planned, summary: "Future learning workflow."}
  - {id: CTX-ASSESSMENT, label: Assessment, kind: bounded_context, layer: control, status: planned, summary: "Future review and grading."}
  - {id: CTX-SAFETY, label: Safety and Audit, kind: bounded_context, layer: control, status: in_progress, summary: "Audit exists; safe capability-aware UI continues."}

  - {id: DATA-PG, label: PostgreSQL, kind: data_store, layer: data, status: in_progress, summary: "Transactional data and RLS."}
  - {id: DATA-BACKUP, label: Backup, kind: data_store, layer: data, status: done, summary: "Backup/restore proven outside Git."}
  - {id: DATA-REDIS, label: Redis, kind: data_store, layer: data, status: planned, summary: "Future shared cache."}
  - {id: DATA-S3, label: Object Storage, kind: data_store, layer: data, status: planned, summary: "Future assets and exports."}
  - {id: WORK-SIM, label: Simulation Worker, kind: worker_pool, layer: compute, status: planned, summary: "Future simulation worker."}
  - {id: WORK-GRADER, label: Grader Worker, kind: worker_pool, layer: compute, status: planned, summary: "Future autograder."}
  - {id: OBS-OTEL, label: OpenTelemetry, kind: observability, layer: operations, status: planned, summary: "Future production telemetry."}

