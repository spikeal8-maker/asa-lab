  - {id: TASK-R3A-ELECTRONICS-GATEWAY-001, label: R3A Electronics Gateway, kind: task, layer: delivery, status: done, summary: "Existing Module Registry, shared Editor Host and module-neutral Project lifecycle verified.", phase: PHASE-R3, issue: https://github.com/spikeal8-maker/asa-lab/issues/63}
  - {id: TASK-ELECTRONICS-M1-001, label: R4 Electronics M1, kind: task, layer: delivery, status: blocked, summary: "Owner paused the open corrective PR #92 while Checkers M1 runs; no completion is claimed.", phase: PHASE-R4, issue: https://github.com/spikeal8-maker/asa-lab/issues/63}
  - {id: TASK-3D-M0-001, label: R10-M1 3D Foundation, kind: task, layer: delivery, status: done, summary: "PR #95 merged into main; the Portal creates ASA 3D projects and the saved WebGL scene reloads through Project Core.", phase: PHASE-R10, issue: https://github.com/spikeal8-maker/asa-lab/issues/94}
  - {id: TASK-CHECKERS-M1-001, label: R11-M1 Educational Russian Draughts, kind: task, layer: delivery, status: done, summary: "Independent Checkers system from Issue #98: rules, learning, teacher work, bots, review and safe class play.", phase: PHASE-R11, issue: https://github.com/spikeal8-maker/asa-lab/issues/98}
  - {id: TASK-ADMIN-AUTH-STABILITY-001, label: Admin Auth and MAX Stability, kind: task, layer: delivery, status: in_progress, summary: "Integrated Admin access, durable sessions, production MAX verification and reproducible runtime recovery.", phase: PHASE-PILOT, issue: https://github.com/spikeal8-maker/asa-lab/issues/135}
  - {id: TASK-R3, label: R3 Project Lifecycle, kind: task, layer: delivery, status: blocked, summary: "Roadmap alias; not executable.", phase: PHASE-R3, issue: https://github.com/spikeal8-maker/asa-lab/issues/37}
  - {id: TASK-R4, label: R4 Electronics Parity, kind: task, layer: delivery, status: blocked, summary: "Roadmap alias; not executable.", phase: PHASE-R4, issue: https://github.com/spikeal8-maker/asa-lab/issues/63}
  - {id: TASK-SEAT, label: StudentSeat, kind: task, layer: delivery, status: blocked, summary: "Future School Pilot task.", phase: PHASE-PILOT, issue: https://github.com/spikeal8-maker/asa-lab/issues/7}
  - {id: TASK-PERF-BASELINE-001, label: Performance Baseline, kind: task, layer: delivery, status: planned, summary: "Measurement tooling and recorded availability budget.", phase: PHASE-PILOT}
  - {id: TASK-AUTH-HARDENING-001, label: Auth Availability, kind: task, layer: delivery, status: planned, summary: "Non-blocking password hashing, attempt ceilings and no timing disclosure.", phase: PHASE-PILOT}
  - {id: TASK-OBSERVABILITY-001, label: Runtime Observability, kind: task, layer: delivery, status: planned, summary: "Metrics, request log and readiness that separates busy from broken.", phase: PHASE-PILOT}
  - {id: TASK-WEB-BOOTSTRAP-001, label: Non-blocking Bootstrap, kind: task, layer: delivery, status: planned, summary: "Render without the Electronics catalog and split the catalog itself.", phase: PHASE-PILOT}
  - {id: TASK-ASSET-DELIVERY-001, label: Asset Delivery, kind: task, layer: delivery, status: planned, summary: "Compression and immutable caching scoped to hashed filenames.", phase: PHASE-PILOT}
  - {id: TASK-E2E-GATE-001, label: Browser Gate, kind: task, layer: delivery, status: planned, summary: "Repair the drifted specs, smoke set on push, full set on pull request.", phase: PHASE-PILOT}
  - {id: TASK-SCALE-PREP-001, label: Scale Preparation, kind: task, layer: delivery, status: planned, summary: "Pool guards, covering indexes, chunk split and multi-instance readiness.", phase: PHASE-PILOT}
  - {id: TASK-PROJECT-PREVIEW-001, label: Project Previews, kind: task, layer: delivery, status: done, summary: "Modules describe a neutral figure, Core stores it on save and draws every project card.", phase: PHASE-PILOT}

