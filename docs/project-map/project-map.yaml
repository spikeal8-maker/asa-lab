schema_version: 1.0.0
map_version: 2026.07.19-1
project:
  id: asa-lab
  name: ASA Lab
  repository: spikeal8-maker/asa-lab
  current_focus: TASK-TEN-001
  source_of_truth: docs/project-map/project-map.yaml
status_definitions:
  planned: Зафиксировано в плане, но ещё не готово к работе.
  blocked: Есть незавершённая обязательная зависимость.
  ready: Можно выдавать coding-агенту.
  in_progress: Один исполнитель работает над задачей.
  in_review: Результат находится в Pull Request.
  done: Exit gate подтверждён тестами и merge.
  deprecated: Узел сохранён только для истории.
relation_definitions:
  contains: Логически содержит.
  uses: Использует через публичный контракт.
  depends_on: Исходный узел не может завершиться раньше целевого.
  produces: Создаёт результат.
  implements: Реализует фазу, элемент или quality gate.
  governs: Устанавливает обязательные правила.
  observes: Экспортирует техническую телеметрию.
  stores_in: Хранит данные.
  queues_to: Передаёт вычислительное задание.
  serves: Предоставляет интерфейс актору.
  next: Следующая фаза.
nodes:
  - {id: ASA, label: ASA Lab, kind: platform, layer: root, status: in_progress, summary: Единая образовательная платформа с Classroom Core и предметными модулями., path: README.md}
  - {id: ACT-STUDENT, label: Ученик, kind: actor, layer: actors, status: planned, summary: Работает с заданиями и проектами через StudentSeat или аккаунт.}
  - {id: ACT-TEACHER, label: Педагог, kind: actor, layer: actors, status: planned, summary: Создаёт классы, выдаёт задания и проверяет работы.}
  - {id: ACT-SCHOOL-ADMIN, label: Администратор школы, kind: actor, layer: actors, status: planned, summary: Управляет педагогами, периодами и политиками школы.}
  - {id: ACT-PLATFORM-ADMIN, label: Администратор платформы, kind: actor, layer: actors, status: planned, summary: Управляет tenants, эксплуатацией, модулями и тарифами.}
  - {id: ACT-AGENT, label: Coding-агент, kind: actor, layer: actors, status: ready, summary: Выполняет только готовую задачу по BOT_RUNBOOK и обновляет карты.}
  - {id: PLANE-EXPERIENCE, label: Experience Plane, kind: plane, layer: architecture, status: planned, summary: Пользовательские приложения платформы.}
  - {id: APP-WEB, label: Web/PWA, kind: application, layer: experience, status: planned, summary: Ученический и педагогический интерфейс., path: apps/web}
  - {id: APP-ADMIN, label: Admin Console, kind: application, layer: experience, status: planned, summary: Отдельный интерфейс администрирования., path: apps/admin}
  - {id: APP-SITE, label: Public Site, kind: application, layer: experience, status: planned, summary: Публичный сайт и подключение организаций., path: apps/site}
  - {id: PLANE-CONTROL, label: Modular Monolith Control Plane, kind: plane, layer: architecture, status: planned, summary: Транзакционно целостное серверное ядро bounded contexts.}
  - {id: CTX-IDENTITY, label: Identity, kind: bounded_context, layer: control, status: planned, summary: Взрослые аккаунты, StudentSeat, сессии и external identity., path: contexts/identity}
  - {id: CTX-ORG, label: Organizations, kind: bounded_context, layer: control, status: planned, summary: Tenant, школа, здания, периоды и TenantPlacement., path: contexts/organization}
  - {id: CTX-CLASSROOM, label: Classroom, kind: bounded_context, layer: control, status: planned, summary: Классы, участники, группы, соучителя и Safe Mode., path: contexts/classroom}
  - {id: CTX-PROJECTS, label: Projects, kind: bounded_context, layer: control, status: planned, summary: Project envelope, операции и immutable ProjectVersion., path: contexts/projects}
  - {id: CTX-ACTIVITIES, label: Activities, kind: bounded_context, layer: control, status: planned, summary: Шаблоны, версии активностей и назначения., path: contexts/activities}
  - {id: CTX-ASSESSMENT, label: Assessment, kind: bounded_context, layer: control, status: planned, summary: Submission, review, rubric и попытки., path: contexts/assessment}
  - {id: CTX-MODULES, label: Module Registry, kind: bounded_context, layer: control, status: planned, summary: Регистрация Module SDK и совместимости., path: contexts/modules}
  - {id: CTX-BILLING, label: Billing, kind: bounded_context, layer: control, status: planned, summary: Entitlements, quotas и usage ledger., path: contexts/billing}
  - {id: CTX-SAFETY, label: Safety and Audit, kind: bounded_context, layer: control, status: planned, summary: Детская безопасность, модерация и неизменяемый аудит., path: contexts/safety}
  - {id: PLANE-COMPUTE, label: Isolated Compute Plane, kind: plane, layer: architecture, status: planned, summary: Изолированные и независимо масштабируемые вычисления.}
  - {id: WORK-COMPILER, label: Compiler Workers, kind: worker_pool, layer: compute, status: planned, summary: Компиляция Arduino и пользовательского кода., path: apps/compiler-worker}
  - {id: WORK-SIM, label: Simulation Workers, kind: worker_pool, layer: compute, status: planned, summary: Детерминированная серверная симуляция., path: apps/simulation-worker}
  - {id: WORK-GRADER, label: Autograder Workers, kind: worker_pool, layer: compute, status: planned, summary: Структурные и поведенческие проверки., path: apps/autograder-worker}
  - {id: WORK-RENDER, label: Render and Robotics Workers, kind: worker_pool, layer: compute, status: planned, summary: Preview, экспорт, 3D и физическая симуляция., path: apps/worker-runtime}
  - {id: DATA-PG, label: PostgreSQL, kind: data_store, layer: data, status: planned, summary: Основные транзакционные tenant-owned данные.}
  - {id: DATA-REDIS, label: Redis, kind: data_store, layer: data, status: planned, summary: Кэш, rate limits, sessions и coordination.}
  - {id: DATA-S3, label: S3-compatible Storage, kind: data_store, layer: data, status: planned, summary: Версии проектов, assets, preview и exports.}
  - {id: DATA-OUTBOX, label: Transactional Outbox, kind: integration, layer: data, status: planned, summary: Надёжная публикация событий после commit.}
  - {id: DATA-QUEUE, label: Job Queue, kind: integration, layer: data, status: planned, summary: Очередь задач Compute Plane.}
  - {id: OBS-OTEL, label: OpenTelemetry, kind: observability, layer: operations, status: planned, summary: Traces, metrics и logs без детского содержимого.}
  - {id: SDK-MODULE, label: Module SDK, kind: sdk, layer: modules, status: planned, summary: Версионированный контракт предметных модулей., path: packages/module-sdk}
  - {id: MOD-ELECTRONICS, label: Электроника, kind: subject_module, layer: modules, status: planned, summary: Редактор схем, симуляция и Arduino., phase: PHASE-5, path: modules/electronics}
  - {id: MOD-3D, label: 3D-моделирование, kind: subject_module, layer: modules, status: planned, summary: Scene graph и подготовка файлов к печати., phase: PHASE-12, path: modules/3d}
  - {id: MOD-ROBOTICS, label: Виртуальная робототехника, kind: subject_module, layer: modules, status: planned, summary: Мир, робот, физика и программирование., phase: PHASE-12, path: modules/robotics}
  - {id: MOD-CHESS, label: Шахматы и шашки, kind: subject_module, layer: modules, status: planned, summary: Позиции, партии, задачи и проверка решений., phase: PHASE-12, path: modules/chess}
  - {id: MOD-DRAWING, label: Рисование и черчение, kind: subject_module, layer: modules, status: planned, summary: Векторные и технические учебные документы., phase: PHASE-12, path: modules/drawing}
