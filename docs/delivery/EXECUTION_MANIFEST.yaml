# Which task is active, on which branch, in which PR, at which status and
# checkpoint, and who holds the execution lease — all of that lives here and
# nowhere else. This manifest describes the programme; it never restates state.
execution_state_source: docs/execution/current.yaml

semantics:
  execution_order: Defined only by tasks.position and project-map execution_queue.
  architecture_horizon: Informational grouping; it is not execution order.
  issue_scope: The linked GitHub Issue is the executable scope.
  current_release_rule: Only owner-activated tasks are executable.
  next_task_rule: A future task becomes executable only through a separate owner transition.
  no_automatic_future_activation: true

