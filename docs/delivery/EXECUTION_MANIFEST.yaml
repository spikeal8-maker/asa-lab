schema_version: 1.0.0
program_id: PROGRAM-ALPHA-001
program_issue: https://github.com/spikeal8-maker/asa-lab/issues/23
human_program: docs/delivery/DEVELOPMENT_PROGRAM_V1.md
state_source: docs/project-map/project-map.yaml
quality_source: docs/testing/test-catalog.yaml

semantics:
  execution_order: Defined only by tasks.position in this manifest and execution_queue in project-map.yaml.
  architecture_horizon: Informational architecture grouping; it is not execution order.
  issue_scope: The linked GitHub Issue is the executable scope for one user flow.
  current_release_rule: Only tasks listed here are executable; roadmap Issues are not executable until an owner-approved transition adds them.
  next_task_rule: A next task becomes ready only after owner acceptance, merge/convergence decision and mandatory map transition.
  no_automatic_future_activation: true

accepted_alpha_baseline:
  sha: 7afebdcf9441b027092ce17a37f1f89950af99c6
  claim: technical_alpha_only
  functional_completeness: false
  canonical_branch: assistant/docker-linux-bootstrap
  draft_pr: 70

roadmap_after_current:
  - release: R2
    issue: https://github.com/spikeal8-maker/asa-lab/issues/62
    name: Creator Home and capability-aware Portal shell
    status: blocked
    activation: separate_owner_transition_after_ACCOUNT_C1
  - release: R3
    issue: https://github.com/spikeal8-maker/asa-lab/issues/37
    name: Module Registry, Project Hub and full project lifecycle
    status: blocked
    activation: separate_owner_transition_after_R2
  - release: R4
    issue: https://github.com/spikeal8-maker/asa-lab/issues/63
    name: Complete Circuits and Electronics functional parity
    status: blocked
    activation: separate_owner_transition_after_R3

ports:
  bind: 127.0.0.1
  web: 4610
  api: 4611
  e2e: 4612
  preview_reserved: 4613
  forbidden: [3000, 3100, 5173]

map_protocol:
  start:
    - current task status becomes in_progress
    - project.current_focus remains the current task
    - implementation, delivery-track and architecture-horizon nodes listed in map_nodes become in_progress when work actually starts
  draft_pr:
    - current task status becomes in_review only after the task implementation and focused gate are complete
    - project-map.yaml and PROJECT_MAP.md reflect actual nodes, paths and dependencies
    - QUALITY_MAP.md and test-catalog.yaml reflect the exact exit gate
    - nx-project-graph.json is regenerated for code-structure changes
  after_merge:
    - current task status becomes done only after owner acceptance and the approved convergence action
    - future roadmap work remains blocked until a separate owner-approved manifest transition
    - project-map.yaml and PROJECT_MAP.md are updated in one governance-only transition
    - the agent stops without implementing a future task

report_contract:
  required_fields:
    - MILESTONE
    - TASK
    - ISSUE
    - STATUS
    - VISIBLE_RESULT
    - USER_FLOW
    - PORTS
    - DEMO_URLS
    - SCREENSHOTS
    - TESTS_RUN
    - MAP_NODES_CHANGED
    - WORKING_TREE
    - NEXT_ALLOWED_TASK

