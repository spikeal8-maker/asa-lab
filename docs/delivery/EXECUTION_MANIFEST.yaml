map_protocol:
  start:
    - one task becomes ready or in_progress
    - project.current_focus becomes that task
    - branch, Issue, scope and tests are published together
  draft_pr:
    - current task becomes in_review only after implementation and focused PASS
    - maps and quality evidence reflect the exact diff
  owner_rejection:
    - current task returns to in_progress with an explicit corrective checkpoint
    - rejected evidence is preserved and must not be called accepted
    - future milestones remain blocked
  owner_integration_request:
    - accepted evidence becomes an integration input, not a completed product claim
    - standalone review surfaces do not satisfy the user-visible result
    - the real product route must consume the integrated contracts before review
  after_merge:
    - accepted task becomes done
    - project.current_focus becomes null unless another task is separately activated
    - coding agent stops

