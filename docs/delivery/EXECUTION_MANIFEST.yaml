schema_version: 1.0.0
program_id: PROGRAM-ALPHA-001
program_issue: https://github.com/spikeal8-maker/asa-lab/issues/23
human_program: docs/delivery/DEVELOPMENT_PROGRAM_V1.md
state_source: docs/project-map/project-map.yaml
quality_source: docs/testing/test-catalog.yaml

semantics:
  execution_order: Defined only by tasks.position in this manifest and execution_queue in project-map.yaml.
  architecture_horizon: Informational architecture grouping; it is not execution order and may be non-monotonic.
  issue_scope: The linked GitHub Issue is the executable scope for one user flow.
  next_task_rule: The next task becomes ready only after merge and the mandatory map transition.

ports:
  bind: 127.0.0.1
  web: 4610
  api: 4611
  e2e: 4612
  preview_reserved: 4613
  forbidden: [3000, 3100, 5173]

map_protocol:
  start:
    - current task status becomes in_progress
    - project.current_focus remains the current task
    - implementation, delivery-track and architecture-horizon nodes listed in map_nodes become in_progress when work actually starts
  draft_pr:
    - current task status becomes in_review
    - project-map.yaml and PROJECT_MAP.md reflect actual nodes, paths and dependencies
    - QUALITY_MAP.md and test-catalog.yaml reflect the exact exit gate
    - nx-project-graph.json is regenerated for code-structure changes
  after_merge:
    - current task status becomes done
    - next task status becomes ready when every dependency is done
    - project.current_focus becomes next_task
    - a shared map node becomes done only when no later incomplete manifest task lists that node
    - project-map.yaml and PROJECT_MAP.md are updated in one map-only transition commit or PR
    - the agent stops without implementing next_task

report_contract:
  required_fields:
    - MILESTONE
    - TASK
    - ISSUE
    - STATUS
    - VISIBLE_RESULT
    - USER_FLOW
    - PORTS
    - DEMO_URLS
    - SCREENSHOTS
    - TESTS_RUN
    - MAP_NODES_CHANGED
    - WORKING_TREE
    - NEXT_ALLOWED_TASK

