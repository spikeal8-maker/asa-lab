schema_version: 1.0.0
program_id: PROGRAM-ALPHA-001
program_issue: https://github.com/spikeal8-maker/asa-lab/issues/23
human_program: docs/delivery/DEVELOPMENT_PROGRAM_V1.md
state_source: docs/project-map/project-map.yaml
quality_source: docs/testing/test-catalog.yaml

semantics:
  execution_order: Defined only by tasks.position in this manifest and execution_queue in project-map.yaml.
  architecture_horizon: Informational architecture grouping; it is not execution order.
  issue_scope: A linked GitHub Issue is executable only while the task is active.
  current_release_rule: Only owner-activated tasks are executable.
  completed_queue_rule: When every listed task is done, project.current_focus must be null.
  next_task_rule: A roadmap task becomes executable only through a separate owner-approved transition.
  no_automatic_future_activation: true

canonical_state:
  branch: main
  merge_sha: e01ac85095ddaabef19ed618964deac3aa5b2406
  verified_implementation_sha: 35c06c42012672b9b4cb2626b85ba1f21b973bc0
  merged_pr: 70
  functional_completeness: false
  active_task: null

roadmap_after_current:
  - release: R2
    issue: https://github.com/spikeal8-maker/asa-lab/issues/62
    name: Creator Home and capability-aware Portal shell
    status: blocked
    activation: separate_owner_transition
  - release: R3
    issue: https://github.com/spikeal8-maker/asa-lab/issues/37
    name: Module Registry, Project Hub and full project lifecycle
    status: blocked
    activation: separate_owner_transition_after_R2
  - release: R4
    issue: https://github.com/spikeal8-maker/asa-lab/issues/63
    name: Complete Circuits and Electronics functional parity
    status: blocked
    activation: separate_owner_transition_after_R3

ports:
  bind: 127.0.0.1
  web: 4610
  api: 4611
  e2e: 4612
  preview_reserved: 4613
  forbidden: [3000, 3100, 5173]

map_protocol:
  start:
    - owner transition sets one task to ready or in_progress
    - project.current_focus becomes that task
    - branch, Issue, scope and tests are published together
  draft_pr:
    - current task becomes in_review only after implementation and focused gate
    - Project Map and Quality Map reflect the exact diff and exit gate
  after_merge:
    - accepted task becomes done
    - merge SHA and verified implementation SHA are recorded
    - project.current_focus becomes null unless another task is separately activated
    - roadmap remains blocked
    - coding agent stops

report_contract:
  required_fields:
    - MILESTONE
    - TASK
    - ISSUE
    - STATUS
    - VISIBLE_RESULT
    - USER_FLOW
    - PORTS
    - DEMO_URLS
    - SCREENSHOTS
    - TESTS_RUN
    - MAP_NODES_CHANGED
    - WORKING_TREE
    - NEXT_ALLOWED_TASK

