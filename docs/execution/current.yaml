schema_version: 1.0.0

# ─────────────────────────────────────────────────────────────────────────────
# THE single source of execution state for ASA Lab.
#
# Every other document — START_HERE_FOR_AI.md, AGENTS.md, EXECUTION_MANIFEST,
# project-map, QUALITY_MAP, PR bodies — describes policy, history or structure.
# None of them may restate the fields below. When they disagree with this file,
# this file wins and the disagreement is a validation failure, not a judgement
# call.
#
# Verify with:  pnpm control-plane:check
#
# What "stabilised" means, in which order it is reached and which decisions the
# owner still has to make: docs/execution/STABILIZATION_PLAN.md
# ─────────────────────────────────────────────────────────────────────────────

task:
  id: TASK-ELECTRONICS-M1-001
  issue: 63
  branch: agent/r4-electronics-m1
  base_branch: main
  pr: 72
  # The PR stays a Draft until the owner decides otherwise. Taking it out of
  # Draft is a decision, not a side effect, so the validator watches for it.
  pr_draft: true
  # Returned from in_review on 2026-08-05: the general repository gate fails on
  # the branch head, so no release-candidate claim is currently defensible.
  status: in_progress
  checkpoint: phase_5_asset_separation
  owner_acceptance: pending

# Commits that mean something. Anything not listed here is ordinary history.
revisions:
  # Last merge into main. The product baseline every release candidate builds on.
  product_merge_sha: 67b4f8eea3804d750684dd1c6dce929f5f1f9bfa
  # Which revision is green is a fact GitHub Actions holds per commit. It is
  # not recorded here: a hand-maintained copy went stale within hours the last
  # time, and it would go stale again on the next push.
  # Owner-visible convergence baseline for the current task.
  convergence_baseline_sha: f27ac1594761265a326229fa2aa8d841081a5dd8
  # Set only by an owner acceptance transition. Never set by an agent.
  owner_accepted_sha: null

# Who is allowed to write to the product branch right now.
# A second agent that finds a held lease stays a reviewer and does not commit.
# holder must be either 'unassigned' or exactly executor_id; while it is held
# both timestamps are required and expires_at must be after acquired_at.
# validate_control_plane.py enforces all of that.
execution_lease:
  executor_id: assistant-stabilisation
  holder: assistant-stabilisation
  acquired_at: '2026-08-07T11:23:10Z'
  expires_at: '2026-08-07T19:23:10Z'
  # Anyone may read, analyse, run tests and report without holding the lease.
  reviewer_role_requires_lease: false

# Which checks exist, and what runs them. Not their outcomes.
#
# Outcomes live in GitHub Actions, which already holds a conclusion per commit.
# validate_control_plane.py reads them for the current head rather than comparing
# against a copy kept here — a copy would have to be rewritten after every push,
# on every branch carrying this file, and would be wrong in between.
gates:
  focused:
    workflow: Electronics R4-M1 Focused
    commands:
      - pnpm gate:electronics-m1
      - pnpm gate:electronics-m1:browser
  general:
    workflow: ASA Lab Governance and Code Gates
    commands:
      - pnpm gate:repository

# Conditions that must clear before the task can return to in_review.
#
# Closed so far:
#   BLOCK-PR-BODY-DRIFT   2026-08-05 — the body describes its head, and the
#                         validator fails if it drifts again
#   BLOCK-GENERAL-GATE    2026-08-05 — the general gate passed on 6973564,
#                         governance, code and PostgreSQL/RLS all green
#   BLOCK-E2E-AUTOSAVE-RACE
#                         2026-08-05 — PR #74 merged; the browser journey passed
#                         five consecutive runs on 81daca8 plus the CI run. A
#                         race is not disproved by one green run, which is why
#                         the exit condition asked for five
#   BLOCK-PERSISTENCE-TEST-COUPLING
#                         2026-08-06 — the persistence test asserts that a saved
#                         result reloads unchanged instead of asserting the LED
#                         numbers. Closed by experiment rather than by a green
#                         run: with LED_KNEE_VOLTAGE.red moved to 1.8 the solver
#                         suite failed and the persistence test stayed green
#   BLOCK-MAIN-MISDIRECTS-AGENTS
#                         2026-08-06 — PR #75 merged into main at d3c9058.
#                         Checked on a fresh clone rather than a working copy,
#                         because the symptom was what a new agent sees: zero
#                         mentions of the finished R2 branch, zero hard-coded
#                         task ids or SHAs in the entry point, and the governance
#                         gate passing on the clone itself
#   BLOCK-STATE-FILE-HAS-TWO-COPIES
#                         2026-08-06 — programme state changes on main and is
#                         inherited; the task branch is refused if it modifies
#                         this file. CI outcomes left the file entirely, since
#                         GitHub Actions already holds one per commit. Confirmed
#                         on agent/r4-electronics-m1: "current.yaml matches
#                         origin/main byte for byte".
blocking: []

# A future task becomes executable only through a separate owner transition.
next_task: null
