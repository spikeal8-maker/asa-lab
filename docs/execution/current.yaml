schema_version: 1.1.0

# Owner-selected development workflow. There is one user-visible product and it
# is developed directly in main. Legacy lane, branch, PR and lease records below
# remain as planning/history metadata only; they do not grant or block writes.
development_policy:
  mode: direct_main
  branch: main
  feature_branches: optional
  pull_requests: optional
  execution_leases: disabled
  lane_path_ownership: advisory

# ─────────────────────────────────────────────────────────────────────────────
# THE single source of execution state for ASA Lab.
#
# Every other document — START_HERE_FOR_AI.md, AGENTS.md, EXECUTION_MANIFEST,
# project-map, QUALITY_MAP, PR bodies — describes policy, history or structure.
# None of them may restate the fields below. When they disagree with this file,
# this file wins and the disagreement is a validation failure, not a judgement
# call.
#
# Verify with:  pnpm control-plane:check
#
# What "stabilised" means, in which order it is reached and which decisions the
# owner still has to make: docs/execution/STABILIZATION_PLAN.md
# ─────────────────────────────────────────────────────────────────────────────

task:
  id: TASK-ADMIN-AUTH-STABILITY-001
  issue: 135
  branch: main
  base_branch: main
  pr: null
  pr_draft: false
  # Owner-authorised stabilisation of the integrated Admin surface, durable
  # account sessions and production MAX verification. Email delivery, CRM,
  # billing, competitions and moderation remain outside this task.
  status: in_progress
  checkpoint: production_restart_verified_max_secret_pending
  owner_acceptance: pending

# Commits that mean something. Anything not listed here is ordinary history.
revisions:
  # Last merge into main. The product baseline every release candidate builds on.
  product_merge_sha: 20986b1c8aa023b8359008d55c82393cc0426954
  # Which revision is green is a fact GitHub Actions holds per commit. It is
  # not recorded here: a hand-maintained copy went stale within hours the last
  # time, and it would go stale again on the next push.
  # Owner-visible convergence baseline for the current task.
  convergence_baseline_sha: 3cdbeeffb254d9578b7133dfee666a34db1d1978

# Legacy compatibility record. It is not an access-control mechanism while
# development_policy.execution_leases is disabled.
execution_lease:
  executor_id: codex-admin-auth-max
  holder: unassigned
  acquired_at: null
  expires_at: null
  # Anyone may read, analyse, run tests and report without holding the lease.
  reviewer_role_requires_lease: false

# Which checks exist, and what runs them. Not their outcomes.
#
# Outcomes live in GitHub Actions, which already holds a conclusion per commit.
# validate_control_plane.py reads them for the current head rather than comparing
# against a copy kept here — a copy would have to be rewritten after every push,
# on every branch carrying this file, and would be wrong in between.
gates:
  focused:
    workflow: ASA Lab Governance and Code Gates
    commands:
      - pnpm gate:admin-control-plane
  browser:
    workflow: ASA Lab Governance and Code Gates
    commands:
      - pnpm e2e:admin-control-plane
  general:
    workflow: ASA Lab Governance and Code Gates
    commands:
      - pnpm gate:repository

# Schema 1.1 keeps the root task, lease and gates as the canonical primary lane
# so every existing consumer remains valid. Lane metadata adds disjoint writable
# scopes for independently leased product work.
primary_lane:
  id: admin-auth
  worktree_id: admin-auth-main
  owned_paths:
    - contexts/identity/**
    - apps/api/src/auth.controller.ts
    - apps/api/src/max-auth.service.ts
    - apps/api/src/admin-control-plane.service.ts
    - apps/web/src/admin/**
    - apps/web/src/pages/AccountPage.tsx
    - apps/web/src/pages/LoginPage.tsx
    - apps/web/src/pages/MaxLinkPage.tsx
    - migrations/0077_admin_auth_sessions.sql
    - migrations/0078_max_verification_lifecycle.sql
    - tests/admin/**
    - tests/account/**
    - e2e/admin-auth-max.spec.ts
    - docs/execution/ADMIN_AUTH_MAX_EXECUTION_PLAN.md

