schema_version: 1.1.0

# ─────────────────────────────────────────────────────────────────────────────
# THE single source of execution state for ASA Lab.
#
# Every other document — START_HERE_FOR_AI.md, AGENTS.md, EXECUTION_MANIFEST,
# project-map, QUALITY_MAP, PR bodies — describes policy, history or structure.
# None of them may restate the fields below. When they disagree with this file,
# this file wins and the disagreement is a validation failure, not a judgement
# call.
#
# Verify with:  pnpm control-plane:check
#
# What "stabilised" means, in which order it is reached and which decisions the
# owner still has to make: docs/execution/STABILIZATION_PLAN.md
# ─────────────────────────────────────────────────────────────────────────────

task:
  id: TASK-CHECKERS-M1-001
  issue: 98
  branch: agent/checkers-education-m1
  base_branch: main
  pr: 101
  pr_draft: true
  # Owner-authorised independent Checkers system. 3D M0 is preserved in main
  # after PR #95; the Checkers lane does not modify it. Chess and Electronics
  # remain outside this task's writable product scope.
  status: in_progress
  checkpoint: project_document_foundation
  owner_acceptance: pending

# Commits that mean something. Anything not listed here is ordinary history.
revisions:
  # Last merge into main. The product baseline every release candidate builds on.
  product_merge_sha: 2a119a258b5fe36e05bc8aa8548e95ca87042cf5
  # Which revision is green is a fact GitHub Actions holds per commit. It is
  # not recorded here: a hand-maintained copy went stale within hours the last
  # time, and it would go stale again on the next push.
  # Owner-visible convergence baseline for the current task.
  convergence_baseline_sha: db1038c66630c80bf121e7c794a44f119a028753
  # Set only by an owner acceptance transition. Never set by an agent.
  owner_accepted_sha: null

# Who is allowed to write to the product branch right now.
# A second agent that finds a held lease stays a reviewer and does not commit.
# holder must be either 'unassigned' or exactly executor_id; while it is held
# both timestamps are required and expires_at must be after acquired_at.
# validate_control_plane.py enforces all of that.
execution_lease:
  executor_id: codex-checkers-m1
  holder: codex-checkers-m1
  acquired_at: "2026-08-11T18:41:49Z"
  expires_at: "2026-08-12T18:41:49Z"
  # Anyone may read, analyse, run tests and report without holding the lease.
  reviewer_role_requires_lease: false

# Which checks exist, and what runs them. Not their outcomes.
#
# Outcomes live in GitHub Actions, which already holds a conclusion per commit.
# validate_control_plane.py reads them for the current head rather than comparing
# against a copy kept here — a copy would have to be rewritten after every push,
# on every branch carrying this file, and would be wrong in between.
gates:
  focused:
    workflow: Checkers M1 Focused
    commands:
      - pnpm gate:checkers-m1
      - pnpm gate:checkers-m1:browser
  general:
    workflow: ASA Lab Governance and Code Gates
    commands:
      - pnpm gate:repository

# Schema 1.1 keeps the root task, lease and gates as the canonical primary lane
# so every existing consumer remains valid. Lane metadata adds disjoint writable
# scopes for independently leased product work.
primary_lane:
  id: checkers
  worktree_id: checkers-education-m1
  owned_paths:
    - contexts/checkers/**
    - apps/web/src/checkers/**

parallel_lanes:
  - id: chess
    worktree_id: chess-r1
    owned_paths:
      - contexts/chess/**
      - contexts/chess-live/**
      - apps/api/src/chess-live.controller.ts
      - apps/api/src/chess-live.controller.spec.ts
      - apps/web/src/chess/**
      - apps/web/src/components/editor-chrome/**
      - e2e/chess-module.spec.ts
      - e2e/chess-live.spec.ts
      - tests/chess/**
      - tests/chess-live/**
      - docs/product/ASA_CHESS_PLATFORM_SPEC.md
      - docs/product/ASA_CHESS_EXECUTION_PLAN.md
      - docs/product/ASA_CHESS_R1_PARITY_LEDGER.md
      - docs/product/ASA_EDITOR_HEADER_CONTRACT.md
      - docs/architecture/SUBJECT_MODULE_ISOLATION_PLAN.md
    task:
      id: TASK-CHESS-R1-001
      issue: 97
      branch: agent/chess-r1-foundation
      base_branch: main
      pr: 103
      pr_draft: true
      status: in_progress
      checkpoint: published_plan_and_engine_contract
      owner_acceptance: pending
    revisions:
      convergence_baseline_sha: 3473ec9f87cdc6b7f1f6c94195e4ed2a9b2bb6ea
      # Head at lane activation. Later PR heads must descend from it; product
      # progress does not require a governance rewrite after every push.
      head_sha: 3473ec9f87cdc6b7f1f6c94195e4ed2a9b2bb6ea
    execution_lease:
      executor_id: codex-chess-r1
      holder: codex-chess-r1
      acquired_at: "2026-08-11T19:20:01Z"
      expires_at: "2026-08-12T19:20:01Z"
      reviewer_role_requires_lease: false
    gates:
      focused:
        workflow: Chess R1 Focused
        commands:
          - pnpm gate:chess-r1
      browser:
        workflow: Chess R1 Focused
        commands:
          - pnpm gate:chess-r1:browser
      general:
        workflow: ASA Lab Governance and Code Gates
        commands:
          - pnpm gate:repository

integration:
  owner_lane: checkers
  shared_paths:
    - docs/execution/current.yaml
    - AGENTS.md
    - START_HERE_FOR_AI.md
    - package.json
    - pnpm-lock.yaml
    - tools/validate_control_plane.py
    - tools/test_validate_control_plane.py
    - .github/workflows/**
    - docs/delivery/**
    - docs/project-map/**
    - docs/testing/**

blocking: []

# A future task becomes executable only through a separate owner transition.
next_task: null
