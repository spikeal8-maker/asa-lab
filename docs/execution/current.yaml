schema_version: 1.0.0

# ─────────────────────────────────────────────────────────────────────────────
# THE single source of execution state for ASA Lab.
#
# Every other document — START_HERE_FOR_AI.md, AGENTS.md, EXECUTION_MANIFEST,
# project-map, QUALITY_MAP, PR bodies — describes policy, history or structure.
# None of them may restate the fields below. When they disagree with this file,
# this file wins and the disagreement is a validation failure, not a judgement
# call.
#
# Verify with:  pnpm control-plane:check
#
# What "stabilised" means, in which order it is reached and which decisions the
# owner still has to make: docs/execution/STABILIZATION_PLAN.md
# ─────────────────────────────────────────────────────────────────────────────

task:
  id: TASK-ELECTRONICS-M1-001
  issue: 63
  branch: agent/r4-electronics-m1
  base_branch: main
  pr: 72
  # The PR stays a Draft until the owner decides otherwise. Taking it out of
  # Draft is a decision, not a side effect, so the validator watches for it.
  pr_draft: true
  # Returned from in_review on 2026-08-05: the general repository gate fails on
  # the branch head, so no release-candidate claim is currently defensible.
  status: in_progress
  checkpoint: m1_led_visual_corrective
  owner_acceptance: pending

# Commits that mean something. Anything not listed here is ordinary history.
revisions:
  # Last merge into main. The product baseline every release candidate builds on.
  product_merge_sha: 67b4f8eea3804d750684dd1c6dce929f5f1f9bfa
  # Owner-visible convergence baseline for the current task.
  convergence_baseline_sha: f27ac1594761265a326229fa2aa8d841081a5dd8
  # Last branch head where BOTH the focused and the general gate were green.
  # Four commits landed after it and broke the general gate.
  last_full_green_sha: 255b0d5e8badc79b33897646b9077d44add03fde
  # Set only by an owner acceptance transition. Never set by an agent.
  owner_accepted_sha: null

# Who is allowed to write to the product branch right now.
# A second agent that finds a held lease stays a reviewer and does not commit.
# holder must be either 'unassigned' or exactly executor_id; while it is held
# both timestamps are required and expires_at must be after acquired_at.
# validate_control_plane.py enforces all of that.
execution_lease:
  executor_id: coding_bot
  holder: unassigned
  acquired_at: null
  expires_at: null
  # Anyone may read, analyse, run tests and report without holding the lease.
  reviewer_role_requires_lease: false

# What is known to be true about the PRODUCT BRANCH head, and what is not.
# last_known is not an honour-system claim: validate_control_plane.py queries
# the named workflow's conclusion on that exact head and fails when they differ.
gates:
  focused:
    workflow: Electronics R4-M1 Focused
    commands:
      - pnpm gate:electronics-m1
      - pnpm gate:electronics-m1:browser
    last_known: PASS
  general:
    workflow: ASA Lab Governance and Code Gates
    commands:
      - pnpm gate:repository
    # Still FAIL on the product branch head; the fix is not merged yet.
    last_known: FAIL
    failure: >-
      tests/portal/projects-api.spec.ts asserted the pre-checkpoint LED model
      (ideal 1.9 V drop, 8 Ω) after the solver moved to a colour-specific knee
      voltage plus dynamic resistance.
    fix: >-
      Verified green on chore/control-plane-recovery (PR #73), including the
      complete Vitest suite and the RLS gate in an isolated PostgreSQL.

# Conditions that must clear before the task can return to in_review.
# BLOCK-PR-BODY-DRIFT was closed on 2026-08-05: the PR #72 body now describes
# its actual head, and validate_control_plane.py fails if it drifts again.
blocking:
  - id: BLOCK-MAIN-MISDIRECTS-AGENTS
    summary: >-
      main still declares the finished R2 task in four places, so a fresh clone
      sends an agent into a completed branch. The control plane is restored only
      on this branch until the repo-wide layer is delivered to main.
    plan: docs/execution/CONTROL_PLANE_DELIVERY.md
    resolved_by: grep -c "agent/r2-creator-portal" START_HERE_FOR_AI.md
  - id: BLOCK-GENERAL-GATE
    summary: General repository gate must pass on the product branch head.
    resolved_by: pnpm gate:repository
    note: Fix verified on PR #73; clears when that PR merges.
  - id: BLOCK-E2E-AUTOSAVE-RACE
    summary: >-
      A draft save that finished could report success for a newer document,
      so an edit made while a save was in flight could be lost and a checkpoint
      taken right after it captured the previous document. Observed as brightness
      43 (220 Ω) where 17 (1000 Ω) was expected. Not a flaky test: a user could
      lose an edit the editor had already called saved.
    fix_pr: 74
    resolved_by: pnpm e2e:electronics-simulation
    note: >-
      Fixed on fix/electronics-autosave-race (PR #74) — save status is derived
      from which document the server holds rather than assigned on any response,
      and saves are serialised. Clears when that PR merges.

# A future task becomes executable only through a separate owner transition.
next_task: null
