schema_version: 1.0.0
matrix_version: 2026.08.16-2
product:
  id: asa-lab
  reference: tinkercad
  principle: parity_before_improvements
  source_of_truth: docs/product/TINKERCAD_PARITY_SPEC.md

status_definitions:
  absent: Capability is not implemented.
  partial: Some code exists but the reference user flow is incomplete.
  ready_for_build: Specification and dependencies are ready.
  in_progress: One active implementation owns the capability.
  in_review: Implementation exists in a pull request and awaits gate/review.
  parity_pass: Reference flow is confirmed by tests and owner review.
  deferred: Explicit owner decision moved the capability later.

surfaces:
  - id: SURFACE-AUTH
    name: Authentication and Join Class
    capabilities: [PARITY-ADULT-AUTH, PARITY-STUDENT-SEAT, PARITY-JOIN-CLASS]

  - id: SURFACE-PROJECT-HUB
    name: My Projects and Create Chooser
    capabilities: [PARITY-PROJECT-HUB, PARITY-MODULE-CHOOSER, PARITY-PROJECT-CARDS, PARITY-PREVIEW]

  - id: SURFACE-EDITOR-HOST
    name: Shared Editor Host
    capabilities: [PARITY-EDITOR-SHELL, PARITY-SAVE-VERSIONS, PARITY-MODULE-CONTRACT]

  - id: SURFACE-PUBLICATION
    name: Sharing and Publication
    capabilities: [PARITY-VISIBILITY, PARITY-SHARE-LINK, PARITY-PUBLISH, PARITY-PUBLIC-PAGE, PARITY-REMIX]

  - id: SURFACE-COMMUNITY
    name: Profiles and Explore
    capabilities: [PARITY-PROFILE, PARITY-EXPLORE, PARITY-LIKES, PARITY-BOOKMARKS, PARITY-PUBLIC-COMMENTS, PARITY-REPORTS]

  - id: SURFACE-CLASSROOM
    name: Classroom and Student Work
    capabilities: [PARITY-CLASSROOM, PARITY-STUDENT-SEAT, PARITY-CO-TEACHER, PARITY-STUDENT-WORK, PARITY-CLASS-ACTIVITY, PARITY-SAFE-MODE]

  - id: SURFACE-ASSIGNMENT
    name: Assignment, Submission and Review
    capabilities: [PARITY-ACTIVITY, PARITY-ASSIGNMENT, PARITY-PROGRESS, PARITY-SUBMISSION, PARITY-EDU-COMMENTS, PARITY-REVIEW, PARITY-GRADE, PARITY-BADGE]

capabilities:
  - id: PARITY-ADULT-AUTH
    name: Adult account and teacher login
    target_release: P1
    status: parity_pass
    depends_on: []
    current_evidence: [e2e-account-c1, api-auth, api-account-sessions]
    gap: None. Registration with an age gate, sign-in, role choice, school creation and session management are covered by the account journey.
    gate: Adult user signs in and reaches My Projects.

  - id: PARITY-PROJECT-HUB
    name: My Projects hub
    target_release: P1
    status: parity_pass
    depends_on: [PARITY-ADULT-AUTH]
    current_evidence: [e2e-project-hub, api-projects]
    gap: None. All four subject modules go through Project Core, and duplicate, archive, trash and restore are covered by a browser journey.
    gate: Personal and classroom projects appear in one module-aware hub with filters and actions.

  - id: PARITY-MODULE-CHOOSER
    name: Create project module chooser
    target_release: P1
    status: parity_pass
    depends_on: [PARITY-PROJECT-HUB, PARITY-MODULE-CONTRACT]
    current_evidence: [api-modules-registry, web-create-project-modal]
    gap: None. The registry drives the chooser; Electronics, Chess, Checkers and ASA 3D are selectable.
    gate: Active and future modules are rendered from Module Registry without hard-coded Core switches.

  - id: PARITY-PROJECT-CARDS
    name: Project cards and actions
    target_release: P1
    status: partial
    depends_on: [PARITY-PROJECT-HUB, PARITY-PREVIEW]
    current_evidence: [e2e-project-hub, e2e-project-preview, api-projects-status]
    gap: Duplicate, archive, trash and restore work, and a card now shows the project rather than its module icon. Visibility and publish actions are missing because the whole visibility model is a P2 capability that does not exist yet.
    gate: Card supports open, rename, duplicate, share, publish/unpublish and archive according to grants.

  - id: PARITY-PREVIEW
    name: Deterministic project previews
    target_release: P1
    status: partial
    depends_on: [PARITY-MODULE-CONTRACT, PARITY-SAVE-VERSIONS]
    current_evidence: [e2e-project-preview, unit-module-preview, unit-project-preview-component]
    gap: Cards on every project surface show a stored figure, and all four modules produce one — a schematic for circuits, a board for chess and checkers, a plan view for 3D scenes. Each is drawn by Project Core from neutral primitives, is byte-identical for the same document, and carries a digest. What is missing is the second half of the gate: nothing but a card consumes a preview, because the gallery and publication surfaces a viewer would see are P2 and do not exist yet.
    gate: Same version produces the same safe preview for cards and viewers.

  - id: PARITY-EDITOR-SHELL
    name: Shared editor shell
    target_release: P1
    status: parity_pass
    depends_on: [PARITY-MODULE-CONTRACT, PARITY-SAVE-VERSIONS]
    current_evidence: [web-module-editor-host, editor-header-contract, e2e-chess, e2e-checkers, e2e-three-d]
    gap: None. One host mounts four modules as lazy chunks behind a shared header contract and a common error boundary.
    gate: Shared project name, save state, versions, share/publish affordances and return navigation wrap every active module.

  - id: PARITY-SAVE-VERSIONS
    name: Autosave and immutable versions
    target_release: P1
    status: parity_pass
    depends_on: [PARITY-ADULT-AUTH]
    current_evidence: [api-projects-draft, api-projects-checkpoints, e2e-chess, e2e-three-d]
    gap: None. Drafts autosave and immutable versions are created and reloaded; the chess and 3D journeys assert a named version after reload.
    gate: Draft survives reload and a version is immutable and addressable.

  - id: PARITY-MODULE-CONTRACT
    name: Universal Module Registry and provider contract
    target_release: P1
    status: parity_pass
    depends_on: []
    current_evidence: [packages-module-sdk, boundaries-gate]
    gap: None. Four isolated contexts implement the SDK contract and the boundary gate proves the core does not import subject code.
    gate: At least three different modules use one Core lifecycle without module-specific Core branches.

  - id: PARITY-VISIBILITY
    name: Project visibility model
    target_release: P2
    status: absent
    depends_on: [PARITY-SAVE-VERSIONS, PARITY-SAFE-MODE]
    current_evidence: []
    gap: The projects table has no visibility column and no endpoint sets one.
    gate: Server enforces all visibility levels and assignment publication lock.

  - id: PARITY-SHARE-LINK
    name: Revocable unlisted share links
    target_release: P2
    status: absent
    depends_on: [PARITY-VISIBILITY]
    current_evidence: []
    gap: No share-link storage or endpoint.
    gate: Owner creates and revokes a view/copy link to an exact version.

  - id: PARITY-PUBLISH
    name: Publish and unpublish
    target_release: P2
    status: absent
    depends_on: [PARITY-VISIBILITY, PARITY-PREVIEW, PARITY-MODERATION]
    current_evidence: []
    gap: No publish state or endpoint.
    gate: A validated immutable version becomes public without exposing the draft.

  - id: PARITY-PUBLIC-PAGE
    name: Public project page
    target_release: P2
    status: absent
    depends_on: [PARITY-PUBLISH, PARITY-MODULE-CONTRACT]
    current_evidence: []
    gap: No public route; every project route requires a session.
    gate: Anonymous visitor opens a published version and cannot mutate the original.

  - id: PARITY-REMIX
    name: Copy and remix lineage
    target_release: P2
    status: absent
    depends_on: [PARITY-PUBLIC-PAGE, PARITY-PROJECT-HUB]
    current_evidence: []
    gap: Duplicate exists for one's own project, but there is no lineage record and no copy of somebody else's work.
    gate: Registered user copies a published version into a personal project with attribution.

  - id: PARITY-PROFILE
    name: Creator profile and portfolio
    target_release: P3
    status: absent
    depends_on: [PARITY-PUBLISH]
    current_evidence: []
    gap: An account settings page exists, but there is no public creator profile or portfolio.
    gate: Allowed user profile shows published projects; child profile remains private by default.

  - id: PARITY-EXPLORE
    name: Explore gallery and search
    target_release: P3
    status: absent
    depends_on: [PARITY-PUBLISH, PARITY-MODERATION]
    current_evidence: []
    gap: No gallery, no search.
    gate: Only eligible published projects appear in recent/popular/featured module feeds.

  - id: PARITY-LIKES
    name: Likes
    target_release: P3
    status: absent
    depends_on: [PARITY-PUBLIC-PAGE, PARITY-SAFE-MODE]
    current_evidence: []
    gap: No likes.
    gate: Eligible user can like/unlike once; Safe Mode policy is enforced.

  - id: PARITY-BOOKMARKS
    name: Bookmarks and collections
    target_release: P3
    status: absent
    depends_on: [PARITY-PUBLIC-PAGE]
    current_evidence: []
    gap: A Collections destination exists in the portal navigation and reports that there is nothing saved; no storage behind it.
    gate: User saves public projects to private collections without changing originals.

  - id: PARITY-PUBLIC-COMMENTS
    name: Public project comments
    target_release: P3
    status: absent
    depends_on: [PARITY-PUBLIC-PAGE, PARITY-MODERATION, PARITY-SAFE-MODE]
    current_evidence: []
    gap: No public comments.
    gate: Policy-eligible users comment; StudentSeat cannot; moderation and rate limits work.

  - id: PARITY-REPORTS
    name: Content reports
    target_release: P3
    status: absent
    depends_on: [PARITY-PUBLIC-PAGE, PARITY-MODERATION]
    current_evidence: []
    gap: Checkers has a reaction report path inside a class; there is no platform-wide content report.
    gate: Report creates a moderation case and audit trail.

  - id: PARITY-MODERATION
    name: Publication moderation
    target_release: P2
    status: absent
    depends_on: [PARITY-SAFE-MODE]
    current_evidence: []
    gap: Nothing is publishable, so there is nothing to moderate.
    gate: Publish, restrict, unpublish and restore decisions are audited.

  - id: PARITY-CLASSROOM
    name: Classroom lifecycle
    target_release: P4
    status: parity_pass
    depends_on: [PARITY-ADULT-AUTH]
    current_evidence: [e2e-classroom-management, api-classrooms, e2e-teacher-portal]
    gap: None. Create, roster, policies and join-code rotation are covered by a browser journey.
    gate: Teacher creates class, adds students/co-teacher and opens complete class sections.

  - id: PARITY-STUDENT-SEAT
    name: Student seat without email
    target_release: P4
    status: parity_pass
    depends_on: [PARITY-CLASSROOM, PARITY-SAFE-MODE]
    current_evidence: [e2e-classroom-management, api-classroom-seats]
    gap: None. Seats are issued individually and in batches, and learner access is controlled without an email address.
    gate: Student joins without registration and sees only permitted work.

  - id: PARITY-JOIN-CLASS
    name: Join class by code or link
    target_release: P4
    status: parity_pass
    depends_on: [PARITY-CLASSROOM, PARITY-STUDENT-SEAT]
    current_evidence: [api-class-join, web-entry-join]
    gap: None. A learner resolves a class code from the entry screen and receives a seat session.
    gate: Existing account or StudentSeat joins a teacher-moderated class.

  - id: PARITY-CO-TEACHER
    name: Co-teacher moderation
    target_release: P4
    status: parity_pass
    depends_on: [PARITY-CLASSROOM]
    current_evidence: [api-classroom-teachers, pg-personal-classroom-coteacher]
    gap: None. Invitations, acceptance and removal are covered, including a personal class shared with an invited educator.
    gate: Owner invites co-teacher with explicit grants and audit.

  - id: PARITY-STUDENT-WORK
    name: Teacher visibility of student work
    target_release: P4
    status: partial
    depends_on: [PARITY-STUDENT-SEAT, PARITY-PROJECT-HUB]
    current_evidence: [e2e-checkers, api-checkers-classroom]
    gap: A teacher sees learner evidence in Checkers only. There is no module-neutral view of student work.
    gate: Teacher filters students/projects, opens current draft and exact versions without silently editing.

  - id: PARITY-CLASS-ACTIVITY
    name: Classroom activity feed
    target_release: P4
    status: absent
    depends_on: [PARITY-CLASSROOM, PARITY-STUDENT-WORK]
    current_evidence: []
    gap: Audit events are written but never read; there is no activity feed surface.
    gate: Teacher sees project opened/saved/submitted/reviewed events without payload leakage.

  - id: PARITY-SAFE-MODE
    name: Safe Mode and child privacy
    target_release: P4
    status: partial
    depends_on: [PARITY-CLASSROOM]
    current_evidence: [e2e-checkers, api-classroom-policies]
    gap: Checkers has predefined reactions, mute and teacher signals, and classrooms carry policies. Safe Mode is not enforced as a platform-wide state across modules.
    gate: StudentSeat cannot publish or publicly communicate; teacher policies are enforced and audited.

  - id: PARITY-ACTIVITY
    name: Teacher activity/starter project
    target_release: P5
    status: absent
    depends_on: [PARITY-PROJECT-HUB, PARITY-MODULE-CONTRACT]
    current_evidence: []
    gap: No activity or starter-project concept separate from a project.
    gate: Teacher selects a personal project and publishes a reusable starter activity.

  - id: PARITY-ASSIGNMENT
    name: Assign to class/group/student
    target_release: P5
    status: partial
    depends_on: [PARITY-ACTIVITY, PARITY-CLASSROOM]
    current_evidence: [e2e-checkers]
    gap: Checkers assigns class work and the learner receives it. Assignment is module-specific, with no generic assignment to class, group or student.
    gate: Teacher assigns an exact activity version with dates and attempt policy.

  - id: PARITY-PROGRESS
    name: Assignment progress monitoring
    target_release: P5
    status: partial
    depends_on: [PARITY-ASSIGNMENT, PARITY-STUDENT-WORK]
    current_evidence: [e2e-checkers, api-checkers-classroom]
    gap: A Checkers teacher sees per-student state after completion. There is no cross-module progress view.
    gate: Teacher sees status and last activity for each student.

  - id: PARITY-SUBMISSION
    name: Immutable submission attempts
    target_release: P5
    status: partial
    depends_on: [PARITY-ASSIGNMENT, PARITY-SAVE-VERSIONS]
    current_evidence: [api-checkers-state]
    gap: Checkers keeps a revisioned student document. Attempts are not immutable and are not modelled as submissions.
    gate: Student submits exact version and later attempts do not mutate it.

  - id: PARITY-EDU-COMMENTS
    name: Educational feedback and anchors
    target_release: P5
    status: partial
    depends_on: [PARITY-SUBMISSION, PARITY-MODULE-CONTRACT]
    current_evidence: [api-checkers-feedback]
    gap: Checkers stores teacher feedback per student. Feedback is not anchored to a position or step and exists in one module only.
    gate: Teacher leaves general and module-anchored feedback on exact version.

  - id: PARITY-REVIEW
    name: Request changes and accept
    target_release: P5
    status: absent
    depends_on: [PARITY-SUBMISSION, PARITY-EDU-COMMENTS]
    current_evidence: []
    gap: No request-changes or accept cycle.
    gate: Teacher requests changes, receives resubmission and accepts final version.

  - id: PARITY-GRADE
    name: Grade and rubric result
    target_release: P5
    status: absent
    depends_on: [PARITY-REVIEW]
    current_evidence: []
    gap: No grade or rubric.
    gate: Audited grade references exact submission evidence.

  - id: PARITY-BADGE
    name: Teacher-assigned skill badge
    target_release: P5
    status: absent
    depends_on: [PARITY-REVIEW]
    current_evidence: []
    gap: No badge.
    gate: Teacher awards badge and student sees it on dashboard.

releases:
  - id: P0
    name: Parity contract freeze
    capabilities: []
    gate: TINKERCAD_PARITY_SPEC and matrix are accepted; deviations register exists.

  - id: P1
    name: Project hub and editor host
    capabilities: [PARITY-ADULT-AUTH, PARITY-PROJECT-HUB, PARITY-MODULE-CHOOSER, PARITY-PROJECT-CARDS, PARITY-PREVIEW, PARITY-EDITOR-SHELL, PARITY-SAVE-VERSIONS, PARITY-MODULE-CONTRACT]
    gate: Personal multi-module project creation, cards, preview, save/reload/version and shared editor shell work.

  - id: P2
    name: Sharing and publication
    capabilities: [PARITY-VISIBILITY, PARITY-SHARE-LINK, PARITY-PUBLISH, PARITY-PUBLIC-PAGE, PARITY-REMIX, PARITY-MODERATION]
    gate: Private/unlisted/public version-safe sharing and remix flow work end to end.

  - id: P3
    name: Profiles and Explore
    capabilities: [PARITY-PROFILE, PARITY-EXPLORE, PARITY-LIKES, PARITY-BOOKMARKS, PARITY-PUBLIC-COMMENTS, PARITY-REPORTS]
    gate: Public portfolio, gallery, search and moderated social actions work.

  - id: P4
    name: Classroom parity
    capabilities: [PARITY-CLASSROOM, PARITY-STUDENT-SEAT, PARITY-JOIN-CLASS, PARITY-CO-TEACHER, PARITY-STUDENT-WORK, PARITY-CLASS-ACTIVITY, PARITY-SAFE-MODE]
    gate: Teacher-moderated class, student access and student work visibility work safely.

  - id: P5
    name: Assignment and feedback cycle
    capabilities: [PARITY-ACTIVITY, PARITY-ASSIGNMENT, PARITY-PROGRESS, PARITY-SUBMISSION, PARITY-EDU-COMMENTS, PARITY-REVIEW, PARITY-GRADE, PARITY-BADGE]
    gate: Teacher starter project to assignment, submission, feedback, revision, grade and badge works.

  - id: P6
    name: Multi-module parity proof
    capabilities: [PARITY-MODULE-CONTRACT]
    gate: Electronics, block coding and chess/checkers or 3D share the same project/publication/classroom lifecycle without Core module switches.
