  planned_scenarios:
  - RNG-SOURCE
  - SINGLE-BATCH-PARITY
  - BATCH-REPLAY-STABLE
  - BATCH-CONCURRENT-UNIQUE
  - CODE-READBACK-AUTHZ
  - ROTATION-HISTORY-UNCHANGED
  - PREDICTABLE-CODE-UPGRADE
  - AES-GCM-ROUNDTRIP-AND-TAMPER
  - KEY-ID-UNKNOWN-FAIL-CLOSED
  - BACKUP-RESTORE-WITH-TEST-KEYRING
  - RETIRED-CODE-NOT-REUSED
  - R1-REPLAY-AFTER-R2-SUPERSEDED
  - STALE-PRINT-VERSION-CONFLICT
  - PERMISSION-REVOKED-BEFORE-REPLAY
  - AAD-SEAT-VERSION-SWAP-TAMPER
  - LOOKUP-KEY-DUAL-READ-ROTATION
  - MANUAL-CODE-4-TO-10-ALNUM-CASE-SENSITIVE
  - KEYRING-MISSING-READINESS-FAIL
  - BACKFILL-INTERRUPT-RESUME
  - BACKFILL-NO-SECRETS-IN-LOGS
  - BACKFILL-ZERO-UNMIGRATED-COVERAGE
  - OLD-APP-ROLLBACK-BEFORE-PLAINTEXT-CLEANUP
  - OWNER-CREDENTIAL-MANAGER-ALLOW
  - AUTO-CODE-SAFE-MIXED-CASE-ALPHABET
  - AUTO-CODE-DEFAULT-LENGTH-6
  - CASE-SENSITIVE-LOOKUP-AND-UNIQUENESS
  - CO-TEACHER-EXACT-CLASS-CREDENTIAL-ALLOW
  - ORG-STAFF-EXACT-CLASS-CREDENTIAL-ALLOW
  - ORG-STAFF-WITHOUT-CLASS-SCOPE-DENY
  - TEMPORARY-SUBSTITUTE-IN-WINDOW-ALLOW
  - TEMPORARY-SUBSTITUTE-EXPIRED-OR-REVOKED-DENY
  - COMPAT-DUAL-WRITE-NO-UNPROTECTED-RACE
  - LEGACY-PREDICTABLE-ZERO-BEFORE-INSTALLED-ACCEPTANCE
  implementation_contract:
    encryption: AES-256-GCM
    lookup: HMAC-SHA-256
    key_storage: outside_database_secret_keyring
    retired_code_reuse: forbidden_within_class
    legacy_transition: envelope_then_explicit_rotation
    permissions:
    - class.credentials.issue
    - class.credentials.read_current
    - class.credentials.rotate
    - class.sessions.revoke
    aad: v1|tenant_id|class_id|seat_id|credential_version
    encryption_key_bytes: 32
    lookup_key_min_bytes: 32
    lookup_key_rotation: dual_read_then_rehash_then_retire
    generated_code_length: 6
    generated_code_alphabet: 2346789ACDEFGHJKMNPQRTUVWXYacdefghjkmnpqrtuvwxy
    generated_code_requires_all_character_classes: false
    manual_code_pattern: '^[A-Za-z0-9]{4,10}$'
    code_case_sensitive: true
    migration_allocation:
      timing: fresh_main_immediately_before_implementation
      rule: next_free_version_greater_than_every_published_migration
      preallocated_version: forbidden
    backfill_tool: tools/student-seat-protected-code-backfill.mjs
    keyring_env:
    - ASA_STUDENT_CODE_ENCRYPTION_KEYS_JSON
    - ASA_STUDENT_CODE_ENCRYPTION_ACTIVE_KEY_ID
    - ASA_STUDENT_CODE_LOOKUP_KEYS_JSON
    - ASA_STUDENT_CODE_LOOKUP_ACTIVE_KEY_ID
    sql_contains_key_material: false
    schema_apply_rotates_student_codes: false
    e1_permission_mapping: active_exact_class_staff_scope
    existing_owner_and_co_teacher_access_preserved: true
    organization_role_requires_exact_class_scope: true
    temporary_substitute_access: active_window_or_explicit_revoke
    rollout_mode_initial: compat
    old_api_concurrent_with_backfill: false
    compat_new_writes_protected_and_legacy: true
    installed_acceptance_requires_unprotected_active: 0
    installed_acceptance_requires_legacy_predictable_active: 0
    final_mode: enforced
  planned_test_ids: *id001
