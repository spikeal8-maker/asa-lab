requirements:
  - id: GP-R0-001
    title: Gaming identity
    observed_main_sha: c3c1c10d7e37782de58ec84d31ed3336971150f5
    evidence:
      - docs/product/games-platform/R0_001_GAMING_IDENTITY.md
      - docs/product/games-platform/R0_001_GAMING_IDENTITY_REVIEW.md
      - migrations/0026_student_seat_principal.sql
      - migrations/0047_seat_principal_lookup.sql
      - migrations/0050_account_learners.sql
      - migrations/0062_principal_home_tenant.sql
      - migrations/0086_learning_identity_foundation.sql
      - contexts/identity/application/active-context.usecase.ts
      - contexts/identity/application/account.ports.ts
      - docs/agent/contracts/identity.yaml
    acceptance:
      - one stable gaming-subject resolution contract
      - no second auth system
      - no raw internal id in public fallback
      - account plus seat principal case covered
    decision: >-
      Use an opaque platform-owned game_player_id resolved from verified Account or StudentSeat
      sources. Account-owned seats resolve to the Account-backed player. Distinct verified
      subjects merge only through explicit audited canonical aliasing; principal_id,
      learner_identity.id, email and display names are not gaming keys.
    negative_case: >-
      Two unlinked StudentSeats with the same display name remain separate; a client-claimed
      playerId never grants authority; class/workspace revocation does not delete match history.
    compatibility: >-
      R1 Checkers maps authenticated humans at the Games adapter boundary without rewriting
      legacy bot/local/classroom saves. Chess Live remains unchanged until R4 shadow mapping and
      parity; existing chess participant/history identifiers are not renamed in place.
    review_verdict: PASS
    state: accepted

  - id: GP-R0-002
    title: Games security and storage domain
    observed_main_sha: 5f5ee6aab8e2981300ff25c698ac6e4f1e4987ce
    evidence:
      - docs/product/games-platform/R0_002_GAMES_SECURITY_DOMAIN.md
      - docs/product/games-platform/R0_002_GAMES_SECURITY_DOMAIN_REVIEW.md
      - docs/architecture/DATA_SECURITY_AND_TENANCY.md
      - packages/database/src/index.ts
      - migrations/0006_chess_live.sql
      - contexts/chess-live/application/ports.ts
    acceptance:
      - cross-workspace placement decided
      - authorization and RLS negative-test model defined
      - no participant tenant chosen by convenience
    decision: >-
      Store global/cross-workspace Games state in an explicit platform-scoped Games security
      domain, initially in the same PostgreSQL database behind a dedicated Games schema and
      repositories. Do not use a participant tenant or synthetic Games tenant. Resolve a
      server-derived game_player_id transaction context; keep FORCE RLS for private Games rows
      and narrow audited transactional boundaries for legitimate cross-player operations.
    negative_case: >-
      A player cannot gain access by supplying another playerId, changing tenantId, knowing a
      private match UUID, or setting only tenant context. Missing Games actor context fails
      closed, and class outsiders cannot access class-scoped matches.
    compatibility: >-
      R1 Checkers may become the first platform-Games persistence consumer without rewriting
      bot/local/classroom saves. Existing Chess Live remains tenant-scoped until additive R4
      shadow mapping/parity; chess_live tables are not renamed or repurposed in R0.
    review_verdict: PASS
    state: accepted

