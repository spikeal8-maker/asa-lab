requirements:
  - id: GP-R0-001
    title: Gaming identity
    observed_main_sha: c3c1c10d7e37782de58ec84d31ed3336971150f5
    evidence: [R0_001_GAMING_IDENTITY.md, R0_001_GAMING_IDENTITY_REVIEW.md, migrations/0026_student_seat_principal.sql, migrations/0086_learning_identity_foundation.sql]
    acceptance: [stable gaming subject, no second auth, no raw public internal id]
    decision: Opaque game_player_id from verified Account/StudentSeat sources; merge only by audited canonical aliasing.
    negative_case: Same-name unlinked seats stay separate; client playerId never grants authority.
    compatibility: Checkers maps at adapter; Chess stays unchanged until R4 parity.
    review_verdict: PASS
    state: accepted

  - id: GP-R0-002
    title: Games security and storage domain
    observed_main_sha: 5f5ee6aab8e2981300ff25c698ac6e4f1e4987ce
    evidence: [R0_002_GAMES_SECURITY_DOMAIN.md, R0_002_GAMES_SECURITY_DOMAIN_REVIEW.md, docs/architecture/DATA_SECURITY_AND_TENANCY.md, migrations/0006_chess_live.sql]
    acceptance: [cross-workspace placement, authorization/RLS negative model, no participant-tenant ownership]
    decision: Platform-scoped Games data in existing PostgreSQL initially, behind dedicated repository/schema boundary and FORCE RLS.
    negative_case: Supplied playerId/tenantId or private match UUID alone grants no access.
    compatibility: R1 Checkers uses Games persistence; Chess Live remains tenant-scoped until R4.
    review_verdict: PASS
    state: accepted

  - id: GP-R0-003
    title: Canonical Match dimensions
    observed_main_sha: 55ea4df254786fd5067b31da78e70a8ae8f99250
    evidence: [R0_003_CANONICAL_MATCH_MODEL.md, R0_003_CANONICAL_MATCH_MODEL_REVIEW.md, contexts/checkers/application/game-service.ts, contexts/chess-live/domain/model.ts]
    acceptance: [orthogonal admission/competition/scope/runtime/topology, no game-state columns]
    decision: One GameMatch envelope with five independent dimensions; seatKey opaque; game state game-owned.
    negative_case: Rated is not admission; classroom is not competition; colors/sides are not Match columns.
    compatibility: Checkers modes decompose; Chess challenge/rated/colors map additively.
    review_verdict: PASS
    state: accepted

  - id: GP-R0-004
    title: Match state machine and termination
    observed_main_sha: 9ff66b6efcf765c021fb3c74fddf91585f856713
    evidence: [R0_004_MATCH_STATE_MACHINE.md, R0_004_TERMINATION_FINALIZATION.md, R0_004_MATCH_STATE_MACHINE_REVIEW.md, contexts/checkers/application/game-service.ts, contexts/chess-live/domain/model.ts]
    acceptance: [transition table with actors, termination matrix, invalid-transition semantics]
    decision: waiting -> ready -> active -> finishing -> finished; cancelled/aborted terminal; lifecycle server-authoritative.
    negative_case: Disconnect/allocation/draw-offer are not Match states; terminal rows never silently reopen.
    compatibility: Checkers and Chess map without changing game rules/state.
    review_verdict: PASS
    state: accepted

  - id: GP-R0-005
    title: First-class teams and outcomes
    observed_main_sha: 599981488846951989de3c0e7d7a3b90536ceb5b
    evidence: [R0_005_TEAMS_AND_OUTCOMES.md, R0_005_TEAMS_AND_OUTCOMES_REVIEW.md, R0_003_CANONICAL_MATCH_MODEL.md, contexts/checkers/application/game-service.ts, contexts/chess-live/domain/model.ts]
    acceptance: [duel/FFA/teams/coop representable, team result independent of participant result]
    decision: Teams/coop use match-scoped team rows; duel/FFA use none; topology decides authoritative team vs participant outcomes.
    negative_case: No synthetic one-person teams; Party/classroom groups are not Match Teams; team win/loss is not duplicated as mutable participant truth.
    compatibility: Checkers/Chess stay duel with zero teams; Arena 2v2/4v4 uses two team rows without Match redesign.
    review_verdict: PASS
    state: accepted

  - id: GP-R0-006
    title: Minimum capability vocabulary
    observed_main_sha: 583be6e207bf30807202ecc16245af2d49330919
    evidence: [R0_006_MINIMUM_CAPABILITIES.md, R0_006_MINIMUM_CAPABILITIES_REVIEW.md, docs/product/ASA_CHECKERS_ONLINE_PLAY.md, docs/product/ASA_CHECKERS_PLAYER_STATS.md]
    acceptance: [R1-R4 only, enable-disable admission, no creator/device/network overdesign]
    decision: Six orthogonal R1-R4 capability keys with separate game support, ASA policy grant, eligibility decision and admission state.
    negative_case: Client/game cannot self-grant; disabled new admission cannot block authorized reconnect/history.
    compatibility: Checkers consumes capabilities by R1-R3; Chess maps to the same keys in R4.
    review_verdict: PASS
    state: accepted

