requirements:
  - id: GP-R0-001
    title: Gaming identity
    observed_main_sha: c3c1c10d7e37782de58ec84d31ed3336971150f5
    evidence:
      - docs/product/games-platform/R0_001_GAMING_IDENTITY.md
      - docs/product/games-platform/R0_001_GAMING_IDENTITY_REVIEW.md
      - migrations/0026_student_seat_principal.sql
      - migrations/0086_learning_identity_foundation.sql
    acceptance: [stable gaming subject, no second auth, no raw public internal id]
    decision: Opaque game_player_id from verified Account/StudentSeat sources; merge only by audited canonical aliasing.
    negative_case: Same-name unlinked seats stay separate; client playerId never grants authority.
    compatibility: Checkers maps at adapter; Chess stays unchanged until R4 parity.
    review_verdict: PASS
    state: accepted

  - id: GP-R0-002
    title: Games security and storage domain
    observed_main_sha: 5f5ee6aab8e2981300ff25c698ac6e4f1e4987ce
    evidence:
      - docs/product/games-platform/R0_002_GAMES_SECURITY_DOMAIN.md
      - docs/product/games-platform/R0_002_GAMES_SECURITY_DOMAIN_REVIEW.md
      - docs/architecture/DATA_SECURITY_AND_TENANCY.md
      - migrations/0006_chess_live.sql
    acceptance: [cross-workspace placement, authorization/RLS negative model, no participant-tenant ownership]
    decision: Platform-scoped Games data in existing PostgreSQL initially, behind dedicated repository/schema boundary and FORCE RLS.
    negative_case: Supplied playerId/tenantId or private match UUID alone grants no access.
    compatibility: R1 Checkers uses Games persistence; Chess Live remains tenant-scoped until R4.
    review_verdict: PASS
    state: accepted

  - id: GP-R0-003
    title: Canonical Match dimensions
    observed_main_sha: 55ea4df254786fd5067b31da78e70a8ae8f99250
    evidence:
      - docs/product/games-platform/R0_003_CANONICAL_MATCH_MODEL.md
      - docs/product/games-platform/R0_003_CANONICAL_MATCH_MODEL_REVIEW.md
      - contexts/checkers/application/game-service.ts
      - contexts/chess-live/domain/model.ts
    acceptance: [orthogonal admission/competition/scope/runtime/topology, no game-state columns]
    decision: One GameMatch envelope with five independent dimensions; participant seatKey is opaque and game state remains game-owned.
    negative_case: Rated is not admission; classroom is not competition; colors/sides are not Match columns.
    compatibility: Checkers modes decompose; Chess challenge/rated/colors map additively.
    review_verdict: PASS
    state: accepted

