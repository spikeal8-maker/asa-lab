requirements:
  - id: GP-R0-001
    title: Gaming identity
    observed_main_sha: c3c1c10d7e37782de58ec84d31ed3336971150f5
    evidence:
      - docs/product/games-platform/R0_001_GAMING_IDENTITY.md
      - docs/product/games-platform/R0_001_GAMING_IDENTITY_REVIEW.md
      - migrations/0026_student_seat_principal.sql
      - migrations/0047_seat_principal_lookup.sql
      - migrations/0050_account_learners.sql
      - migrations/0062_principal_home_tenant.sql
      - migrations/0086_learning_identity_foundation.sql
      - contexts/identity/application/active-context.usecase.ts
      - contexts/identity/application/account.ports.ts
      - docs/agent/contracts/identity.yaml
    acceptance:
      - stable gaming-subject resolver
      - no second auth system
      - no raw internal public id
      - account plus seat case covered
    decision: >-
      Use opaque game_player_id from verified Account/StudentSeat sources. Account-owned seats
      resolve to the Account player. Merge only through audited canonical aliasing; principal,
      learner, email and display names are not gaming keys.
    negative_case: >-
      Same-name unlinked seats stay separate; client playerId never grants authority; revoked
      class/workspace access does not delete match history.
    compatibility: >-
      R1 Checkers maps humans at the Games adapter without rewriting legacy saves. Chess Live
      stays unchanged until R4 shadow mapping/parity.
    review_verdict: PASS
    state: accepted

  - id: GP-R0-002
    title: Games security and storage domain
    observed_main_sha: 5f5ee6aab8e2981300ff25c698ac6e4f1e4987ce
    evidence:
      - docs/product/games-platform/R0_002_GAMES_SECURITY_DOMAIN.md
      - docs/product/games-platform/R0_002_GAMES_SECURITY_DOMAIN_REVIEW.md
      - docs/architecture/DATA_SECURITY_AND_TENANCY.md
      - packages/database/src/index.ts
      - migrations/0006_chess_live.sql
      - contexts/chess-live/application/ports.ts
    acceptance:
      - cross-workspace placement decided
      - authorization and RLS negative-test model defined
      - no participant tenant ownership shortcut
    decision: >-
      Global Games state is platform-scoped, initially in the same PostgreSQL behind a dedicated
      Games schema/repository boundary. No participant/synthetic tenant. Use server-derived
      game_player_id context, FORCE RLS for private rows and narrow cross-player transactions.
    negative_case: >-
      Supplied playerId/tenantId, private match UUID or tenant context alone grants no access;
      missing Games actor context fails closed; class outsiders are denied.
    compatibility: >-
      R1 Checkers can use platform Games persistence without rewriting bot/local/classroom saves.
      Chess Live remains tenant-scoped until additive R4 parity/cutover.
    review_verdict: PASS
    state: accepted

