      - contexts/checkers/application/game-service.ts
      - apps/web/src/checkers/checkers-match-session.ts
      - contexts/chess-live/domain/model.ts
    acceptance: [transition table with actors, termination matrix, invalid-transition semantics]
    decision: waiting -> ready -> active -> finishing -> finished; cancelled/aborted terminal; lifecycle mutations are server-authoritative.
    negative_case: Disconnect/allocation/draw-offer are not Match states; terminal rows never silently reopen.
    compatibility: Checkers classroom/service and Chess Live map without changing game rules/state.
    review_verdict: PASS
    state: accepted

