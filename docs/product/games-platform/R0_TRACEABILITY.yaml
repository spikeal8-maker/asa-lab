requirements:
  - id: GP-R0-001
    title: Gaming identity
    evidence: [R0_001_GAMING_IDENTITY.md, R0_001_GAMING_IDENTITY_REVIEW.md]
    decision: Opaque game_player_id from verified Account/StudentSeat sources; audited canonical aliasing only.
    negative_case: Same-name unlinked seats stay separate; client playerId never grants authority.
    compatibility: Checkers maps at adapter; Chess stays unchanged until R4 parity.
    review_verdict: PASS
    state: accepted

  - id: GP-R0-002
    title: Games security and storage domain
    evidence: [R0_002_GAMES_SECURITY_DOMAIN.md, R0_002_GAMES_SECURITY_DOMAIN_REVIEW.md, docs/architecture/DATA_SECURITY_AND_TENANCY.md]
    decision: Platform-scoped Games data in existing PostgreSQL initially, behind dedicated repository/schema boundary and FORCE RLS.
    negative_case: Supplied playerId/tenantId or private match UUID alone grants no access.
    compatibility: R1 Checkers uses Games persistence; Chess Live remains tenant-scoped until R4.
    review_verdict: PASS
    state: accepted

  - id: GP-R0-003
    title: Canonical Match dimensions
    evidence: [R0_003_CANONICAL_MATCH_MODEL.md, R0_003_CANONICAL_MATCH_MODEL_REVIEW.md]
    decision: One GameMatch envelope with independent admission/competition/scope/runtime/topology; seatKey opaque; game state game-owned.
    negative_case: Rated is not admission; classroom is not competition; colors/sides are not Match columns.
    compatibility: Checkers modes decompose; Chess challenge/rated/colors map additively.
    review_verdict: PASS
    state: accepted

  - id: GP-R0-004
    title: Match state machine and termination
    evidence: [R0_004_MATCH_STATE_MACHINE.md, R0_004_TERMINATION_FINALIZATION.md, R0_004_MATCH_STATE_MACHINE_REVIEW.md]
    decision: waiting -> ready -> active -> finishing -> finished; cancelled/aborted terminal; lifecycle server-authoritative.
    negative_case: Disconnect/allocation/draw-offer are not Match states; terminal rows never silently reopen.
    compatibility: Checkers and Chess map without changing game rules/state.
    review_verdict: PASS
    state: accepted

  - id: GP-R0-005
    title: First-class teams and outcomes
    evidence: [R0_005_TEAMS_AND_OUTCOMES.md, R0_005_TEAMS_AND_OUTCOMES_REVIEW.md]
    decision: Teams/coop use match-scoped team rows; duel/FFA use none; topology selects authoritative team vs participant outcome.
    negative_case: No synthetic one-person teams; Party/classroom groups are not Match Teams.
    compatibility: Checkers/Chess stay duel; Arena 2v2/4v4 requires no Match redesign.
    review_verdict: PASS
    state: accepted

  - id: GP-R0-006
    title: Minimum capability vocabulary
    evidence: [R0_006_MINIMUM_CAPABILITIES.md, R0_006_MINIMUM_CAPABILITIES_REVIEW.md]
    decision: Six R1-R4 capability keys with separate game support, ASA policy grant, eligibility decision and admission state.
    negative_case: Client/game cannot self-grant; disabling new admission cannot block authorized reconnect/history.
    compatibility: Checkers consumes by R1-R3; Chess maps to same keys in R4.
    review_verdict: PASS
    state: accepted

  - id: GP-R0-007
    title: Error and idempotency contract
    observed_main_sha: c880a376989f65b7d418db881eed183452b30160
    evidence: [R0_007_ERROR_IDEMPOTENCY.md, R0_007_ERROR_CATALOG_LIMITS.md, R0_007_ERROR_IDEMPOTENCY_REVIEW.md, contexts/chess-live/application/ports.ts, contexts/checkers/application/game-service.ts, apps/api/src/validation.ts]
    decision: Actor-scoped command receipts + canonical fingerprint + expectedVersion + atomic state/event/receipt/outbox boundary; one error envelope and bounded API limits.
    negative_case: Lost-response retry keeps commandId; changed payload/version under same id conflicts; stale version never mutates.
    compatibility: R1 wraps Checkers with Games command semantics; R4 maps existing Chess receipt/version behavior to the shared contract.
    review_verdict: PASS
    state: accepted

r0_gate:
