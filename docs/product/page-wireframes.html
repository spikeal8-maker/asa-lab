<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASA Lab — схемы всех страниц</title>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <style>
    :root{color-scheme:light;--ink:#0b3558;--cyan:#087fa4;--bg:#eef2f5;--card:#fff;--text:#172431;--muted:#687684;--line:#b9c5cf;--soft:#dde5eb;--accent:#e5f6fa;--danger:#b23a32;--review:#655ac6;--ok:#188353}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,system-ui,sans-serif}header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:14px 22px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.top h1{margin:0;color:var(--ink);font-size:23px}.top p{margin:5px 0 0;color:var(--muted)}.filters{display:grid;grid-template-columns:2fr repeat(3,minmax(140px,1fr));gap:9px;margin-top:13px}.filters input,.filters select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit}.summary{padding:12px 22px;background:#f8fafb;border-bottom:1px solid var(--line);color:var(--muted)}main{padding:18px 22px 40px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(390px,1fr));gap:16px}.surface{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:0 2px 8px rgba(13,43,65,.06)}.surface-head{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--soft)}.surface-head h2{font-size:16px;margin:0;color:var(--ink)}.surface-head small{display:block;color:var(--muted);margin-top:3px}.pills{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.pill{font-size:10px;border:1px solid var(--line);border-radius:999px;padding:2px 6px;color:var(--muted);white-space:nowrap}.pill.absent{color:var(--danger)}.pill.partial,.pill.in_review{color:var(--review)}.pill.parity_pass{color:var(--ok)}.frame{margin:13px;border:2px solid #8ea0ae;border-radius:8px;background:#fff;aspect-ratio:16/10;min-height:215px;display:grid;overflow:hidden;position:relative}.bar{height:22px;border-bottom:1px solid var(--line);background:#f7fafc;display:flex;align-items:center;gap:5px;padding:0 7px}.dot{width:5px;height:5px;border-radius:50%;background:#91a1ad}.brand{width:38px;height:7px;border-radius:3px;background:var(--ink);margin-right:5px}.nav{height:6px;width:25px;border-radius:2px;background:#b7c3cc}.nav.active{background:var(--cyan)}.avatar{margin-left:auto;width:11px;height:11px;border-radius:50%;background:#9bacb8}.page-title{height:9px;width:42%;background:#55728a;border-radius:3px}.action{height:13px;width:45px;background:var(--cyan);border-radius:3px;margin-left:auto}.muted-line{height:5px;background:#c7d2da;border-radius:2px}.field{height:16px;border:1px solid #b8c5ce;border-radius:3px;background:#fff}.button{height:16px;background:var(--cyan);border-radius:3px}.card{border:1px solid #b8c5ce;border-radius:4px;background:#fdfefe}.safe{background:#fff4d7;border-bottom:1px solid #e6cb86;height:16px}.error-strip{height:10px;background:#fde4e1;border-top:1px solid #e4aaa4}.public{grid-template-rows:22px 1fr 17px}.public .body{display:grid;align-content:center;gap:8px;padding:22px 36px}.public .body .page-title{width:65%;height:13px}.public .body .muted-line{width:90%}.public .body .field{height:22px}.public footer{background:#eef3f6;border-top:1px solid var(--line)}.portal{grid-template-rows:22px 38px 20px 1fr}.portal .page-head{display:flex;align-items:center;padding:0 10px;border-bottom:1px solid var(--soft)}.portal .filterbar{display:grid;grid-template-columns:1.3fr repeat(3,.6fr);gap:5px;padding:3px 10px}.portal .content{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:9px 10px}.portal .content .card{min-height:58px}.classroom{grid-template-rows:22px 32px 18px 1fr}.classroom .class-head{display:flex;align-items:center;padding:0 10px;border-bottom:1px solid var(--soft)}.classroom .tabs{display:flex;gap:5px;padding:4px 9px;background:#f7fafc;border-bottom:1px solid var(--soft)}.classroom .tabs span{height:5px;width:30px;border-radius:2px;background:#b9c7d0}.classroom .tabs span:first-child{background:var(--cyan)}.classroom .body{display:grid;grid-template-columns:1fr 2fr;gap:8px;padding:9px}.classroom .panel{border:1px solid var(--line);border-radius:4px}.student{grid-template-rows:22px 16px 32px 1fr}.student .student-head{display:flex;align-items:center;padding:0 9px;border-bottom:1px solid var(--soft)}.student .intro{display:flex;align-items:center;padding:0 10px}.student .cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 10px}.student .cards .card{min-height:54px}.editor{grid-template-rows:22px 21px 1fr 15px}.editor .toolbar{display:flex;gap:4px;padding:3px 7px;border-bottom:1px solid var(--line)}.tool{width:16px;height:14px;border:1px solid #aab9c4;border-radius:3px;background:#f7fafc}.editor .workspace{display:grid;grid-template-columns:24% 1fr 25%;min-height:0}.editor .library,.editor .inspector{padding:6px;border-right:1px solid var(--line);background:#f8fafb}.editor .inspector{border-right:0;border-left:1px solid var(--line)}.editor .stage{position:relative;background-image:radial-gradient(#bdc9d1 1px,transparent 1px);background-size:12px 12px}.component{position:absolute;width:29px;height:17px;border:2px solid var(--cyan);border-radius:4px;background:#e5f6fa}.component.a{left:26%;top:30%}.component.b{right:23%;bottom:26%;border-color:#e5a31a;background:#fff4d7}.wire{position:absolute;height:2px;background:#d45145;width:43%;left:31%;top:51%;transform:rotate(12deg)}.editor .diag{background:#fff5e7;border-top:1px solid #e1c28a}.admin{grid-template-rows:22px 1fr}.admin .admin-body{display:grid;grid-template-columns:25% 1fr}.admin .sidebar{border-right:1px solid var(--line);padding:8px 6px;background:#f7fafc}.admin .sidebar div{height:6px;border-radius:2px;background:#b8c5ce;margin:6px}.admin .sidebar div:nth-child(2){background:var(--cyan)}.admin .main{display:grid;grid-template-rows:32px 21px 1fr;padding:0 9px 9px}.admin .head{display:flex;align-items:center}.admin .filters-mini{display:grid;grid-template-columns:1fr .6fr .6fr;gap:4px}.table{border:1px solid var(--line);border-radius:4px;margin-top:7px;background:repeating-linear-gradient(to bottom,#fff 0,#fff 17px,#e6ecef 18px)}.publication{grid-template-rows:22px 1fr}.publication .pub-body{display:grid;grid-template-columns:2fr 1fr;gap:8px;padding:9px}.viewer{background:#eef3f6;border:1px solid var(--line);border-radius:4px;position:relative}.viewer:after{content:'';position:absolute;left:35%;top:30%;width:42px;height:27px;border:2px solid var(--cyan);border-radius:5px;background:#e5f6fa}.meta-panel{border:1px solid var(--line);border-radius:4px;padding:7px}.caption{padding:0 14px 14px;color:var(--muted);font-size:12px;line-height:1.4}.caption strong{color:var(--text)}.empty{padding:40px;color:var(--muted);text-align:center}.error{margin:20px;padding:15px;border:1px solid #d98d87;background:#fff0ef;color:#7f1d1d;border-radius:8px}.hidden{display:none}@media(max-width:800px){.filters{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.top{flex-direction:column}}@media(max-width:520px){header,main{padding-left:12px;padding-right:12px}.filters{grid-template-columns:1fr}.frame{min-height:190px}}
  </style>
</head>
<body>
<header>
  <div class="top"><div><h1>ASA Lab — визуальные схемы всех страниц</h1><p>Автоматические wireframes из нормативного surface catalog. Это структура, а не финальный pixel-design.</p></div><strong id="claim">Runtime coverage: загрузка…</strong></div>
  <div class="filters">
    <input id="search" type="search" placeholder="Поиск названия, маршрута, действия…">
    <select id="actor"><option value="">Все роли</option></select>
    <select id="release"><option value="">Все релизы</option></select>
    <select id="template"><option value="">Все shell-шаблоны</option></select>
  </div>
</header>
<div class="summary" id="summary">Загрузка каталога…</div>
<main><div id="error" class="error hidden"></div><section id="grid" class="grid"></section></main>
<script>
const $=id=>document.getElementById(id);let catalog;
const labels={anonymous:'Анонимный',account_creator:'Автор',educator:'Педагог',registered_student:'Ученик с аккаунтом',student_seat:'StudentSeat',guardian:'Опекун',co_teacher:'Соучитель',school_admin:'Админ школы',moderator:'Модератор',platform_admin:'Админ платформы',support_operator:'Поддержка',PUBLIC:'Public',PORTAL:'Creator Portal',CLASSROOM:'Classroom',STUDENT:'Learner',EDITOR_HOST:'Editor Host',ADMIN:'Administration',PUBLICATION:'Public Project',absent:'Отсутствует',partial:'Частично',in_review:'На проверке',parity_pass:'Готово',approved_deviation:'Отклонение'};
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
async function loadYaml(){const r=await fetch('ASA_PRODUCT_SURFACE_CATALOG.yaml',{cache:'no-store'});if(!r.ok)throw new Error(`ASA_PRODUCT_SURFACE_CATALOG.yaml: HTTP ${r.status}`);return jsyaml.load(await r.text());}
function uniq(values){return [...new Set(values.filter(Boolean))].sort();}
function options(id,values){const s=$(id);for(const value of values){const o=document.createElement('option');o.value=value;o.textContent=labels[value]||value;s.append(o);}}
function browserBar(){return `<div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="brand"></span><span class="nav active"></span><span class="nav"></span><span class="nav"></span><span class="avatar"></span></div>`;}
function publicFrame(){return `<div class="frame public">${browserBar()}<div class="body"><div class="page-title"></div><div class="muted-line"></div><div class="muted-line" style="width:68%"></div><div class="field"></div><div class="field"></div><div class="button" style="width:42%"></div></div><footer></footer></div>`;}
function portalFrame(){return `<div class="frame portal">${browserBar()}<div class="page-head"><div class="page-title"></div><div class="action"></div></div><div class="filterbar"><div class="field"></div><div class="field"></div><div class="field"></div><div class="field"></div></div><div class="content"><div class="card"></div><div class="card"></div><div class="card"></div><div class="card"></div><div class="card"></div><div class="card"></div></div></div>`;}
function classroomFrame(){return `<div class="frame classroom">${browserBar()}<div class="class-head"><div class="page-title"></div><div class="action"></div></div><div class="tabs"><span></span><span></span><span></span><span></span><span></span></div><div class="body"><div class="panel"></div><div class="panel table"></div></div></div>`;}
function studentFrame(){return `<div class="frame student">${browserBar()}<div class="safe"></div><div class="student-head"><div class="page-title"></div><div class="action"></div></div><div class="cards"><div class="card"></div><div class="card"></div><div class="card"></div><div class="card"></div></div></div>`;}
function editorFrame(){return `<div class="frame editor">${browserBar()}<div class="toolbar"><div class="tool"></div><div class="tool"></div><div class="tool"></div><div class="tool"></div><div class="tool"></div><div class="tool"></div><div class="action"></div></div><div class="workspace"><div class="library"><div class="field"></div><div class="card" style="height:27px;margin-top:6px"></div><div class="card" style="height:27px;margin-top:5px"></div></div><div class="stage"><div class="component a"></div><div class="component b"></div><div class="wire"></div></div><div class="inspector"><div class="page-title" style="width:75%"></div><div class="field" style="margin-top:7px"></div><div class="field" style="margin-top:5px"></div><div class="muted-line" style="margin-top:7px"></div></div></div><div class="diag"></div></div>`;}
function adminFrame(){return `<div class="frame admin">${browserBar()}<div class="admin-body"><div class="sidebar"><div></div><div></div><div></div><div></div><div></div><div></div></div><div class="main"><div class="head"><div class="page-title"></div><div class="action"></div></div><div class="filters-mini"><div class="field"></div><div class="field"></div><div class="field"></div></div><div class="table"></div></div></div></div>`;}
function publicationFrame(){return `<div class="frame publication">${browserBar()}<div class="pub-body"><div class="viewer"></div><div class="meta-panel"><div class="page-title" style="width:80%"></div><div class="muted-line" style="margin-top:7px"></div><div class="muted-line" style="margin-top:5px;width:65%"></div><div class="button" style="margin-top:12px"></div><div class="field" style="margin-top:7px"></div></div></div></div>`;}
function wireframe(template){return template==='PUBLIC'?publicFrame():template==='PORTAL'?portalFrame():template==='CLASSROOM'?classroomFrame():template==='STUDENT'?studentFrame():template==='EDITOR_HOST'?editorFrame():template==='ADMIN'?adminFrame():publicationFrame();}
function searchText(s){return [s.id,s.name,s.route,s.purpose,s.release,s.template,...(s.actors||[]),...(s.primary_actions||[]),...(s.required_states||[])].join(' ').toLowerCase();}
function render(){const q=$('search').value.trim().toLowerCase(),actor=$('actor').value,release=$('release').value,template=$('template').value;const all=catalog.surfaces||[];const visible=all.filter(s=>(!q||searchText(s).includes(q))&&(!actor||(s.actors||[]).includes(actor))&&(!release||s.release===release)&&(!template||s.template===template));const implemented=all.filter(s=>['parity_pass'].includes(s.implementation)).length,partial=all.filter(s=>['partial','in_review'].includes(s.implementation)).length;$('claim').textContent=`Runtime: ${implemented} parity pass · ${partial} partial/review · ${all.length-implemented-partial} absent`;$('summary').textContent=`Показано ${visible.length} из ${all.length} страниц. Wireframe строится из шаблона ${uniq(visible.map(s=>s.template)).join(', ')||'—'}.`;$('grid').innerHTML=visible.length?visible.map(s=>`<article class="surface"><div class="surface-head"><div><h2>${esc(s.name)}</h2><small>${esc(s.id)} · ${esc(s.route)}</small></div><div class="pills"><span class="pill">${esc(s.release)}</span><span class="pill">${esc(labels[s.template]||s.template)}</span><span class="pill ${esc(s.implementation)}">${esc(labels[s.implementation]||s.implementation)}</span></div></div>${wireframe(s.template)}<div class="caption"><strong>Роли:</strong> ${(s.actors||[]).map(a=>esc(labels[a]||a)).join(', ')}<br><strong>Основные действия:</strong> ${(s.primary_actions||[]).map(esc).join(', ')}<br><strong>Состояния:</strong> ${(s.required_states||[]).map(esc).join(', ')}<br><strong>Screenshot IDs:</strong> ${(s.screenshot_ids||[]).map(esc).join(', ')}</div></article>`).join(''):'<div class="empty">Страницы не найдены.</div>';}
async function init(){try{catalog=await loadYaml();const surfaces=catalog.surfaces||[];options('actor',uniq(surfaces.flatMap(s=>s.actors||[])));options('release',uniq(surfaces.map(s=>s.release)));options('template',uniq(surfaces.map(s=>s.template)));['search','actor','release','template'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));render();}catch(error){$('error').classList.remove('hidden');$('error').textContent=`Не удалось загрузить каталог: ${error.message}. Запустите из корня репозитория: python -m http.server 8080`;}}
init();
</script>
</body>
</html>
