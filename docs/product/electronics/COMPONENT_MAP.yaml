schema_version: 1.0.0
module: electronics
product: "Electronics / Arduino"
purpose: "Compact lookup: human request/component ID -> one subsystem card."
execution_state_source: docs/execution/current.yaml
roadmap_source: docs/product/electronics/ASA_ELECTRONICS_OPTIMIZATION_PLAN_V2.md
normative_spec: docs/product/electronics/README.md
agent_router: docs/product/electronics/START_HERE.md

rules:
  default_read: "router + this index + one referenced card"
  expand: one_dependency_hop_at_a_time
  broad_search: only_if_map_stale_or_cross_cutting
  plan_skip: forbidden
  automatic_next_task: forbidden
  index_owns: [component_id, card_route, human_keywords]
  card_owns: [implementation_state, risk, ownership, contracts, sources, tests, dependencies]

areas:
  engine-worker-clock: components/engine-worker-clock.yaml
  arduino-peripherals: components/arduino-peripherals.yaml
  ui-assets-persistence: components/ui-assets-persistence.yaml
  delivery-portability: components/delivery-portability.yaml

components:
