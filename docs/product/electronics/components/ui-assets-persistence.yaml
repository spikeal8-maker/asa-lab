schema_version: 1.0.0
area: ui-assets-persistence
purpose: Workbench presentation, component catalog/owner assets, inspector/help and project persistence boundaries.
components:
  electronics.ui.arduino-editor:
    ownership: asa
    risk: high
    dependencies: []
    contracts:
    - docs/product/electronics/README.md#15-arduino-и-программирование
    sources:
    - apps/web/src/electronics/ArduinoCodePanel.tsx
    - apps/web/src/electronics/arduino-blocks.ts
    - apps/web/src/electronics/arduino-block-schema.ts
    - apps/web/src/electronics/arduino-block-definitions.ts
    - apps/web/src/electronics/arduino-block-appearance.ts
    - apps/web/src/electronics/arduino-block-ui.ts
    - apps/web/src/electronics/arduino-pin-inputs.ts
    tests:
    - apps/web/src/electronics/testing/arduino-block-messages.spec.ts
    - apps/web/src/electronics/testing/arduino-value-inputs.spec.ts
    - apps/web/src/electronics/testing/arduino-value-inputs.browser.mjs
    - apps/web/src/electronics/testing/arduino-pin-inputs.spec.ts
    - apps/web/src/electronics/testing/arduino-inactive-blocks.spec.ts
    - apps/web/src/electronics/testing/arduino-inactive-blocks.browser.mjs
    - apps/web/src/electronics/testing/arduino-editor-ui.browser.mjs
    - e2e/electronics-interactions.spec.ts
    - apps/web/src/electronics/testing/arduino-code-panel-persistence.spec.ts
    - apps/web/src/electronics/testing/arduino-code-contract.spec.ts
    symbols:
    - ArduinoCodePanel
    - registerArduinoBlocks
    - migrateLegacyArduinoWorkspaceState
    - generateArduinoCode
    - ScratchWorkspace
    - configureArduinoPaletteScroll
    - arduinoBlockTooltip
    - literalArduinoPin
    - activeArduinoGraph
    notes: Blockly message initialization and editor lifecycle; preserve generated code and saved workspace.
  electronics.ui.workbench:
    ownership: asa
    risk: medium
    contracts:
    - docs/product/electronics/contracts/HOST_PACING_PAUSE_ADAPTER_V1.md#rates-and-authority
    - docs/product/electronics/README.md#7-stage-selection-и-rotation
    - docs/product/electronics/README.md#8-провода-и-breadboard
    sources:
    - apps/web/src/electronics/use-electronics-workbench.ts
    - apps/web/src/electronics/workbench-shortcuts.ts
    - apps/web/src/pages/SchematicEditor.tsx
    - apps/web/src/electronics/WorkbenchStage.tsx
    - apps/web/src/electronics/ProductionComponentVisual.tsx
    - apps/web/src/electronics/WorkbenchSidebars.tsx
    - apps/web/src/electronics/WorkbenchHeader.tsx
    - apps/web/src/electronics/SimulationSpeedControl.tsx
    - apps/web/src/electronics/NativeOpticalComponentVisual.tsx
    - apps/web/src/electronics/NativeLedDiagnostic.tsx
    - apps/web/src/electronics/native-optical-presentation.ts
    - apps/web/src/electronics/WorkbenchTooltip.tsx
    - apps/web/src/electronics/workbench-geometry.ts
    - apps/web/src/electronics/workbench-drag-preview.ts
    - apps/web/src/electronics/CanvasAnnotationLayer.tsx
    - apps/web/src/electronics/use-canvas-annotations.ts
    - apps/web/src/electronics/workbench-annotations.ts
    - apps/web/src/electronics/component-hit-testing.ts
    - apps/web/src/electronics/production-asset-contracts.ts
    - apps/web/src/electronics/workbench.css
    tests:
    - apps/web/src/electronics/testing/workbench-runtime-controls.spec.ts
    - apps/web/src/electronics/testing/workbench-annotations.spec.ts
    - apps/web/src/electronics/testing/canvas-annotations.browser.mjs
    - apps/web/src/electronics/testing/workbench-shortcuts.spec.ts
    - apps/web/src/electronics/testing/workbench-keyboard-ui.browser.mjs
    - apps/web/src/electronics/testing/reverse-led-colour.browser.mjs
    - apps/web/src/electronics/testing/spdt-active-shadow.browser.mjs
    - apps/web/src/electronics/testing/workbench-native-wheel.spec.ts
    - e2e/electronics-native-wheel.spec.ts
    - apps/web/src/electronics/testing/psu-setpoint-persistence.spec.ts
    - apps/web/src/electronics/testing/asset-recovery.spec.ts
    - apps/web/src/electronics/testing/component-hit-testing.spec.ts
    - apps/web/src/electronics/testing/workbench-presentation.spec.ts
    - apps/web/src/electronics/testing/workbench-header-time.spec.ts
    - apps/web/src/electronics/testing/toolbar-oracle.browser.mjs
    - apps/web/src/electronics/testing/emergency-toolbar.browser.mjs
    - apps/web/src/electronics/testing/simulation-speed-control.spec.ts
    - apps/web/src/electronics/testing/simulation-speed.browser.mjs
    - apps/web/src/electronics/testing/native-led-diagnostic.spec.ts
    - apps/web/src/electronics/testing/seven-segment-optical.spec.ts
    - apps/web/src/electronics/testing/workbench-tooltips.browser.mjs
    - apps/web/src/electronics/testing/servo-runtime.browser.mjs
    - apps/web/src/electronics/testing/workbench-geometry.spec.ts
    - apps/web/src/electronics/testing/workbench-drag-preview.spec.ts
    - apps/web/src/electronics/testing/workbench-field-drag.spec.ts
    - e2e/electronics-interactions.spec.ts
    - e2e/electronics-simulation.spec.ts
    - e2e/electronics-simulation-time.spec.ts
    - e2e/electronics-switch-shadow.spec.ts
    - e2e/electronics-selection-outline.spec.ts
    dependencies:
    - electronics.worker.live-controller
    notes: UI renders committed engine results; it must not compute electrical truth itself. Read only the selected task's exact sources, not every mapped file.
    symbols:
    - useElectronicsWorkbench
    - WorkbenchStage
    - ProductionComponentVisual
    - preloadComponentHitMask
    - warmProductionAsset
    - SchematicEditor
    - WorkbenchSidebars
    - WorkbenchTooltip
  electronics.ui.catalog:
    ownership: asa
    risk: medium
    contracts:
    - docs/product/electronics/README.md#6-component-library
    sources:
    - apps/web/src/electronics/component-catalog.ts
    - apps/web/src/electronics/production-manifest-adapter.ts
    - apps/web/public/assets/electronics/component-database/catalog.json
    tests:
    - apps/web/src/electronics/testing/production-assets.spec.ts
    - apps/web/src/electronics/testing/production-editor-integration.spec.ts
    - apps/web/src/electronics/testing/component-information.spec.ts
    dependencies:
    - electronics.assets.owner-svg
    - electronics.engine.device-model
    symbols:
    - workbenchCatalog
    - configureProductionLibrary
  electronics.assets.owner-svg:
    ownership: owner_asset
    risk: critical
    contracts:
    - docs/product/electronics/README.md#6-component-library
    - AGENTS.md#3-неприкосновенные-данные
    sources: []
    asset_roots:
    - apps/web/public/assets/electronics/owner-supplied
    - apps/web/public/assets/electronics/owner-audit
    tests:
    - tools/test_validate_electronics_assets.py
    - apps/web/src/electronics/testing/owner-runtime-assets.spec.ts
    dependencies: []
    forbidden:
    - redraw
    - png_tracing
    - generated_runtime_artwork
    - destructive_owner_asset_edit
  electronics.ui.inspector-help:
    ownership: asa
    risk: low
    contracts:
    - docs/product/electronics/README.md#9-единый-инспектор
    sources:
    - apps/web/src/electronics/component-help-content.ts
    - apps/web/src/electronics/WorkbenchSidebars.tsx
    tests:
    - apps/web/src/electronics/testing/component-help-content.spec.ts
    - apps/web/src/electronics/testing/component-information.spec.ts
    - apps/web/src/electronics/testing/workbench-presentation.spec.ts
    dependencies:
    - electronics.ui.catalog
    - electronics.engine.device-model
    symbols:
    - componentHelpSections
    - WorkbenchSidebars
  electronics.persistence.project:
    ownership: cross_boundary
    risk: high
    symbols:
    - ArduinoCodePanel
    contracts:
    - docs/product/electronics/README.md#5-circuitdocument
    - AGENTS.md#5-инварианты-симуляции
    sources:
    - apps/web/src/components/editor-chrome/EditorPersistenceIndicator.tsx
    - apps/web/src/electronics/use-workbench-project-state.ts
    - contexts/electronics/module.ts
    - packages/module-sdk/src/index.ts
    - contexts/projects/application/ports.ts
    - contexts/projects/application/project.usecases.ts
    - apps/api/src/app.module.ts
    - apps/web/src/electronics/ArduinoCodePanel.tsx
    - apps/web/src/electronics/electronics-document-merge.ts
    - apps/web/src/electronics/workbench-autosave.ts
    - apps/web/src/electronics/electronics-project-recovery.ts
    - apps/web/src/electronics/electronics-document-repair.ts
    - apps/web/vite.config.ts
    - apps/web/src/electronics/workbench-document.ts
    - apps/api/src/validation.ts
    - apps/api/src/server-diagnostics.ts
    - apps/web/src/modules/project-local-draft.ts
    tests:
    - apps/web/src/components/editor-chrome/testing/editor-persistence-indicator.spec.ts
    - contexts/projects/testing/projects.spec.ts
    - tests/capacity/prepared-draft-save.pg.spec.ts
    - apps/web/src/electronics/testing/workbench-project-state.spec.ts
    - apps/web/src/electronics/testing/arduino-code-contract.spec.ts
    - apps/web/src/electronics/testing/arduino-code-panel-persistence.spec.ts
    - apps/web/src/electronics/testing/workbench-autosave.spec.ts
    - apps/web/src/electronics/testing/electronics-project-recovery.spec.ts
    - apps/web/src/electronics/testing/electronics-document-repair.spec.ts
    - apps/web/src/electronics/testing/workbench-document.spec.ts
    - apps/api/src/electronics-save-validation.spec.ts
    - tests/electronics/copy-identifiers.spec.ts
    - apps/web/src/electronics/testing/electronics-document-merge.spec.ts
    - apps/web/src/modules/testing/project-local-draft.spec.ts
    - e2e/electronics-simulation.spec.ts
    dependencies:
    - electronics.engine.document
    - electronics.ui.workbench
    - electronics.worker.live-controller
    notes: Browser calculation must precede autosave completion; runtime Start/Stop is not collaborative electrical intent.
rules:
  ui_may_invent_current_voltage_damage: false
  owner_svg_is_runtime_truth_for_artwork: true
  runtime_controls_create_project_revision: false
  deployment_from_ui_task: forbidden
