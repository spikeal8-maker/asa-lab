compile_load_contract:
  editor_source_distinct_from_loaded_program: required
  failed_compile_replaces_loaded_program: false
  last_successfully_loaded_program_preserved: required
  compile_error_distinct_from_simulator_unsupported: required
  learner_compile_error_stops_global_simulation: false
  no_loaded_program_on_initial_compile_failure: required
  exact_gpio_reset_values_defined_here: false
  implementation_status: not_implemented_in_EOPT5A

selected_strategy: SOURCE_LEVEL
selection_reason: >-
  Preserve the accepted E-OPT-3 canonical clock/Worker/replay/state model and student-facing
  diagnostics while meeting the declared educational subset with no new compiler/emulator
  runtime dependency. AVR remains an independent hardware-oriented reference oracle.

rejected:
  avr_production_backend:
    reason: >-
      Adds compiler/toolchain distribution, binary lifecycle, emulator continuation serialization,
      source mapping and MCU-to-circuit bridging before the declared educational subset requires
      those costs; broader compatibility does not by itself justify a second product runtime.
  hybrid_production_backend:
    reason: >-
      Creates two production execution truths, backend-discriminated state and a multiplied parity
      and maintenance matrix without current evidence that the extra compatibility justifies it.

