changed_media_concern:
  pre_initialization:
    class: canonical-active
    paths: [apps/web/src/electronics/ArduinoCodePanel.tsx, apps/web/vite.config.ts]
    source_evidence: ScratchWorkspace passes the absolute local base derived from scratchZoomInUrl/document.baseURI into ScratchBlocks.inject before synchronous image creation. Vite hashes names plus original bytes of exactly sprites.png and zoom-in/out/reset.svg into one directory, preserves upstream filenames and disables inlining only for those four imports; unrelated assets retain default naming/inlining.
    retained_original_artwork: Existing imported vendor bytes are packaged, not redrawn or generated. Owner-supplied and owner-audit roots are outside the exact packaging matcher and remain unchanged.
  late_dom_refresh:
    class: canonical-active
    symbol: applyScratchMediaAssets
    consumer: ScratchWorkspace's requestAnimationFrame callback calls applyScratchMediaAssets(host) followed by ScratchBlocks.svgResize(workspace); its cleanup still cancels assetFrame.
    retention_evidence: The unchanged function sets both href and xlink:href on the four existing zoom/trash SVG-image selectors from the same imported local asset URLs. It is still called and the existing renderer contract explicitly requires applyScratchMediaAssets(host). It is not an unused orphan or a proven replacement for pre-injection configuration.
    coverage_boundary: Accepted533 actual production/browser and Vite-contract evidence covers the combined pre-injection plus retained late-refresh implementation. No removal experiment, bootstrap/resize equivalence proof or coverage of a version without late refresh exists; this checkpoint does not invent such proof or claim late refresh independently necessary for every renderer.
    future_removal_condition: A separately selected bounded maintenance slice must prove synchronous creation and subsequent renderer/resize behavior remain equivalent without this consumer, migrate its existing source-contract expectation, check runtime/import/public/schema/normative dependencies and pass applicable focused/browser/shared gates before deletion is considered.
    removal_authorized: false

