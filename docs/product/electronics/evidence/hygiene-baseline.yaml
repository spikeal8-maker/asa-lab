schema_version: 1.0.0
module: electronics
contract: docs/product/electronics/contracts/ENGINEERING_HYGIENE_CONTRACT.md
large_source_bytes: 50000
growth_review_percent: 20
checkpoint_policy:
  max_counted_slices_between_checkpoints: 3
  counted_task_kinds:
    - implementation
    - component/peripheral
    - maintenance:production-source-change
    - repair:production-source-change

large_sources:
  - path: contexts/electronics/domain/solver.ts
    class: decomposition-candidate
    reviewed_bytes: 179752
    rationale: Solver orchestration remains active but combines many physical/model responsibilities; decompose only under E-OPT-4 with parity/reference evidence.
  - path: apps/web/src/electronics/workbench.css
    class: decomposition-candidate
    reviewed_bytes: 120669
    rationale: Active workbench styling spans several editor surfaces; split only with visual/browser evidence and stable ownership boundaries.
  - path: apps/web/src/electronics/WorkbenchSidebars.tsx
    class: decomposition-candidate
    reviewed_bytes: 103985
    rationale: Active sidebar surface contains multiple inspector/library responsibilities and needs bounded responsibility review before further growth.
  - path: apps/web/src/electronics/use-electronics-workbench.ts
    class: decomposition-candidate
    reviewed_bytes: 84980
    rationale: Active workbench controller coordinates interaction and simulation concerns; E-OPT-3 is complete, while any structural extraction remains a separately selected E-OPT-7/maintenance responsibility change.
  - path: contexts/electronics/domain/arduino-program-runtime.ts
    class: decomposition-candidate
    reviewed_bytes: 68170
    rationale: Active source-level Arduino runtime owns several logical subsystems; decomposition/design belongs to E-OPT-5 rather than cleanup-by-size.
  - path: apps/web/src/electronics/ArduinoCodePanel.tsx
    class: decomposition-candidate
    reviewed_bytes: 63884
    rationale: Active code-editor surface is above the review threshold; future extraction must preserve command/editor behavior and tests.
  - path: apps/web/src/electronics/ProductionComponentVisual.tsx
    class: decomposition-candidate
    reviewed_bytes: 60089
    rationale: Active visual renderer spans many component families; split by stable visual responsibility, never by arbitrary line count.
  - path: apps/web/src/electronics/WorkbenchStage.tsx
    class: decomposition-candidate
    reviewed_bytes: 54879
    rationale: Active stage rendering/interaction surface is above the threshold and requires browser evidence for any structural split.

legacy_concerns:
  - path: apps/web/src/electronics/live-simulation.ts
    class: compatibility-shim
    concern: E-OPT-3F is accepted and production Worker/runtime callers of advanceLiveSimulation are zero, but live/reference tests and active benchmark tooling still call the exported helper; preflight helpers in the same file also remain active.
    retirement_condition: A separately selected maintenance slice migrates or explicitly retires every active advanceLiveSimulation test/tool caller, preserves historical benchmark evidence as historical evidence, and repository search proves production imports plus active test/tool dependencies are zero before deletion is evaluated.
  - path: contexts/electronics/domain/arduino-program-runtime.ts
    class: active-legacy-bridge
    concern: E-OPT-3F is accepted, but ArduinoClockProfile still includes legacy-ms-v1 and instruction-us-v1; advanceArduinoRuntime(...) explicitly selects legacy-ms-v1, with current production callers including arduino-model.ts and solver.ts.
    retirement_condition: A separately selected E-OPT-5 or prerequisite Arduino-runtime convergence establishes the canonical clock profile for every production snapshot/stateless caller, migrates production dependencies, and repository search proves no production/public/evidence dependency requires legacy-ms-v1 or advanceArduinoRuntime before deletion is evaluated.
documentation_hotspots:
  - path: docs/product/electronics/README.md
    class: decomposition-candidate
    rationale: Large normative specification is intentionally routed by exact headings; any future extraction must preserve stable contracts/anchors or migrate every route atomically.

preserved_classes:
  - path: docs/product/electronics/tasks/**
    class: historical-evidence
    rationale: Completed task cards remain provenance and are not cleanup candidates.
  - path: docs/product/electronics/generated/component-coverage.json
    class: generated
    rationale: Rebuilt by tools/generate-electronics-component-coverage.mjs and stale output is validated.
  - path: apps/web/public/assets/electronics/owner-supplied/**
    class: protected-owner-asset
    rationale: Owner-supplied artwork is protected by repository asset policy.
  - path: apps/web/public/assets/electronics/owner-audit/**
    class: protected-owner-asset
    rationale: Owner-audit artwork is protected by repository asset policy.
