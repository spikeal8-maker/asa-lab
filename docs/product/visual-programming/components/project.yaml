schema_version: 2.0.0
area: project-persistence
components:
  - id: blocks.project.persistence-guard
    state: blocked
    risk: high
    ownership: cross_boundary
    purpose: "Generic Project Core pre-save durability guard plus Blocks-specific implementation."
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-002-PERSISTENCE-CONTRACT.md
        section: "Decision: generic async pre-save persistence guard"
      - path: docs/product/visual-programming/VSCR-D0-002-PERSISTENCE-CONTRACT.md
        section: "Generic project-draft API must not bypass durability"
    task: VSCR-M1-005
    active_candidate:
      task: VSCR-M1-005B
      pr: 288
      branch: codex/scratch-real-storage-005b
      status: implemented_in_draft_pr
      acceptance: pending
    design_gate: VSCR-M1-005P
    depends_on: [blocks.assets.metadata]

  - id: blocks.project.load-save
    state: blocked
    risk: high
    ownership: cross_boundary
    purpose: "Durable projectJson load/save with exact already-durable referenced assets."
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-002-PERSISTENCE-CONTRACT.md
        section: "Asset-before-document invariant"
      - path: docs/product/visual-programming/VSCR-D0-003-ASSET-STORAGE-CONTRACT.md
        section: "Project save interaction"
    task: VSCR-M1-005
    active_candidate:
      task: VSCR-M1-005B
      pr: 288
      branch: codex/scratch-real-storage-005b
      status: backend_pipeline_present_browser_wiring_pending
      acceptance: pending
    depends_on: [blocks.project.persistence-guard, blocks.assets.upload, blocks.assets.read]

  - id: blocks.project.autosave
    state: blocked
    risk: high
    ownership: asa
    purpose: "Generation-aware latest-state queue; edits during an in-flight save are not lost."
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-002-PERSISTENCE-CONTRACT.md
        section: "Autosave transaction identity"
      - path: docs/product/visual-programming/VSCR-D0-008-AUTOSAVE-PREVIEW-OPTIMIZATION-CONTRACT.md
        section: "Autosave execution contract"
      - path: docs/product/visual-programming/VSCR-D0-008-AUTOSAVE-PREVIEW-OPTIMIZATION-CONTRACT.md
        section: "Classroom load shaping"
    task: VSCR-M1-006
    depends_on: [blocks.project.load-save]

  - id: blocks.project.preview
    state: blocked
    risk: medium
    ownership: asa
    purpose: "Automatic owner-facing stage preview bound to an exact confirmed durable revision/fingerprint."
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-008-AUTOSAVE-PREVIEW-OPTIMIZATION-CONTRACT.md
        section: "Automatic draft preview"
      - path: docs/product/visual-programming/VSCR-D0-008-AUTOSAVE-PREVIEW-OPTIMIZATION-CONTRACT.md
        section: "Preview must match one durable generation"
    task: VSCR-M1-006
    depends_on: [blocks.project.load-save, blocks.project.autosave]

  - id: blocks.project.recovery
    state: blocked
    risk: high
    ownership: asa
    purpose: "Bounded recovery/offline retry without becoming canonical project storage."
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-002-PERSISTENCE-CONTRACT.md
        section: "Conflict behaviour"
      - path: docs/product/visual-programming/VSCR-D0-008-AUTOSAVE-PREVIEW-OPTIMIZATION-CONTRACT.md
        section: "Recovery-store minimum contract"
    task: VSCR-M1-006
    depends_on: [blocks.project.load-save]
    design_gap: "M1-006 must choose explicit finite recovery TTL/quota values and logout/account-switch cleanup policy before coding acceptance; payload storage is structured browser storage, never localStorage/sessionStorage."

  - id: blocks.project.conflict
    state: blocked
    risk: high
    ownership: asa
    purpose: "Optimistic revision conflict handling with no silent last-write-wins."
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-002-PERSISTENCE-CONTRACT.md
        section: "Conflict behaviour"
    task: VSCR-M1-006
    depends_on: [blocks.project.load-save]
