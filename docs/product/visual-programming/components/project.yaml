schema_version: 2.0.0
area: project-persistence
components:
  - id: blocks.project.persistence-guard
    state: implemented
    risk: high
    ownership: cross_boundary
    purpose: Generic pre-save guard plus Blocks validation, composed into the production SaveDraftUseCase.
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-002-PERSISTENCE-CONTRACT.md
        section: 'Decision: generic async pre-save persistence guard'
      - path: docs/product/visual-programming/VSCR-D0-002-PERSISTENCE-CONTRACT.md
        section: Generic project-draft API must not bypass durability
    task: VSCR-M1-005A
    depends_on:
      - blocks.assets.metadata
    sources:
      - path: contexts/projects/application/ports.ts
        symbols:
          - ProjectDraftPersistenceGuardPort
          - ProjectPersistenceGuardResult
      - path: contexts/projects/application/project.usecases.ts
        symbols:
          - SaveDraftUseCase
      - path: apps/api/src/blocks-persistence.guard.ts
        symbols:
          - BlocksDraftPersistenceGuard
          - BlocksAssetMetadataPort
      - path: apps/api/src/blocks-durable-document.ts
        symbols:
          - inspectBlocksDocument
          - inspectScratchProject
          - snapshotJson
      - path: apps/api/src/projects.controller.ts
        symbols: [STATUS_BY_CODE, ProjectsController]
    tests:
      - apps/api/src/blocks-project-persistence.spec.ts
      - e2e/blocks-product-integration.spec.ts
      - tools/blocks/flush-semantics.test.mjs
      - contexts/projects/testing/projects.spec.ts
      - apps/api/src/projects-save-status.spec.ts

  - id: blocks.project.load-save
    state: implemented
    risk: high
    ownership: cross_boundary
    purpose:
      Real runtime-session open, parent-owned explicit Save, live-VM FLUSH persistence and
      save-close-fresh-browser exact reopen are implemented candidates through common Project Core
      and production PostgreSQL/private object-storage adapters; independent critical review remains pending.
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-002-PERSISTENCE-CONTRACT.md
        section: Asset-before-document invariant
      - path: docs/product/visual-programming/VSCR-D0-003-ASSET-STORAGE-CONTRACT.md
        section: Project save interaction
    task: VSCR-M1-005A
    completion_task: VSCR-M1-005B
    candidate_status: implementation_complete_independent_review_pending
    depends_on:
      - blocks.project.persistence-guard
      - blocks.assets.upload
      - blocks.assets.read
    sources:
      - path: apps/api/src/blocks-project-persistence.ts
        symbols:
          - BlocksProjectPersistence
          - BlocksDurableAssetPort
          - BlocksAssetSourcePort
      - path: apps/api/src/blocks-durable-document.ts
        symbols:
          - inspectBlocksDocument
          - inspectScratchProject
    tests:
      - apps/api/src/blocks-project-persistence.spec.ts
      - apps/web/src/blocks/testing/editor-runtime-session.spec.ts
      - e2e/blocks-product-integration.spec.ts
      - tools/blocks/flush-semantics.test.mjs
      - tools/blocks/portable-smoke.mjs

  - id: blocks.project.autosave
    state: blocked
    risk: high
    ownership: asa
    purpose: "Generation-aware latest-state queue; edits during an in-flight save are not lost."
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-002-PERSISTENCE-CONTRACT.md
        section: "Autosave transaction identity"
      - path: docs/product/visual-programming/VSCR-D0-008-AUTOSAVE-PREVIEW-OPTIMIZATION-CONTRACT.md
        section: "Autosave execution contract"
      - path: docs/product/visual-programming/VSCR-D0-008-AUTOSAVE-PREVIEW-OPTIMIZATION-CONTRACT.md
        section: "Classroom load shaping"
    task: VSCR-M1-006
    depends_on: [blocks.project.load-save]

  - id: blocks.project.preview
    state: blocked
    risk: medium
    ownership: asa
    purpose: "Automatic owner-facing stage preview bound to an exact confirmed durable revision/fingerprint."
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-008-AUTOSAVE-PREVIEW-OPTIMIZATION-CONTRACT.md
        section: "Automatic draft preview"
      - path: docs/product/visual-programming/VSCR-D0-008-AUTOSAVE-PREVIEW-OPTIMIZATION-CONTRACT.md
        section: "Preview must match one durable generation"
    task: VSCR-M1-006
    depends_on: [blocks.project.load-save, blocks.project.autosave]

  - id: blocks.project.recovery
    state: blocked
    risk: high
    ownership: asa
    purpose: "Bounded recovery/offline retry without becoming canonical project storage."
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-002-PERSISTENCE-CONTRACT.md
        section: "Conflict behaviour"
      - path: docs/product/visual-programming/VSCR-D0-008-AUTOSAVE-PREVIEW-OPTIMIZATION-CONTRACT.md
        section: "Recovery-store minimum contract"
    task: VSCR-M1-006
    depends_on: [blocks.project.load-save]
    design_gap: "M1-006 must choose explicit finite recovery TTL/quota values and logout/account-switch cleanup policy before coding acceptance; payload storage is structured browser storage, never localStorage/sessionStorage."

  - id: blocks.project.conflict
    state: blocked
    risk: high
    ownership: asa
    purpose:
      Persistence-level revision conflict detection is implemented fail-closed in M1-005B;
      user-facing conflict UX/recovery remains blocked on M1-006.
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-002-PERSISTENCE-CONTRACT.md
        section: "Conflict behaviour"
    task: VSCR-M1-006
    depends_on: [blocks.project.load-save]
