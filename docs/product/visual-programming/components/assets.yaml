schema_version: 2.0.0
area: asset-storage
components:
  - id: blocks.assets.reference
    state: implemented
    risk: medium
    ownership: asa
    purpose: "Persistent logical Scratch asset reference only; no physical object locator."
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-003-ASSET-STORAGE-CONTRACT.md
        section: "Separation of identities"
    sources:
      - path: contexts/blocks/domain/document.ts
        symbols: [BlocksAssetReferenceV1]
      - path: contexts/blocks/domain/validation.ts
        symbols: [validateBlocksAssetReference]
    tests:
      - contexts/blocks/testing/module.spec.ts
    task: VSCR-M1-001

  - id: blocks.assets.metadata
    state: blocked
    risk: high
    ownership: infrastructure
    purpose: "Tenant-private immutable blob metadata and Scratch asset-alias metadata."
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-003-ASSET-STORAGE-CONTRACT.md
        section: "Relational model"
      - path: docs/product/visual-programming/VSCR-D0-003-ASSET-STORAGE-CONTRACT.md
        section: "Tenant and RLS policy"
    task: VSCR-M1-004
    design_gate: VSCR-M1-004P
    depends_on: [blocks.runtime.capability]

  - id: blocks.assets.upload
    state: blocked
    risk: high
    ownership: cross_boundary
    purpose: "Validated streaming asset PUT with identity, integrity, content and byte limits."
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-003-ASSET-STORAGE-CONTRACT.md
        section: "Asset upload endpoint"
      - path: docs/product/visual-programming/VSCR-D0-003-ASSET-STORAGE-CONTRACT.md
        section: "Content validation"
    task: VSCR-M1-004
    design_gate: VSCR-M1-004P
    depends_on: [blocks.assets.metadata, blocks.runtime.origin-security]

  - id: blocks.assets.read
    state: blocked
    risk: high
    ownership: cross_boundary
    purpose: "Reference-authorised private asset GET for the exact authorised draft/version."
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-003-ASSET-STORAGE-CONTRACT.md
        section: "Asset GET endpoint"
    task: VSCR-M1-004
    depends_on: [blocks.assets.metadata, blocks.runtime.capability]
