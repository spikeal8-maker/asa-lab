schema_version: 2.0.0
area: sovereign-deployment
components:
  - id: blocks.sovereign.media
    state: blocked
    risk: medium
    ownership: asa
    purpose: 'Provide right-cleared/local core media where ASA deployment needs independence from Scratch project/asset backends.'
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-001-SCRATCH-HOST-CONTRACT.md
        section: 'Branding'
      - path: docs/product/visual-programming/VSCR-D0-005-DEPLOYMENT-ACTIVATION-CONTRACT.md
        section: 'Sovereign deployment test'
    task: VSCR-M3
    depends_on: [blocks.project.load-save]

  - id: blocks.sovereign.extensions
    state: blocked
    risk: high
    ownership: upstream_config
    purpose: 'Add optional ASA/local alternatives and per-integration resilience without globally deleting native Scratch external-service or hardware extensions.'
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-001-SCRATCH-HOST-CONTRACT.md
        section: 'Extensions'
      - path: docs/product/visual-programming/VSCR-D0-005-DEPLOYMENT-ACTIVATION-CONTRACT.md
        section: 'Sovereign deployment test'
    task: VSCR-M3
    depends_on: [blocks.host.extensions]

  - id: blocks.deployment.backup-restore
    state: blocked
    risk: critical
    ownership: infrastructure
    purpose: 'Coherent PostgreSQL + object-store backup/isolated-restore evidence.'
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-005-DEPLOYMENT-ACTIVATION-CONTRACT.md
        section: 'Restore acceptance'
      - path: docs/product/visual-programming/VSCR-D0-005-DEPLOYMENT-ACTIVATION-CONTRACT.md
        section: 'Backup consistency invariant'
    task: VSCR-M3
    depends_on: [blocks.assets.metadata, blocks.project.load-save]

  - id: blocks.activation
    state: blocked
    risk: critical
    ownership: asa
    purpose: 'Only authorised coming_soon → active transition after every acceptance gate.'
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-005-DEPLOYMENT-ACTIVATION-CONTRACT.md
        section: 'Activation task VSCR-M4-001'
      - path: docs/product/visual-programming/VSCR-D0-005-DEPLOYMENT-ACTIVATION-CONTRACT.md
        section: 'Activation preflight evidence'
    task: VSCR-M4-001
    depends_on:
      - blocks.project.autosave
      - blocks.project.recovery
      - blocks.project.conflict
      - blocks.sb3.import
      - blocks.sb3.export
      - blocks.gallery.publication
      - blocks.gallery.player
      - blocks.gallery.remix
      - blocks.learning.submission
      - blocks.sovereign.media
      - blocks.sovereign.extensions
      - blocks.deployment.backup-restore

  - id: blocks.deployment.local-file
    state: implemented
    risk: high
    ownership: infrastructure
    purpose: 'Portable default Scratch startup and coherent updates; not server persistence.'
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-005-DEPLOYMENT-ACTIVATION-CONTRACT.md
        section: 'Portable local-file installation'
    sources:
      - compose.yaml
      - compose.blocks-preview.yaml
      - docs/deployment/SCRATCH_INSTALLATION.md
      - path: tools/asa-lab.ps1
        symbols: [New-PrivateEnvironment, Test-Ready, Wait-Ready]
      - path: tools/asa-lab.sh
        symbols: [create_environment, ready, wait_for_ready]
      - path: tools/installation-identity.ps1
        symbols: [Assert-AsaInstallationIdentity, Assert-AsaIdentityInventory]
      - path: tools/installation-identity.sh
        symbols: [asa_assert_installation_identity, asa_validate_identity_inventory]
      - path: tools/docker-update.ps1
        symbols: [Wait-ExactReadiness, Invoke-GuardedUpdate]
      - path: tools/docker-update.sh
        symbols: [wait_exact_readiness, main]
    tests:
      - tools/blocks/deployment.test.mjs
      - tools/blocks/installation-identity.test.mjs
      - tools/blocks/portable-smoke.mjs
      - .github/workflows/scratch-focused.yml
    task: VSCR-M4-002
    depends_on: [blocks.host.build, blocks.host.identity-shell]
