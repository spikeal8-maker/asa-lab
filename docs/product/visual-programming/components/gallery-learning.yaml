schema_version: 2.0.0
area: gallery-learning
components:
  - id: blocks.gallery.publication
    state: blocked
    risk: high
    ownership: cross_boundary
    purpose: 'Publish one exact immutable project version, never the mutable current draft.'
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-006-PUBLICATION-REMIX-CONTRACT.md
        section: 'Publication identity'
      - path: docs/product/visual-programming/VSCR-D0-006-PUBLICATION-REMIX-CONTRACT.md
        section: 'Gallery work/read semantics'
      - path: docs/product/visual-programming/VSCR-D0-008-AUTOSAVE-PREVIEW-OPTIMIZATION-CONTRACT.md
        section: 'Publication cover is not draft preview'
    task: VSCR-M2
    depends_on: [blocks.project.load-save]

  - id: blocks.gallery.card
    state: blocked
    risk: medium
    ownership: cross_boundary
    purpose: 'Project/publication card metadata, manual cover and aggregate engagement without mutating the published executable version.'
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-006-PUBLICATION-REMIX-CONTRACT.md
        section: 'Draft preview and publication cover are different objects'
      - path: docs/product/visual-programming/VSCR-D0-006-PUBLICATION-REMIX-CONTRACT.md
        section: 'Publication card metadata and engagement'
      - path: docs/product/visual-programming/VSCR-D0-008-AUTOSAVE-PREVIEW-OPTIMIZATION-CONTRACT.md
        section: 'Publication card metadata and engagement boundary'
    task: VSCR-M2
    depends_on: [blocks.gallery.publication, blocks.project.preview]

  - id: blocks.gallery.player
    state: implemented
    risk: high
    ownership: cross_boundary
    purpose: 'Read-only player bound to the exact immutable published Blocks version.'
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-006-PUBLICATION-REMIX-CONTRACT.md
        section: 'Gallery work/read semantics'
      - path: docs/product/visual-programming/VSCR-D0-006-PUBLICATION-REMIX-CONTRACT.md
        section: 'Blocks asset read for published versions'
    task: TASK-PROJ-SCRATCH-PUBLIC-VIEWER-001
    depends_on: [blocks.gallery.publication, blocks.runtime.capability]
    sources:
      - path: apps/api/src/public-scratch-player.ts
        symbols: [PublicScratchPlayerService, publicScratchDocument]
      - apps/api/src/public-scratch-player.controller.ts
      - apps/web/src/projects-public/PublicScratchPlayer.tsx
      - packages/contracts/src/public-scratch-player.ts
      - migrations/0261_public_scratch_player.sql
    tests:
      - apps/api/src/public-scratch-player.spec.ts
      - tests/portal/public-scratch-player.pg.spec.ts
      - e2e/public-project-scratch-viewer.spec.ts
    rule: 'Implementation exists; technical/browser acceptance is recorded by the selected task, not implied by this routing card. Official player and host are reused; editor authority is unchanged.'

  - id: blocks.gallery.remix
    state: blocked
    risk: high
    ownership: cross_boundary
    purpose: 'Server-side cross-tenant asset re-materialisation from an immutable publication.'
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-006-PUBLICATION-REMIX-CONTRACT.md
        section: 'Cross-tenant remix cannot be SQL JSON copy'
      - path: docs/product/visual-programming/VSCR-D0-006-PUBLICATION-REMIX-CONTRACT.md
        section: 'Failure ordering for remix'
      - path: docs/product/visual-programming/VSCR-D0-006-PUBLICATION-REMIX-CONTRACT.md
        section: 'Provenance'
    task: VSCR-M2
    depends_on: [blocks.gallery.publication, blocks.assets.read]

  - id: blocks.learning.submission
    state: blocked
    risk: medium
    ownership: shared_existing
    purpose: 'Reuse ASA Learning immutable project_version_id submission semantics; no Scratch-specific LMS.'
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-006-PUBLICATION-REMIX-CONTRACT.md
        section: 'Learning is separate from Gallery publication'
    task: VSCR-M2
    depends_on: [blocks.project.load-save]
    rule: 'No Scratch-specific LMS, classroom, gradebook or submission database.'
