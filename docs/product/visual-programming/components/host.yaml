schema_version: 2.0.0
area: scratch-host
components:
  - id: blocks.host.build
    state: implemented
    risk: medium
    ownership: infrastructure
    purpose: 'Build pinned standalone Scratch and ASA host shell.'
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-001-SCRATCH-HOST-CONTRACT.md
        section: 'Host layout'
    sources:
      - infra/scratch-editor/Dockerfile
      - infra/scratch-editor/nginx.conf.template
      - infra/scratch-editor/README.md
      - infra/scratch-editor/host/index.html
      - path: infra/scratch-editor/host/main.js
        symbols: [requiredExports]
      - infra/scratch-editor/host/host.css
    tests:
      - .github/workflows/scratch-focused.yml
      - tools/verify-blocks-host-shell.mjs
    task: VSCR-M1-002A
    depends_on: [blocks.upstream.pin]

  - id: blocks.host.branding
    state: implemented
    risk: medium
    ownership: upstream_patch
    purpose: 'Replace Scratch product logo with canonical ASA mark; keep Scratch UI.'
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-001-SCRATCH-HOST-CONTRACT.md
        section: 'Branding'
    canonical_asset: apps/web/public/asa-lab-mark.svg
    sources:
      - apps/web/public/asa-lab-mark.svg
      - infra/scratch-editor/patches/0001-host-logo-prop.patch
      - path: infra/scratch-editor/host/editor.js
        symbols: [mountEditor, logo]
      - infra/scratch-editor/Dockerfile
    tests: [e2e/blocks-host-controls.spec.ts]
    task: VSCR-M1-002B
    depends_on: [blocks.host.storage-adapter]

  - id: blocks.host.localization
    state: implemented
    risk: low
    ownership: upstream_config
    purpose: 'Remove forced English; preserve native Scratch Settings/browser locale.'
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-001-SCRATCH-HOST-CONTRACT.md
        section: 'Localization'
    sources:
      - path: infra/scratch-editor/host/editor.js
        symbols: [mountEditor]
    tests: [e2e/blocks-host-controls.spec.ts]
    task: VSCR-M1-002B
    depends_on: [blocks.host.storage-adapter]

  - id: blocks.host.theme
    state: implemented
    risk: medium
    ownership: asa
    purpose: 'ASA product-chrome colours only; preserve Scratch category colours.'
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-001-SCRATCH-HOST-CONTRACT.md
        section: 'ASA theme boundary'
    sources: [infra/scratch-editor/host/host.css]
    tests: [e2e/blocks-host-controls.spec.ts]
    task: VSCR-M1-002B
    depends_on: [blocks.host.storage-adapter]

  - id: blocks.host.identity-shell
    state: implemented
    risk: high
    ownership: cross_boundary
    purpose: 'Parent-owned ASA avatar/account; no Scratch-origin ASA authority.'
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-001-SCRATCH-HOST-CONTRACT.md
        section: 'ASA identity shell'
    sources:
      - apps/web/src/blocks/BlocksEditorShell.tsx
      - apps/web/src/blocks/blocks-editor-shell.css
    tests: [e2e/blocks-host-controls.spec.ts]
    task: VSCR-M1-002B
    depends_on: [blocks.host.protocol, blocks.host.storage-adapter]

  - id: blocks.host.file-menu
    state: implemented
    risk: low
    ownership: upstream_config
    purpose: 'Preserve native File/Edit/local file commands; ASA persistence stays separate.'
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-001-SCRATCH-HOST-CONTRACT.md
        section: 'Product controls'
    sources:
      - path: infra/scratch-editor/host/editor.js
        symbols: [mountEditor, canSave]
    tests: [e2e/blocks-host-controls.spec.ts]
    task: VSCR-M1-002B
    depends_on: [blocks.host.storage-adapter]

  - id: blocks.host.extensions
    state: implemented
    risk: medium
    ownership: upstream_config
    purpose: 'Preserve native Extensions, external services and hardware integrations.'
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-001-SCRATCH-HOST-CONTRACT.md
        section: 'Extensions'
    sources:
      - path: infra/scratch-editor/host/editor.js
        symbols: [mountEditor, createStandaloneRoot]
    tests: [e2e/blocks-host-controls.spec.ts]
    task: VSCR-M1-002B
    depends_on: [blocks.host.storage-adapter]

  - id: blocks.host.protocol
    state: implemented
    risk: high
    ownership: asa
    purpose: 'Exact parent/iframe message protocol and validation boundary.'
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-001-SCRATCH-HOST-CONTRACT.md
        section: 'Parent/iframe protocol'
      - path: docs/product/visual-programming/VSCR-D0-004-RUNTIME-SECURITY-CONTRACT.md
        section: 'Origin CORS CSP boundary'
    sources:
      - apps/web/src/blocks/runtime-protocol.ts
      - infra/scratch-editor/host/protocol.js
      - infra/scratch-editor/host/status.js
      - path: infra/scratch-editor/host/main.js
        symbols: [protocolApi, expectedParentOrigin, reportFatal]
    tests:
      - apps/web/src/blocks/testing/runtime-protocol.spec.ts
      - apps/web/src/blocks/testing/teardown.spec.ts
      - tools/blocks/browser/scenarios.mjs
      - tools/verify-blocks-host-protocol.mjs
    task: VSCR-M1-002C
    depends_on: [blocks.host.build]

  - id: blocks.host.storage-adapter
    state: implemented
    risk: high
    ownership: asa
    purpose: 'ASA ScratchStorage/GUIStorage fixture adapter without Scratch-host fallback or durable writes.'
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-001-SCRATCH-HOST-CONTRACT.md
        section: 'Scratch storage adapter'
    sources:
      - infra/scratch-editor/host/storage.js
      - path: infra/scratch-editor/host/editor.js
        symbols: [mountEditor, createFixtureStorage, EditorState, setProjectId]
      - path: infra/scratch-editor/host/main.js
        symbols: [editor]
    tests:
      - e2e/blocks-host-storage.spec.ts
      - tools/blocks/host.test.mjs
    task: VSCR-M1-002D
    depends_on: [blocks.host.protocol]
