schema_version: 1.0.0
area: scratch-host
components:
  - id: blocks.host.build
    state: planned
    risk: medium
    purpose: "Build shipping standalone Scratch distribution and package ASA-owned host."
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-001-SCRATCH-HOST-CONTRACT.md
        section: "Host layout"
    planned_sources:
      - infra/scratch-editor/Dockerfile
      - infra/scratch-editor/nginx.conf.template
      - infra/scratch-editor/host/index.html
      - infra/scratch-editor/host/main.js
    planned_tests: [.github/workflows/scratch-m0-focused.yml]
    task: VSCR-M1-002
    depends_on: [blocks.upstream.pin]

  - id: blocks.host.branding
    state: planned
    risk: low
    purpose: "Render canonical ASA Lab mark and remove Scratch product logo/navigation."
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-001-SCRATCH-HOST-CONTRACT.md
        section: "Branding"
    canonical_asset: apps/web/public/asa-lab-mark.svg
    planned_sources:
      - infra/scratch-editor/host/branding.js
      - infra/scratch-editor/patches/0001-host-logo-prop.patch
    planned_tests: [e2e/blocks-host.spec.ts]
    task: VSCR-M1-002

  - id: blocks.host.file-menu
    state: planned
    risk: low
    purpose: "Disable upstream File/new/save/title paths so ASA owns persistence and sb3 flows."
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-001-SCRATCH-HOST-CONTRACT.md
        section: "Product controls"
    planned_sources: [infra/scratch-editor/host/editor-config.js]
    planned_tests: [e2e/blocks-host.spec.ts]
    task: VSCR-M1-002

  - id: blocks.host.extensions
    state: planned
    risk: medium
    purpose: "Hide upstream Extensions library in core mode; later controlled allowlist only."
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-001-SCRATCH-HOST-CONTRACT.md
        section: "Extensions"
    planned_sources:
      - infra/scratch-editor/host/editor-config.js
      - infra/scratch-editor/patches/0002-extension-button-visibility.patch
    planned_tests: [e2e/blocks-host.spec.ts]
    task: VSCR-M1-002

  - id: blocks.host.protocol
    state: planned
    risk: high
    purpose: "Exact parent/iframe message protocol and validation."
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-001-SCRATCH-HOST-CONTRACT.md
        section: "Parent/iframe protocol"
      - path: docs/product/visual-programming/VSCR-D0-004-RUNTIME-SECURITY-CONTRACT.md
        section: "iframe/origin/CSP semantics required by selected task"
    planned_sources:
      - apps/web/src/blocks/**
      - infra/scratch-editor/host/protocol.js
      - infra/scratch-editor/host/main.js
    planned_tests: [e2e/blocks-host.spec.ts]
    task: VSCR-M1-002

  - id: blocks.host.storage-adapter
    state: planned
    risk: high
    purpose: "ASA ScratchStorage/GUIStorage adapter without Scratch-host fallback."
    contracts:
      - path: docs/product/visual-programming/VSCR-D0-001-SCRATCH-HOST-CONTRACT.md
        section: "Scratch storage adapter"
    planned_sources: [infra/scratch-editor/host/storage.js]
    planned_tests: [e2e/blocks-host.spec.ts]
    task: VSCR-M1-002
    depends_on: [blocks.host.protocol]
