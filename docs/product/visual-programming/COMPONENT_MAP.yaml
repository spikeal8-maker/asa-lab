schema_version: 2.0.0
module: blocks
product: "Визуальное программирование"
purpose: "Compact index from a stable component ID to one small subsystem card."
execution_state_source: docs/execution/current.yaml
router: docs/product/visual-programming/README.md
agent_guide: docs/product/visual-programming/AGENT_GUIDE.md

rules:
  default_read: "this index + one referenced card only"
  expand: one_dependency_hop_at_a_time
  broad_search: only_if_map_stale_or_cross_cutting
  update_card_when_source_or_test_ownership_changes: true
  component_state_values: [implemented, planned, blocked]
  risk_values: [low, medium, high, critical]

areas:
  module: components/module.yaml
  host: components/host.yaml
  runtime: components/runtime.yaml
  assets: components/assets.yaml
  project: components/project.yaml
  sb3: components/sb3.yaml
  gallery-learning: components/gallery-learning.yaml
  sovereign-deployment: components/sovereign-deployment.yaml

components:
  blocks.module.contract: {card: components/module.yaml, state: implemented, risk: medium}
  blocks.upstream.pin: {card: components/module.yaml, state: implemented, risk: high}

  blocks.host.build: {card: components/host.yaml, state: planned, risk: medium}
  blocks.host.branding: {card: components/host.yaml, state: planned, risk: low}
  blocks.host.file-menu: {card: components/host.yaml, state: planned, risk: low}
  blocks.host.extensions: {card: components/host.yaml, state: planned, risk: medium}
  blocks.host.protocol: {card: components/host.yaml, state: planned, risk: high}
  blocks.host.storage-adapter: {card: components/host.yaml, state: planned, risk: high}

  blocks.runtime.session: {card: components/runtime.yaml, state: planned, risk: high}
  blocks.runtime.capability: {card: components/runtime.yaml, state: planned, risk: high}
  blocks.runtime.origin-security: {card: components/runtime.yaml, state: planned, risk: high}

  blocks.assets.reference: {card: components/assets.yaml, state: implemented, risk: medium}
  blocks.assets.metadata: {card: components/assets.yaml, state: planned, risk: high}
  blocks.assets.upload: {card: components/assets.yaml, state: planned, risk: high}
  blocks.assets.read: {card: components/assets.yaml, state: planned, risk: high}

  blocks.project.persistence-guard: {card: components/project.yaml, state: planned, risk: high}
  blocks.project.load-save: {card: components/project.yaml, state: planned, risk: high}
  blocks.project.autosave: {card: components/project.yaml, state: planned, risk: high}
  blocks.project.recovery: {card: components/project.yaml, state: planned, risk: high}
  blocks.project.conflict: {card: components/project.yaml, state: planned, risk: high}

  blocks.sb3.import: {card: components/sb3.yaml, state: planned, risk: high}
  blocks.sb3.export: {card: components/sb3.yaml, state: planned, risk: high}

  blocks.gallery.publication: {card: components/gallery-learning.yaml, state: blocked, risk: high}
  blocks.gallery.player: {card: components/gallery-learning.yaml, state: blocked, risk: high}
  blocks.gallery.remix: {card: components/gallery-learning.yaml, state: blocked, risk: high}
  blocks.learning.submission: {card: components/gallery-learning.yaml, state: blocked, risk: medium}

  blocks.sovereign.media: {card: components/sovereign-deployment.yaml, state: blocked, risk: medium}
  blocks.sovereign.extensions: {card: components/sovereign-deployment.yaml, state: blocked, risk: high}
  blocks.deployment.backup-restore: {card: components/sovereign-deployment.yaml, state: blocked, risk: critical}
  blocks.activation: {card: components/sovereign-deployment.yaml, state: blocked, risk: critical}
