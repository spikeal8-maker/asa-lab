schema_version: 3.0.0
module: blocks
product: "Визуальное программирование"
purpose: "Compact human/agent lookup from a stable concern ID to one small subsystem card."
execution_state_source: docs/execution/current.yaml
readiness_source: docs/product/visual-programming/VSCR-M1-FORWARD-PLAN-2026-09-11.md
router: docs/product/visual-programming/README.md
agent_guide: docs/product/visual-programming/AGENT_GUIDE.md

rules:
  default_read: "this index + one referenced card only"
  expand: one_dependency_hop_at_a_time
  broad_search: only_if_map_stale_or_cross_cutting
  index_owns: [component_id, card_route, human_keywords]
  card_owns: [implementation_state, risk, ownership, contracts, sources, tests, dependencies]
  update_card_when_source_or_test_ownership_changes: true

areas:
  module: components/module.yaml
  host: components/host.yaml
  runtime: components/runtime.yaml
  assets: components/assets.yaml
  project: components/project.yaml
  sb3: components/sb3.yaml
  gallery-learning: components/gallery-learning.yaml
  sovereign-deployment: components/sovereign-deployment.yaml

components:
  blocks.module.contract:
    card: components/module.yaml
    keywords: ["модуль blocks", "контракт blocks", "схема проекта", "module registry"]
  blocks.upstream.pin:
    card: components/module.yaml
    keywords: ["версия scratch", "sha scratch", "обновить scratch", "upstream pin"]

  blocks.host.build:
