catalog_rules:
  - every_route_has_at_least_one_actor
  - every_surface_has_release_template_purpose_actions_states_and_screenshots
  - every_mutating_surface_includes_validation_authorization_server_error_states
  - studentseat_surfaces_show_safe_mode_and_never_expose_other_roster_members
  - admin_surfaces_are_server_grant_driven_and_not_teacher_navigation_tabs
  - editor_surfaces_use_shared_editor_host
  - future_module_surfaces_may_be_documented_but_never_shown_as_working_without_runtime
  - screenshots_never_contain_real_student_data_or_credentials
  - exact_visual_layout_is_asa_original_not_a_pixel_copy
