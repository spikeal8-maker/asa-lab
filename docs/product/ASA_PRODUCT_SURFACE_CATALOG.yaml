schema_version: 1.0.0
catalog_id: asa-complete-product-surfaces
status: normative_candidate
source_scope: docs/product/ASA_TINKERCAD_100_PERCENT_SCOPE.yaml
source_blueprint: docs/product/ASA_TARGET_PLATFORM_BLUEPRINT.md

actors:
  - anonymous
  - account_creator
  - educator
  - registered_student
  - student_seat
  - guardian
  - co_teacher
  - school_admin
  - moderator
  - platform_admin
  - support_operator

implementation_states: [absent, partial, in_review, parity_pass, approved_deviation]
required_ui_states:
  - loading
  - empty
  - populated
  - validation_error
  - authorization_denied
  - server_error
  - offline_or_reconnecting
  - success_feedback

layout_templates:
  PUBLIC:
    regions: [brand_header, primary_content, contextual_help, privacy_footer]
  PORTAL:
    regions: [global_header, capability_navigation, page_header, actions, filters, content, notifications]
  CLASSROOM:
    regions: [global_header, class_header, class_navigation, class_context, content, audit_or_help]
  STUDENT:
    regions: [safe_header, class_context, task_navigation, content, feedback, safe_mode_indicator]
  EDITOR_HOST:
    regions: [context_return, project_title, save_state, version_actions, share_actions, module_toolbar, stage, library, inspector, diagnostics]
  ADMIN:
    regions: [admin_header, scope_switcher, admin_navigation, filters, data_table_or_dashboard, detail_drawer, audit_context]
  PUBLICATION:
    regions: [public_header, viewer, metadata, author, interactions, report, related_projects]

