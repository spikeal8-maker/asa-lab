schema_version: 1.0.0
catalog_id: asa-electronics-complete-tool-catalog
status: normative_candidate
module_key: electronics
release: R4
source_scope: docs/product/ASA_TINKERCAD_100_PERCENT_SCOPE.yaml
source_visual_contract: docs/product/ASA_VISUAL_PRODUCT_SYSTEM.md

reference_statuses:
  confirmed_official: Current public reference source confirms the capability family.
  owner_video: Owner evidence confirms the visible behavior.
  evidence_required: Exact reference behavior or inventory must be captured before parity claim.
  asa_safety_improvement: Deliberate safer behavior requiring deviation record if reference differs.

implementation_states: [absent, partial, in_review, parity_pass, approved_deviation]

workbench_regions:
  - { id: REGION-PROJECT-HEADER, purpose: shared project title save version share and context }
  - { id: REGION-MODULE-TOOLBAR, purpose: editing wiring view code and simulation tools }
  - { id: REGION-COMPONENT-LIBRARY, purpose: search filter preview and place parts }
  - { id: REGION-STAGE, purpose: circuit construction and interaction }
  - { id: REGION-INSPECTOR, purpose: selected object properties terminals and measurements }
  - { id: REGION-CODE, purpose: microcontroller blocks text compile and serial }
  - { id: REGION-INSTRUMENTS, purpose: measurement panels and traces }
  - { id: REGION-DIAGNOSTICS, purpose: errors warnings unsupported topology and runtime state }

modes:
  - id: MODE-DESIGN
    name: Circuit design
    reference_status: confirmed_official
    implementation: partial
  - id: MODE-SIMULATION
    name: Live simulation
    reference_status: confirmed_official
    implementation: partial
  - id: MODE-CODE-BLOCKS
    name: Blocks
    reference_status: evidence_required
    implementation: absent
  - id: MODE-CODE-TEXT
    name: Text code
    reference_status: evidence_required
    implementation: absent
  - id: MODE-CODE-MIXED
    name: Blocks plus text
    reference_status: evidence_required
    implementation: absent
  - id: MODE-SCHEMATIC
    name: Alternate schematic representation
    reference_status: evidence_required
    implementation: absent

milestones:
  - id: R4-M1
    name: Workbench and deterministic basic DC
    required_groups: [SHELL, EDIT, VIEW, LIBRARY, WIRING, INSPECTOR, SIMULATION-BASIC, PERSISTENCE]
  - id: R4-M2
    name: Component and connectivity parity
    required_groups: [COMPONENT-BASIC, COMPONENT-SENSORS, COMPONENT-ACTUATORS, COMPONENT-DISPLAYS, COMPONENT-IC]
  - id: R4-M3
    name: Instruments and diagnostics
    required_groups: [INSTRUMENTS, DIAGNOSTICS]
  - id: R4-M4
    name: Arduino and code
    required_groups: [MICROCONTROLLER-ARDUINO, CODE, SERIAL]
  - id: R4-M5
    name: micro:bit
    required_groups: [MICROCONTROLLER-MICROBIT, CODE]
  - id: R4-M6
    name: Electronics parity evidence
    required_groups: [ACCESSIBILITY, CLASSROOM-CONTEXT, PUBLIC-VIEWER, EXPORT]

capability_groups:
  - id: SHELL
    tools:
      - { id: ELEC-BACK, name: Return to source context, reference_status: owner_video, implementation: partial }
      - { id: ELEC-RENAME, name: Rename project, reference_status: owner_video, implementation: partial }
      - { id: ELEC-SAVE-STATE, name: Saving saved offline conflict states, reference_status: owner_video, implementation: partial }
      - { id: ELEC-VERSIONS, name: Version journal and checkpoint, reference_status: owner_video, implementation: partial }
      - { id: ELEC-DUPLICATE-PROJECT, name: Duplicate project, reference_status: owner_video, implementation: absent }
      - { id: ELEC-SHARE, name: Share and publish affordance by policy, reference_status: owner_video, implementation: absent }
      - { id: ELEC-ACTOR-CONTEXT, name: Actor workspace class assignment banner, reference_status: asa_safety_improvement, implementation: partial }

  - id: EDIT
    tools:
      - { id: ELEC-SELECT, name: Select object or wire, reference_status: owner_video, implementation: partial }
      - { id: ELEC-MULTISELECT, name: Shift selection and selection rectangle, reference_status: evidence_required, implementation: absent }
      - { id: ELEC-MOVE, name: Drag selected object with grid snap, reference_status: owner_video, implementation: partial }
      - { id: ELEC-NUDGE, name: Keyboard nudge, reference_status: evidence_required, implementation: absent }
      - { id: ELEC-ROTATE, name: Rotate component, reference_status: owner_video, implementation: partial }
      - { id: ELEC-DUPLICATE, name: Duplicate selection, reference_status: owner_video, implementation: partial }
      - { id: ELEC-COPY-PASTE, name: Copy paste selection, reference_status: evidence_required, implementation: absent }
      - { id: ELEC-DELETE, name: Delete selection with undo, reference_status: owner_video, implementation: partial }
      - { id: ELEC-UNDO, name: Undo, reference_status: owner_video, implementation: partial }
      - { id: ELEC-REDO, name: Redo, reference_status: owner_video, implementation: partial }
      - { id: ELEC-KEYBOARD-SHORTCUTS, name: Documented keyboard shortcuts, reference_status: evidence_required, implementation: absent }

  - id: VIEW
    tools:
      - { id: ELEC-PAN, name: Pan stage, reference_status: owner_video, implementation: partial }
      - { id: ELEC-ZOOM-IN, name: Zoom in, reference_status: owner_video, implementation: partial }
      - { id: ELEC-ZOOM-OUT, name: Zoom out, reference_status: owner_video, implementation: partial }
      - { id: ELEC-FIT, name: Fit circuit to view, reference_status: owner_video, implementation: partial }
      - { id: ELEC-GRID, name: Visible grid and snap policy, reference_status: owner_video, implementation: partial }
      - { id: ELEC-ZOOM-INDICATOR, name: Visible recoverable zoom state, reference_status: asa_safety_improvement, implementation: absent }
      - { id: ELEC-MINIMAP, name: Optional minimap for large circuits, reference_status: evidence_required, implementation: absent }

  - id: LIBRARY
    tools:
      - { id: ELEC-LIBRARY-SEARCH, name: Search components, reference_status: owner_video, implementation: partial }
      - { id: ELEC-LIBRARY-CATEGORY, name: Component categories, reference_status: owner_video, implementation: partial }
      - { id: ELEC-LIBRARY-VIEW, name: Compact and list view, reference_status: owner_video, implementation: partial }
      - { id: ELEC-LIBRARY-PREVIEW, name: Original SVG preview, reference_status: owner_video, implementation: partial }
      - { id: ELEC-LIBRARY-DRAG, name: Drag component to stage, reference_status: owner_video, implementation: partial }
      - { id: ELEC-LIBRARY-RECENT, name: Recent components, reference_status: evidence_required, implementation: absent }
      - { id: ELEC-LIBRARY-FAVORITES, name: Favorite components, reference_status: evidence_required, implementation: absent }
      - { id: ELEC-LIBRARY-STARTER, name: Starter circuits and templates, reference_status: evidence_required, implementation: absent }
      - { id: ELEC-LIBRARY-FUTURE, name: Honest unavailable or coming soon cards, reference_status: asa_safety_improvement, implementation: partial }

  - id: WIRING
    tools:
      - { id: ELEC-TERMINALS, name: Stable terminals with large hit areas, reference_status: owner_video, implementation: partial }
      - { id: ELEC-WIRE-CREATE, name: Create wire terminal to terminal, reference_status: owner_video, implementation: partial }
      - { id: ELEC-WIRE-SELECT, name: Select and highlight wire, reference_status: owner_video, implementation: partial }
      - { id: ELEC-WIRE-RECONNECT, name: Reconnect endpoint, reference_status: evidence_required, implementation: absent }
      - { id: ELEC-WIRE-BEND, name: Add move remove bend points, reference_status: owner_video, implementation: partial }
      - { id: ELEC-WIRE-ROUTE, name: Straight curved or routed wire style, reference_status: owner_video, implementation: partial }
      - { id: ELEC-WIRE-COLOR, name: Change wire color, reference_status: owner_video, implementation: partial }
      - { id: ELEC-WIRE-DELETE, name: Delete wire with undo, reference_status: owner_video, implementation: partial }
      - { id: ELEC-NET-HIGHLIGHT, name: Highlight connected electrical net, reference_status: evidence_required, implementation: absent }
      - { id: ELEC-DANGLING-WIRE, name: Diagnose dangling or invalid endpoint, reference_status: asa_safety_improvement, implementation: absent }

  - id: INSPECTOR
    tools:
      - { id: ELEC-INSPECTOR-PREVIEW, name: Selected item preview and identity, reference_status: owner_video, implementation: partial }
      - { id: ELEC-INSPECTOR-PROPERTIES, name: Editable typed properties, reference_status: owner_video, implementation: partial }
      - { id: ELEC-INSPECTOR-LABEL, name: User label and designator, reference_status: evidence_required, implementation: absent }
      - { id: ELEC-INSPECTOR-TERMINALS, name: Terminal names polarity and connection state, reference_status: evidence_required, implementation: absent }
      - { id: ELEC-INSPECTOR-MEASURED, name: Live measured values, reference_status: owner_video, implementation: partial }
      - { id: ELEC-INSPECTOR-VALIDATION, name: Property validation and supported ranges, reference_status: asa_safety_improvement, implementation: partial }
      - { id: ELEC-INSPECTOR-COLLAPSE, name: Collapse resize and avoid occlusion, reference_status: owner_video, implementation: partial }
      - { id: ELEC-INSPECTOR-DELETE, name: Separated destructive action, reference_status: asa_safety_improvement, implementation: partial }

  - id: SIMULATION-BASIC
    tools:
      - { id: ELEC-SIM-START, name: Start simulation, reference_status: confirmed_official, implementation: partial }
      - { id: ELEC-SIM-STOP, name: Stop simulation, reference_status: confirmed_official, implementation: partial }
      - { id: ELEC-SIM-RESET, name: Reset runtime state, reference_status: evidence_required, implementation: absent }
      - { id: ELEC-SIM-RUNNING-STATE, name: Visible running state and disabled edit rules, reference_status: owner_video, implementation: partial }
      - { id: ELEC-SIM-RESULTS, name: Voltage current and component state results, reference_status: owner_video, implementation: partial }
      - { id: ELEC-SIM-UNSUPPORTED, name: Honest unsupported topology diagnostic, reference_status: asa_safety_improvement, implementation: partial }
      - { id: ELEC-SIM-SHORT, name: Short circuit and unsafe parameter diagnostic, reference_status: evidence_required, implementation: absent }
      - { id: ELEC-SIM-SPEED, name: Simulation time or speed control if reference-confirmed, reference_status: evidence_required, implementation: absent }

  - id: DIAGNOSTICS
    tools:
      - { id: ELEC-DIAG-SUMMARY, name: Error warning and information summary, reference_status: asa_safety_improvement, implementation: partial }
      - { id: ELEC-DIAG-ANCHOR, name: Select diagnostic and focus component wire terminal or code line, reference_status: asa_safety_improvement, implementation: absent }
      - { id: ELEC-DIAG-NETLIST, name: Connectivity and netlist diagnostics, reference_status: asa_safety_improvement, implementation: partial }
      - { id: ELEC-DIAG-CODE, name: Compiler and runtime diagnostics, reference_status: evidence_required, implementation: absent }
      - { id: ELEC-DIAG-NO-FAKE-SUCCESS, name: Never report numerical success for unsupported model, reference_status: asa_safety_improvement, implementation: partial }

  - id: INSTRUMENTS
    tools:
      - { id: ELEC-MULTIMETER, name: Multimeter voltage current resistance modes, reference_status: evidence_required, implementation: absent }
      - { id: ELEC-OSCILLOSCOPE, name: Oscilloscope channels timebase scale trigger and traces, reference_status: evidence_required, implementation: absent }
      - { id: ELEC-SIGNAL-GENERATOR, name: Signal or function generator if reference-confirmed, reference_status: evidence_required, implementation: absent }
      - { id: ELEC-POWER-SUPPLY, name: Adjustable bench power supply if reference-confirmed, reference_status: evidence_required, implementation: absent }
      - { id: ELEC-INSTRUMENT-PROBES, name: Probe placement polarity and wire attachment, reference_status: evidence_required, implementation: absent }
      - { id: ELEC-INSTRUMENT-PERSIST, name: Instrument settings persist in draft, reference_status: asa_safety_improvement, implementation: absent }

  - id: CODE
    tools:
      - { id: ELEC-CODE-OPEN, name: Open code panel, reference_status: confirmed_official, implementation: absent }
      - { id: ELEC-CODE-BLOCKS, name: Block editor, reference_status: evidence_required, implementation: absent }
      - { id: ELEC-CODE-TEXT, name: Text editor, reference_status: evidence_required, implementation: absent }
      - { id: ELEC-CODE-MIXED, name: Blocks plus text workflow, reference_status: evidence_required, implementation: absent }
      - { id: ELEC-CODE-COMPILE, name: Compile and show diagnostics, reference_status: confirmed_official, implementation: absent }
      - { id: ELEC-CODE-RUN, name: Execute code with circuit simulation, reference_status: confirmed_official, implementation: absent }
      - { id: ELEC-CODE-STOP, name: Stop execution, reference_status: confirmed_official, implementation: absent }
      - { id: ELEC-CODE-LIBRARY, name: Reference APIs and examples, reference_status: evidence_required, implementation: absent }
      - { id: ELEC-CODE-VERSION, name: Code included in ProjectVersion digest, reference_status: asa_safety_improvement, implementation: absent }

  - id: SERIAL
    tools:
      - { id: ELEC-SERIAL-OPEN, name: Open serial monitor, reference_status: evidence_required, implementation: absent }
      - { id: ELEC-SERIAL-OUTPUT, name: Timestamped output and autoscroll, reference_status: evidence_required, implementation: absent }
      - { id: ELEC-SERIAL-INPUT, name: Send line input, reference_status: evidence_required, implementation: absent }
      - { id: ELEC-SERIAL-CLEAR, name: Clear visible log without mutating project, reference_status: evidence_required, implementation: absent }
      - { id: ELEC-SERIAL-BAUD, name: Baud and line ending behavior if reference-confirmed, reference_status: evidence_required, implementation: absent }

  - id: PERSISTENCE
    tools:
      - { id: ELEC-AUTOSAVE, name: Debounced idempotent autosave, reference_status: owner_video, implementation: partial }
      - { id: ELEC-MANUAL-SAVE, name: Explicit save or retry, reference_status: owner_video, implementation: partial }
      - { id: ELEC-RELOAD, name: Exact document reload, reference_status: owner_video, implementation: partial }
      - { id: ELEC-CHECKPOINT, name: Immutable version checkpoint, reference_status: owner_video, implementation: partial }
      - { id: ELEC-CONFLICT, name: Optimistic conflict and recovery copy, reference_status: asa_safety_improvement, implementation: absent }
      - { id: ELEC-PREVIEW, name: Deterministic safe project preview, reference_status: owner_video, implementation: partial }
      - { id: ELEC-MIGRATE, name: Additive document schema migration, reference_status: asa_safety_improvement, implementation: partial }

  - id: CLASSROOM-CONTEXT
    tools:
      - { id: ELEC-ASSIGNMENT-BANNER, name: Assignment title due state and publication lock, reference_status: asa_safety_improvement, implementation: absent }
      - { id: ELEC-SUBMIT, name: Submit exact immutable ProjectVersion, reference_status: owner_video, implementation: absent }
