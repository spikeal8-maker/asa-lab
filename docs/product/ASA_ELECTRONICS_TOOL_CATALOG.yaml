      - { id: ELEC-REMIX, name: Remix to personal project with attribution, reference_status: owner_video, implementation: absent }

  - id: ACCESSIBILITY
    tools:
      - { id: ELEC-A11Y-NAMES, name: Accessible names and tooltips, reference_status: asa_safety_improvement, implementation: partial }
      - { id: ELEC-A11Y-FOCUS, name: Visible keyboard focus, reference_status: asa_safety_improvement, implementation: partial }
      - { id: ELEC-A11Y-TARGETS, name: Practical 44 by 44 pointer targets, reference_status: asa_safety_improvement, implementation: partial }
      - { id: ELEC-A11Y-KEYBOARD, name: Keyboard path for critical actions, reference_status: asa_safety_improvement, implementation: absent }
      - { id: ELEC-A11Y-CONTRAST, name: WCAG AA contrast, reference_status: asa_safety_improvement, implementation: partial }
      - { id: ELEC-A11Y-MOTION, name: Reduced motion and no flashing diagnostic, reference_status: asa_safety_improvement, implementation: absent }

  - id: EXPORT
    tools:
