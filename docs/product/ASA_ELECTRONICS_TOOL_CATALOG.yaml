      - { id: ELEC-EXPORT-CODE, name: Export supported microcontroller code, reference_status: evidence_required, implementation: absent }
      - { id: ELEC-EXPORT-PARTS, name: Parts list or BOM if reference-confirmed, reference_status: evidence_required, implementation: absent }
      - { id: ELEC-IMPORT-DOCUMENT, name: Import validated ASA circuit document, reference_status: asa_safety_improvement, implementation: absent }

component_families:
  - id: COMPONENT-BASIC
    reference_status: evidence_required
    required_for_full_parity: true
    parts:
      - resistor
      - potentiometer
      - capacitor
      - polarized_capacitor
      - inductor
      - diode
      - zener_diode
      - led
      - rgb_led
      - photoresistor
      - thermistor
      - pushbutton
      - slide_switch
      - dip_switch
      - battery
      - coin_cell
      - dc_power_source
      - breadboard
      - mini_breadboard
  - id: COMPONENT-SEMICONDUCTOR
    reference_status: evidence_required
    required_for_full_parity: true
    parts: [npn_transistor, pnp_transistor, nmos, pmos, optocoupler]
  - id: COMPONENT-SENSORS
    reference_status: evidence_required
    required_for_full_parity: true
    parts: [temperature_sensor, pir_sensor, ultrasonic_sensor, tilt_sensor, flex_sensor, force_sensor, light_sensor, gas_sensor, soil_moisture_sensor]
  - id: COMPONENT-ACTUATORS
    reference_status: evidence_required
    required_for_full_parity: true
    parts: [dc_motor, servo, stepper_motor, relay, piezo_buzzer, speaker, vibration_motor]
  - id: COMPONENT-DISPLAYS
    reference_status: evidence_required
    required_for_full_parity: true
    parts: [single_seven_segment, four_digit_seven_segment, lcd_16x2, neopixel_strip, led_matrix]
  - id: COMPONENT-IC
    reference_status: evidence_required
    required_for_full_parity: true
    parts: [timer_555, op_amp, logic_gates, shift_register, motor_driver, decade_counter]
  - id: MICROCONTROLLER-ARDUINO
    reference_status: confirmed_official
    required_for_full_parity: true
    parts: [arduino_uno, compatible_pin_and_power_model]
  - id: MICROCONTROLLER-MICROBIT
    reference_status: confirmed_official
    required_for_full_parity: true
    parts: [microbit_board, led_matrix, buttons, accelerometer, radio_or_equivalent_if_reference_confirmed]
  - id: INSTRUMENT-COMPONENTS
    reference_status: evidence_required
    required_for_full_parity: true
    parts: [multimeter, oscilloscope, signal_generator_if_confirmed, bench_power_supply_if_confirmed]

component_contract:
  required_fields:
    - type_id
    - display_name
    - category
    - svg_asset
    - physical_scale
    - terminals
    - editable_properties
    - default_properties
    - validation_rules
    - simulation_model
    - preview_provider
    - safe_mode_support
    - document_schema_version
  terminal_fields:
    - terminal_id
    - label
    - electrical_role
    - polarity
    - local_position
    - hit_radius
  rules:
    - component_and_terminal_ids_are_stable
    - owner_or_asa_original_assets_only
    - no_raster_inside_svg
    - no_blank_placeholder_for_claimed_available_component
    - unavailable_part_is_marked_coming_soon_and_not_draggable
    - simulation_model_absence_produces_diagnostic_not_fake_result
    - exact_reference_inventory_requires_evidence_capture

required_reference_capture:
  - complete_current_component_inventory
  - exact_instrument_inventory_and_controls
  - exact_wire_route_styles_and_shortcuts
  - exact_Arduino_code_modes_and_supported_libraries
  - exact_microbit_board_features
  - exact_serial_monitor_controls
  - exact_schematic_view_behavior
  - exact_import_export_and_parts_list_behavior

required_screenshots:
  - electronics-empty
  - electronics-component-library
  - electronics-component-properties
  - electronics-wire-selected
  - electronics-wire-routing
  - electronics-multiselect
  - electronics-running
  - electronics-diagnostic
  - electronics-multimeter
  - electronics-oscilloscope
  - electronics-arduino-code
  - electronics-serial-monitor
  - electronics-microbit
  - electronics-assignment-context
  - electronics-teacher-viewer
  - electronics-mobile-or-approved-responsive-state

parity_rules:
  - documentation_does_not_equal_implementation
  - evidence_required_item_blocks_100_percent_claim
  - every_available_component_has_real_asset_terminals_properties_and_model_or_honest_diagnostic
  - unsupported_topology_never_returns_fake_numeric_success
  - code_and_circuit_are_one_versioned_document
  - teacher_view_and_public_view_never_mutate_original
  - student_assignment_work_is_publication_locked
  - module_core_does_not_leak_electronics_types_into_project_classroom_or_assessment_core
