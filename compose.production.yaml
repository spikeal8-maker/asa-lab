name: ${COMPOSE_PROJECT_NAME:-asa-lab-production}

services:
  postgres:
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the private production environment}

  migration:
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?set a dedicated migration URL in the private production environment}
      MIGRATION_EXPECT_DATABASE: ${MIGRATION_EXPECT_DATABASE:?attest the exact production database name}
      MIGRATION_CONFIRM: ${MIGRATION_CONFIRM:?confirm the exact production database as APPLY:name}
      ASA_APP_DB_PASSWORD: ${ASA_APP_DB_PASSWORD:?set ASA_APP_DB_PASSWORD in the private production environment}
      ASA_SEED_DEV: 'false'

  api:
    restart: always
    environment:
      NODE_ENV: production
      APP_DATABASE_URL: ${APP_DATABASE_URL:?set APP_DATABASE_URL in the private production environment}
      ASA_SETTINGS_ENCRYPTION_KEY: ${ASA_SETTINGS_ENCRYPTION_KEY:?set ASA_SETTINGS_ENCRYPTION_KEY in the private production environment}
      ASA_PUBLIC_WEB_ORIGINS: ${ASA_PUBLIC_WEB_ORIGINS:-https://asa-lab.ru,https://www.asa-lab.ru,https://lab.alikinas.ru}

  web:
    restart: always
