<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/electronics-review/review.css" />
  </head>
  <body>
    <script type="module">
      import {
        loadFoundation,
        mountShell,
        reportReady,
        setStats,
      } from '/electronics-review/review-common.js';

      const main = mountShell(
        'physical-scale.html',
        'Единый физический масштаб',
        'Каждая деталь получает размер только из physicalWidthMm × physicalHeightMm. На этой странице 1 мм всегда равен 5 экранным единицам; индивидуального renderWidth больше нет.',
      );
      const { manifest } = await loadFoundation();
      setStats([
        [`${manifest.worldUnitsPerMm}×`, 'units / mm'],
        ['10 мм', 'линейка'],
        ['0', 'renderWidth'],
      ]);
      main.insertAdjacentHTML(
        'beforeend',
        `<div class="notice">Корпус tactile-кнопки — <strong>6 × 6 мм</strong>; полный owner canvas с ножками — 10 × 10 мм. Сравнение ниже сохраняет и корпус, и физические окончания выводов.</div><section class="scale-stage" id="stage"><div class="ruler">10 мм</div></section>`,
      );
      const rows = [
        [
          'battery-holder-aa-1',
          'battery-holder-aa-2',
          'battery-holder-aa-3',
          'battery-holder-aa-4',
          'battery-holder-aa-6',
          'battery-holder-aa-8',
        ],
        [
          'button-tactile-6mm',
          'resistor-axial',
          'led-5mm',
          'switch-spdt',
          'potentiometer',
          'diode-do35',
          'incandescent-lamp',
        ],
        [
          'breadboard-small',
          'breadboard-medium',
          'seven-segment-display',
          'rgb-led',
          'dc-motor',
          'servo-motor',
        ],
      ];
      const byId = new Map(manifest.components.map((item) => [item.componentId, item]));
      const stage = document.querySelector('#stage');
      for (const ids of rows) {
        const row = document.createElement('div');
        row.className = 'scale-row';
        for (const id of ids) {
          const item = byId.get(id);
          const width = item.physicalWidthMm * manifest.worldUnitsPerMm;
          const height = item.physicalHeightMm * manifest.worldUnitsPerMm;
          const node = document.createElement('div');
          node.className = 'scale-item';
          node.innerHTML = `<div class="asset-frame" style="width:${width}px;height:${height}px"><img src="${item.productionSvg}" alt="${item.displayName}"/></div><strong>${item.displayName}</strong><small>${item.physicalWidthMm} × ${item.physicalHeightMm} мм · ${Math.round(width)} × ${Math.round(height)} units</small>`;
          row.append(node);
        }
        stage.append(row);
      }
      await Promise.all([...document.images].map((image) => image.decode().catch(() => undefined)));
      reportReady('physical-scale');
    </script>
  </body>
</html>
