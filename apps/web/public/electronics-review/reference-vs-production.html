<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/electronics-review/review.css" />
  </head>
  <body>
    <script type="module">
      import {
        loadFoundation,
        mountShell,
        reportReady,
        setStats,
      } from '/electronics-review/review-common.js';

      const main = mountShell(
        'reference-vs-production.html',
        'Эталон владельца и прозрачный production-вектор',
        'Слева — неизменённое reference evidence из owner-пакета. Справа — только прозрачный рабочий SVG: точный owner SVG либо векторная реконструкция, полученная из owner reference без изменения внешнего вида.',
      );
      const { manifest, references } = await loadFoundation();
      setStats([
        [manifest.summary.logicalComponents, 'в каталоге'],
        [manifest.summary.candidateForOwnerReview, 'к review'],
        [manifest.summary.missingReference, 'missing'],
      ]);
      main.insertAdjacentHTML(
        'beforeend',
        `<div class="notice"><strong>Admission gate:</strong> все 32 позиции остаются <span class="mono">candidate_for_owner_review</span>. <span class="mono">owner_accepted=false</span>, поэтому эта библиотека ещё не подключена к редактору.</div>
         <div class="toolbar"><label for="query">Каталог</label><input id="query" type="search" placeholder="Название, категория, provenance…"/><select id="category"><option value="all">Все категории</option></select><span id="visible-count"></span></div>
         <section class="catalog-grid" id="catalog"></section>`,
      );
      const referenceById = new Map(references.components.map((item) => [item.componentId, item]));
      const categories = [...new Set(manifest.components.map((item) => item.category))].sort();
      document
        .querySelector('#category')
        .insertAdjacentHTML(
          'beforeend',
          categories.map((category) => `<option value="${category}">${category}</option>`).join(''),
        );
      const catalog = document.querySelector('#catalog');
      const cards = manifest.components.map((component) => {
        const reference = referenceById.get(component.componentId);
        const missing = component.status === 'missing_reference';
        const card = document.createElement('article');
        card.className = 'asset-card';
        card.dataset.search =
          `${component.componentId} ${component.displayName} ${component.category} ${component.provenance}`.toLowerCase();
        card.dataset.category = component.category;
        card.innerHTML = `<header><div><h3>${component.displayName}</h3><small class="mono">${component.componentId}</small></div><span class="badge ${missing ? 'missing' : ''}">${missing ? 'missing_reference' : component.provenance}</span></header>
          <div class="compare">
            <figure>${reference?.referenceFile ? `<img src="${reference.referenceFile}" alt="Reference ${component.displayName}"/>` : '<div class="error">Нет исходного файла</div>'}<figcaption>REFERENCE · SHA ${reference?.sha256?.slice(0, 10) ?? '—'}</figcaption></figure>
            <figure>${component.productionSvg ? `<img src="${component.productionSvg}" alt="Production ${component.displayName}"/>` : '<div class="error">5×AA не найден в пакете</div>'}<figcaption>PRODUCTION · transparent SVG</figcaption></figure>
          </div>
          <div class="asset-meta"><span>${component.physicalWidthMm ?? '—'} × ${component.physicalHeightMm ?? '—'} мм</span><span>${component.pins.length} pins</span><span>scale × ${manifest.worldUnitsPerMm}</span><span>owner accepted: no</span></div>`;
        catalog.append(card);
        return card;
      });
      const query = document.querySelector('#query');
      const category = document.querySelector('#category');
      const filter = () => {
        const value = query.value.trim().toLowerCase();
        let visible = 0;
        cards.forEach((card) => {
          const match =
            (!value || card.dataset.search.includes(value)) &&
            (category.value === 'all' || card.dataset.category === category.value);
          card.hidden = !match;
          if (match) visible += 1;
        });
        document.querySelector('#visible-count').textContent = `${visible} / ${cards.length}`;
      };
      query.addEventListener('input', filter);
      category.addEventListener('change', filter);
      filter();
      await Promise.all([...document.images].map((image) => image.decode().catch(() => undefined)));
      reportReady('reference-vs-production');
    </script>
  </body>
</html>
