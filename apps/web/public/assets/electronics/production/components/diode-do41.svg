<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="20mm" height="7mm" viewBox="0 0 20 7" version="1.1">
  <title>Diode DO-41 horizontal — 4 pitch</title>
  <desc>Larger realistic horizontal rectifier diode for breadboard, 10.16 mm lead spacing.</desc>
  <defs>
    <linearGradient id="leadGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f0f0f0"/><stop offset="100%" stop-color="#9d9d9d"/></linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="0.5"><stop offset="0%" stop-color="#40434a"/><stop offset="100%" stop-color="#1d2026"/></linearGradient>
  </defs>
  <!-- lead centers: (3.50,3.50) and (13.66,3.50), span = 10.16 mm = 4*2.54 -->
  <g fill="url(#leadGrad)" stroke="#8f8f8f" stroke-width="0.08">
    <rect x="1.20" y="3.18" width="4.60" height="0.64" rx="0.25"/>
    <rect x="11.40" y="3.18" width="4.60" height="0.64" rx="0.25"/>
  </g>
  <rect x="5.60" y="1.80" width="6.60" height="3.40" rx="0.74" fill="url(#bodyGrad)" stroke="#27292d" stroke-width="0.11"/>
  <rect x="10.45" y="1.88" width="0.82" height="3.24" fill="#d7d7d7" opacity="0.98"/>
  <ellipse cx="7.10" cy="2.55" rx="0.56" ry="0.82" fill="#ffffff" opacity="0.05"/>

<g id="production-pin-anchors" aria-hidden="true"><circle id="pin-anode" data-pin-id="anode" cx="0" cy="3.5" r="0.01" fill="none"/><circle id="pin-cathode" data-pin-id="cathode" cx="20" cy="3.5" r="0.01" fill="none"/></g>
</svg>
