<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="18mm" height="6mm" viewBox="0 0 18 6" version="1.1">
  <title>Diode DO-35 horizontal — 4 pitch</title>
  <desc>Small realistic horizontal diode for breadboard, 10.16 mm lead spacing.</desc>
  <defs>
    <linearGradient id="leadGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f0f0f0"/><stop offset="100%" stop-color="#9d9d9d"/></linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="0.5"><stop offset="0%" stop-color="#474a51"/><stop offset="100%" stop-color="#23262d"/></linearGradient>
  </defs>
  <!-- lead centers: (3.00,3.00) and (13.16,3.00), span = 10.16 mm = 4*2.54 -->
  <g fill="url(#leadGrad)" stroke="#8f8f8f" stroke-width="0.08">
    <rect x="1.00" y="2.74" width="4.30" height="0.52" rx="0.24"/>
    <rect x="10.90" y="2.74" width="4.30" height="0.52" rx="0.24"/>
  </g>
  <rect x="5.05" y="1.58" width="6.05" height="2.84" rx="0.64" fill="url(#bodyGrad)" stroke="#2d2e31" stroke-width="0.10"/>
  <rect x="9.45" y="1.66" width="0.68" height="2.68" fill="#dedede" opacity="0.96"/>
  <ellipse cx="6.25" cy="2.20" rx="0.45" ry="0.65" fill="#ffffff" opacity="0.05"/>

<g id="production-pin-anchors" aria-hidden="true"><circle id="pin-anode" data-pin-id="anode" cx="0" cy="3" r="0.01" fill="none"/><circle id="pin-cathode" data-pin-id="cathode" cx="18" cy="3" r="0.01" fill="none"/></g>
</svg>
