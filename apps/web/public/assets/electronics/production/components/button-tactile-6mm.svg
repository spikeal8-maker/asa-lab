<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="10mm" height="10mm" viewBox="0 0 10 10" version="1.1">
  <title>Tactile button 6x6 mm — released</title>
  <desc>Released state. Pure SVG. Units in millimeters.</desc>
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9d9d9"/>
      <stop offset="100%" stop-color="#bfbfbf"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2f2f2"/>
      <stop offset="45%" stop-color="#d0d0d0"/>
      <stop offset="100%" stop-color="#9a9a9a"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f5056"/>
      <stop offset="100%" stop-color="#24262d"/>
    </linearGradient>
  </defs>

  <!-- Pin centers: (2.65,1.20), (7.35,1.20), (2.65,8.80), (7.35,8.80) -->
  <g id="pins" fill="url(#pinGrad)" stroke="#8f8f8f" stroke-width="0.08">
    <path d="M2.20,0.35 h0.90 v1.85 h-0.90 z"/>
    <path d="M6.90,0.35 h0.90 v1.85 h-0.90 z"/>
    <path d="M2.20,7.80 h0.90 v1.85 h-0.90 z"/>
    <path d="M6.90,7.80 h0.90 v1.85 h-0.90 z"/>
  </g>

  <rect x="1.58" y="1.58" width="6.84" height="6.84" rx="0.45" ry="0.45" fill="url(#bodyGrad)" stroke="#a0a0a0" stroke-width="0.12"/>
  <circle cx="2.95" cy="2.95" r="0.62" fill="#4c4c50" stroke="#39393c" stroke-width="0.06"/>
  <circle cx="7.05" cy="2.95" r="0.62" fill="#4c4c50" stroke="#39393c" stroke-width="0.06"/>
  <circle cx="2.95" cy="7.05" r="0.62" fill="#4c4c50" stroke="#39393c" stroke-width="0.06"/>
  <circle cx="7.05" cy="7.05" r="0.62" fill="#4c4c50" stroke="#39393c" stroke-width="0.06"/>

  <circle cx="5" cy="5" r="1.95" fill="#6b6b6b" opacity="0.58"/>
  <circle cx="5" cy="5" r="1.74" fill="url(#capGrad)" stroke="#575757" stroke-width="0.10"/>
  <ellipse cx="4.46" cy="4.44" rx="0.62" ry="0.56" fill="#ffffff" opacity="0.05"/>

<g id="production-pin-anchors" aria-hidden="true"><circle id="pin-SW-A1" data-pin-id="SW-A1" cx="2.65" cy="1.2" r="0.01" fill="none"/><circle id="pin-SW-B1" data-pin-id="SW-B1" cx="7.35" cy="1.2" r="0.01" fill="none"/><circle id="pin-SW-A2" data-pin-id="SW-A2" cx="2.65" cy="8.8" r="0.01" fill="none"/><circle id="pin-SW-B2" data-pin-id="SW-B2" cx="7.35" cy="8.8" r="0.01" fill="none"/></g>
</svg>
