<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="10mm" height="10mm" viewBox="0 0 10 10" version="1.1">
  <title>Tactile button 6x6 mm — animated</title>
  <desc>Animated tactile push button. Loops between released and pressed visual states.</desc>
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9d9d9"/>
      <stop offset="100%" stop-color="#bfbfbf"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2f2f2"/>
      <stop offset="45%" stop-color="#d0d0d0"/>
      <stop offset="100%" stop-color="#9a9a9a"/>
    </linearGradient>
    <linearGradient id="capUpGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f5056"/>
      <stop offset="100%" stop-color="#24262d"/>
    </linearGradient>
    <linearGradient id="capDownGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a4b50"/>
      <stop offset="100%" stop-color="#1e2027"/>
    </linearGradient>
  </defs>

  <g id="pins" fill="url(#pinGrad)" stroke="#8f8f8f" stroke-width="0.08">
    <path d="M2.20,0.35 h0.90 v1.85 h-0.90 z"/>
    <path d="M6.90,0.35 h0.90 v1.85 h-0.90 z"/>
    <path d="M2.20,7.80 h0.90 v1.85 h-0.90 z"/>
    <path d="M6.90,7.80 h0.90 v1.85 h-0.90 z"/>
  </g>
  <rect x="1.58" y="1.58" width="6.84" height="6.84" rx="0.45" ry="0.45" fill="url(#bodyGrad)" stroke="#a0a0a0" stroke-width="0.12"/>
  <circle cx="2.95" cy="2.95" r="0.62" fill="#4c4c50" stroke="#39393c" stroke-width="0.06"/>
  <circle cx="7.05" cy="2.95" r="0.62" fill="#4c4c50" stroke="#39393c" stroke-width="0.06"/>
  <circle cx="2.95" cy="7.05" r="0.62" fill="#4c4c50" stroke="#39393c" stroke-width="0.06"/>
  <circle cx="7.05" cy="7.05" r="0.62" fill="#4c4c50" stroke="#39393c" stroke-width="0.06"/>

  <g id="buttonCap">
    <circle cx="5" cy="5" r="1.95" fill="#6b6b6b" opacity="0.58">
      <animate attributeName="r" values="1.95;1.88;1.88;1.95;1.95" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.58;0.64;0.64;0.58;0.58" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="5" cy="5" r="1.74" fill="url(#capUpGrad)" stroke="#575757" stroke-width="0.10">
      <animate attributeName="r" values="1.74;1.56;1.56;1.74;1.74" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="url(#capUpGrad);url(#capDownGrad);url(#capDownGrad);url(#capUpGrad);url(#capUpGrad)" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="5" cy="5" r="1.74" fill="none" stroke="#3c3c3c" stroke-width="0.16" opacity="0">
      <animate attributeName="opacity" values="0;0.45;0.45;0;0" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <ellipse cx="4.50" cy="4.48" rx="0.60" ry="0.54" fill="#ffffff" opacity="0.05">
      <animate attributeName="rx" values="0.60;0.50;0.50;0.60;0.60" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="0.54;0.45;0.45;0.54;0.54" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.05;0.035;0.035;0.05;0.05" dur="1.6s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</svg>
