<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 494" width="1000" height="494">
  <title>Батарейка «Крона» 9 В — чистый вектор по образцу владельца</title>
  <desc>Hand-drawn replacement for the auto-traced mosaic. Geometry measured
  from the owner reference render: black negative contact top-left with its
  tip, red positive below, dark connector bar with grey neck and two cap
  prongs, orange band with − and + marks, dark body with a vertical «9V»
  legend.</desc>

  <!-- contact tips and caps: negative (black, top), positive (red, bottom) -->
  <rect x="59" y="215" width="15" height="8" rx="4" fill="#333333"/>
  <rect x="70" y="210" width="47" height="18" rx="9" fill="#333333"/>
  <rect x="59" y="254" width="15" height="8" rx="4" fill="#af1c1c"/>
  <rect x="70" y="249" width="47" height="18" rx="9" fill="#af1c1c"/>

  <!-- connector bar -->
  <rect x="118" y="53" width="34" height="363" rx="14" fill="#333333"/>

  <!-- neck between bar and prongs -->
  <rect x="152" y="77" width="17" height="134" fill="#8c8c8c"/>
  <rect x="152" y="245" width="17" height="135" fill="#8c8c8c"/>

  <!-- cap prongs -->
  <rect x="169" y="77" width="51" height="134" fill="#bababa"/>
  <rect x="169" y="245" width="51" height="135" fill="#bababa"/>
  <rect x="169" y="245" width="27" height="135" fill="#8c8c8c"/>

  <!-- battery body -->
  <rect x="438" y="38" width="515" height="399" rx="8" fill="#333333"/>

  <!-- orange band over the body tail -->
  <path d="M228 38 h208 v399 h-208 q-8 0 -8 -8 v-383 q0 -8 8 -8 z" fill="#d19152"/>

  <!-- polarity marks on the orange band: minus top, plus bottom -->
  <g fill="none" stroke="#b47d4d" stroke-width="4">
    <circle cx="256" cy="145" r="24"/>
    <circle cx="256" cy="319" r="24"/>
  </g>
  <g stroke="#b47d4d" stroke-width="5" stroke-linecap="round">
    <line x1="244" y1="145" x2="268" y2="145"/>
    <line x1="244" y1="319" x2="268" y2="319"/>
    <line x1="256" y1="307" x2="256" y2="331"/>
  </g>

  <!-- legend -->
  <text transform="translate(701 305) rotate(-90)" font-family="Arial, Helvetica, sans-serif"
        font-size="112" font-weight="700" fill="#dddddd">9V</text>
</svg>
