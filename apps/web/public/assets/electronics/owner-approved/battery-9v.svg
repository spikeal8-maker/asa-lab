<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 494" width="1000" height="494">
  <title>Батарейка «Крона» 9 В — чистый вектор по образцу владельца</title>
  <desc>Hand-drawn replacement for the auto-traced mosaic. Geometry measured
  from the owner reference: same viewBox, same contact positions (black
  negative top-left, red positive below), orange band with − and + marks,
  dark body with a vertical «9V» legend.</desc>

  <!-- contact caps: negative (black, top), positive (red, bottom) -->
  <rect x="59" y="214" width="14" height="8" rx="4" fill="#222222"/>
  <rect x="71" y="207" width="47" height="22" rx="11" fill="#333333"/>
  <rect x="59" y="254" width="14" height="8" rx="4" fill="#8f1616"/>
  <rect x="71" y="247" width="46" height="22" rx="11" fill="#af1c1c"/>

  <!-- snap connector base -->
  <rect x="118" y="50" width="34" height="370" rx="14" fill="#333333"/>

  <!-- white plastic plate between the cap prongs -->
  <rect x="155" y="200" width="65" height="55" fill="#f4f4f4"/>

  <!-- cap prongs (the lower one carries a darker left face) -->
  <rect x="169" y="88" width="51" height="112" rx="4" fill="#bababa"/>
  <rect x="169" y="252" width="51" height="126" rx="4" fill="#bababa"/>
  <rect x="169" y="252" width="27" height="126" fill="#8c8c8c"/>

  <!-- battery body -->
  <rect x="439" y="38" width="515" height="400" rx="16" fill="#333333"/>

  <!-- orange band over the body tail -->
  <path d="M230 38 h210 v400 h-210 q-10 0 -10 -10 v-380 q0 -10 10 -10 z" fill="#d19152"/>

  <!-- polarity marks on the orange band: minus top, plus bottom -->
  <g fill="none" stroke="#b17b4c" stroke-width="4">
    <circle cx="256" cy="145" r="22"/>
    <circle cx="256" cy="319" r="22"/>
  </g>
  <g stroke="#b17b4c" stroke-width="5" stroke-linecap="round">
    <line x1="245" y1="145" x2="267" y2="145"/>
    <line x1="245" y1="319" x2="267" y2="319"/>
    <line x1="256" y1="308" x2="256" y2="330"/>
  </g>

  <!-- legend -->
  <text transform="translate(701 305) rotate(-90)" font-family="Arial, Helvetica, sans-serif"
        font-size="120" font-weight="700" fill="#dddddd">9V</text>
</svg>
