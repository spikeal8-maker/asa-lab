<svg xmlns="http://www.w3.org/2000/svg" width="120" height="370" viewBox="0 0 120 370" fill="none">
  <!-- ASA Lab vibration motor / coin vibration motor with two leads -->
  <!-- Local coordinates are source coordinates shifted by x=-62, y=-43 -->

  <!-- Metal lead tips -->
  <g id="lead-tips" fill="#8C8C8C">
    <rect x="37.5" y="347" width="3.5" height="22" rx="1.75"/>
    <rect x="78.5" y="347" width="3.5" height="22" rx="1.75"/>
  </g>

  <!-- Wires: dark outlines -->
  <g id="wire-outlines" fill="none" stroke-linecap="butt" stroke-linejoin="round">
    <path id="wire-black-outline"
          d="M51 130 L51 220 C51 232 49 237 43 248 C38.5 256 38 263 38 270 L38 347"
          stroke="#231F20" stroke-width="10"/>
    <path id="wire-red-outline"
          d="M68 130 L68 220 C68 232 70 237 76 248 C80.5 256 81 263 81 270 L81 347"
          stroke="#8B0304" stroke-width="10"/>
  </g>

  <!-- Wires: colored cores -->
  <g id="wire-cores" fill="none" stroke-linecap="butt" stroke-linejoin="round">
    <path id="wire-black"
          d="M51 130 L51 220 C51 232 49 237 43 248 C38.5 256 38 263 38 270 L38 347"
          stroke="#414042" stroke-width="6"/>
    <path id="wire-red"
          d="M68 130 L68 220 C68 232 70 237 76 248 C80.5 256 81 263 81 270 L81 347"
          stroke="#ED1C24" stroke-width="6"/>
  </g>

  <!-- Small wire highlights, matching the source illustration -->
  <path d="M66.5 134 L66.5 158" stroke="#FF353A" stroke-width="1.5" opacity="0.7"/>
  <path d="M49.5 134 L49.5 220" stroke="#727173" stroke-width="1" opacity="0.6"/>

  <!-- Connector / strain-relief tab behind the motor body -->
  <g id="connector">
    <rect x="37" y="113" width="41" height="21" rx="2.5" fill="#5F6062"/>
    <rect x="41" y="116" width="33" height="14" rx="1.5" fill="#A7A9AC"/>
  </g>

  <!-- Circular vibration motor body -->
  <g id="motor-body">
    <!-- outer metal rim -->
    <circle cx="59.5" cy="59.5" r="59" fill="#5F6062"/>
    <!-- light metal ring -->
    <circle cx="59.5" cy="59.5" r="54.5" fill="#D1D3D4"/>
    <!-- black face -->
    <circle cx="59.5" cy="59.5" r="48.5" fill="#231F20"/>
  </g>
</svg>
