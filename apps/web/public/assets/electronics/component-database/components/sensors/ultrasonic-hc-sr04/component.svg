<svg xmlns="http://www.w3.org/2000/svg" width="738" height="415" viewBox="0 0 738 415" fill="none">
  <defs>
    <g id="transducer">
      <!-- lower cylinder shadow -->
      <circle cx="0" cy="27" r="130" fill="#263340"/>
      <!-- front shell -->
      <circle cx="0" cy="0" r="130" fill="#CCCCCC"/>
      <!-- darker top rim accent -->
      <path d="M -107 -6 A 107 107 0 0 1 107 -6 L 100 6 A 100 100 0 0 0 -100 6 Z" fill="#D6D6D6" opacity="0.85"/>
      <!-- inner ring -->
      <circle cx="0" cy="0" r="102" fill="#666666"/>
      <!-- darker side/inner shading -->
      <path d="M -97 -16 A 102 102 0 0 1 -57 -83 A 102 102 0 0 1 57 -83 A 102 102 0 0 0 -97 -16 Z" fill="#4C4C4C" opacity="0.9"/>
      <!-- olive ring -->
      <circle cx="0" cy="0" r="81" fill="#999933"/>
      <!-- inner membrane -->
      <circle cx="0" cy="0" r="61" fill="#999999"/>
      <!-- subtle membrane highlight -->
      <path d="M -52 -12 A 61 61 0 0 1 0 -58 A 61 61 0 0 0 -52 -12 Z" fill="#A6A6A6" opacity="0.65"/>
    </g>
    <style>
      .board-text{fill:#EAEAEA;font-family:"Trebuchet MS","Verdana","DejaVu Sans",sans-serif;font-weight:700;letter-spacing:1px}
      .small-text{fill:#EAEAEA;font-family:"Trebuchet MS","Verdana","DejaVu Sans",sans-serif;font-weight:700}
      .pin-label{fill:#EAEAEA;font-family:"Trebuchet MS","Verdana","DejaVu Sans",sans-serif;font-weight:700;letter-spacing:1px}
    </style>
  </defs>

  <!-- PCB -->
  <rect x="1" y="1" width="736" height="326" rx="7" fill="#003366"/>

  <!-- Mount holes -->
  <g>
    <g transform="translate(21 21)">
      <circle r="13.5" fill="#CCCCCC"/>
      <circle r="9" fill="#E8E8E8"/>
    </g>
    <g transform="translate(716 21)">
      <circle r="13.5" fill="#CCCCCC"/>
      <circle r="9" fill="#E8E8E8"/>
    </g>
    <g transform="translate(21 307)">
      <circle r="13.5" fill="#CCCCCC"/>
      <circle r="9" fill="#E8E8E8"/>
    </g>
    <g transform="translate(716 307)">
      <circle r="13.5" fill="#CCCCCC"/>
      <circle r="9" fill="#E8E8E8"/>
    </g>
  </g>

  <!-- Top capsule -->
  <rect x="294" y="15" width="150" height="53" rx="26.5" fill="#CCCCCC"/>
  <rect x="301" y="19" width="136" height="45" rx="22.5" fill="#999999"/>
  <path d="M311 25 Q369 10 427 25" fill="none" stroke="#BEBEBE" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- Transducers -->
  <g transform="translate(152 163)">
    <use href="#transducer"/>
  </g>
  <g transform="translate(585 163)">
    <use href="#transducer"/>
  </g>

  <!-- Main title -->
  <text x="368" y="118" text-anchor="middle" class="board-text" font-size="42">HC-SR04</text>

  <!-- Pin labels -->
  <g class="pin-label" font-size="18">
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" transform="translate(304 222) rotate(-90)">Vcc</text>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" transform="translate(344 220) rotate(-90)">TRIG</text>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" transform="translate(386 220) rotate(-90)">ECHO</text>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" transform="translate(428 221) rotate(-90)">GND</text>
  </g>

  <!-- Contact pads -->
  <g>
    <g transform="translate(307 286)">
      <rect x="-12" y="-20" width="24" height="40" rx="12" fill="#999999"/>
      <ellipse cx="0" cy="0" rx="6.5" ry="8" fill="#CCCCCC"/>
    </g>
    <g transform="translate(347 286)">
      <rect x="-12" y="-20" width="24" height="40" rx="12" fill="#999999"/>
      <ellipse cx="0" cy="0" rx="6.5" ry="8" fill="#CCCCCC"/>
    </g>
    <g transform="translate(388 286)">
      <rect x="-12" y="-20" width="24" height="40" rx="12" fill="#999999"/>
      <ellipse cx="0" cy="0" rx="6.5" ry="8" fill="#CCCCCC"/>
    </g>
    <g transform="translate(429 286)">
      <rect x="-12" y="-20" width="24" height="40" rx="12" fill="#999999"/>
      <ellipse cx="0" cy="0" rx="6.5" ry="8" fill="#CCCCCC"/>
    </g>
  </g>

  <!-- Metal pins -->
  <g fill="#CCCCCC">
    <rect x="302" y="327" width="10" height="87" rx="5"/>
    <rect x="342" y="327" width="10" height="87" rx="5"/>
    <rect x="383" y="327" width="10" height="87" rx="5"/>
    <rect x="424" y="327" width="10" height="87" rx="5"/>
  </g>

  <!-- Corner marks -->
  <g class="small-text">
    <text x="61" y="317" text-anchor="middle" font-size="58">T</text>
    <path d="M50 275 H68" stroke="#777777" stroke-width="6" stroke-linecap="round"/>
    <text x="668" y="317" text-anchor="middle" font-size="58">R</text>
  </g>
</svg>
