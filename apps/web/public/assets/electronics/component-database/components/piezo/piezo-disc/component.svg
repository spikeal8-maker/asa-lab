    <circle cx="120" cy="96" r="66" fill="url(#brassGrad)"/>
    <circle cx="120" cy="96" r="63" stroke="#937424" stroke-width="2"/>
    <circle cx="120" cy="96" r="46" fill="url(#ceramicGrad)" stroke="#D2CCBC" stroke-width="2"/>
    <path d="M82 56C92 46 106 41 121 41" stroke="#E0CA84" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <circle cx="100" cy="124" r="6.8" fill="#BFC2C6" stroke="#8C8F95" stroke-width="1.7"/>
    <circle cx="141" cy="118" r="6.8" fill="#BFC2C6" stroke="#8C8F95" stroke-width="1.7"/>
    <path d="M100 131C98 148 93 171 88 196" stroke="#D75850" stroke-width="4" stroke-linecap="round"/>
    <path d="M141 125C146 144 151 168 156 196" stroke="#41444B" stroke-width="4" stroke-linecap="round"/>
  </g>
