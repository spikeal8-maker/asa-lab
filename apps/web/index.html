<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B3558" />
    <link rel="icon" type="image/svg+xml" href="/asa-lab-mark.svg" />
    <title>ASA Lab — проекты и учебные среды</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const recoveryKey = 'asa-vite-preload-recovery';
        window.addEventListener('vite:preloadError', (event) => {
          event.preventDefault();
          const now = Date.now();
          const previousAttempt = Number.parseInt(sessionStorage.getItem(recoveryKey) ?? '0', 10);
          if (Number.isFinite(previousAttempt) && now - previousAttempt < 10_000) return;
          sessionStorage.setItem(recoveryKey, String(now));
          window.location.reload();
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
