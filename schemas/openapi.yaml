openapi: 3.1.0
info:
  title: ASA Lab Control Plane API
  version: 0.5.0
  description: >-
    Account and Portal contract: health probes, universal account session,
    capability-aware workspace context, scoped administrative control plane
    and classroom create/list. Tenant, capability, active workspace and
    administrative grants are derived exclusively from the server-side session.
servers:
  - url: http://127.0.0.1:4611
    description: Local development
paths:
  /health/live:
    get:
      operationId: getHealthLive
      summary: Liveness probe
      responses:
        '200':
          description: Service process is live
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveResponse'
  /health/ready:
    get:
      operationId: getHealthReady
      summary: Readiness probe (PostgreSQL SELECT 1)
      responses:
        '200':
          description: Database is reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: Database is not reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /api/auth/register:
    post:
      operationId: postAuthRegister
      summary: Register an adult Account and establish its Personal Workspace session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account and session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email or username is already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Registration is routed to a child-safe flow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/login:
    post:
      operationId: postAuthLogin
      summary: Universal Account or compatibility organization login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session established
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid workspace, email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/max/config:
    get:
      operationId: getMaxAuthConfig
      summary: Public MAX mini-app launch configuration without credentials
      responses:
        '200':
          description: MAX availability and launch URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaxAuthConfig'
  /api/auth/max/session:
    post:
      operationId: postMaxAuthSession
      summary: Establish a session from fresh server-validated MAX WebApp data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaxInitDataRequest'
      responses:
        '200':
          description: Linked account session established
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          description: MAX signature is invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Account linking is required or the assertion was replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: MAX authentication is not configured or temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/max/link:
    post:
      operationId: postMaxAuthLink
      summary: Link fresh MAX WebApp data to the active ASA Lab account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaxInitDataRequest'
      responses:
        '200':
          description: MAX identity linked to the active account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaxLinkResponse'
        '401':
          description: No active ASA Lab session or invalid MAX signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The MAX identity or account is already linked elsewhere
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/logout:
    post:
      operationId: postAuthLogout
      summary: Revoke the current session
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok]
                properties:
                  ok:
                    type: boolean
  /api/auth/me:
    get:
      operationId: getAuthMe
      summary: Current session user
      responses:
        '200':
          description: Active session or an explicit anonymous state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatusEnvelope'
        '401':
          description: Invalid or expired session token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/session/context:
    post:
      operationId: postSessionContext
      summary: Switch to a server-authorized workspace without changing capabilities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchWorkspaceRequest'
      responses:
        '201':
          description: Active workspace changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveWorkspaceEnvelope'
        '400':
          description: Invalid workspace identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Workspace is unavailable for this Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/v1/me:
    get:
      operationId: getAdminMe
      summary: Resolve server-owned administrative scopes for the current session
      responses:
        '200':
          description: Administrative principal and its exact scopes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMeEnvelope'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account has no administrative grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/v1/scopes:
    get:
      operationId: getAdminScopes
      summary: List the exact platform and organization scopes available to the administrator
      responses:
        '200':
          description: Administrative scope collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminScopesEnvelope'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account has no administrative grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/v1/audit-events:
    get:
      operationId: getAdminAuditEvents
      summary: Read the append-only audit trail within an authorized administrative scope
      parameters:
        - name: scopeKind
          in: query
          required: true
          schema:
            type: string
            enum: [platform, organization]
        - name: scopeId
          in: query
          required: false
          description: Required only for an organization scope; forbidden for platform.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: before
          in: query
          required: false
          description: Stable cursor timestamp; must be paired with beforeId.
          schema:
            type: string
            format: date-time
        - name: beforeId
          in: query
          required: false
          description: Stable cursor UUID; must be paired with before.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Authorized audit page; the privileged read is itself audited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuditPage'
        '400':
          description: Invalid scope, page limit or cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The requested administrative scope is not granted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/classrooms:
    get:
      operationId: getClassrooms
      summary: List personal, organization and co-taught classrooms for the educator account
      responses:
        '200':
          description: Classroom collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomCollection'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: postClassrooms
      summary: Create a class immediately; a school workspace is optional
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            Mandatory. A repeat with the same key and the same payload returns
            the existing classroom; the same key with a different payload is
            rejected with 409 idempotency_conflict. Keys longer than 128
            characters are rejected, never truncated.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9._:-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClassroomRequest'
      responses:
        '201':
          description: Classroom created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomEnvelope'
        '200':
          description: Idempotent repeat — the existing classroom is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomEnvelope'
        '400':
          description: >-
            Validation error: malformed body, additional properties, any
            client-supplied tenant identifier, or a missing/invalid
            Idempotency-Key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            Explicit conflict: idempotency_conflict (same key, different
            payload), or an unavailable personal teaching context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/classrooms/{classroomId}:
    parameters:
      - name: classroomId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getClassroomWorkspace
      summary: Open an owner- or co-teacher-authorized classroom workspace
      responses:
        '200':
          description: Classroom workspace header and safety state
          content:
            application/json:
              schema:
                type: object
                required: [classroom]
                properties:
                  classroom: { $ref: '#/components/schemas/Classroom' }
        '404':
          description: Classroom is unavailable to the educator
    patch:
      operationId: patchClassroomDetails
      summary: Correct a classroom's name, age band, topics and safe-mode default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassroomDetailsRequest' }
      responses:
        '200':
          description: Updated classroom
          content:
            application/json:
              schema:
                type: object
                required: [classroom]
                properties:
                  classroom: { $ref: '#/components/schemas/Classroom' }
        '400':
          description: Validation error
        '404':
          description: Classroom is unavailable to the educator
  /api/classrooms/{classroomId}/status:
    parameters:
      - name: classroomId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: postClassroomStatus
      summary: Archive a classroom, restore it, or remove it from every list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, archived, deleted]
      responses:
        '200':
          description: >-
            The classroom in its new state, or an acknowledgement that it was
            removed. Removal keeps the rows: learner work and the audit trail
            survive, and the class stops being listed or joinable.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties: false
                    required: [classroom]
                    properties:
                      classroom: { $ref: '#/components/schemas/Classroom' }
                  - type: object
                    additionalProperties: false
                    required: [removed]
                    properties:
                      removed: { type: boolean, const: true }
        '400':
          description: Unknown status
        '403':
          description: Only the owning teacher may remove a classroom
        '404':
          description: Classroom is unavailable to the educator
  /api/classrooms/{classroomId}/roster:
    parameters:
      - name: classroomId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getClassroomRoster
      summary: List teacher-authorized StudentSeats without exposing passwords
      responses:
        '200':
          description: Classroom roster
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ClassroomStudentSeat' }
  /api/classrooms/{classroomId}/seats:
    parameters:
      - name: classroomId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: postClassroomStudentSeat
      summary: Create an email-free StudentSeat
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStudentSeatRequest' }
      responses:
        '201':
          description: StudentSeat created and its assigned handle returned
  /api/classrooms/{classroomId}/seats/batch:
    parameters:
      - name: classroomId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: postClassroomStudentSeatsBatch
      summary: Create 1 to 100 StudentSeats with deterministic per-row results
      responses:
        '200': { description: Batch result }
  /api/classrooms/{classroomId}/seats/{seatId}:
    parameters:
      - name: classroomId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: seatId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: patchClassroomStudentSeat
      summary: Rename, protect, suspend or reactivate a StudentSeat
      responses:
        '200': { description: Updated StudentSeat }
    delete:
      operationId: deleteClassroomStudentSeat
      summary: Remove a StudentSeat and revoke its active sessions
      responses:
        '200': { description: StudentSeat removed }
  /api/classrooms/{classroomId}/policies:
    parameters:
      - name: classroomId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: patchClassroomPolicy
      summary: Change the class-wide Safe Mode policy
      responses:
        '200': { description: Classroom policy updated }
  /api/classrooms/{classroomId}/join-code/rotate:
    parameters:
      - name: classroomId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: rotateClassroomJoinCode
      summary: Revoke the previous code and issue a new deterministic code
      responses:
        '200': { description: New class code issued }
  /api/classrooms/{classroomId}/join-code:
    parameters:
      - name: classroomId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: revokeClassroomJoinCode
      summary: Close new StudentSeat sign-in for the classroom
      responses:
        '200': { description: Class code revoked }
  /api/classrooms/{classroomId}/teachers:
    parameters:
      - name: classroomId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getClassroomTeachers
      summary: List the primary teacher, co-teachers and pending owner invitations
      responses:
        '200':
          description: Teaching team visible to every teacher in the class
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassroomTeacherTeam' }
        '404': { description: Classroom is unavailable to the educator }
  /api/classrooms/{classroomId}/teacher-invitations:
    parameters:
      - name: classroomId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: createClassroomTeacherInvitation
      summary: Create a single-use seven-day co-teacher invitation link
      responses:
        '201':
          description: Invitation link created by the primary teacher
          content:
            application/json:
              schema:
                type: object
                required: [invitation]
                properties:
                  invitation: { $ref: '#/components/schemas/ClassroomTeacherInvitationWithPath' }
        '403': { description: Only the primary teacher can invite colleagues }
        '409': { description: The five co-teacher and pending-invitation slots are full }
  /api/classrooms/{classroomId}/teacher-invitations/{invitationId}:
    parameters:
      - name: classroomId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: invitationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: revokeClassroomTeacherInvitation
      summary: Revoke an unused co-teacher invitation
      responses:
        '200': { description: Invitation revoked }
        '404': { description: Pending invitation not found }
  /api/classrooms/{classroomId}/teachers/{teacherAccountId}:
    parameters:
      - name: classroomId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: teacherAccountId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: removeClassroomCoTeacher
      summary: Remove a co-teacher without deleting their account or projects
      responses:
        '200': { description: Co-teacher access removed }
        '404': { description: Co-teacher not found }
  /api/classroom-teacher-invitations/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string, minLength: 24, maxLength: 128 }
    get:
      operationId: resolveClassroomTeacherInvitation
      summary: Resolve the minimal public preview for a co-teacher invitation
      responses:
        '200':
          description: Invitation preview
          content:
            application/json:
              schema:
                type: object
                required: [invitation]
                properties:
                  invitation: { $ref: '#/components/schemas/ClassroomTeacherInvitationPreview' }
        '404': { description: Invitation not found }
  /api/classroom-teacher-invitations/{token}/accept:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string, minLength: 24, maxLength: 128 }
    post:
      operationId: acceptClassroomTeacherInvitation
      summary: Accept a single-use invitation as an educator account
      responses:
        '200': { description: Co-teacher membership created }
        '403': { description: The signed-in account is not an educator }
        '410': { description: Invitation expired, was revoked or was already used }
  /api/class-join/resolve:
    post:
      operationId: resolveClassroomJoinCode
      summary: Resolve a normalized class code without roster enumeration
      responses:
        '200': { description: Minimal class identity preview }
        '404': { description: Generic class-not-found response }
  /api/class-join/studentseat:
    post:
      operationId: signInClassroomStudentSeat
      summary: Sign in with class code and teacher-assigned handle, without email
      responses:
        '200': { description: HttpOnly StudentSeat session created }
        '401': { description: Generic invalid class credentials response }
        '429': { description: Attempt limit reached }
  /api/class-join/me:
    get:
      operationId: getClassroomStudentSession
      summary: Resolve the current StudentSeat session
      responses:
        '200': { description: StudentSeat session state }
  /api/class-join/logout:
    post:
      operationId: logoutClassroomStudentSeat
      summary: Revoke the current StudentSeat session
      responses:
        '200': { description: Session revoked }
  /api/projects:
    get:
      operationId: getProjects
      summary: List projects visible to the active workspace actor
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [personal, classroom]
        - name: classroomId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ProjectStatus'
      responses:
        '200':
          description: Project collection filtered by lifecycle state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCollection'
        '400':
          description: Invalid filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: postProject
      summary: Create a project and its initial draft atomically
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEnvelope'
        '200':
          description: Idempotent repeat returned the existing project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEnvelope'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency key was reused with a different payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProject
      summary: Open the project draft and immutable version history
      responses:
        '200':
          description: Project workbench payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenProjectEnvelope'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project is unavailable to the active actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: patchProject
      summary: Rename a project that is not in trash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameProjectRequest'
      responses:
        '200':
          description: Project renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectOnlyEnvelope'
        '400':
          description: Invalid title
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project is unavailable to the active actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/projects/{projectId}/duplicate:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: postProjectDuplicate
      summary: Duplicate a project with its current draft
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameProjectRequest'
      responses:
        '201':
          description: Duplicate created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEnvelope'
        '200':
          description: Idempotent repeat returned the existing duplicate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEnvelope'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Source project is unavailable to the active actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency key was reused with a different payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/projects/{projectId}/status:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: postProjectStatus
      summary: Archive, trash or restore a project through an allowed transition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeProjectStatusRequest'
      responses:
        '201':
          description: Lifecycle state changed without deleting project data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectOnlyEnvelope'
        '400':
          description: Invalid lifecycle transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project is unavailable to the active actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
  schemas:
    LiveResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [live]
    ReadyResponse:
      type: object
      additionalProperties: false
      required: [status, dependencies]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        dependencies:
          type: object
          additionalProperties: false
          required: [database]
          properties:
            database:
              type: string
              enum: [up, down]
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    AdminPermission:
      type: string
      enum:
        - administration.open
        - administration.scopes.read
        - administration.audit.read
        - administration.accounts.read
        - administration.organizations.read
        - administration.security.read
        - administration.moderation.read
        - administration.billing.read
        - administration.operations.read
    AdminScope:
      type: object
      additionalProperties: false
      required: [kind, id, title, role, permissions]
      properties:
        kind:
          type: string
          enum: [platform, organization]
        id:
          type: [string, 'null']
          format: uuid
        title:
          type: string
        role:
          type: string
          enum: [platform_admin, owner, school_admin, moderator, billing_admin]
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AdminPermission'
    AdminMeEnvelope:
      type: object
      additionalProperties: false
      required: [administrator, principalId, accountId, displayName, activeWorkspaceId, scopes]
      properties:
        administrator:
          type: boolean
          const: true
        principalId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        displayName:
          type: string
        activeWorkspaceId:
          type: string
          format: uuid
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/AdminScope'
    AdminScopesEnvelope:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminScope'
    AdminAuditEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - occurredAt
        - actorPrincipalId
        - actorRole
        - scopeKind
        - scopeId
        - action
        - targetType
        - targetId
        - reasonCode
        - reasonText
        - ticketId
        - requestId
        - result
        - beforeVersion
        - afterVersion
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        actorPrincipalId:
          type: string
          format: uuid
        actorRole:
          type: string
        scopeKind:
          type: string
          enum: [platform, organization]
        scopeId:
          type: [string, 'null']
          format: uuid
        action:
          type: string
        targetType:
          type: [string, 'null']
        targetId:
          type: [string, 'null']
        reasonCode:
          type: [string, 'null']
        reasonText:
          type: [string, 'null']
        ticketId:
          type: [string, 'null']
        requestId:
          type: string
        result:
          type: string
          enum: [allowed, denied, succeeded, failed]
        beforeVersion:
          type: [integer, 'null']
          format: int64
        afterVersion:
          type: [integer, 'null']
          format: int64
    AdminAuditCursor:
      type: object
      additionalProperties: false
      required: [occurredAt, id]
      properties:
        occurredAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
    AdminAuditPage:
      type: object
      additionalProperties: false
      required: [items, next]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminAuditEvent'
        next:
          oneOf:
            - $ref: '#/components/schemas/AdminAuditCursor'
            - type: 'null'
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, username, birthDate, country]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
        username:
          type: string
          minLength: 3
          maxLength: 36
        displayName:
          type: string
          maxLength: 120
        birthDate:
          type: string
          format: date
        country:
          type: string
          minLength: 2
          maxLength: 2
    LoginRequest:
      oneOf:
        - $ref: '#/components/schemas/AccountLoginRequest'
        - $ref: '#/components/schemas/OrganizationLoginRequest'
    MaxAuthConfig:
      type: object
      additionalProperties: false
      required: [enabled, launchUrl]
      properties:
        enabled:
          type: boolean
        launchUrl:
          type: [string, 'null']
          format: uri
    MaxInitDataRequest:
      type: object
      additionalProperties: false
      required: [initData]
      properties:
        initData:
          type: string
          minLength: 1
          maxLength: 16384
    MaxLinkResponse:
      type: object
      additionalProperties: false
      required: [linked]
      properties:
        linked:
          type: boolean
          const: true
    AccountLoginRequest:
      type: object
      additionalProperties: false
      required: [password]
      anyOf:
        - required: [identifier]
        - required: [email]
      properties:
        identifier:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    OrganizationLoginRequest:
      type: object
      additionalProperties: false
      required: [workspace, email, password]
      properties:
        workspace:
          type: string
          description: Compatibility organization locator used only during authentication.
          minLength: 3
          maxLength: 64
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    UserEnvelope:
      type: object
      additionalProperties: false
      required:
        [
          authenticated,
          user,
          account,
          capabilities,
          workspaces,
          activeWorkspace,
          navigation,
          timeZone,
        ]
      properties:
        authenticated:
          type: boolean
          const: true
        user:
          $ref: '#/components/schemas/PublicAccount'
        account:
          $ref: '#/components/schemas/PublicAccount'
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
        activeWorkspace:
          $ref: '#/components/schemas/ActiveWorkspace'
        navigation:
          $ref: '#/components/schemas/PortalNavigation'
        timeZone:
          description: >-
            IANA zone the account keeps time in. Every date shown about a class
            is rendered in it. Null until a browser has reported one.
          type: [string, 'null']
          maxLength: 64
    SessionStatusEnvelope:
      oneOf:
        - $ref: '#/components/schemas/UserEnvelope'
        - $ref: '#/components/schemas/AnonymousSessionEnvelope'
    AnonymousSessionEnvelope:
      type: object
      additionalProperties: false
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
          const: false
    PublicAccount:
      type: object
      additionalProperties: false
      required: [id, displayName, email]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
    Capability:
      type: object
      additionalProperties: false
      required: [capability, state]
      properties:
        capability:
          type: string
        state:
          type: string
    Workspace:
      type: object
      additionalProperties: false
      required: [workspaceId, kind, title, role]
      properties:
        workspaceId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [personal, organization]
        title:
          type: string
        role:
          type: string
    ActiveWorkspace:
      type: object
      additionalProperties: false
      required: [workspaceId, kind]
      properties:
        workspaceId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [personal, organization]
    PortalNavigation:
      type: object
      additionalProperties: false
      required: [classes, classroomManagement]
      properties:
        classes:
          type: boolean
        classroomManagement:
          type: boolean
    SwitchWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [workspaceId]
      properties:
        workspaceId:
          type: string
          format: uuid
    ActiveWorkspaceEnvelope:
      type: object
      additionalProperties: false
      required: [activeWorkspace]
      properties:
        activeWorkspace:
          $ref: '#/components/schemas/ActiveWorkspace'
    CreateClassroomRequest:
      type: object
      additionalProperties: false
      required: [title, ageBand, topicKeys, safeModeDefault]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        ageBand:
          type: string
          enum: ['6-8', '9-10', '11-12', '13-15', '16-18', mixed]
        topicKeys:
          type: array
          maxItems: 12
          items:
            type: string
            pattern: '^[a-z0-9-]{1,32}$'
        safeModeDefault:
          type: boolean
    ClassroomDetailsRequest:
      description: >-
        Every field is optional: a teacher fixing a name should not have to
        restate the age band. Anything omitted keeps its stored value.
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        ageBand:
          type: string
          enum: ['6-8', '9-10', '11-12', '13-15', '16-18', mixed]
        topicKeys:
          type: array
          maxItems: 12
          items:
            type: string
            pattern: '^[a-z0-9-]{1,32}$'
        safeModeDefault:
          type: boolean
    Classroom:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - status
        - ageBand
        - topicKeys
        - safeModeDefault
        - studentCount
        - joinCodeVersion
        - joinCodeStatus
        - joinCode
        - teacherRole
        - workspaceKind
        - workspaceTitle
        - createdAt
        - archivedAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          description: >-
            active while the class is running, archived once it is put away.
            A removed class is never returned.
          type: string
          enum: [active, archived]
        ageBand:
          type: string
          enum: ['6-8', '9-10', '11-12', '13-15', '16-18', mixed]
        topicKeys:
          type: array
          items: { type: string }
        safeModeDefault:
          type: boolean
        studentCount:
          type: integer
          minimum: 0
        joinCodeVersion:
          type: [integer, 'null']
        joinCodeStatus:
          type: [string, 'null']
          enum: [active, revoked, null]
        joinCode:
          type: [string, 'null']
          pattern: '^[A-Z2-9]{3} [A-Z2-9]{3} [A-Z2-9]{3}$'
        teacherRole:
          type: string
          enum: [owner, co_teacher]
        workspaceKind:
          type: string
          enum: [personal, organization]
        workspaceTitle:
          type: string
        createdAt:
          type: string
          format: date-time
        archivedAt:
          description: When the class was put away; null while it is running.
          type: [string, 'null']
          format: date-time
    ClassroomTeacher:
      type: object
      additionalProperties: false
      required: [accountId, displayName, avatarDataUrl, role, joinedAt]
      properties:
        accountId: { type: string, format: uuid }
        displayName: { type: string }
        avatarDataUrl: { type: [string, 'null'] }
        role:
          type: string
          enum: [owner, co_teacher]
        joinedAt: { type: string, format: date-time }
    ClassroomTeacherInvitation:
      type: object
      additionalProperties: false
      required: [id, status, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, accepted, expired]
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    ClassroomTeacherInvitationWithPath:
      allOf:
        - $ref: '#/components/schemas/ClassroomTeacherInvitation'
        - type: object
          required: [invitePath]
          properties:
            invitePath: { type: string }
    ClassroomTeacherInvitationPreview:
      type: object
      additionalProperties: false
      required: [classroomId, classroomTitle, ownerDisplayName, status, expiresAt]
      properties:
        classroomId: { type: string, format: uuid }
        classroomTitle: { type: string }
        ownerDisplayName: { type: string }
        status:
          type: string
          enum: [pending, accepted, revoked, expired]
        expiresAt: { type: string, format: date-time }
    ClassroomTeacherTeam:
      type: object
      additionalProperties: false
      required: [items, invitations]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ClassroomTeacher' }
        invitations:
          type: array
          items: { $ref: '#/components/schemas/ClassroomTeacherInvitation' }
    CreateStudentSeatRequest:
      type: object
      additionalProperties: false
      required: [displayLabel, safeMode]
      properties:
        displayLabel: { type: string, minLength: 1, maxLength: 120 }
        loginHandle:
          type: string
          pattern: '^[a-z0-9._-]{3,32}$'
        safeMode: { type: boolean }
    ClassroomStudentSeat:
      type: object
      additionalProperties: false
      required: [id, displayLabel, loginHandle, safeMode, status, lastActiveAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        displayLabel: { type: string }
        loginHandle: { type: string }
        safeMode: { type: boolean }
        status:
          type: string
          enum: [issued, active, suspended]
        lastActiveAt:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
    ClassroomEnvelope:
      type: object
      additionalProperties: false
      required: [classroom, created]
      properties:
        classroom:
          $ref: '#/components/schemas/Classroom'
        created:
          type: boolean
    ClassroomCollection:
      type: object
      additionalProperties: false
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Classroom'
        meta:
          type: object
          additionalProperties: false
          required: [total]
          properties:
            total:
              type: integer
    ProjectStatus:
      type: string
      enum: [active, archived, trashed]
    Project:
      type: object
      additionalProperties: false
      required: [id, scope, classroomId, moduleKey, title, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        scope:
          type: string
          enum: [personal, classroom]
        classroomId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        moduleKey:
          type: string
        title:
          type: string
        status:
          $ref: '#/components/schemas/ProjectStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProjectCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
    ProjectEnvelope:
      type: object
      additionalProperties: false
      required: [project, created]
      properties:
        project:
          $ref: '#/components/schemas/Project'
        created:
          type: boolean
    ProjectOnlyEnvelope:
      type: object
      additionalProperties: false
      required: [project]
      properties:
        project:
          $ref: '#/components/schemas/Project'
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [scope, classroomId, module, title]
      properties:
        scope:
          type: string
          enum: [personal, classroom]
        classroomId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        module:
          type: string
        title:
          type: string
          minLength: 1
          maxLength: 255
    RenameProjectRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
    ChangeProjectStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/ProjectStatus'
    ProjectDraft:
      type: object
      required: [projectId, document, revision, updatedAt]
      properties:
        projectId:
          type: string
          format: uuid
        document: {}
        revision:
          type: integer
        updatedAt:
          type: string
          format: date-time
    ProjectVersion:
      type: object
      additionalProperties: false
      required: [id, projectId, versionNo, label, createdAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        versionNo:
          type: integer
        label:
          oneOf:
            - type: string
            - type: 'null'
        createdAt:
          type: string
          format: date-time
    OpenProjectEnvelope:
      type: object
      additionalProperties: false
      required: [project, draft, versions, result]
      properties:
        project:
          $ref: '#/components/schemas/Project'
        draft:
          $ref: '#/components/schemas/ProjectDraft'
        versions:
          type: array
          items:
            $ref: '#/components/schemas/ProjectVersion'
        result: {}
