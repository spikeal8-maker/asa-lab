  '/api/courses/{courseId}/publish':
    {
      'parameters':
        [
          {
            'name': 'courseId',
            'in': 'path',
            'required': true,
            'schema': { 'type': 'string', 'format': 'uuid' },
          },
        ],
      'post':
        {
          'operationId': 'publishAuthorCourse',
          'summary': 'Pin exact published dependencies, reject empty or invalid course, idempotent request',
          'requestBody':
            {
              'required': true,
              'content':
                {
                  'application/json':
                    {
                      'schema':
                        {
                          'type': 'object',
                          'additionalProperties': false,
                          'properties':
                            {
                              'expectedRevision': { 'type': 'integer', 'minimum': 1 },
                              'requestId':
                                { 'type': 'string', 'pattern': '^[A-Za-z0-9._:-]{8,128}$' },
                            },
                          'required': ['expectedRevision', 'requestId'],
                        },
                    },
                },
            },
          'responses':
            {
              '201':
                {
                  'description': 'Scoped success',
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'type': 'object',
                              'additionalProperties': false,
                              'properties':
                                {
                                  'versionId': { 'type': 'string', 'format': 'uuid' },
                                  'versionNumber': { 'type': 'integer', 'minimum': 1 },
                                  'publishedAt': { 'type': 'string', 'format': 'date-time' },
                                  'reused': { 'type': 'boolean' },
                                },
                              'required': ['versionId', 'versionNumber', 'publishedAt', 'reused'],
                            },
                        },
                    },
                },
              '400': { 'description': 'Invalid request' },
              '401': { 'description': 'Current session required' },
              '403': { 'description': 'Capability or workspace denied' },
              '404': { 'description': 'Resource unavailable' },
              '409':
                { 'description': 'Version, state or request conflict; no partial publication' },
            },
        },
    }
  '/api/courses/{courseId}/outline':
    {
      'parameters':
        [
          {
            'name': 'courseId',
            'in': 'path',
            'required': true,
            'schema': { 'type': 'string', 'format': 'uuid' },
          },
        ],
      'get':
        {
          'operationId': 'getAuthorCourseOutline',
          'summary': 'Current author outline and draft revision; preview creates no Attempt',
          'responses':
            {
              '200':
                {
                  'description': 'Scoped success',
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'type': 'object',
                              'additionalProperties': false,
                              'properties':
                                {
                                  'draftRevision': { 'type': 'integer', 'minimum': 1 },
                                  'sections':
                                    {
                                      'type': 'array',
                                      'items': { 'type': 'object', 'additionalProperties': true },
                                    },
                                },
                              'required': ['draftRevision', 'sections'],
                            },
                        },
                    },
                },
              '400': { 'description': 'Invalid request' },
              '401': { 'description': 'Current session required' },
              '403': { 'description': 'Capability or workspace denied' },
              '404': { 'description': 'Resource unavailable' },
              '409':
                { 'description': 'Version, state or request conflict; no partial publication' },
            },
        },
    }
  '/api/courses/{courseId}/sections':
    {
      'parameters':
        [
          {
            'name': 'courseId',
            'in': 'path',
            'required': true,
            'schema': { 'type': 'string', 'format': 'uuid' },
          },
        ],
      'post':
        {
          'operationId': 'createLearningCoursesections',
          'summary': 'Add to existing course outline under expected draft revision',
          'requestBody':
            {
              'required': true,
              'content':
                {
                  'application/json':
                    { 'schema': { '$ref': '#/components/schemas/LearningCourseSectionRequest' } },
                },
            },
          'responses':
            {
              '201':
                {
                  'description': 'Scoped success',
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'type': 'object',
                              'additionalProperties': false,
                              'properties': { 'id': { 'type': 'string', 'format': 'uuid' } },
                              'required': ['id'],
                            },
                        },
                    },
                },
              '400': { 'description': 'Invalid request' },
