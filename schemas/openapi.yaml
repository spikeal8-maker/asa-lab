openapi: 3.1.0
info:
  title: ASA Lab Control Plane API
  version: 0.3.0
  description: >-
    Account and Portal contract: health probes, universal account session,
    capability-aware workspace context and classroom create/list. Tenant,
    capability and active workspace are derived exclusively from the
    server-side session.
servers:
  - url: http://127.0.0.1:4611
    description: Local development
paths:
  /health/live:
    get:
      operationId: getHealthLive
      summary: Liveness probe
      responses:
        '200':
          description: Service process is live
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveResponse'
  /health/ready:
    get:
      operationId: getHealthReady
      summary: Readiness probe (PostgreSQL SELECT 1)
      responses:
        '200':
          description: Database is reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: Database is not reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /api/auth/register:
    post:
      operationId: postAuthRegister
      summary: Register an adult Account and establish its Personal Workspace session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account and session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email or username is already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Registration is routed to a child-safe flow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/login:
    post:
      operationId: postAuthLogin
      summary: Universal Account or compatibility organization login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session established
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid workspace, email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/logout:
    post:
      operationId: postAuthLogout
      summary: Revoke the current session
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok]
                properties:
                  ok:
                    type: boolean
  /api/auth/me:
    get:
      operationId: getAuthMe
      summary: Current session user
      responses:
        '200':
          description: Active session or an explicit anonymous state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatusEnvelope'
        '401':
          description: Invalid or expired session token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/session/context:
    post:
      operationId: postSessionContext
      summary: Switch to a server-authorized workspace without changing capabilities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchWorkspaceRequest'
      responses:
        '201':
          description: Active workspace changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveWorkspaceEnvelope'
        '400':
          description: Invalid workspace identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Workspace is unavailable for this Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/classrooms:
    get:
      operationId: getClassrooms
      summary: List classrooms owned by the session teacher
      responses:
        '200':
          description: Classroom collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomCollection'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: postClassrooms
      summary: Create a classroom (atomic with owner membership and audit event)
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            Mandatory. A repeat with the same key and the same payload returns
            the existing classroom; the same key with a different payload is
            rejected with 409 idempotency_conflict. Keys longer than 128
            characters are rejected, never truncated.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9._:-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClassroomRequest'
      responses:
        '201':
          description: Classroom created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomEnvelope'
        '200':
          description: Idempotent repeat — the existing classroom is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomEnvelope'
        '400':
          description: >-
            Validation error: malformed body, additional properties, any
            client-supplied tenant identifier, or a missing/invalid
            Idempotency-Key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            Explicit conflict: idempotency_conflict (same key, different
            payload), no_school_assigned or no_active_period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    LiveResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [live]
    ReadyResponse:
      type: object
      additionalProperties: false
      required: [status, dependencies]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        dependencies:
          type: object
          additionalProperties: false
          required: [database]
          properties:
            database:
              type: string
              enum: [up, down]
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, username, birthDate, country]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
        username:
          type: string
          minLength: 3
          maxLength: 36
        displayName:
          type: string
          maxLength: 120
        birthDate:
          type: string
          format: date
        country:
          type: string
          minLength: 2
          maxLength: 2
    LoginRequest:
      oneOf:
        - $ref: '#/components/schemas/AccountLoginRequest'
        - $ref: '#/components/schemas/OrganizationLoginRequest'
    AccountLoginRequest:
      type: object
      additionalProperties: false
      required: [password]
      anyOf:
        - required: [identifier]
        - required: [email]
      properties:
        identifier:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    OrganizationLoginRequest:
      type: object
      additionalProperties: false
      required: [workspace, email, password]
      properties:
        workspace:
          type: string
          description: Compatibility organization locator used only during authentication.
          minLength: 3
          maxLength: 64
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    UserEnvelope:
      type: object
      additionalProperties: false
      required:
        [authenticated, user, account, capabilities, workspaces, activeWorkspace, navigation]
      properties:
        authenticated:
          type: boolean
          const: true
        user:
          $ref: '#/components/schemas/PublicAccount'
        account:
          $ref: '#/components/schemas/PublicAccount'
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
        activeWorkspace:
          $ref: '#/components/schemas/ActiveWorkspace'
        navigation:
          $ref: '#/components/schemas/PortalNavigation'
    SessionStatusEnvelope:
      oneOf:
        - $ref: '#/components/schemas/UserEnvelope'
        - $ref: '#/components/schemas/AnonymousSessionEnvelope'
    AnonymousSessionEnvelope:
      type: object
      additionalProperties: false
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
          const: false
    PublicAccount:
      type: object
      additionalProperties: false
      required: [id, displayName, email]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
    Capability:
      type: object
      additionalProperties: false
      required: [capability, state]
      properties:
        capability:
          type: string
        state:
          type: string
    Workspace:
      type: object
      additionalProperties: false
      required: [workspaceId, kind, title, role]
      properties:
        workspaceId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [personal, organization]
        title:
          type: string
        role:
          type: string
    ActiveWorkspace:
      type: object
      additionalProperties: false
      required: [workspaceId, kind]
      properties:
        workspaceId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [personal, organization]
    PortalNavigation:
      type: object
      additionalProperties: false
      required: [classes, classroomManagement]
      properties:
        classes:
          type: boolean
        classroomManagement:
          type: boolean
    SwitchWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [workspaceId]
      properties:
        workspaceId:
          type: string
          format: uuid
    ActiveWorkspaceEnvelope:
      type: object
      additionalProperties: false
      required: [activeWorkspace]
      properties:
        activeWorkspace:
          $ref: '#/components/schemas/ActiveWorkspace'
    CreateClassroomRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
    Classroom:
      type: object
      additionalProperties: false
      required: [id, title, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
        createdAt:
          type: string
    ClassroomEnvelope:
      type: object
      additionalProperties: false
      required: [classroom, created]
      properties:
        classroom:
          $ref: '#/components/schemas/Classroom'
        created:
          type: boolean
    ClassroomCollection:
      type: object
      additionalProperties: false
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Classroom'
        meta:
          type: object
          additionalProperties: false
          required: [total]
          properties:
            total:
              type: integer
