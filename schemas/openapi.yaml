openapi: 3.1.0
info:
  title: ASA Lab Control Plane API
  version: 0.5.0
  description: >-
    Account and Portal contract: health probes, universal account session,
    capability-aware workspace context, scoped administrative control plane
    and classroom create/list. Tenant, capability, active workspace and
    administrative grants are derived exclusively from the server-side session.
servers:
  - url: http://127.0.0.1:4611
    description: Local development
paths:
  '/api/classrooms/{classroomId}/assignments/{assignmentId}/students/{seatId}/review-context':
    {
      'parameters':
        [
          {
            'name': 'classroomId',
            'in': 'path',
            'required': true,
            'schema': { 'type': 'string', 'format': 'uuid' },
          },
          {
            'name': 'assignmentId',
            'in': 'path',
            'required': true,
            'schema': { 'type': 'string', 'format': 'uuid' },
          },
          {
            'name': 'seatId',
            'in': 'path',
            'required': true,
            'schema': { 'type': 'string', 'format': 'uuid' },
          },
        ],
      'get':
        {
          'operationId': 'getTeacherLearningReviewContext',
          'summary': 'Exact Participation attempt history and immutable grading scale pin',
          'responses':
            {
              '200':
                {
                  'description': 'Scoped success',
                  'content':
                    {
                      'application/json':
                        {
                          'schema': { '$ref': '#/components/schemas/LearningTeacherReviewContext' },
                        },
                    },
                },
              '400': { 'description': 'Invalid request' },
              '401': { 'description': 'Current session required' },
              '403': { 'description': 'Capability or workspace denied' },
              '404': { 'description': 'Resource unavailable' },
              '409':
                { 'description': 'Version, state or request conflict; no partial publication' },
            },
        },
    }
  '/api/classrooms/{classroomId}/assignments/{assignmentId}/learners/{seatId}/legacy-review':
    {
      'parameters':
        [
          {
            'name': 'classroomId',
            'in': 'path',
            'required': true,
            'schema': { 'type': 'string', 'format': 'uuid' },
          },
          {
            'name': 'assignmentId',
            'in': 'path',
            'required': true,
            'schema': { 'type': 'string', 'format': 'uuid' },
          },
          {
            'name': 'seatId',
            'in': 'path',
            'required': true,
            'schema': { 'type': 'string', 'format': 'uuid' },
          },
        ],
      'get':
        {
          'operationId': 'getLegacyReviewContext',
          'summary': 'Only confirmed legacy evidence; unknown compatibility grading is never treated as a real scale',
          'responses':
            {
              '200':
                {
                  'description': 'Scoped success',
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'type': 'object',
                              'additionalProperties': false,
                              'properties':
                                {
                                  'attemptId': { 'type': 'string', 'format': 'uuid' },
                                  'state': { 'type': 'string' },
                                  'maxPoints': { 'type': ['integer', 'null'] },
                                  'submission':
                                    { 'type': ['object', 'null'], 'additionalProperties': true },
                                  'feedback': { 'type': ['string', 'null'] },
                                },
                              'required':
                                ['attemptId', 'state', 'maxPoints', 'submission', 'feedback'],
                            },
                        },
                    },
                },
              '400': { 'description': 'Invalid request' },
              '401': { 'description': 'Current session required' },
              '403': { 'description': 'Capability or workspace denied' },
              '404': { 'description': 'Resource unavailable' },
              '409':
                { 'description': 'Version, state or request conflict; no partial publication' },
            },
        },
    }
  '/api/classrooms/{classroomId}/grading-scheme':
    {
      'parameters':
        [
          {
            'name': 'classroomId',
            'in': 'path',
            'required': true,
            'schema': { 'type': 'string', 'format': 'uuid' },
          },
        ],
      'get':
        {
          'operationId': 'getLearningGradingScheme',
          'summary': 'Class default for future assignments; existing runs retain their pin',
          'responses':
            {
              '200':
                {
                  'description': 'Scoped success',
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'type': 'object',
                              'additionalProperties': false,
                              'properties':
                                {
                                  'title': { 'type': ['string', 'null'] },
                                  'version': { 'type': ['integer', 'null'] },
                                  'bands':
                                    {
                                      'type': 'array',
                                      'items':
                                        {
                                          'type': 'object',
                                          'additionalProperties': false,
                                          'properties':
                                            {
                                              'minBasisPoints':
                                                {
                                                  'type': 'integer',
                                                  'minimum': 0,
                                                  'maximum': 10000,
                                                },
                                              'label':
                                                {
                                                  'type': 'string',
                                                  'minLength': 1,
                                                  'maxLength': 24,
                                                },
                                            },
                                          'required': ['minBasisPoints', 'label'],
                                        },
                                    },
                                  'publishedAt': { 'type': 'string', 'format': 'date-time' },
                                },
                              'required': ['title', 'version', 'bands'],
                            },
                        },
                    },
                },
              '400': { 'description': 'Invalid request' },
              '401': { 'description': 'Current session required' },
              '403': { 'description': 'Capability or workspace denied' },
              '404': { 'description': 'Resource unavailable' },
              '409':
                { 'description': 'Version, state or request conflict; no partial publication' },
            },
        },
      'post':
        {
          'operationId': 'publishLearningGradingScheme',
          'summary': 'Publish immutable grade scale version with request replay',
          'requestBody':
            {
              'required': true,
              'content':
                {
                  'application/json':
                    {
                      'schema':
                        {
                          'type': 'object',
                          'additionalProperties': false,
                          'properties':
                            {
                              'title': { 'type': 'string', 'minLength': 1, 'maxLength': 120 },
                              'bands':
                                {
                                  'type': 'array',
                                  'minItems': 2,
                                  'maxItems': 10,
                                  'items':
                                    {
                                      'type': 'object',
                                      'additionalProperties': false,
                                      'properties':
                                        {
                                          'minBasisPoints':
                                            { 'type': 'integer', 'minimum': 0, 'maximum': 10000 },
                                          'label':
                                            { 'type': 'string', 'minLength': 1, 'maxLength': 24 },
                                        },
                                      'required': ['minBasisPoints', 'label'],
                                    },
                                },
                              'requestId':
                                { 'type': 'string', 'pattern': '^[A-Za-z0-9._:-]{8,128}$' },
                            },
                          'required': ['title', 'bands'],
                        },
                    },
                },
            },
          'responses':
            {
              '201':
                {
                  'description': 'Scoped success',
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'type': 'object',
                              'additionalProperties': false,
                              'properties':
                                {
                                  'id': { 'type': 'string', 'format': 'uuid' },
                                  'version': { 'type': 'integer', 'minimum': 1 },
                                },
                              'required': ['id', 'version'],
                            },
                        },
                    },
                },
              '400': { 'description': 'Invalid request' },
              '401': { 'description': 'Current session required' },
              '403': { 'description': 'Capability or workspace denied' },
              '404': { 'description': 'Resource unavailable' },
              '409':
                { 'description': 'Version, state or request conflict; no partial publication' },
            },
        },
    }
