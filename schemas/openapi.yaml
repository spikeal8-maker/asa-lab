          enum: [active, archived]
        ageBand:
          type: string
          enum: ['6-8', '9-10', '11-12', '13-15', '16-18', mixed]
        topicKeys:
          type: array
          items: { type: string }
        safeModeDefault:
          type: boolean
        studentCount:
