  /api/class-join/account/quizzes:
    get:
      operationId: getAccountLearnerQuizzes
      summary: List quizzes across active account seats with canonical learning state
      responses:
        '200':
          description: Active-account quiz projection without answer keys
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanonicalLearningItemCollection' }
  /api/class-join/me/results:
    get:
      operationId: getLearnerResults
      summary: List selected results and the current canonical workflow state
      responses:
        '200':
          description: Active-seat result projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanonicalLearningItemCollection' }
  /api/class-join/account/results:
    get:
      operationId: getAccountLearnerResults
      summary: List selected results across active account seats with canonical workflow state
      responses:
        '200':
          description: Active-account result projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanonicalLearningItemCollection' }
  /api/class-join/me/course-runs:
    get:
      operationId: getLearnerCourseRuns
      summary: List course runs with canonical state on assignment lessons
      responses:
        '200':
          description: Active-seat course projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanonicalLearningItemCollection' }
  /api/class-join/account/course-runs:
    get:
      operationId: getAccountLearnerCourseRuns
      summary: List course runs across active account seats with canonical assignment state
      responses:
        '200':
          description: Active-account course projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanonicalLearningItemCollection' }
  /api/classrooms/awaiting-review:
    get:
      operationId: getClassroomAwaitingReview
      summary: Count canonical waiting_review work across teacher-authorized classrooms
      responses:
        '200':
          description: Canonical review queue counts
