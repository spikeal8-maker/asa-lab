    get:
      operationId: getClassroomStudentCanonicalDetail
      summary: Read one learner with canonical assignment and course state
      responses:
        '200':
          description: Teacher-authorized learner detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanonicalLearningProjectionEnvelope' }
  /api/classrooms/{classroomId}/assignments:
    parameters:
      - name: classroomId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getClassroomCanonicalAssignments
      summary: List classroom assignments with canonical aggregate counts
      responses:
        '200':
          description: Canonical teacher assignment projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanonicalLearningItemCollection' }
  /api/classrooms/{classroomId}/assignments/{assignmentId}/progress:
    parameters:
      - name: classroomId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: assignmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getClassroomAssignmentCanonicalProgress
      summary: List per-seat progress for an assignment from canonical state
      responses:
        '200':
          description: Canonical assignment progress projection
          content:
