  /api/classrooms/{classroomId}/course-runs:
    parameters:
      - name: classroomId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: assignCanonicalCourse
      summary: Assign an immutable published course version through the existing Learning runtime
      description: New authoring clients use the canonical request below. Legacy requests without requestId use the retained legacy adapter and do not create canonical content.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LearningCourseAssign' }
      responses:
        '201':
          description: Assigned or identical request replay
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [runId, versionNumber, reused]
                properties:
                  runId: { type: string, format: uuid }
                  versionNumber: { type: integer, minimum: 1 }
                  reused: { type: boolean }
        '400':
          description: Invalid version, audience, deadline or time zone
        '401':
          description: Active Account session required
        '403':
          description: Teaching capability or classroom access denied
        '404':
          description: Classroom unavailable
        '409':
          description: Publication, audience or request conflict; no partial assignment
    get:
      operationId: getClassroomCanonicalCourseRuns
      summary: List assigned courses with canonical lesson-state aggregates
      responses:
        '200':
