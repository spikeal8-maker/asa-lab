              '404': { 'description': 'Resource unavailable' },
              '409':
                { 'description': 'Version, state or request conflict; no partial publication' },
            },
        },
    }
  '/api/courses/{courseId}/sections/{sectionId}':
    {
      'parameters':
        [
          {
            'name': 'courseId',
            'in': 'path',
            'required': true,
            'schema': { 'type': 'string', 'format': 'uuid' },
          },
          {
            'name': 'sectionId',
            'in': 'path',
            'required': true,
            'schema': { 'type': 'string', 'format': 'uuid' },
          },
        ],
      'patch':
        {
          'operationId': 'updateLearningCoursesections',
          'summary': 'Update draft only under expected revision',
          'requestBody':
            {
              'required': true,
              'content':
                {
                  'application/json':
                    { 'schema': { '$ref': '#/components/schemas/LearningCourseSectionRequest' } },
                },
            },
          'responses':
            {
              '200':
                {
                  'description': 'Scoped success',
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'type': 'object',
                              'additionalProperties': false,
                              'properties': { 'id': { 'type': 'string', 'format': 'uuid' } },
                              'required': ['id'],
