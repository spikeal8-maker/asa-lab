          minLength: 3
          maxLength: 64
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    UserEnvelope:
      type: object
      additionalProperties: false
      required:
        [
          authenticated,
          user,
          account,
          capabilities,
          workspaces,
          activeWorkspace,
          navigation,
          timeZone,
        ]
      properties:
        authenticated:
          type: boolean
          const: true
        user:
          $ref: '#/components/schemas/PublicAccount'
        account:
          $ref: '#/components/schemas/PublicAccount'
        capabilities:
          type: array
