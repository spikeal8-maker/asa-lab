    }
  '/api/courses/{courseId}':
    {
      'parameters':
        [
          {
            'name': 'courseId',
            'in': 'path',
            'required': true,
            'schema': { 'type': 'string', 'format': 'uuid' },
          },
        ],
      'patch':
        {
          'operationId': 'updateAuthorCourse',
          'summary': 'CAS draft changes do not affect published course or existing runs',
          'requestBody':
            {
              'required': true,
              'content':
                {
                  'application/json':
                    { 'schema': { '$ref': '#/components/schemas/LearningCourseDraftRequest' } },
                },
            },
          'responses':
            {
              '200':
                {
                  'description': 'Scoped success',
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'type': 'object',
                              'additionalProperties': false,
                              'properties': { 'id': { 'type': 'string', 'format': 'uuid' } },
