            {
              'required': true,
              'content':
                {
                  'application/json':
                    {
                      'schema':
                        {
                          'type': 'object',
                          'additionalProperties': false,
                          'properties': { 'code': { 'type': 'string' } },
                          'required': ['code'],
                        },
                    },
                },
            },
          'responses':
            {
              '200':
                {
                  'description': 'Scoped success',
                  'content':
                    {
                      'application/json':
                        { 'schema': { '$ref': '#/components/schemas/LearningJoinReceipt' } },
                    },
                },
              '400': { 'description': 'Invalid request' },
              '401': { 'description': 'Current session required' },
              '403': { 'description': 'Capability or workspace denied' },
              '404': { 'description': 'Resource unavailable' },
              '409':
                { 'description': 'Version, state or request conflict; no partial publication' },
            },
        },
    }
  '/api/courses':
    {
      'get':
        {
          'operationId': 'getAuthorCourses',
          'summary': 'One owner library regardless of teaching capability',
          'responses':
            {
              '200':
                {
                  'description': 'Scoped success',
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'type': 'object',
                              'additionalProperties': false,
                              'properties':
                                {
                                  'items':
                                    {
                                      'type': 'array',
                                      'items': { 'type': 'object', 'additionalProperties': true },
                                    },
                                },
                              'required': ['items'],
                            },
                        },
                    },
                },
              '400': { 'description': 'Invalid request' },
              '401': { 'description': 'Current session required' },
              '403': { 'description': 'Capability or workspace denied' },
              '404': { 'description': 'Resource unavailable' },
              '409':
                { 'description': 'Version, state or request conflict; no partial publication' },
            },
        },
      'post':
        {
          'operationId': 'createAuthorCourse',
          'summary': 'Private by default; requestId required for new authoring workflow',
          'requestBody':
            {
              'required': true,
              'content':
                {
                  'application/json':
                    { 'schema': { '$ref': '#/components/schemas/LearningCourseDraftRequest' } },
                },
            },
          'responses':
            {
              '201':
                {
                  'description': 'Scoped success',
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'type': 'object',
                              'additionalProperties': false,
                              'properties': { 'id': { 'type': 'string', 'format': 'uuid' } },
                              'required': ['id'],
                            },
                        },
                    },
                },
              '400': { 'description': 'Invalid request' },
              '401': { 'description': 'Current session required' },
              '403': { 'description': 'Capability or workspace denied' },
              '404': { 'description': 'Resource unavailable' },
              '409':
                { 'description': 'Version, state or request conflict; no partial publication' },
            },
