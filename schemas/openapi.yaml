openapi: 3.1.0
info:
  title: ASA Lab Control Plane API
  version: 0.2.0
  description: >-
    Teacher Portal v0.1 contract: health probes, teacher session auth and
    classroom create/list. The tenant context is derived exclusively from the
    server-side session; clients never send a tenant identifier.
servers:
  - url: http://127.0.0.1:4611
    description: Local development
paths:
  /health/live:
    get:
      operationId: getHealthLive
      summary: Liveness probe
      responses:
        '200':
          description: Service process is live
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveResponse'
  /health/ready:
    get:
      operationId: getHealthReady
      summary: Readiness probe (PostgreSQL SELECT 1)
      responses:
        '200':
          description: Database is reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: Database is not reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /api/auth/register:
    post:
      operationId: postAuthRegister
      summary: Adult self-registration into a Personal Workspace (feature-flagged)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountEnvelope'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email or username already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Below the adult age; the answer names the routes to take instead
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutedErrorResponse'
        '503':
          description: Public registration is disabled by feature flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/username-available:
    get:
      operationId: getAuthUsernameAvailable
      summary: Is this pseudonym free (usernames are never derived from the email)
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Availability answer
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [available]
                properties:
                  available:
                    type: boolean
  /api/join-class/resolve:
    post:
      operationId: postJoinClassResolve
      summary: Resolve a class code into a preview; creates no session and no membership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code:
                  type: string
                  description: Spaces, dashes and case are normalized away.
      responses:
        '200':
          description: Class preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomPreviewEnvelope'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >-
            No class for this code. A malformed code gets the same answer, so
            the endpoint cannot be used to enumerate classes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many attempts from this client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/login:
    post:
      operationId: postAuthLogin
      summary: Universal sign-in by email or username; workspace is the legacy organization path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session established
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEnvelope'
        '503':
          description: The account has no usable working context yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid workspace, email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/logout:
    post:
      operationId: postAuthLogout
      summary: Revoke the current session
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok]
                properties:
                  ok:
                    type: boolean
  /api/auth/me:
    get:
      operationId: getAuthMe
      summary: Current session user
      responses:
        '200':
          description: Active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEnvelope'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/classrooms:
    get:
      operationId: getClassrooms
      summary: List classrooms of the session educator (educator capability required)
      responses:
        '200':
          description: Classroom collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomCollection'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: postClassrooms
      summary: Create a classroom (atomic with owner membership and audit event)
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            Mandatory. A repeat with the same key and the same payload returns
            the existing classroom; the same key with a different payload is
            rejected with 409 idempotency_conflict. Keys longer than 128
            characters are rejected, never truncated.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9._:-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClassroomRequest'
      responses:
        '201':
          description: Classroom created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomEnvelope'
        '200':
          description: Idempotent repeat — the existing classroom is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomEnvelope'
        '400':
          description: >-
            Validation error: malformed body, additional properties, any
            client-supplied tenant identifier, or a missing/invalid
            Idempotency-Key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            Explicit conflict: idempotency_conflict (same key, different
            payload), no_school_assigned or no_active_period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    LiveResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [live]
    ReadyResponse:
      type: object
      additionalProperties: false
      required: [status, dependencies]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        dependencies:
          type: object
          additionalProperties: false
          required: [database]
          properties:
            database:
              type: string
              enum: [up, down]
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required: [password]
      description: >-
        Universal sign-in sends `identifier` (an email address or a username).
        `email` stays accepted for the legacy organization form.
      properties:
        identifier:
          type: string
          description: Email address or username of the account signing in.
          minLength: 1
        workspace:
          type: string
          description: >-
            Legacy organization locator (slug). Omitted by the ordinary sign-in;
            present only on the separate organization path.
          minLength: 3
          maxLength: 64
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    ClassroomPreviewEnvelope:
      type: object
      additionalProperties: false
      required: [classroom]
      properties:
        classroom:
          type: object
          additionalProperties: false
          required: [id, title, educatorDisplayName]
          properties:
            id:
              type: string
              format: uuid
            title:
              type: string
            educatorDisplayName:
              type: string
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, username, birthDate, country]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
        username:
          type: string
          description: Pseudonym chosen by the account holder; never derived from the email.
          minLength: 3
          maxLength: 40
        displayName:
          type: string
          description: Optional; a real first or last name is never required.
          maxLength: 255
        birthDate:
          type: string
          format: date
        country:
          type: string
          minLength: 2
          maxLength: 2
    AccountEnvelope:
      type: object
      additionalProperties: false
      required: [account]
      properties:
        account:
          type: object
          additionalProperties: false
          required: [id, email]
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
    RoutedErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, routes]
          properties:
            code:
              type: string
            message:
              type: string
            routes:
              type: array
              items:
                type: string
                enum: [class_code, student_account_next_stage]
    SessionEnvelope:
      type: object
      additionalProperties: false
      required: [user, capabilities, workspaces]
      properties:
        user:
          type: object
          additionalProperties: false
          required: [id, displayName, email]
          properties:
            id:
              type: string
              format: uuid
            displayName:
              type: string
            email:
              type: string
        capabilities:
          type: array
          description: Granted by the server only; the client never states a role.
          items:
            type: object
            additionalProperties: false
            required: [capability, state]
            properties:
              capability:
                type: string
                enum: [creator, educator, guardian, platform_admin]
              state:
                type: string
                enum: [provisional, verified, suspended, revoked]
        workspaces:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [workspaceId, kind, title, role]
            properties:
              workspaceId:
                type: string
                format: uuid
              kind:
                type: string
                enum: [personal, organization]
              title:
                type: string
              role:
                type: string
                enum: [owner, educator, school_admin]
    CreateClassroomRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
    Classroom:
      type: object
      additionalProperties: false
      required: [id, title, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
        createdAt:
          type: string
    ClassroomEnvelope:
      type: object
      additionalProperties: false
      required: [classroom, created]
      properties:
        classroom:
          $ref: '#/components/schemas/Classroom'
        created:
          type: boolean
    ClassroomCollection:
      type: object
      additionalProperties: false
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Classroom'
        meta:
          type: object
          additionalProperties: false
          required: [total]
          properties:
            total:
              type: integer
