          type: string
          pattern: '^[a-z0-9._-]{3,32}$'
        safeMode: { type: boolean, default: true }
    StudentSeatBatchPreviewRequest:
      type: object
      additionalProperties: false
      required: [students]
      properties:
        students:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/StudentSeatBatchInput' }
    StudentSeatBatchPreviewRow:
      type: object
      additionalProperties: false
      required: [index, displayLabel, loginHandle, safeMode, status, reasonCode]
      properties:
        index: { type: integer, minimum: 0, maximum: 99 }
        displayLabel: { type: [string, 'null'] }
        loginHandle: { type: [string, 'null'] }
        safeMode: { type: [boolean, 'null'] }
        status:
          type: string
          enum: [valid, duplicate, conflict, invalid]
        reasonCode: { type: string }
    StudentSeatBatchPreviewResponse:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/StudentSeatBatchPreviewRow' }
    StudentSeatBatchCommitRequest:
      type: object
      additionalProperties: false
      required: [students, requestId]
      properties:
        students:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/StudentSeatBatchInput' }
        requestId: { type: string, format: uuid }
    StudentSeatBatchCommitRow:
      type: object
      additionalProperties: false
      required:
        [
          index,
          status,
          reasonCode,
          displayLabel,
          loginHandle,
          safeMode,
          seatId,
          credentialVersion,
          credential,
        ]
      properties:
        index: { type: integer, minimum: 0, maximum: 99 }
        status:
          type: string
          enum: [created, duplicate, conflict, invalid]
        reasonCode: { type: string }
        displayLabel: { type: [string, 'null'] }
        loginHandle: { type: [string, 'null'] }
        safeMode: { type: [boolean, 'null'] }
        seatId: { type: [string, 'null'], format: uuid }
        credentialVersion: { type: [integer, 'null'], minimum: 1 }
        credential:
          type: [string, 'null']
          description: One-time plaintext credential. Null for retries and rows that were not newly created.
    StudentSeatBatchCommitResponse:
      type: object
      additionalProperties: false
      required: [requestId, reused, created, credentialsAvailable, results]
      properties:
        requestId: { type: string, format: uuid }
        reused: { type: boolean }
        created: { type: integer, minimum: 0, maximum: 100 }
        credentialsAvailable: { type: boolean }
        results:
          type: array
          items: { $ref: '#/components/schemas/StudentSeatBatchCommitRow' }
    ClassroomStudentSeat:
      type: object
      additionalProperties: false
      required:
        [
          id,
          displayLabel,
          loginHandle,
          safeMode,
          status,
          lastActiveAt,
          createdAt,
          assignedCount,
          submittedCount,
          awaitingReview,
        ]
      properties:
        id: { type: string, format: uuid }
        displayLabel: { type: string }
        loginHandle: { type: string }
        safeMode: { type: boolean }
        status:
          type: string
          enum: [issued, active, suspended]
        lastActiveAt:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        assignedCount: { type: integer, minimum: 0 }
        submittedCount:
          type: integer
          minimum: 0
          description: Count derived from canonical workflow states when canonical reads are enabled.
        awaitingReview:
          type: integer
          minimum: 0
          description: Count of canonical waiting_review states only.
