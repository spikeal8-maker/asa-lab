              schema: { $ref: '#/components/schemas/CanonicalLearningProjectionEnvelope' }
  /api/classrooms/{classroomId}/gradebook:
    parameters:
      - name: classroomId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getClassroomCanonicalGradebook
      summary: Read canonical workflow state and selected immutable results
      responses:
        '200':
          description: Teacher gradebook projection with compatibility diagnostics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanonicalLearningProjectionEnvelope' }
  /api/classrooms/{classroomId}/course-runs:
    parameters:
      - name: classroomId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getClassroomCanonicalCourseRuns
      summary: List assigned courses with canonical lesson-state aggregates
      responses:
        '200':
          description: Teacher course-run projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanonicalLearningItemCollection' }
  /api/projects:
    get:
      operationId: getProjects
      summary: List projects visible to the active workspace actor
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [personal, classroom]
        - name: classroomId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ProjectStatus'
      responses:
        '200':
          description: Project collection filtered by lifecycle state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCollection'
        '400':
          description: Invalid filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: postProject
      summary: Create a project and its initial draft atomically
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEnvelope'
        '200':
          description: Idempotent repeat returned the existing project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEnvelope'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency key was reused with a different payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProject
      summary: Open the project draft and immutable version history
      responses:
        '200':
          description: Project workbench payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenProjectEnvelope'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project is unavailable to the active actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: patchProject
      summary: Rename a project that is not in trash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameProjectRequest'
      responses:
        '200':
          description: Project renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectOnlyEnvelope'
        '400':
          description: Invalid title
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project is unavailable to the active actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/projects/{projectId}/duplicate:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: postProjectDuplicate
      summary: Duplicate a project with its current draft
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameProjectRequest'
      responses:
        '201':
          description: Duplicate created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEnvelope'
        '200':
          description: Idempotent repeat returned the existing duplicate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEnvelope'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Source project is unavailable to the active actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency key was reused with a different payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/projects/{projectId}/draft:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    put:
      operationId: putProjectDraft
      summary: Save a draft only when its base revision is still current
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveProjectDraftRequest'
      responses:
        '200':
          description: Draft saved and revision advanced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveProjectDraftEnvelope'
        '400':
          description: Invalid document or base revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project is unavailable to the active actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Draft revision changed on another device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/projects/{projectId}/snapshot:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    put:
      operationId: putProjectSnapshot
      summary: Store a raster preview only for the draft revision it represents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveProjectSnapshotRequest'
      responses:
        '200':
          description: Snapshot stored for the exact source revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveProjectSnapshotEnvelope'
        '400':
          description: Invalid raster image or source revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project is unavailable to the active actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The canvas belongs to a stale draft revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      operationId: getProjectSnapshot
      summary: Read the latest authorised project snapshot
      parameters:
        - name: rev
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: PNG or WebP snapshot bytes
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Snapshot or project is unavailable to the active actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/projects/{projectId}/status:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: postProjectStatus
      summary: Archive, trash or restore a project through an allowed transition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeProjectStatusRequest'
      responses:
        '201':
          description: Lifecycle state changed without deleting project data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectOnlyEnvelope'
        '400':
          description: Invalid lifecycle transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project is unavailable to the active actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
  schemas:
    LearningActivityKind:
      type: string
      enum: [quiz, project, essay, file, manual]
    LearningActivityResultMode:
      type: string
      enum: [ungraded, completion, graded]
    LearningActivityPolicySnapshot:
      type: object
      additionalProperties: false
      required:
        - attemptPolicy
        - resultSelectionPolicy
        - completionPolicy
        - latePolicy
        - assessmentPolicy
        - feedbackReleasePolicy
      properties:
        attemptPolicy: { type: [object, 'null'] }
        resultSelectionPolicy: { type: [object, 'null'] }
        completionPolicy: { type: [object, 'null'] }
        latePolicy: { type: [object, 'null'] }
        assessmentPolicy: { type: [object, 'null'] }
        feedbackReleasePolicy: { type: [object, 'null'] }
    LearningActivityCreateRequest:
      type: object
      additionalProperties: false
      required: [requestId, kind, title, resultMode, policies]
      properties:
        requestId:
          type: string
          minLength: 8
          maxLength: 128
          pattern: '^[A-Za-z0-9._:-]+$'
        kind: { $ref: '#/components/schemas/LearningActivityKind' }
        title: { type: string, minLength: 1, maxLength: 255 }
        instructions: { type: [string, 'null'], maxLength: 12000 }
        resultMode: { $ref: '#/components/schemas/LearningActivityResultMode' }
        maxPoints: { type: [integer, 'null'], minimum: 1 }
        policies: { $ref: '#/components/schemas/LearningActivityPolicySnapshot' }
        moduleKey: { type: [string, 'null'], pattern: '^[a-z0-9-]{1,64}$' }
        quizVersionId: { type: [string, 'null'], format: uuid }
        starterProjectVersionId: { type: [string, 'null'], format: uuid }
        sourceTeacherAssignmentId: { type: [string, 'null'], format: uuid }
        scope: { type: string, enum: [personal, school], default: personal }
        visibility: { type: string, enum: [private, school], default: private }
    LearningActivityDraftUpdateRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, title, resultMode, policies]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 255 }
        instructions: { type: [string, 'null'], maxLength: 12000 }
        resultMode: { $ref: '#/components/schemas/LearningActivityResultMode' }
        maxPoints: { type: [integer, 'null'], minimum: 1 }
        policies: { $ref: '#/components/schemas/LearningActivityPolicySnapshot' }
        moduleKey: { type: [string, 'null'], pattern: '^[a-z0-9-]{1,64}$' }
        quizVersionId: { type: [string, 'null'], format: uuid }
        starterProjectVersionId: { type: [string, 'null'], format: uuid }
    LearningActivityPublishRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, requestId]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        requestId:
          type: string
          minLength: 8
          maxLength: 128
          pattern: '^[A-Za-z0-9._:-]+$'
    LearningActivityDraftReceipt:
      type: object
      additionalProperties: false
      required: [id, draftRevision]
      properties:
        id: { type: string, format: uuid }
        draftRevision: { type: integer, minimum: 1 }
    LearningActivityPublishReceipt:
      type: object
      additionalProperties: false
      required: [id, activityId, versionNumber, contentDigest, reused]
      properties:
        id: { type: string, format: uuid }
        activityId: { type: string, format: uuid }
        versionNumber: { type: integer, minimum: 1 }
        contentDigest: { type: string, pattern: '^[0-9a-f]{64}$' }
        reused: { type: boolean }
    LearningActivitySummary:
      type: object
      additionalProperties: false
      required:
        [
          id,
          title,
          kind,
          resultMode,
          visibility,
          draftRevision,
          currentPublishedVersionId,
          archivedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        kind: { $ref: '#/components/schemas/LearningActivityKind' }
        resultMode: { $ref: '#/components/schemas/LearningActivityResultMode' }
        visibility: { type: string, enum: [private, school] }
        draftRevision: { type: integer, minimum: 1 }
        currentPublishedVersionId: { type: [string, 'null'], format: uuid }
        archivedAt: { type: [string, 'null'], format: date-time }
    LearningActivityDetail:
      type: object
      additionalProperties: false
      required:
        [
          id,
          tenantId,
          title,
          kind,
          ownerScope,
          visibility,
          draftRevision,
          draft,
          currentPublishedVersionId,
          archivedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        title: { type: string }
        kind: { $ref: '#/components/schemas/LearningActivityKind' }
        ownerScope: { type: string, enum: [personal, school] }
        visibility: { type: string, enum: [private, school] }
        draftRevision: { type: integer, minimum: 1 }
        draft: { type: object }
        currentPublishedVersionId: { type: [string, 'null'], format: uuid }
        archivedAt: { type: [string, 'null'], format: date-time }
    LearningActivityVersion:
      type: object
      additionalProperties: false
      required:
        [
          id,
          versionNumber,
          kind,
          resultMode,
          maxPoints,
          policies,
          quizVersionId,
          starterProjectVersionId,
          provenance,
          contentDigest,
          publishedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        versionNumber: { type: integer, minimum: 1 }
        kind: { $ref: '#/components/schemas/LearningActivityKind' }
        resultMode: { $ref: '#/components/schemas/LearningActivityResultMode' }
        maxPoints: { type: [integer, 'null'], minimum: 1 }
        policies: { $ref: '#/components/schemas/LearningActivityPolicySnapshot' }
        quizVersionId: { type: [string, 'null'], format: uuid }
        starterProjectVersionId: { type: [string, 'null'], format: uuid }
        provenance: { type: object }
        contentDigest: { type: string, pattern: '^[0-9a-f]{64}$' }
        publishedAt: { type: string, format: date-time }
    LearningActivityCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LearningActivitySummary' }
    LearningActivityVersionCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LearningActivityVersion' }
    CanonicalLearningWorkflowState:
      type: string
      enum:
        - not_applicable
        - not_started
        - in_progress
        - submitted
        - waiting_review
        - changes_requested
        - completed
        - invalidated
    CanonicalLearningSelectedResult:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - resultRevisionId
        - compatibilityAssessmentResultId
        - rawPoints
        - maxPoints
        - percentageBasisPoints
        - displayGrade
        - completionValue
        - outcome
        - publishedAt
      properties:
        attemptId: { type: string, format: uuid }
        resultRevisionId: { type: [string, 'null'], format: uuid }
        compatibilityAssessmentResultId: { type: [string, 'null'], format: uuid }
        rawPoints: { type: [integer, 'null'] }
        maxPoints: { type: [integer, 'null'] }
        percentageBasisPoints: { type: [integer, 'null'] }
        displayGrade: { type: [string, 'null'] }
        completionValue: { type: [boolean, 'null'] }
        outcome:
          type: [string, 'null']
          enum: [passed, failed, incomplete, excused, null]
        publishedAt: { type: string, format: date-time }
    CanonicalLearningSurfaceState:
      description: >-
        Server-resolved workflow and selected immutable result. Learner responses omit
        internal compatibility flags and diagnostics; teacher responses may include them.
      type: object
      additionalProperties: false
      required: [workflowState, selectedResult, flags, learnerMessageCode]
      properties:
        workflowState: { $ref: '#/components/schemas/CanonicalLearningWorkflowState' }
        selectedResult:
          oneOf:
            - $ref: '#/components/schemas/CanonicalLearningSelectedResult'
            - type: 'null'
        flags:
          type: array
          items:
            type: string
            enum:
              - late
              - excused
              - revision_in_progress
              - withdrawn
              - after_due
              - legacy_unresolved
              - legacy_compatibility
              - unselected_result
              - visibility_restricted
        learnerMessageCode:
          type: [string, 'null']
          enum: [access_not_active, access_suspended, access_ended, null]
        compatibilityDiagnostic:
          type: string
          description: Teacher-only diagnostic for unresolved historical evidence.
    CanonicalLearningItem:
      type: object
      additionalProperties: true
      properties:
        canonicalState:
          oneOf:
            - $ref: '#/components/schemas/CanonicalLearningSurfaceState'
            - type: 'null'
    CanonicalLearningItemCollection:
      type: object
      additionalProperties: true
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CanonicalLearningItem' }
    CanonicalLearningReviewCount:
      type: object
      additionalProperties: false
      required: [total]
      properties:
        total:
          type: integer
          minimum: 0
          description: Number of canonical waiting_review states visible to the educator.
    CanonicalLearningProjectionEnvelope:
      type: object
      additionalProperties: true
      description: >-
        Teacher-authorized projection whose learner or assignment rows carry
        CanonicalLearningSurfaceState and whose aggregate counts derive from it.
    LiveResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [live]
    ReadyResponse:
      type: object
      additionalProperties: false
      required: [status, dependencies]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        dependencies:
          type: object
          additionalProperties: false
          required: [database]
          properties:
            database:
              type: string
              enum: [up, down]
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    AdminPermission:
      type: string
      enum:
        - administration.open
        - administration.scopes.read
        - administration.audit.read
        - administration.accounts.read
        - administration.organizations.read
        - administration.security.read
        - administration.moderation.read
        - administration.billing.read
        - administration.operations.read
    AdminScope:
      type: object
      additionalProperties: false
      required: [kind, id, title, role, permissions]
      properties:
        kind:
          type: string
          enum: [platform, organization]
        id:
          type: [string, 'null']
          format: uuid
        title:
          type: string
        role:
          type: string
          enum: [platform_admin, owner, school_admin, moderator, billing_admin]
        permissions:
