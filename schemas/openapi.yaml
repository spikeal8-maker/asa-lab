          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanonicalLearningItemCollection' }
  /api/projects:
    get:
      operationId: getProjects
      summary: List projects visible to the active workspace actor
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [personal, classroom]
        - name: classroomId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ProjectStatus'
        - name: module
          in: query
          schema: { type: string, pattern: '^[a-z][a-z0-9-]{0,63}$' }
        - name: limit
          in: query
          description: Optional bounded page; omit for the legacy full collection.
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: cursor
          in: query
          description: nextCursor from the preceding page, with the same filters and sort. Requires limit.
          schema: { type: string, maxLength: 2048 }
        - name: search
          in: query
          schema: { type: string, maxLength: 255 }
        - name: sort
          in: query
          schema: { type: string, enum: [recent, oldest, title], default: recent }
        - name: excludeGames
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Project collection filtered by lifecycle state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCollection'
        '400':
          description: Invalid filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: postProject
      summary: Create a project and its initial draft atomically
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEnvelope'
        '200':
          description: Idempotent repeat returned the existing project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEnvelope'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency key was reused with a different payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProject
      summary: Open the project draft and immutable version history
      responses:
        '200':
          description: Project workbench payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenProjectEnvelope'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project is unavailable to the active actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: patchProject
      summary: Rename a project that is not in trash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameProjectRequest'
      responses:
        '200':
          description: Project renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectOnlyEnvelope'
        '400':
          description: Invalid title
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project is unavailable to the active actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/projects/{projectId}/duplicate:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: postProjectDuplicate
      summary: Duplicate a project with its current draft
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameProjectRequest'
      responses:
        '201':
          description: Duplicate created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEnvelope'
        '200':
          description: Idempotent repeat returned the existing duplicate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEnvelope'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Source project is unavailable to the active actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency key was reused with a different payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/projects/{projectId}/draft:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    put:
      operationId: putProjectDraft
      summary: Save a draft only when its base revision is still current
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveProjectDraftRequest'
      responses:
        '200':
          description: Draft saved and revision advanced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveProjectDraftEnvelope'
        '400':
          description: Invalid document or base revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project is unavailable to the active actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Draft revision changed on another device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/projects/{projectId}/snapshot:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    put:
      operationId: putProjectSnapshot
      summary: Store a raster preview only for the draft revision it represents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveProjectSnapshotRequest'
      responses:
        '200':
          description: Snapshot stored for the exact source revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveProjectSnapshotEnvelope'
        '400':
          description: Invalid raster image or source revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project is unavailable to the active actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The canvas belongs to a stale draft revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      operationId: getProjectSnapshot
      summary: Read the latest authorised project snapshot
      parameters:
        - name: rev
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: PNG or WebP snapshot bytes
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Snapshot or project is unavailable to the active actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/projects/{projectId}/status:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: postProjectStatus
      summary: Archive, trash or restore a project through an allowed transition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeProjectStatusRequest'
      responses:
        '201':
          description: Lifecycle state changed without deleting project data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectOnlyEnvelope'
        '400':
          description: Invalid lifecycle transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project is unavailable to the active actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
  schemas:
    LearningTeacherReviewContext:
      {
        'type': 'object',
        'additionalProperties': false,
        'properties':
          {
            'participationId': { 'type': 'string', 'format': 'uuid' },
            'activityRunId': { 'type': 'string', 'format': 'uuid' },
            'resultMode': { 'type': 'string', 'enum': ['ungraded', 'completion', 'graded'] },
            'maxPoints': { 'type': ['integer', 'null'] },
            'title': { 'type': 'string' },
            'instructions': { 'type': ['string', 'null'] },
            'moduleKey': { 'type': 'string' },
            'selectionPolicy':
              {
                'type': 'string',
                'enum': ['first', 'latest', 'best', 'latest_accepted', 'teacher_selected'],
              },
            'teacherSelectedAttemptId': { 'type': ['string', 'null'], 'format': 'uuid' },
            'attempts':
              {
                'type': 'array',
                'items':
                  {
                    'type': 'object',
                    'additionalProperties': false,
                    'properties':
                      {
                        'id': { 'type': 'string', 'format': 'uuid' },
                        'number': { 'type': 'integer', 'minimum': 1 },
                        'state': { '$ref': '#/components/schemas/LearningAttemptState' },
                        'closedAt': { 'type': ['string', 'null'], 'format': 'date-time' },
                        'revisionOfAttemptId': { 'type': ['string', 'null'], 'format': 'uuid' },
                        'submissionId': { 'type': ['string', 'null'], 'format': 'uuid' },
                        'projectVersionId': { 'type': ['string', 'null'], 'format': 'uuid' },
                        'submittedAt': { 'type': ['string', 'null'], 'format': 'date-time' },
                        'results':
                          {
                            'type': 'array',
                            'items':
                              {
                                'type': 'object',
                                'additionalProperties': false,
                                'properties':
                                  {
                                    'id': { 'type': 'string', 'format': 'uuid' },
                                    'revision': { 'type': 'integer', 'minimum': 1 },
                                    'supersedesId':
                                      { 'type': ['string', 'null'], 'format': 'uuid' },
                                    'decision': { 'type': ['string', 'null'] },
                                    'points': { 'type': ['integer', 'null'] },
                                    'maxPoints': { 'type': ['integer', 'null'] },
                                    'feedback': { 'type': ['string', 'null'] },
                                    'reason': { 'type': ['string', 'null'] },
                                    'publishedAt': { 'type': 'string', 'format': 'date-time' },
                                  },
                                'required':
                                  [
                                    'id',
                                    'revision',
                                    'supersedesId',
                                    'decision',
                                    'points',
                                    'maxPoints',
                                    'feedback',
                                    'reason',
                                    'publishedAt',
                                  ],
                              },
                          },
                      },
                    'required':
