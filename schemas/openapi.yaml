        - maxPoints
        - percentageBasisPoints
        - displayGrade
        - completionValue
        - outcome
        - publishedAt
      properties:
        attemptId: { type: string, format: uuid }
        resultRevisionId: { type: [string, 'null'], format: uuid }
        compatibilityAssessmentResultId: { type: [string, 'null'], format: uuid }
        rawPoints: { type: [integer, 'null'] }
        maxPoints: { type: [integer, 'null'] }
        percentageBasisPoints: { type: [integer, 'null'] }
        displayGrade: { type: [string, 'null'] }
        completionValue: { type: [boolean, 'null'] }
        outcome:
          type: [string, 'null']
          enum: [passed, failed, incomplete, excused, null]
        publishedAt: { type: string, format: date-time }
    CanonicalLearningSurfaceState:
      description: >-
        Server-resolved workflow and selected immutable result. Learner responses omit
        internal compatibility flags and diagnostics; teacher responses may include them.
      type: object
      additionalProperties: false
      required: [workflowState, selectedResult, flags, learnerMessageCode]
      properties:
        workflowState: { $ref: '#/components/schemas/CanonicalLearningWorkflowState' }
        selectedResult:
          oneOf:
            - $ref: '#/components/schemas/CanonicalLearningSelectedResult'
            - type: 'null'
        flags:
          type: array
          items:
            type: string
            enum:
              - late
              - excused
              - revision_in_progress
              - withdrawn
              - after_due
              - legacy_unresolved
              - legacy_compatibility
              - unselected_result
              - visibility_restricted
        learnerMessageCode:
          type: [string, 'null']
          enum: [access_not_active, access_suspended, access_ended, null]
        compatibilityDiagnostic:
          type: string
          description: Teacher-only diagnostic for unresolved historical evidence.
