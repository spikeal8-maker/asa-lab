                },
              '400': { 'description': 'Invalid request' },
              '401': { 'description': 'Current session required' },
              '403': { 'description': 'Capability or workspace denied' },
              '404': { 'description': 'Resource unavailable' },
              '409':
                { 'description': 'Version, state or request conflict; no partial publication' },
            },
          'parameters':
            [
              {
                'name': 'assignmentId',
                'in': 'query',
                'schema': { 'type': 'string', 'format': 'uuid' },
              },
              {
                'name': 'courseRunId',
                'in': 'query',
                'schema': { 'type': 'string', 'format': 'uuid' },
              },
            ],
        },
    }
  '/api/classrooms/{classroomId}/learning/audiences/{audienceId}/members/{seatId}':
    {
      'parameters':
        [
          {
            'name': 'classroomId',
            'in': 'path',
            'required': true,
            'schema': { 'type': 'string', 'format': 'uuid' },
          },
          {
            'name': 'audienceId',
            'in': 'path',
            'required': true,
            'schema': { 'type': 'string', 'format': 'uuid' },
          },
          {
            'name': 'seatId',
            'in': 'path',
            'required': true,
            'schema': { 'type': 'string', 'format': 'uuid' },
          },
        ],
      'post':
        {
          'operationId': 'changeLearningNamedAudience',
          'summary': 'Add/remove through existing Audience with expected membership and reason; withdrawn history is not revived',
          'requestBody':
            {
              'required': true,
              'content':
                {
                  'application/json':
                    { 'schema': { '$ref': '#/components/schemas/LearningAudienceMemberChange' } },
