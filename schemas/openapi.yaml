        },
      'delete':
        {
          'operationId': 'removeLearningCoursesections',
          'summary': 'Remove draft item only; published snapshots retained',
          'requestBody':
            {
              'required': true,
              'content':
                {
                  'application/json':
                    {
                      'schema':
                        {
                          'type': 'object',
                          'additionalProperties': false,
                          'properties': { 'expectedRevision': { 'type': 'integer', 'minimum': 1 } },
                          'required': ['expectedRevision'],
                        },
                    },
                },
            },
          'responses':
            {
              '200':
                {
                  'description': 'Scoped success',
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'type': 'object',
                              'additionalProperties': false,
                              'properties': { 'removed': { 'type': 'boolean' } },
                              'required': ['removed'],
                            },
                        },
                    },
                },
              '400': { 'description': 'Invalid request' },
              '401': { 'description': 'Current session required' },
              '403': { 'description': 'Capability or workspace denied' },
              '404': { 'description': 'Resource unavailable' },
              '409':
                { 'description': 'Version, state or request conflict; no partial publication' },
            },
        },
    }
  '/api/courses/{courseId}/sections/{sectionId}/move':
    {
      'parameters':
        [
          {
            'name': 'courseId',
            'in': 'path',
            'required': true,
            'schema': { 'type': 'string', 'format': 'uuid' },
          },
          {
            'name': 'sectionId',
            'in': 'path',
            'required': true,
            'schema': { 'type': 'string', 'format': 'uuid' },
          },
        ],
      'post':
        {
          'operationId': 'moveLearningCoursesections',
          'summary': 'Reorder existing draft outline under expected revision',
          'requestBody':
            {
              'required': true,
              'content':
                {
                  'application/json':
                    {
                      'schema':
                        {
                          'type': 'object',
                          'additionalProperties': false,
                          'properties':
                            {
                              'expectedRevision': { 'type': 'integer', 'minimum': 1 },
                              'delta': { 'type': 'integer', 'enum': [-1, 1] },
                            },
                          'required': ['expectedRevision', 'delta'],
                        },
                    },
                },
            },
          'responses':
            {
              '201':
                {
                  'description': 'Scoped success',
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'type': 'object',
                              'additionalProperties': false,
                              'properties': { 'ok': { 'type': 'boolean' } },
                              'required': ['ok'],
                            },
                        },
                    },
                },
              '400': { 'description': 'Invalid request' },
              '401': { 'description': 'Current session required' },
              '403': { 'description': 'Capability or workspace denied' },
              '404': { 'description': 'Resource unavailable' },
              '409':
                { 'description': 'Version, state or request conflict; no partial publication' },
            },
        },
    }
  '/api/courses/{courseId}/lessons':
    {
      'parameters':
        [
          {
            'name': 'courseId',
            'in': 'path',
            'required': true,
            'schema': { 'type': 'string', 'format': 'uuid' },
          },
        ],
      'post':
