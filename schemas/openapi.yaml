    CreateClassroomRequest:
      type: object
      additionalProperties: false
      required: [title, ageBand, topicKeys, safeModeDefault]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        ageBand:
          type: string
          enum: ['6-8', '9-10', '11-12', '13-15', '16-18', mixed]
        topicKeys:
          type: array
          maxItems: 12
          items:
            type: string
            pattern: '^[a-z0-9-]{1,32}$'
        safeModeDefault:
          type: boolean
    ClassroomDetailsRequest:
      description: >-
        Every field is optional: a teacher fixing a name should not have to
        restate the age band. Anything omitted keeps its stored value.
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        ageBand:
          type: string
          enum: ['6-8', '9-10', '11-12', '13-15', '16-18', mixed]
        topicKeys:
          type: array
          maxItems: 12
          items:
            type: string
            pattern: '^[a-z0-9-]{1,32}$'
        safeModeDefault:
          type: boolean
    Classroom:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - status
        - ageBand
        - topicKeys
        - safeModeDefault
        - studentCount
        - joinCodeVersion
        - joinCodeStatus
        - joinCode
        - teacherRole
        - workspaceKind
        - workspaceTitle
        - createdAt
        - archivedAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          description: >-
            active while the class is running, archived once it is put away.
            A removed class is never returned.
          type: string
          enum: [active, archived]
        ageBand:
          type: string
          enum: ['6-8', '9-10', '11-12', '13-15', '16-18', mixed]
        topicKeys:
          type: array
          items: { type: string }
        safeModeDefault:
          type: boolean
        studentCount:
          type: integer
          minimum: 0
        joinCodeVersion:
          type: [integer, 'null']
        joinCodeStatus:
          type: [string, 'null']
          enum: [active, revoked, null]
        joinCode:
          type: [string, 'null']
          pattern: '^[A-Z2-9]{3} [A-Z2-9]{3} [A-Z2-9]{3}$'
        teacherRole:
          type: string
          enum: [owner, co_teacher]
        workspaceKind:
          type: string
          enum: [personal, organization]
        workspaceTitle:
          type: string
        createdAt:
          type: string
          format: date-time
        archivedAt:
          description: When the class was put away; null while it is running.
          type: [string, 'null']
          format: date-time
