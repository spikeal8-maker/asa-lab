name: Scratch Documentation Routing

on:
  push:
    branches:
      - main
    paths:
      - 'START_HERE_FOR_AI.md'
      - 'docs/execution/current.yaml'
      - 'docs/product/visual-programming/**'
      - 'docs/product/ASA_VISUAL_PROGRAMMING_SCRATCH_MASTER_SPEC.md'
      - 'docs/architecture/ADR-VSCR-001-SCRATCH-EDITOR-INTEGRATION.md'
      - 'contexts/blocks/**'
      - 'apps/web/src/blocks/**'
      - 'infra/scratch-editor/**'
      - 'tools/blocks/**'
      - 'tools/verify-blocks-host-*.mjs'
      - 'tools/validate-blocks-docs.mjs'
      - 'tools/validate-context-boundaries.mjs'
      - 'docs/project-map/nx-project-graph.json'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/scratch-*.yml'
  pull_request:
    paths:
      - 'START_HERE_FOR_AI.md'
      - 'docs/execution/current.yaml'
      - 'docs/product/visual-programming/**'
      - 'docs/product/ASA_VISUAL_PROGRAMMING_SCRATCH_MASTER_SPEC.md'
      - 'docs/architecture/ADR-VSCR-001-SCRATCH-EDITOR-INTEGRATION.md'
      - 'contexts/blocks/**'
      - 'apps/web/src/blocks/**'
      - 'infra/scratch-editor/**'
      - 'tools/blocks/**'
      - 'tools/verify-blocks-host-*.mjs'
      - 'tools/validate-blocks-docs.mjs'
      - 'tools/validate-context-boundaries.mjs'
      - 'docs/project-map/nx-project-graph.json'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/scratch-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  routing:
    name: Scratch component routing
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Scratch routing gate
        run: pnpm gate:blocks --docs
