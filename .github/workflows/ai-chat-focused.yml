name: ASA AI Chat Focused

'on':
  push:
    branches:
      - main
      - feature/ai-chat-gpt-integration-20261014
    paths:
      - 'apps/api/src/ai-*'
      - 'apps/api/src/ai-attachments/**'
      - 'apps/api/src/app.module.ts'
      - 'apps/api/src/app.factory.ts'
      - 'apps/api/src/abuse-protection.ts'
      - 'apps/api/src/abuse-protection.spec.ts'
      - 'apps/api/src/tokens.ts'
      - 'apps/api/src/seat-context.ts'
      - 'apps/api/src/account-verification.guard*'
      - 'apps/web/src/pages/ClassroomPage.tsx'
      - 'apps/web/src/components/ClassroomAiAccess.tsx'
      - 'apps/web/src/components/classroom-ai-access.css'
      - 'apps/web/src/ai/**'
      - 'apps/web/src/admin/AdminAiPage.tsx'
      - 'apps/web/src/admin/ai-admin.css'
      - 'apps/web/src/admin/testing/ai-*.spec.ts'
      - 'apps/web/src/admin/admin-navigation.ts'
      - 'apps/web/src/App.tsx'
      - 'e2e/ai-*.spec.ts'
      - 'migrations/*_ai_*.sql'
      - 'tests/admin/ai-*.ts'
      - 'tests/ai-attachments/**'
      - 'infra/minio/Dockerfile'
      - 'playwright.ai-chat.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ai-chat-focused.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/api/src/ai-*'
      - 'apps/api/src/ai-attachments/**'
      - 'apps/api/src/app.module.ts'
      - 'apps/api/src/app.factory.ts'
      - 'apps/api/src/abuse-protection.ts'
      - 'apps/api/src/abuse-protection.spec.ts'
      - 'apps/api/src/tokens.ts'
      - 'apps/api/src/seat-context.ts'
      - 'apps/api/src/account-verification.guard*'
      - 'apps/web/src/pages/ClassroomPage.tsx'
      - 'apps/web/src/components/ClassroomAiAccess.tsx'
      - 'apps/web/src/components/classroom-ai-access.css'
      - 'apps/web/src/ai/**'
      - 'apps/web/src/admin/AdminAiPage.tsx'
      - 'apps/web/src/admin/ai-admin.css'
      - 'apps/web/src/admin/testing/ai-*.spec.ts'
      - 'apps/web/src/admin/admin-navigation.ts'
      - 'apps/web/src/App.tsx'
      - 'e2e/ai-*.spec.ts'
      - 'migrations/*_ai_*.sql'
      - 'tests/admin/ai-*.ts'
      - 'tests/ai-attachments/**'
      - 'infra/minio/Dockerfile'
      - 'playwright.ai-chat.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ai-chat-focused.yml'

permissions:
  contents: read

concurrency:
  group: asa-ai-chat-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  focused:
    name: AI unit and API/Web types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NX_SKIP_NX_CACHE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build AI unit API and identity dependencies
        run: pnpm exec nx run-many -t build -p identity api --skip-nx-cache
      - name: AI Chat unit regression
        run: pnpm test:ai-chat
      - name: No unformatted files
        run: |
          pnpm exec prettier --check apps/api/src/ai-* apps/api/src/ai-attachments apps/api/src/app.factory.ts apps/api/src/abuse-protection.ts apps/api/src/abuse-protection.spec.ts apps/api/src/seat-context.ts apps/api/src/account-verification.guard* apps/web/src/components/ClassroomAiAccess.tsx apps/web/src/components/classroom-ai-access.css apps/web/src/ai apps/web/src/admin/testing/ai-*.spec.ts e2e/ai-*.spec.ts tests/admin/ai-*.ts tests/ai-attachments package.json
          pnpm exec prettier --check --ignore-path /dev/null .github/workflows/ai-chat-focused.yml
      - name: API TypeScript
        run: pnpm exec nx run api:typecheck --skip-nx-cache
      - name: Web TypeScript
        run: pnpm exec nx run web:typecheck --skip-nx-cache

  database:
    name: AI real PostgreSQL isolation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: docker.io/library/postgres@sha256:75adc2a65806c96bc0e59030230bfe3f1c1b0d6d8f8181a8913e2b8b53bdc166
        env:
          POSTGRES_DB: asa_ai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ai-focused-ci-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d asa_ai_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CI: 'true'
      NX_SKIP_NX_CACHE: 'true'
      TEST_DATABASE_URL: postgresql://postgres:ai-focused-ci-test@127.0.0.1:5432/asa_ai_test
      APP_TEST_DATABASE_URL: postgresql://asalab_app:ai-focused-ci-test@127.0.0.1:5432/asa_ai_test
      MIGRATION_DATABASE_URL: postgresql://postgres:ai-focused-ci-test@127.0.0.1:5432/asa_ai_test
      MIGRATION_EXPECT_DATABASE: asa_ai_test
      MIGRATION_CONFIRM: APPLY:asa_ai_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply all migrations to disposable database
        run: pnpm db:migrate
      - name: Provision only isolated runtime role
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE asalab_app WITH LOGIN PASSWORD 'ai-focused-ci-test'"
      - name: Build API identity contracts
        run: pnpm exec nx run-many -t build -p identity api --skip-nx-cache
      - name: AI cross-account security and provider persistence
        run: pnpm exec vitest run tests/admin/ai-*.pg.spec.ts

  storage:
    name: AI real S3 attachment isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      ASA_AI_ATTACHMENTS_STORAGE_TEST: '1'
      ASA_AI_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ASA_OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:19000
      ASA_OBJECT_STORAGE_REGION: us-east-1
      ASA_OBJECT_STORAGE_BUCKET: ai-attachments-${{ github.run_id }}
      ASA_OBJECT_STORAGE_FORCE_PATH_STYLE: 'true'
      ASA_OBJECT_STORAGE_ACCESS_KEY: ai-attachments-ci-only
      ASA_OBJECT_STORAGE_SECRET_KEY: ai-attachments-ci-only-secret
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify exact storage fixture source and configuration
        run: |
          test "$(git rev-parse HEAD)" = "$ASA_AI_CANDIDATE_SHA"
          GITHUB_SHA="$ASA_AI_CANDIDATE_SHA" node --input-type=module -e \
            "import { readAiAttachmentFixtureEnvironment } from './tests/ai-attachments/minio-fixture.mjs'; readAiAttachmentFixtureEnvironment(process.env);"
      - name: Build pinned disposable MinIO
        run: |
          docker --host unix:///var/run/docker.sock build \
            --file infra/minio/Dockerfile \
            --tag "asa-ai-attachments-minio:${GITHUB_RUN_ID}" \
            infra/minio
      # Pass the checked-out head only to fixture processes; a PR event's
      # default GITHUB_SHA identifies its synthetic merge commit instead.
      - name: Start disposable attachment storage
        run: GITHUB_SHA="$ASA_AI_CANDIDATE_SHA" node tests/ai-attachments/minio-fixture.mjs start
      - name: Real S3 attachment cases and fixture guards
        run: GITHUB_SHA="$ASA_AI_CANDIDATE_SHA" pnpm test:ai-attachments:s3
      - name: Stop only the verified owned storage fixture
        if: always()
        run: GITHUB_SHA="$ASA_AI_CANDIDATE_SHA" node tests/ai-attachments/minio-fixture.mjs stop

  browser:
    name: AI desktop and mobile browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: AI browser journeys without provider credentials
        run: pnpm e2e:ai-chat
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-chat-browser-${{ github.sha }}
          path: reports/playwright/ai-chat/
          if-no-files-found: ignore
