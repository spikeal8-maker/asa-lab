name: ASA AI Chat Focused

'on':
  push:
    branches:
      - main
      - feature/ai-chat-gpt-integration-20261014
    paths:
      - 'apps/api/src/ai-*'
      - 'apps/api/src/ai-attachments/**'
      - 'apps/api/src/app.module.ts'
      - 'apps/api/src/app.factory.ts'
      - 'apps/api/src/abuse-protection.ts'
      - 'apps/api/src/abuse-protection.spec.ts'
      - 'apps/api/src/tokens.ts'
      - 'apps/api/src/seat-context.ts'
      - 'apps/api/src/account-verification.guard*'
      - 'apps/web/src/pages/ClassroomPage.tsx'
      - 'apps/web/src/components/ClassroomAiAccess.tsx'
      - 'apps/web/src/components/classroom-ai-access.css'
      - 'apps/web/src/ai/**'
      - 'apps/web/src/admin/AdminAiPage.tsx'
      - 'apps/web/src/admin/AiAdminWorkspace.tsx'
      - 'apps/web/src/admin/AdminAiUsageOverview.tsx'
      - 'apps/web/src/admin/AdminAiOwnQuality.tsx'
      - 'apps/web/src/admin/ai-own-quality.css'
      - 'apps/web/src/admin/admin-api.ts'
      - 'apps/web/src/admin/ai-admin-navigation.ts'
      - 'apps/web/src/admin/ai-usage-overview*'
      - 'apps/web/src/admin/ai-admin.css'
      - 'apps/web/src/admin/testing/ai-*.spec.ts'
      - 'apps/web/src/admin/admin-navigation.ts'
      - 'apps/web/src/App.tsx'
      - 'e2e/ai-*.spec.ts'
      - 'e2e/own-quality-real.spec.ts'
      - 'e2e/ai-usage-native-zoom.ts'
      - 'migrations/*_ai_*.sql'
      - 'tests/admin/ai-*.ts'
      - 'tests/ai-attachments/**'
      - 'infra/minio/Dockerfile'
      - 'playwright.ai-chat.config.ts'
      - 'playwright.ai-usage-overview.config.ts'
      - 'playwright.ai-native-streaming.config.ts'
      - 'packages/contracts/src/ai-usage-overview.ts'
      - 'packages/contracts/src/ai-own-quality.ts'
      - 'packages/authz/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ai-chat-focused.yml'
  workflow_dispatch:
    inputs:
      streaming_source_baseline:
        description: 'Run the isolated ASAI-15 source-baseline comparator once'
        type: boolean
        required: false
        default: false
  pull_request:
    paths:
      - 'apps/api/src/ai-*'
      - 'apps/api/src/ai-attachments/**'
      - 'apps/api/src/app.module.ts'
      - 'apps/api/src/app.factory.ts'
      - 'apps/api/src/abuse-protection.ts'
      - 'apps/api/src/abuse-protection.spec.ts'
      - 'apps/api/src/tokens.ts'
      - 'apps/api/src/seat-context.ts'
      - 'apps/api/src/account-verification.guard*'
      - 'apps/web/src/pages/ClassroomPage.tsx'
      - 'apps/web/src/components/ClassroomAiAccess.tsx'
      - 'apps/web/src/components/classroom-ai-access.css'
      - 'apps/web/src/ai/**'
      - 'apps/web/src/admin/AdminAiPage.tsx'
      - 'apps/web/src/admin/AiAdminWorkspace.tsx'
      - 'apps/web/src/admin/AdminAiUsageOverview.tsx'
      - 'apps/web/src/admin/AdminAiOwnQuality.tsx'
      - 'apps/web/src/admin/ai-own-quality.css'
      - 'apps/web/src/admin/admin-api.ts'
      - 'apps/web/src/admin/ai-admin-navigation.ts'
      - 'apps/web/src/admin/ai-usage-overview*'
      - 'apps/web/src/admin/ai-admin.css'
      - 'apps/web/src/admin/testing/ai-*.spec.ts'
      - 'apps/web/src/admin/admin-navigation.ts'
      - 'apps/web/src/App.tsx'
      - 'e2e/ai-*.spec.ts'
      - 'e2e/own-quality-real.spec.ts'
      - 'e2e/ai-usage-native-zoom.ts'
      - 'migrations/*_ai_*.sql'
      - 'tests/admin/ai-*.ts'
      - 'tests/ai-attachments/**'
      - 'infra/minio/Dockerfile'
      - 'playwright.ai-chat.config.ts'
      - 'playwright.ai-usage-overview.config.ts'
      - 'playwright.ai-native-streaming.config.ts'
      - 'packages/contracts/src/ai-usage-overview.ts'
      - 'packages/contracts/src/ai-own-quality.ts'
      - 'packages/authz/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ai-chat-focused.yml'

permissions:
  contents: read

concurrency:
  group: asa-ai-chat-${{ github.head_ref || github.ref_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.streaming_source_baseline == true && 'baseline' || 'candidate' }}
  cancel-in-progress: true

jobs:
  focused:
    if: github.event_name != 'workflow_dispatch' || inputs.streaming_source_baseline != true
    name: AI unit and API/Web types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NX_SKIP_NX_CACHE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build AI unit API and identity dependencies
        run: pnpm exec nx run-many -t build -p identity api --skip-nx-cache
      - name: AI Chat unit regression
        run: pnpm test:ai-chat
      - name: No unformatted files
        run: |
          pnpm exec prettier --check apps/api/src/ai-* apps/api/src/ai-attachments apps/api/src/app.factory.ts apps/api/src/abuse-protection.ts apps/api/src/abuse-protection.spec.ts apps/api/src/seat-context.ts apps/api/src/account-verification.guard* apps/web/src/components/ClassroomAiAccess.tsx apps/web/src/components/classroom-ai-access.css apps/web/src/ai apps/web/src/admin/testing/ai-*.spec.ts e2e/ai-*.spec.ts e2e/own-quality-real.spec.ts apps/web/src/admin/AdminAiOwnQuality.tsx apps/web/src/admin/ai-own-quality.css packages/contracts/src/ai-own-quality.ts tests/admin/ai-*.ts tests/ai-attachments package.json
          pnpm exec prettier --check --ignore-path /dev/null .github/workflows/ai-chat-focused.yml
      - name: API TypeScript
        run: pnpm exec nx run api:typecheck --skip-nx-cache
      - name: Web TypeScript
        run: pnpm exec nx run web:typecheck --skip-nx-cache

  database:
    if: github.event_name != 'workflow_dispatch' || inputs.streaming_source_baseline != true
    name: AI real PostgreSQL isolation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: docker.io/library/postgres@sha256:75adc2a65806c96bc0e59030230bfe3f1c1b0d6d8f8181a8913e2b8b53bdc166
        env:
          POSTGRES_DB: asa_ai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ai-focused-ci-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d asa_ai_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CI: 'true'
      NX_SKIP_NX_CACHE: 'true'
      TEST_DATABASE_URL: postgresql://postgres:ai-focused-ci-test@127.0.0.1:5432/asa_ai_test
      APP_TEST_DATABASE_URL: postgresql://asalab_app:ai-focused-ci-test@127.0.0.1:5432/asa_ai_test
      MIGRATION_DATABASE_URL: postgresql://postgres:ai-focused-ci-test@127.0.0.1:5432/asa_ai_test
      MIGRATION_EXPECT_DATABASE: asa_ai_test
      MIGRATION_CONFIRM: APPLY:asa_ai_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply all migrations to disposable database
        run: pnpm db:migrate
      - name: Provision only isolated runtime role
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE asalab_app WITH LOGIN PASSWORD 'ai-focused-ci-test'"
      - name: Build API identity contracts
        run: pnpm exec nx run-many -t build -p identity api --skip-nx-cache
      - name: AI cross-account security and provider persistence
        run: pnpm exec vitest run tests/admin/ai-*.pg.spec.ts

  storage:
    if: github.event_name != 'workflow_dispatch' || inputs.streaming_source_baseline != true
    name: AI real S3 attachment isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      ASA_AI_ATTACHMENTS_STORAGE_TEST: '1'
      ASA_AI_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ASA_OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:19000
      ASA_OBJECT_STORAGE_REGION: us-east-1
      ASA_OBJECT_STORAGE_BUCKET: ai-attachments-${{ github.run_id }}
      ASA_OBJECT_STORAGE_FORCE_PATH_STYLE: 'true'
      ASA_OBJECT_STORAGE_ACCESS_KEY: ai-attachments-ci-only
      ASA_OBJECT_STORAGE_SECRET_KEY: ai-attachments-ci-only-secret
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify exact storage fixture source and configuration
        run: |
          test "$(git rev-parse HEAD)" = "$ASA_AI_CANDIDATE_SHA"
          GITHUB_SHA="$ASA_AI_CANDIDATE_SHA" node --input-type=module -e \
            "import { readAiAttachmentFixtureEnvironment } from './tests/ai-attachments/minio-fixture.mjs'; readAiAttachmentFixtureEnvironment(process.env);"
      - name: Build pinned disposable MinIO
        run: |
          docker --host unix:///var/run/docker.sock build \
            --file infra/minio/Dockerfile \
            --tag "asa-ai-attachments-minio:${GITHUB_RUN_ID}" \
            infra/minio
      # Pass the checked-out head only to fixture processes; a PR event's
      # default GITHUB_SHA identifies its synthetic merge commit instead.
      - name: Start disposable attachment storage
        run: GITHUB_SHA="$ASA_AI_CANDIDATE_SHA" node tests/ai-attachments/minio-fixture.mjs start
      - name: Real S3 attachment cases and fixture guards
        run: GITHUB_SHA="$ASA_AI_CANDIDATE_SHA" pnpm test:ai-attachments:s3
      - name: Stop only the verified owned storage fixture
        if: always()
        run: GITHUB_SHA="$ASA_AI_CANDIDATE_SHA" node tests/ai-attachments/minio-fixture.mjs stop

  browser:
    if: github.event_name != 'workflow_dispatch' || inputs.streaming_source_baseline != true
    name: AI desktop and mobile browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: AI browser journeys without provider credentials
        run: pnpm e2e:ai-chat
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-chat-browser-${{ github.sha }}
          path: reports/playwright/ai-chat/
          if-no-files-found: ignore

  usage-overview-browser:
    if: github.event_name != 'workflow_dispatch' || inputs.streaming_source_baseline != true
    name: AI usage overview and native streaming real API and built Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: docker.io/library/postgres@sha256:75adc2a65806c96bc0e59030230bfe3f1c1b0d6d8f8181a8913e2b8b53bdc166
        env:
          POSTGRES_DB: asa_ai_overview_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ai-overview-isolated-ci-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d asa_ai_overview_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CI: 'true'
      NX_SKIP_NX_CACHE: 'true'
      NX_DAEMON: 'false'
      ASA_BUILD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      VITE_ASA_BUILD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      TEST_DATABASE_URL: postgresql://postgres:ai-overview-isolated-ci-test@127.0.0.1:5432/asa_ai_overview_test
      APP_TEST_DATABASE_URL: postgresql://asalab_app:ai-overview-isolated-ci-test@127.0.0.1:5432/asa_ai_overview_test
      MIGRATION_DATABASE_URL: postgresql://postgres:ai-overview-isolated-ci-test@127.0.0.1:5432/asa_ai_overview_test
      MIGRATION_EXPECT_DATABASE: asa_ai_overview_test
      MIGRATION_CONFIRM: APPLY:asa_ai_overview_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fresh isolated overview database
        run: |
          pnpm db:migrate
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE asalab_app WITH LOGIN PASSWORD 'ai-overview-isolated-ci-test'"
      - name: Build exact API and Web without cache
        run: pnpm exec nx run-many -t build -p identity api web --skip-nx-cache
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Real overview metrics, states, navigation and responsive screenshots
        run: pnpm exec playwright test --config playwright.ai-usage-overview.config.ts
      - name: ASAI-15 native streaming through built API and isolated PostgreSQL
        run: pnpm exec playwright test --config playwright.ai-native-streaming.config.ts
      - name: Preserve safe exact-SHA overview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-usage-overview-${{ github.event.pull_request.head.sha || github.sha }}
          path: reports/playwright/ai-usage-overview/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve safe native streaming browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-native-streaming-${{ github.event.pull_request.head.sha || github.sha }}
          path: reports/playwright/ai-native-streaming/
          if-no-files-found: ignore
          retention-days: 14

  usage-overview-source-baseline:
    # Owner-requested density comparison against the unchanged previous PR
    # candidate, with the same real PostgreSQL fixture and viewport sizes.
    # This comparator neither deploys a revision nor selects another task.
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'assistant/asai-01-')
    name: ASAI-01 pristine pre-density overview comparison
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: baseline
    services:
      postgres:
        image: docker.io/library/postgres@sha256:75adc2a65806c96bc0e59030230bfe3f1c1b0d6d8f8181a8913e2b8b53bdc166
        env:
          POSTGRES_DB: asa_ai_baseline_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ai-baseline-isolated-ci-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d asa_ai_baseline_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CI: 'true'
      NX_SKIP_NX_CACHE: 'true'
      NX_DAEMON: 'false'
      ASA_AI_OVERVIEW_BASELINE: 'true'
      ASA_BUILD_REVISION: 8934e542d767b52b5e0d763c5db4d9835fda916b
      VITE_ASA_BUILD_REVISION: 8934e542d767b52b5e0d763c5db4d9835fda916b
      TEST_DATABASE_URL: postgresql://postgres:ai-baseline-isolated-ci-test@127.0.0.1:5432/asa_ai_baseline_test
      APP_TEST_DATABASE_URL: postgresql://asalab_app:ai-baseline-isolated-ci-test@127.0.0.1:5432/asa_ai_baseline_test
      MIGRATION_DATABASE_URL: postgresql://postgres:ai-baseline-isolated-ci-test@127.0.0.1:5432/asa_ai_baseline_test
      MIGRATION_EXPECT_DATABASE: asa_ai_baseline_test
      MIGRATION_CONFIRM: APPLY:asa_ai_baseline_test
    steps:
      - name: Read candidate's narrow browser harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - name: Checkout unchanged product source baseline
        uses: actions/checkout@v4
        with:
          ref: 8934e542d767b52b5e0d763c5db4d9835fda916b
          path: baseline
          persist-credentials: false
      - name: Copy only the browser harness, preserve all baseline product sources
        run: |
          cp ../candidate/e2e/ai-usage-overview.spec.ts e2e/ai-usage-overview.spec.ts
          cp ../candidate/e2e/ai-usage-native-zoom.ts e2e/ai-usage-native-zoom.ts
          cp ../candidate/playwright.ai-usage-overview.config.ts playwright.ai-usage-overview.config.ts
          test "$(git rev-parse HEAD)" = "$ASA_BUILD_REVISION"
          git diff --exit-code -- apps contexts packages migrations package.json pnpm-lock.yaml
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: baseline/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Fresh isolated baseline database
        run: |
          pnpm db:migrate
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE asalab_app WITH LOGIN PASSWORD 'ai-baseline-isolated-ci-test'"
      - name: Build pristine baseline API and Web without cache
        run: pnpm exec nx run-many -t build -p identity api web --skip-nx-cache
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Capture authentic baseline desktop and mobile views
        run: pnpm exec playwright test --config playwright.ai-usage-overview.config.ts
      - name: Preserve source-baseline evidence with separate revision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-usage-before-density-8934e542-${{ github.event.pull_request.head.sha }}
          path: baseline/reports/playwright/ai-usage-overview/
          if-no-files-found: error
          retention-days: 14

  streaming-source-baseline:
    if: github.event_name == 'workflow_dispatch' && inputs.streaming_source_baseline == true
    name: ASAI-15 pristine buffered source comparison
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: baseline
    services:
      postgres:
        image: docker.io/library/postgres@sha256:75adc2a65806c96bc0e59030230bfe3f1c1b0d6d8f8181a8913e2b8b53bdc166
        env:
          POSTGRES_DB: asa_ai_stream_before_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ai-stream-before-ci-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d asa_ai_stream_before_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CI: 'true'
      NX_SKIP_NX_CACHE: 'true'
      NX_DAEMON: 'false'
      ASAI_STREAM_EXPECT_BUFFERED: 'true'
      ASA_BUILD_REVISION: 26c5a2cc3684fa16268058626e74a0ccf5ae2eaa
      VITE_ASA_BUILD_REVISION: 26c5a2cc3684fa16268058626e74a0ccf5ae2eaa
      TEST_DATABASE_URL: postgresql://postgres:ai-stream-before-ci-test@127.0.0.1:5432/asa_ai_stream_before_test
      APP_TEST_DATABASE_URL: postgresql://asalab_app:ai-stream-before-ci-test@127.0.0.1:5432/asa_ai_stream_before_test
      MIGRATION_DATABASE_URL: postgresql://postgres:ai-stream-before-ci-test@127.0.0.1:5432/asa_ai_stream_before_test
      MIGRATION_EXPECT_DATABASE: asa_ai_stream_before_test
      MIGRATION_CONFIRM: APPLY:asa_ai_stream_before_test
    steps:
      - name: Read candidate browser harness only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
      - name: Checkout unchanged source baseline
        uses: actions/checkout@v4
        with:
          ref: 26c5a2cc3684fa16268058626e74a0ccf5ae2eaa
          path: baseline
          persist-credentials: false
      - name: Copy narrow harness without modifying baseline product
        run: |
          cp ../candidate/e2e/ai-native-streaming-real.spec.ts e2e/ai-native-streaming-real.spec.ts
          cp ../candidate/playwright.ai-native-streaming.config.ts playwright.ai-native-streaming.config.ts
          test "$(git rev-parse HEAD)" = "$ASA_BUILD_REVISION"
          git diff --exit-code -- apps contexts packages migrations package.json pnpm-lock.yaml
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: baseline/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Fresh disposable source-baseline database
        run: |
          pnpm db:migrate
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE asalab_app WITH LOGIN PASSWORD 'ai-stream-before-ci-test'"
      - name: Build pristine baseline API and Web
        run: pnpm exec nx run-many -t build -p identity api web --skip-nx-cache
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Capture held first fragment from source baseline
        run: pnpm exec playwright test --config playwright.ai-native-streaming.config.ts
      - name: Preserve safe before sequence and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-native-streaming-before-26c5a2cc-${{ github.sha }}
          path: baseline/reports/playwright/ai-native-streaming/
          if-no-files-found: error
          retention-days: 14
