name: One-time Polza final formatting
on:
  push:
    branches:
      - feature/asa-polza-transcription-admin-20261029
    paths:
      - .github/workflows/polza-format-final.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exact changed files
        run: pnpm exec prettier --write apps/api/src/ai-polza.service.ts apps/api/src/ai-polza.controller.ts apps/api/src/ai-polza.spec.ts e2e/ai-generation-policy.spec.ts
      - name: Commit formatting if needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/api/src/ai-polza.service.ts apps/api/src/ai-polza.controller.ts apps/api/src/ai-polza.spec.ts e2e/ai-generation-policy.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(ai-polza): format final API and browser tests'
            git push origin 'HEAD:refs/heads/feature/asa-polza-transcription-admin-20261029'
          fi
