name: Classroom final source verification

"on":
  push:
    branches: ["assistant/classroom-owner-usability-20261011"]
    paths:
      - ".github/asa558-final-repair.cjs"
      - ".github/workflows/classroom-finalize-once.yml"

permissions:
  contents: read

concurrency:
  group: classroom-final-source-cleanup
  cancel-in-progress: false

env:
  CI: "true"
  NX_DAEMON: "false"
  NX_SKIP_NX_CACHE: "true"

jobs:
  publish-clean-source:
    if: github.repository == 'spikeal8-maker/asa-lab' && github.ref == 'refs/heads/assistant/classroom-owner-usability-20261011'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      head: ${{ steps.commit.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: node .github/asa558-final-repair.cjs
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format, remove temporary write tooling and publish normal source commit
        id: commit
        run: |
          node -e 'const cp=require("node:child_process"),fs=require("node:fs"); const files=JSON.parse(fs.readFileSync("/tmp/asa558-changed.json","utf8")); cp.execFileSync("pnpm",["exec","prettier","--write",...files],{stdio:"inherit"}); cp.execFileSync("git",["add","--",...files],{stdio:"inherit"});'
          git rm .github/asa558-final-repair.cjs .github/workflows/classroom-finalize-once.yml
          git diff --cached --check
          remote=$(git ls-remote origin refs/heads/assistant/classroom-owner-usability-20261011 | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(classrooms): finish readable settings and remove temporary repair tooling'
          git push origin HEAD:refs/heads/assistant/classroom-owner-usability-20261011
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  code-quality:
    needs: publish-clean-source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ASA_BUILD_REVISION: ${{ needs.publish-clean-source.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish-clean-source.outputs.head }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gate:code
  layout:
    needs: publish-clean-source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASA_BUILD_REVISION: ${{ needs.publish-clean-source.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish-clean-source.outputs.head }}
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec nx build web --skip-nx-cache
      - name: Save exact source and build
        run: |
          mkdir -p reports/final-repair
          git archive HEAD | gzip > reports/final-repair/source-current.tar.gz
          git rev-parse HEAD > reports/final-repair/head.txt
      - name: All screens, real glyph bounds, zoom and keyboard
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/reports/final-repair/layout.json
        run: pnpm exec playwright test --config playwright.settings-ui.config.ts e2e/classroom-layout-acceptance.spec.ts e2e/classroom-usability-ui.spec.ts e2e/classroom-owner-ui.spec.ts --reporter=list,json
      - name: Preserve all layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classroom-final-layout-${{ needs.publish-clean-source.outputs.head }}
          path: |
            reports/final-repair
            reports/playwright
            e2e/artifacts/owner-preview/classroom-layout-final
            apps/web/dist/build-metadata.json
          retention-days: 14
  full-data-and-browser:
    needs: publish-clean-source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ASA_BUILD_REVISION: ${{ needs.publish-clean-source.outputs.head }}
      TEST_DATABASE_URL: postgresql://postgres:classroom-owner-ci-isolated-test@127.0.0.1:5432/asa_access_a_test
      APP_TEST_DATABASE_URL: postgresql://asalab_app:classroom-owner-ci-isolated-test@127.0.0.1:5432/asa_access_a_test
      MIGRATION_DATABASE_URL: postgresql://postgres:classroom-owner-ci-isolated-test@127.0.0.1:5432/asa_access_a_test
      MIGRATION_EXPECT_DATABASE: asa_access_a_test
      MIGRATION_CONFIRM: APPLY:asa_access_a_test
      VITEST_MAX_WORKERS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish-clean-source.outputs.head }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Migrate isolated PostgreSQL and verify restricted application role
        id: database
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER ROLE postgres WITH PASSWORD 'classroom-owner-ci-isolated-test'"
          sudo -u postgres createdb asa_access_a_test
          pnpm db:migrate
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE asalab_app WITH LOGIN PASSWORD 'classroom-owner-ci-isolated-test'"
          role=$(psql "$APP_TEST_DATABASE_URL" -Atqc "SELECT current_user || ':' || rolsuper || ':' || rolbypassrls FROM pg_roles WHERE rolname=current_user")
          test "$role" = "asalab_app:false:false"
      - name: Complete database gate, not a selected subset
        run: |
          mkdir -p reports/final-repair
          set -o pipefail
          pnpm gate:data 2>&1 | tee reports/final-repair/postgresql.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classroom-final-data-${{ needs.publish-clean-source.outputs.head }}
          path: reports/final-repair
          retention-days: 14
      - name: Real classroom teacher and pupil journeys
        if: ${{ !cancelled() && steps.database.outcome == 'success' }}
        run: pnpm e2e:access-a
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classroom-final-journeys-${{ needs.publish-clean-source.outputs.head }}
          path: |
            reports/playwright
            e2e/artifacts/owner-preview
            apps/web/dist/build-metadata.json
          retention-days: 14
      - name: Complete existing settings and navigation suite
        if: ${{ !cancelled() && steps.database.outcome == 'success' }}
        run: pnpm e2e:settings-ui
      - name: Preserve final verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classroom-final-all-${{ needs.publish-clean-source.outputs.head }}
          path: |
            reports/final-repair
            reports/playwright
            e2e/artifacts/owner-preview
            apps/web/dist/build-metadata.json
          retention-days: 14
      - name: Stop disposable test database
        if: always()
        run: sudo systemctl stop postgresql.service
