name: Temporary smol-toml security pin

on:
  push:
    branches:
      - chore/smol-toml-security-pin

permissions:
  contents: write

jobs:
  update-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
      - name: Pin patched transitive dependency
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.pnpm ??= {};
          pkg.pnpm.overrides ??= {};
          pkg.pnpm.overrides['smol-toml@<=1.7.0'] = '1.8.0';
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          pnpm install --lockfile-only --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify patched resolution
        shell: bash
        run: |
          test "$(node -p "require('./package.json').pnpm.overrides['smol-toml@<=1.7.0']")" = "1.8.0"
          grep -q "smol-toml@1.8.0" pnpm-lock.yaml
          if grep -q "smol-toml@1.6.1" pnpm-lock.yaml; then
            echo 'Old vulnerable resolution remains in lockfile' >&2
            exit 1
          fi
      - name: Commit generated lock update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'No dependency changes required.'
            exit 0
          fi
          git commit -m 'security: pin smol-toml 1.8.0'
          git push origin HEAD:chore/smol-toml-security-pin
