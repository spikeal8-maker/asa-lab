name: AI conversational management formatter
"on":
  push:
    branches:
      - feature/ai-chat-gpt-integration-20261014
    paths:
      - .github/workflows/ai-management-formatter-once.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'spikeal8-maker/asa-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-chat-gpt-integration-20261014
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Canonical format
        run: |
          set -euo pipefail
          pnpm exec prettier --write apps/api/src/ai-chat.service.ts apps/api/src/ai-chat.controller.ts apps/web/src/ai/AiChatPage.tsx apps/web/src/ai/izo-chat-design.css tests/admin/ai-chat.pg.spec.ts e2e/ai-chat.spec.ts
          pnpm exec prettier --check apps/api/src/ai-chat.service.ts apps/api/src/ai-chat.controller.ts apps/web/src/ai/AiChatPage.tsx apps/web/src/ai/izo-chat-design.css tests/admin/ai-chat.pg.spec.ts e2e/ai-chat.spec.ts
          git diff --check
          git add -- apps/api/src/ai-chat.service.ts apps/api/src/ai-chat.controller.ts apps/web/src/ai/AiChatPage.tsx apps/web/src/ai/izo-chat-design.css tests/admin/ai-chat.pg.spec.ts e2e/ai-chat.spec.ts
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(ai): normalize new conversation management code'
            git push origin HEAD:refs/heads/feature/ai-chat-gpt-integration-20261014
          fi
