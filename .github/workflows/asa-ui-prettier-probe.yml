name: Temporary ASA UI formatting diff

"on":
  push:
    branches:
      - assistant/asa-shared-tabs-and-feedback-20261015
    paths:
      - .github/workflows/asa-ui-prettier-probe.yml

permissions:
  contents: read

jobs:
  exact-prettier:
    name: Format six UI files and show exact diff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Exact upstream Prettier diff (read-only repository)
        run: |
          pnpm exec prettier --write \
            apps/web/src/admin/AdminPage.tsx \
            apps/web/src/components/system-feedback.ts \
            apps/web/src/components/system-tabs.css \
            apps/web/src/pages/ClassroomPage.tsx \
            apps/web/src/pages/DashboardPage.tsx \
            apps/web/src/pages/MyProjectsPage.tsx
          git diff --no-ext-diff -- \
            apps/web/src/admin/AdminPage.tsx \
            apps/web/src/components/system-feedback.ts \
            apps/web/src/components/system-tabs.css \
            apps/web/src/pages/ClassroomPage.tsx \
            apps/web/src/pages/DashboardPage.tsx \
            apps/web/src/pages/MyProjectsPage.tsx
