name: ASA Real Host Acceptance
run-name: Real host ${{ github.event.pull_request.head.sha || github.sha }}

'on':
  pull_request:
    paths:
      - 'asa-setup.sh'
      - 'tools/asa_cli.py'
      - 'tools/asa_setup*.py'
      - 'tools/deployment/**'
      - '.github/workflows/setup-realhost.yml'
      - 'docs/deployment/SETUP_REALHOST_ACCEPTANCE.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: asa-realhost-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  realhost:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      NX_SKIP_NX_CACHE: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Measure the disposable runner before installing anything
        run: python3 tools/deployment/ci_setup_realhost.py --revision "$SOURCE_REVISION" --preflight-only
      - name: Install VM tools only in this standard disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ubuntu-keyring gpgv age acl
      - name: Real Ubuntu and 1Panel with public ASA commands and guest reboot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/deployment/ci_setup_realhost.py --revision "$SOURCE_REVISION"
      - name: Preserve only the allowlisted evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: asa-realhost-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/setup-realhost/evidence.json
          if-no-files-found: error
          retention-days: 30
