name: Temporary Electronics D1-D6 Prettier Repair

on:
  push:
    branches:
      - codex/electronics-natural-wire-routing-377
    paths:
      - '.github/workflows/electronics-d1-d6-prettier-repair.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/electronics-natural-wire-routing-377
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only D1-D6 changed files
        run: >-
          pnpm exec prettier --write
          apps/web/src/electronics/WorkbenchHeader.tsx
          apps/web/src/electronics/use-electronics-workbench.ts
          apps/web/src/electronics/workbench.css
          e2e/electronics-interactions.spec.ts
      - name: Commit formatted files and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             apps/web/src/electronics/WorkbenchHeader.tsx             apps/web/src/electronics/use-electronics-workbench.ts             apps/web/src/electronics/workbench.css             e2e/electronics-interactions.spec.ts
          git rm .github/workflows/electronics-d1-d6-prettier-repair.yml
          git commit -m "style(electronics): format owner D1-D6 repair"
          git push origin HEAD:codex/electronics-natural-wire-routing-377
