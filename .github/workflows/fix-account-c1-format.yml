name: Fix account C1 heading format

on:
  push:
    branches:
      - bot/fix-account-c1-format

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Normalize heading expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('e2e/account-c1.spec.ts')
          text = path.read_text()
          old = "  await expect(\n    page.getByRole('heading', { name: 'Идея есть? Сделай её.' }),\n  ).toBeVisible();"
          new = "  await expect(page.getByRole('heading', { name: 'Идея есть? Сделай её.' })).toBeVisible();"
          if old not in text:
              raise SystemExit('heading block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit exact formatting patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/account-c1.spec.ts
          git commit -m "style(test): normalize account C1 heading expectation"
          git push
