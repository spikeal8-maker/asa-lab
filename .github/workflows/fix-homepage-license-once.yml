name: Fix homepage license label once
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-homepage-license-once.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add required public source label
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/GitHub →/Исходный код · AGPL-3.0 →/' apps/web/src/pages/PublicEntryPage.tsx
          grep -F 'Исходный код · AGPL-3.0' apps/web/src/pages/PublicEntryPage.tsx
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/src/pages/PublicEntryPage.tsx
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ASA Lab automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/pages/PublicEntryPage.tsx
          git commit -m "fix(web): restore public AGPL source notice"
          git push origin HEAD:main
