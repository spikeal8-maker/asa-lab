name: Classroom final clean acceptance

"on":
  push:
    branches: ["assistant/classroom-owner-usability-20261011"]
    paths: [".github/workflows/classroom-verified-format.yml"]

permissions:
  contents: read

env:
  CI: "true"
  NX_DAEMON: "false"
  NX_SKIP_NX_CACHE: "true"

jobs:
  publish:
    if: github.repository == 'spikeal8-maker/asa-lab' && github.ref == 'refs/heads/assistant/classroom-owner-usability-20261011'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      head: ${{ steps.commit.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply two final non-semantic corrections and remove this temporary workflow
        id: commit
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const p = 'apps/web/src/modules/classroom-usability.css';
          const s = fs.readFileSync(p, 'utf8');
          const marker = '/* Medium content keeps four full pupil rows visible without shrinking text. */';
          if (s.includes(marker)) throw Error('Already applied');
          fs.writeFileSync(p, s.trimEnd() + '\n\n' + marker + '\n@container classroom (min-width: 551px) and (max-width: 959px) {\n  .classroom-owner-workspace.classroom-workspace .classroom-roster-toolbar {\n    margin-bottom: 6px;\n  }\n}\n');
          JS
          pnpm exec prettier --write apps/web/src/modules/classroom-usability.css e2e/student-access-cards.spec.ts
          git add apps/web/src/modules/classroom-usability.css e2e/student-access-cards.spec.ts
          git rm .github/workflows/classroom-verified-format.yml
          git diff --cached --check
          remote=$(git ls-remote origin refs/heads/assistant/classroom-owner-usability-20261011 | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(classrooms): preserve four visible pupil rows and normalized regression formatting'
          git push origin HEAD:refs/heads/assistant/classroom-owner-usability-20261011
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  code:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ASA_BUILD_REVISION: ${{ needs.publish.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.head }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml jsonschema
      - run: pnpm install --frozen-lockfile
      - run: pnpm gate:code
  layout:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASA_BUILD_REVISION: ${{ needs.publish.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.head }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec nx build web --skip-nx-cache
      - name: Exact source snapshot
        run: |
          mkdir -p reports/final-repair
          git rev-parse HEAD > reports/final-repair/head.txt
          git archive HEAD | gzip > reports/final-repair/source-current.tar.gz
      - name: Complete visible-text and all-screen acceptance
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/reports/final-repair/layout.json
        run: pnpm exec playwright test --config playwright.settings-ui.config.ts e2e/classroom-layout-acceptance.spec.ts e2e/classroom-usability-ui.spec.ts e2e/classroom-owner-ui.spec.ts --reporter=list,json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classroom-clean-layout-${{ needs.publish.outputs.head }}
          path: |
            reports/final-repair
            reports/playwright
            e2e/artifacts/owner-preview/classroom-layout-final
            apps/web/dist/build-metadata.json
          retention-days: 14
  full-data-and-browser:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TEST_DATABASE_URL: postgresql://postgres:classroom-owner-ci-isolated-test@127.0.0.1:5432/asa_access_a_test
      APP_TEST_DATABASE_URL: postgresql://asalab_app:classroom-owner-ci-isolated-test@127.0.0.1:5432/asa_access_a_test
      MIGRATION_DATABASE_URL: postgresql://postgres:classroom-owner-ci-isolated-test@127.0.0.1:5432/asa_access_a_test
      MIGRATION_EXPECT_DATABASE: asa_access_a_test
      MIGRATION_CONFIRM: APPLY:asa_access_a_test
      VITEST_MAX_WORKERS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.head }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
        env:
          ASA_BUILD_REVISION: ${{ needs.publish.outputs.head }}
      - name: Isolated PostgreSQL and restricted application role
        id: database
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER ROLE postgres WITH PASSWORD 'classroom-owner-ci-isolated-test'"
          sudo -u postgres createdb asa_access_a_test
          pnpm db:migrate
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE asalab_app WITH LOGIN PASSWORD 'classroom-owner-ci-isolated-test'"
          role=$(psql "$APP_TEST_DATABASE_URL" -Atqc "SELECT current_user || ':' || rolsuper || ':' || rolbypassrls FROM pg_roles WHERE rolname=current_user")
          test "$role" = "asalab_app:false:false"
      - name: Complete data gate under its standard test environment
        run: |
          mkdir -p reports/final-repair
          set -o pipefail
          env -u ASA_BUILD_REVISION pnpm gate:data 2>&1 | tee reports/final-repair/postgresql.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classroom-clean-data-${{ needs.publish.outputs.head }}
          path: reports/final-repair
          retention-days: 14
      - name: Real teacher and pupil journeys
        if: ${{ !cancelled() && steps.database.outcome == 'success' }}
        run: pnpm e2e:access-a
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classroom-clean-journeys-${{ needs.publish.outputs.head }}
          path: |
            reports/playwright
            e2e/artifacts/owner-preview
            apps/web/dist/build-metadata.json
          retention-days: 14
      - name: Related course journeys
        if: ${{ !cancelled() && steps.database.outcome == 'success' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/reports/final-repair/courses.json
        run: pnpm exec playwright test e2e/learning-course-01.spec.ts --grep 'matrix 30|private authored course' --workers=1 --reporter=list,json
      - name: Complete existing settings and navigation suite
        if: ${{ !cancelled() && steps.database.outcome == 'success' }}
        run: pnpm e2e:settings-ui
      - name: Save full verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classroom-clean-all-${{ needs.publish.outputs.head }}
          path: |
            reports/final-repair
            reports/playwright
            e2e/artifacts/owner-preview
            apps/web/dist/build-metadata.json
          retention-days: 14
      - name: Stop disposable test database
        if: always()
        run: sudo systemctl stop postgresql.service
