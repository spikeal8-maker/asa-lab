name: Temporary Prettier Diff 691

on:
  push:
    branches:
      - codex/projects-editorial-featured-20261022
    paths:
      - .github/workflows/projects-prettier-preview-691.yml

permissions:
  contents: read

jobs:
  exact-format-diff:
    name: Exact project Prettier patch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact formatting differences only
        run: |
          pnpm exec prettier --write tests/portal/public-project-moderation.pg.spec.ts
          echo '===PRETTIER_PATCH_BEGIN==='
          git -c color.ui=false diff -- tests/portal/public-project-moderation.pg.spec.ts
          echo '===PRETTIER_PATCH_END==='
          pnpm exec prettier --check tests/portal/public-project-moderation.pg.spec.ts
