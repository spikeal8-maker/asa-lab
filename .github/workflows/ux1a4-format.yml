name: UX1A4 GitHub Formatter

on:
  push:
    branches:
      - ux/learning-reference-window-385

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format UX1A4 files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/AssignmentBrief.tsx \
            apps/web/src/components/task-image-reference-window-layout.ts \
            e2e/learning-learner-submits-project-assignment.spec.ts \
            tests/courses/task-image-reference-window-layout.spec.ts
          echo "BRIEF_B64=$(base64 -w0 apps/web/src/components/AssignmentBrief.tsx)"
          echo "LAYOUT_B64=$(base64 -w0 apps/web/src/components/task-image-reference-window-layout.ts)"
          echo "E2E_B64=$(base64 -w0 e2e/learning-learner-submits-project-assignment.spec.ts)"
          echo "LAYOUT_TEST_B64=$(base64 -w0 tests/courses/task-image-reference-window-layout.spec.ts)"
