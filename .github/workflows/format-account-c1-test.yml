name: Format account C1 test

on:
  push:
    branches:
      - bot/format-account-c1-test

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write e2e/account-c1.spec.ts
      - name: Commit formatted test
        run: |
          if git diff --quiet -- e2e/account-c1.spec.ts; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/account-c1.spec.ts
          git commit -m "style(test): format account C1 journey"
          git push
