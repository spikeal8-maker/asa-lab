# Isolated timing diagnostic for #836. This branch is not a merge candidate.
name: Electronics Arduino trace diagnostic
run-name: 'Electronics Arduino 1 ms trace ABBA (${{ github.sha }})'

on:
  push:
    branches:
      - codex/electronics-548-current-diagnostic
  workflow_dispatch:

permissions:
  contents: read

env:
  NX_SKIP_NX_CACHE: 'true'

jobs:
  browser:
    if: github.ref == 'refs/heads/codex/electronics-548-current-diagnostic'
    name: Arduino 1 ms full and light tracing on the same runner
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CI: 'true'
      ASA_BUILD_REVISION: c1d768211ed3fdff5a47dfe9ab9779f02c2294f4
      ASA_ELECTRONICS_EXPECTED_SHA: c1d768211ed3fdff5a47dfe9ab9779f02c2294f4
      ASA_ELECTRONICS_QUALIFICATION_PROFILE: strict-real-time
      ASA_ELECTRONICS_FAILURE_REPORT: 'true'
      ASA_IMAGE_TAG: c1d768211ed3fdff5a47dfe9ab9779f02c2294f4
      COMPOSE_PROJECT_NAME: asa-lab-electronics-trace-${{ github.run_id }}
      ASA_TEST_UID: '1000'
      ASA_TEST_GID: '1000'
    steps:
      - name: Checkout diagnostic
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove unchanged production and test inputs from the pinned main
        run: |
          git merge-base --is-ancestor "$ASA_BUILD_REVISION" HEAD
          git diff --exit-code "$ASA_BUILD_REVISION" HEAD -- . \
            ':!.github/workflows/electronics-ui-679-557.yml' ':!playwright.config.ts'
          mkdir -p e2e/artifacts/electronics-simulation reports/electronics-trace-abba
          chmod -R 0777 e2e/artifacts reports
          jq -n --arg source "$ASA_BUILD_REVISION" --arg diagnostic "$(git rev-parse HEAD)" \
            '{production_source: $source, diagnostic_commit: $diagnostic}' \
            > reports/electronics-trace-abba/provenance.json

      - name: Prepare and verify image-only PostgreSQL transport
        run: |
          python3 tools/test_ci_image_transport.py --prepare-electronics-postgres
          python3 tools/test_ci_image_transport.py --electronics-compose-model-check

      - name: Build isolated Electronics browser images
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/asa-electronics-postgres.yaml" --profile test
          build --build-arg NODE_IMAGE=mirror.gcr.io/library/node@sha256:43aeff40f4afc22e83f7589a2f37e111cff5ca84529571f1c8415bcc5fcc21b2 --build-arg CADDY_IMAGE=mirror.gcr.io/library/caddy@sha256:d8c17a862962def15cde69863a3a463f25a2664942eafd7bdbf050e9c3116b83 --build-arg BUILDKIT_SYNTAX=mirror.gcr.io/docker/dockerfile@sha256:b5f3b260a9678e1d83d2fce86eeddf79420b79147eaba2a25986f47133d73720 migration api web test-runner

      - name: Verify original base layers and exact source revision
        run: python3 tools/test_ci_image_transport.py --electronics-built-images

      - name: Start isolated PostgreSQL
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/asa-electronics-postgres.yaml" --profile test
          up -d --wait --wait-timeout 120 postgres

      - name: Verify original PostgreSQL image identity
        run: python3 tools/test_ci_image_transport.py --electronics-pulled-postgres

      - name: Apply isolated migrations
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/asa-electronics-postgres.yaml" --profile test
          run --rm --no-deps migration

      - name: Start Electronics API and Web without unrelated media services
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/asa-electronics-postgres.yaml" --profile test
          up -d --wait --wait-timeout 240 --no-deps api web

      - name: Run the unchanged Arduino 1 ms scenario in ABBA order
        shell: bash
        run: |
          compose=(docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml
            -f "$RUNNER_TEMP/asa-electronics-postgres.yaml" --profile test)
          root=reports/electronics-trace-abba
          artifact_mount="$RUNNER_TEMP/electronics-trace-artifacts.yaml"
          cat > "$artifact_mount" <<'YAML'
          services:
            test-runner:
              volumes:
                - type: bind
                  source: "${ASA_TRACE_TRIAL_ARTIFACTS:?}"
                  target: /workspace/e2e/artifacts
          YAML
          failure_report=reports/electronics-failures.ndjson
          title='Owner Arduino temporal: delay 1 ms, independent optical integrals and stable loaded-image brightness$'
          docker image inspect --format '{{.Id}} {{range .RepoTags}}{{.}} {{end}}' \
            "asa-lab-api:$ASA_IMAGE_TAG" "asa-lab-web:$ASA_IMAGE_TAG" "asa-lab-test:$ASA_IMAGE_TAG" \
            > "$root/images.txt"
          printf 'order\ttrace\texit_code\tevidence\n' > "$root/status.tsv"

          result=0
          index=0
          for trace_variant in full light light full; do
            index=$((index + 1))
            trial="$root/$index-$trace_variant"
            static_har="reports/.electronics-static-trace-$index.har"
            mkdir -m 0777 -- "$trial" "$trial/test-artifacts"
            export ASA_TRACE_TRIAL_ARTIFACTS="$PWD/$trial/test-artifacts"
            test_artifacts="$trial/test-artifacts/electronics-simulation/ready-cadence-539"
            "${compose[@]}" -f "$artifact_mount" config --format json |
              jq -e --arg host "$ASA_TRACE_TRIAL_ARTIFACTS" '
                .services["test-runner"].volumes
                | any(.[]; .target == "/workspace/e2e/artifacts" and .source == $host)
              ' >/dev/null
            if "${compose[@]}" -f "$artifact_mount" run --rm --no-deps -e NX_SKIP_NX_CACHE=true \
              -e ASA_ELECTRONICS_EXPECTED_SHA -e ASA_ELECTRONICS_QUALIFICATION_PROFILE \
              -e ASA_ELECTRONICS_FAILURE_REPORT -e "ASA_ELECTRONICS_DIAGNOSTIC_TRACE=$trace_variant" \
              -e "ASA_ELECTRONICS_DIAGNOSTIC_STATIC_HAR=$static_har" test-runner \
              pnpm exec playwright test e2e/electronics-ready-cadence.spec.ts --workers=1 \
              --grep "$title" --output "$trial/playwright" 2>&1 | tee "$trial/playwright.log"; then
              trial_exit=0
            else
              trial_exit=$?
              result=1
            fi
            if [[ -f "$failure_report" ]]; then
              mv -- "$failure_report" "$trial/electronics-failures.ndjson"
            fi

            evidence=complete
            if [[ ! -s "$static_har" ]] || ! jq -e '
              .log.entries
              | map({
                  path: (.request.url | sub("^https?://[^/]+"; "") | split("?")[0] | split("#")[0]),
                  method: .request.method,
                  status: .response.status,
                  started_at: .startedDateTime,
                  duration_ms: .time
                })
              | map(select(.path | test("^/assets/(electronics/|simulation[.]worker-[A-Za-z0-9_-]+[.]js$)")))
              | select(length > 0)
            ' "$static_har" > "$trial/static-network.json"; then
              evidence=missing
              result=1
            fi
            # The raw HAR is outside the upload root even if filtering fails.
            rm -f -- "$static_har"
            trace_files=("$trial"/playwright/*/trace.zip)
            if [[ ! -s "$test_artifacts/owner-r18-blink-1-raw.json" ||
                  ! -s "$test_artifacts/owner-r18-blink-1-frame.png" ||
                  ! -s "$trial/electronics-failures.ndjson" || ! -s "${trace_files[0]}" ]]; then
              evidence=missing
              result=1
            fi
            printf '%s\t%s\t%s\t%s\n' "$index" "$trace_variant" "$trial_exit" "$evidence" \
              >> "$root/status.tsv"
          done
          cat "$root/status.tsv"
          exit "$result"

      - name: Show isolated stack state
        if: always()
        run: docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/asa-electronics-postgres.yaml" --profile test ps -a

      - name: Upload diagnostic receipts and browser trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electronics-trace-abba-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/electronics-trace-abba
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove isolated test stack
        if: always()
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/asa-electronics-postgres.yaml" --profile test
          down -v --remove-orphans
