# Isolated Worker timing diagnostic for #682.
name: Electronics Arduino Worker phase diagnostic
run-name: 'Electronics long10000 Worker phases (${{ github.sha }})'

on:
  push:
    branches:
      - codex/electronics-548-current-diagnostic
  workflow_dispatch:

permissions:
  contents: read

env:
  NX_SKIP_NX_CACHE: 'true'

jobs:
  browser:
    if: github.ref == 'refs/heads/codex/electronics-548-current-diagnostic'
    name: Native long10000 with Worker phase timestamps
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CI: 'true'
      ASA_DIAGNOSTIC_BASE_SHA: dbba985c65b831ead0e7ce041cfcee8bc9bb63fb
      ASA_BUILD_REVISION: ${{ github.sha }}
      ASA_ELECTRONICS_EXPECTED_SHA: ${{ github.sha }}
      ASA_ELECTRONICS_QUALIFICATION_PROFILE: strict-real-time
      ASA_ELECTRONICS_FAILURE_REPORT: 'true'
      ASA_IMAGE_TAG: ${{ github.sha }}
      COMPOSE_PROJECT_NAME: asa-lab-electronics-trace-${{ github.run_id }}
      ASA_TEST_UID: '1000'
      ASA_TEST_GID: '1000'
    steps:
      - name: Checkout diagnostic
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Check diagnostic scope against the pinned source
        run: |
          test "$(git rev-parse HEAD)" = "$ASA_BUILD_REVISION"
          git merge-base --is-ancestor "$ASA_DIAGNOSTIC_BASE_SHA" HEAD
          git diff --exit-code "$ASA_DIAGNOSTIC_BASE_SHA" HEAD -- . \
            ':!.github/workflows/electronics-ui-679-557.yml' ':!playwright.config.ts' \
            ':!apps/web/src/electronics/simulation.worker.ts' \
            ':!apps/web/src/electronics/simulation-worker-evaluator.ts' \
            ':!e2e/electronics-interactions.spec.ts'
          mkdir -p e2e/artifacts/electronics-simulation reports/electronics-worker-phase-682
          chmod -R 0777 e2e/artifacts reports
          jq -n --arg source "$ASA_DIAGNOSTIC_BASE_SHA" --arg diagnostic "$ASA_BUILD_REVISION" \
            '{production_source: $source, diagnostic_commit: $diagnostic, trial: "long10000"}' \
            > reports/electronics-worker-phase-682/provenance.json

      - name: Prepare and verify image-only PostgreSQL transport
        run: |
          python3 tools/test_ci_image_transport.py --prepare-electronics-postgres
          python3 tools/test_ci_image_transport.py --electronics-compose-model-check

      - name: Build isolated Electronics browser images
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/asa-electronics-postgres.yaml" --profile test
          build --build-arg NODE_IMAGE=mirror.gcr.io/library/node@sha256:43aeff40f4afc22e83f7589a2f37e111cff5ca84529571f1c8415bcc5fcc21b2 --build-arg CADDY_IMAGE=mirror.gcr.io/library/caddy@sha256:d8c17a862962def15cde69863a3a463f25a2664942eafd7bdbf050e9c3116b83 --build-arg BUILDKIT_SYNTAX=mirror.gcr.io/docker/dockerfile@sha256:b5f3b260a9678e1d83d2fce86eeddf79420b79147eaba2a25986f47133d73720 migration api web test-runner

      - name: Verify original base layers and exact source revision
        run: python3 tools/test_ci_image_transport.py --electronics-built-images

      - name: Start isolated PostgreSQL
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/asa-electronics-postgres.yaml" --profile test
          up -d --wait --wait-timeout 120 postgres

      - name: Verify original PostgreSQL image identity
        run: python3 tools/test_ci_image_transport.py --electronics-pulled-postgres

      - name: Apply isolated migrations
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/asa-electronics-postgres.yaml" --profile test
          run --rm --no-deps migration

      - name: Start Electronics API and Web without unrelated media services
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/asa-electronics-postgres.yaml" --profile test
          up -d --wait --wait-timeout 240 --no-deps api web

      - name: Run the original strict long10000 scenario once
        shell: bash
        run: |
          compose=(docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml
            -f "$RUNNER_TEMP/asa-electronics-postgres.yaml" --profile test)
          root=reports/electronics-worker-phase-682
          title='long10000: strict real time and acknowledged native evidence$'
          docker image inspect --format '{{.Id}} {{range .RepoTags}}{{.}} {{end}}' \
            "asa-lab-api:$ASA_IMAGE_TAG" "asa-lab-web:$ASA_IMAGE_TAG" "asa-lab-test:$ASA_IMAGE_TAG" \
            > "$root/images.txt"
          if "${compose[@]}" run --rm --no-deps -e NX_SKIP_NX_CACHE=true \
            -e ASA_ELECTRONICS_EXPECTED_SHA -e ASA_ELECTRONICS_QUALIFICATION_PROFILE \
            -e ASA_ELECTRONICS_FAILURE_REPORT test-runner \
            pnpm exec playwright test e2e/electronics-interactions.spec.ts --workers=1 \
            --grep "$title" --output "$root/playwright"; then
            trial_exit=0
          else
            trial_exit=$?
          fi
          journals=("$root"/playwright/*/realtime-682-native.jsonl)
          evidence=missing
          if [[ -s "${journals[0]}" ]]; then
            evidence=retained
          fi
          printf 'playwright_exit\traw_journal\n%s\t%s\n' "$trial_exit" "$evidence" > "$root/status.tsv"
          cat "$root/status.tsv"
          if [[ "$evidence" != retained && "$trial_exit" == 0 ]]; then
            exit 1
          fi
          exit "$trial_exit"

      - name: Show isolated stack state
        if: always()
        run: docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/asa-electronics-postgres.yaml" --profile test ps -a

      - name: Upload the raw journal and isolated timing receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electronics-worker-phase-682-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/electronics-worker-phase-682/provenance.json
            reports/electronics-worker-phase-682/images.txt
            reports/electronics-worker-phase-682/status.tsv
            reports/electronics-worker-phase-682/playwright/**/realtime-682-native.jsonl
            reports/electronics-worker-phase-682/playwright/**/realtime-682.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove isolated test stack
        if: always()
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/asa-electronics-postgres.yaml" --profile test
          down -v --remove-orphans
