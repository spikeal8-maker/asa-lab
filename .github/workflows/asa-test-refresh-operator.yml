name: ASA Lab Test Refresh Operator

on:
  pull_request:
    paths:
      - 'tools/asa_test_refresh.py'
      - 'tools/test_asa_test_refresh.py'
      - 'docs/deployment/ASA_TEST_REFRESH_OPERATOR.md'
      - '.github/workflows/asa-test-refresh-operator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-safety:
    name: Python source/restore safety (no credentials, no Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax and import check
        run: python3 -m py_compile tools/asa_test_refresh.py tools/test_asa_test_refresh.py

      - name: Offline safety regression suite
        run: python3 -m unittest tools.test_asa_test_refresh -v

      - name: No private files in diff
        shell: bash
        run: |
          ! git ls-files | grep -E '(^|/)(\\.env|private\\.env|.+\\.age|age-identity\\.private)$'
