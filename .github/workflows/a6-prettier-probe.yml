name: A6 Prettier Probe

on:
  push:
    branches:
      - diag/a6-prettier-probe-20260915

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format target file and print exact diff
        run: |
          pnpm exec prettier --write tests/courses/learning-class-session-attendance.pg.spec.ts
          git diff -- tests/courses/learning-class-session-attendance.pg.spec.ts
