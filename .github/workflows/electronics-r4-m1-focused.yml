name: Electronics R12 Operating Point Exact Directed

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NX_SKIP_NX_CACHE: 'true'

concurrency:
  group: electronics-r12-operating-point-directed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused:
    name: Shared solver, editor contracts and build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: f610333e6cbf6ac6ebbdbeb9b7edbfaf9ba417dc
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      # One gate per result: the same command a local agent and an owner
      # evidence run invoke. Do not inline its steps here.
      - name: Focused Electronics M1 gate
        run: pnpm gate:electronics-m1


  browser:
    needs: focused
    name: Five unchanged generic and owner Arduino timing cases ONLY
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      ASA_BUILD_REVISION: f610333e6cbf6ac6ebbdbeb9b7edbfaf9ba417dc
      ASA_IMAGE_TAG: f610333e6cbf6ac6ebbdbeb9b7edbfaf9ba417dc
      COMPOSE_PROJECT_NAME: asa-lab-electronics-${{ github.run_id }}
      ASA_TEST_UID: '1000'
      ASA_TEST_GID: '1000'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: f610333e6cbf6ac6ebbdbeb9b7edbfaf9ba417dc
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare writable evidence directories
        run: |
          mkdir -p e2e/artifacts/electronics-simulation reports
          chmod -R 0777 e2e/artifacts reports

      - name: Verify pinned PostgreSQL identity and prepare CI-only transport
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; assert 'public.ecr.aws/docker/library/postgres@sha256:e9243ab06e47223dedeb3c129fa9ece8d37f506bdc6ee943afb9335f98bb4854' in Path('.github/compose.registry-ci.yaml').read_text()"
          printf 'services:\n  postgres:\n    image: docker.io/library/postgres@sha256:e9243ab06e47223dedeb3c129fa9ece8d37f506bdc6ee943afb9335f98bb4854\n' > "$RUNNER_TEMP/electronics-postgres-transport.yaml"

      - name: Build isolated Electronics browser images
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/electronics-postgres-transport.yaml" --profile test
          build --build-arg NODE_IMAGE=docker.io/library/node@sha256:43aeff40f4afc22e83f7589a2f37e111cff5ca84529571f1c8415bcc5fcc21b2 --build-arg CADDY_IMAGE=docker.io/library/caddy@sha256:d8c17a862962def15cde69863a3a463f25a2664942eafd7bdbf050e9c3116b83 --build-arg BUILDKIT_SYNTAX=mirror.gcr.io/docker/dockerfile@sha256:b5f3b260a9678e1d83d2fce86eeddf79420b79147eaba2a25986f47133d73720 migration api web test-runner

      - name: Start isolated PostgreSQL
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/electronics-postgres-transport.yaml" --profile test
          up -d --wait --wait-timeout 120 postgres

      - name: Apply isolated migrations
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/electronics-postgres-transport.yaml" --profile test
          run --rm --no-deps migration

      - name: Start Electronics API and Web without unrelated media services
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/electronics-postgres-transport.yaml" --profile test
          up -d --wait --wait-timeout 240 --no-deps api web

      - name: Verify actual candidate checkout and built Web revision
        run: |
          test "$(git rev-parse HEAD)" = "$ASA_BUILD_REVISION"
          curl --fail --silent http://127.0.0.1:4612/build-metadata.json > reports/owner-arduino-timing-build-metadata.json
          python3 -c "import json,os; assert json.load(open('reports/owner-arduino-timing-build-metadata.json'))['revision'] == os.environ['ASA_BUILD_REVISION']"
          git rev-parse HEAD > reports/owner-arduino-timing-source-sha.txt
          sha256sum pnpm-lock.yaml compose.yaml compose.test.yaml .github/compose.registry-ci.yaml > reports/owner-arduino-timing-inputs.sha256

      - name: Five Arduino timing journeys NOT ordinary browser gate
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/electronics-postgres-transport.yaml" --profile test
          run --rm --no-deps test-runner
          pnpm exec playwright test e2e/electronics-ready-cadence.spec.ts --workers=1

      - name: Show isolated stack state
        if: always()
        run: |
          cp "$RUNNER_TEMP/electronics-postgres-transport.yaml" reports/compose.postgres-transport.yaml
          sha256sum reports/compose.postgres-transport.yaml > reports/compose.postgres-transport.sha256
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/electronics-postgres-transport.yaml" --profile test ps -a

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electronics-r4-m1-browser-${{ github.run_id }}
          path: |
            e2e/artifacts/electronics-simulation
            reports
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove isolated test stack
        if: always()
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/electronics-postgres-transport.yaml" --profile test
          down -v --remove-orphans
