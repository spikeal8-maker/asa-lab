name: Electronics 531 Directed Readiness Diagnostic ONLY

on:
  pull_request:
    paths:
      - 'compose.test.yaml'
      - 'apps/api/src/origin-policy.ts'
      - 'apps/api/src/app.factory.ts'
      - 'AGENTS.md'
      - 'contexts/electronics/**'
      - 'apps/web/src/electronics/**'
      - 'apps/web/src/pages/SchematicEditor.tsx'
      - 'apps/web/vite.config.ts'
      - 'apps/web/tsconfig.json'
      - 'e2e/electronics-simulation.spec.ts'
      - 'e2e/electronics-interactions.spec.ts'
      - 'tests/electronics/**'
      - 'tools/run-electronics-benchmark.mjs'
      - 'tools/run-electronics-browser-benchmark.mjs'
      - 'tools/run-electronics-load-benchmark.mjs'
      - 'tools/run-electronics-memory-benchmark.mjs'
      - 'tools/update-electronics-benchmark-golden.mjs'
      - 'docs/delivery/evidence/electronics-opt0/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/electronics-r4-m1-focused.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NX_SKIP_NX_CACHE: 'true'

concurrency:
  group: electronics-r4-m1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Directed pending-SDK readiness diagnostic ONLY
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      ASA_BUILD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      ASA_IMAGE_TAG: ${{ github.event.pull_request.head.sha || github.sha }}
      COMPOSE_PROJECT_NAME: asa-lab-electronics-${{ github.run_id }}
      ASA_TEST_UID: '1000'
      ASA_TEST_GID: '1000'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare writable evidence directories
        run: |
          mkdir -p e2e/artifacts/electronics-simulation reports
          chmod -R 0777 e2e/artifacts reports

      - name: Build isolated Electronics browser images
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml --profile test
          build migration api web test-runner

      - name: Start isolated PostgreSQL
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml --profile test
          up -d --wait --wait-timeout 120 postgres

      - name: Apply isolated migrations
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml --profile test
          run --rm --no-deps migration

      - name: Start Electronics API and Web without unrelated media services
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml --profile test
          up -d --wait --wait-timeout 240 --no-deps api web

      # Temporary directed diagnosis only; NOT the registered browser gate.
      # Final source ref retains the byte-identical ordinary workflow.
      # No diagnostic workflow history is integrated into that source ref.
      - name: Directed single-profile diagnostic (NOT browser gate)
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml --profile test
          run --rm --no-deps test-runner
          pnpm exec playwright test e2e/electronics-interactions.spec.ts
          --grep 'BREADBOARD_PROFILE large board with a rigid two-pin part$'

      - name: Show isolated stack state
        if: always()
        run: docker compose -f compose.yaml -f compose.test.yaml --profile test ps -a

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electronics-r4-m1-browser-${{ github.run_id }}
          path: |
            e2e/artifacts/electronics-simulation
            reports
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove isolated test stack
        if: always()
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml --profile test
          down -v --remove-orphans
