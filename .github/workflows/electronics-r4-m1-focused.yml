name: Electronics R4-M1 Focused
run-name: Electronics R4-M1 ${{ inputs.qualification_profile || 'strict-real-time' }} ${{ github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
    paths:
      - 'compose.test.yaml'
      - '.github/compose.registry-ci.yaml'
      - 'tools/test_ci_image_transport.py'
      - 'docs/product/electronics/evidence/ci-image-transport-classroom-d13-receipt.json'
      - 'apps/api/src/origin-policy.ts'
      - 'apps/api/src/app.factory.ts'
      - 'AGENTS.md'
      - 'contexts/electronics/**'
      - 'apps/web/src/electronics/**'
      - 'apps/web/src/pages/SchematicEditor.tsx'
      - 'apps/web/vite.config.ts'
      - 'apps/web/tsconfig.json'
      - 'e2e/electronics-simulation.spec.ts'
      - 'e2e/electronics-simulation-time.spec.ts'
      - 'e2e/electronics-interactions.spec.ts'
      - 'e2e/electronics-piezo-clock.spec.ts'
      - 'e2e/electronics-native-wheel.spec.ts'
      - 'e2e/electronics-ready-cadence.spec.ts'
      - 'e2e/electronics-classroom-timing.spec.ts'
      - 'tests/electronics/**'
      - 'tools/run-electronics-classroom-browser.mjs'
      - 'tools/run-electronics-benchmark.mjs'
      - 'tools/run-electronics-browser-benchmark.mjs'
      - 'tools/electronics-benchmark-assets*.mjs'
      - 'tools/electronics-failure-reporter.mjs'
      - 'tools/electronics-runner-timing.py'
      - 'tools/electronics-clock-reference.py'
      - 'playwright.config.ts'
      - 'tools/run-electronics-load-benchmark.mjs'
      - 'tools/run-electronics-memory-benchmark.mjs'
      - 'tools/update-electronics-benchmark-golden.mjs'
      - 'docs/delivery/evidence/electronics-opt0/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/electronics-r4-m1-focused.yml'
  workflow_dispatch:
    inputs:
      qualification_profile:
        description: Explicit browser qualification; strict real-time remains the default
        required: false
        type: choice
        default: strict-real-time
        options:
          - strict-real-time
          - classroom-d13-v2
          - classroom-d13-v3
          - arduino-editor-error

permissions:
  contents: read

env:
  NX_SKIP_NX_CACHE: 'true'

concurrency:
  group: electronics-r4-m1-${{ github.event.pull_request.number || github.ref }}-${{ inputs.qualification_profile || 'strict-real-time' }}
  cancel-in-progress: true

jobs:
  focused:
    if: ${{ inputs.qualification_profile != 'arduino-editor-error' }}
    name: Shared solver, editor contracts and build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      # One gate per result: the same command a local agent and an owner
      # evidence run invoke. Do not inline its steps here.
      - name: Focused Electronics M1 gate
        run: pnpm gate:electronics-m1

      - name: Mandatory classroom qualification adversarial tests
        run: pnpm exec vitest run tests/electronics/classroom-qualification.spec.ts --maxWorkers=1

  benchmark:
    name: Electronics E-OPT benchmark integrity
    needs: focused
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for benchmark probes
        run: pnpm exec playwright install --with-deps chromium

      # Performance timings are evidence only at E-OPT-0. This gate fails on
      # execution errors, status drift, golden-result drift or nondeterminism;
      # it deliberately has no millisecond threshold yet.
      - name: Electronics E-OPT quick benchmark suite
        run: pnpm benchmark:electronics:ci

      - name: Upload E-OPT benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electronics-e-opt-${{ github.run_id }}
          path: |
            reports/electronics-opt0-*.json
            reports/electronics-opt0-*.md
          if-no-files-found: ignore
          retention-days: 14

  browser:
    name: Actual editor live simulation journey (${{ matrix.browser_case.label }})
    needs: focused
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (inputs.qualification_profile || 'strict-real-time') == 'strict-real-time' && 75 || 50 }}
    strategy:
      fail-fast: false
      matrix:
        # Keep the two classroom qualifications whole and preserve the
        # arduino-editor-error dispatch. Four strict shards run the universal
        # cases. All five assigned runners can qualify for the reference cases.
        browser_case: >-
          ${{ fromJSON(
              (inputs.qualification_profile == 'classroom-d13-v2' ||
              inputs.qualification_profile == 'classroom-d13-v3' ||
              inputs.qualification_profile == 'arduino-editor-error') &&
              '[{"label":"whole","shard":""}]' ||
              '[{"label":"s1","shard":"1/4"},{"label":"s2","shard":"2/4"},{"label":"s3","shard":"3/4"},{"label":"s4","shard":"4/4"},{"label":"arduino-realtime","shard":""}]'
            ) }}
    env:
      CI: 'true'
      ASA_BUILD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      ASA_ELECTRONICS_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ASA_ELECTRONICS_FAILURE_REPORT: 'true'
      ASA_ELECTRONICS_QUALIFICATION_PROFILE: ${{ inputs.qualification_profile || 'strict-real-time' }}
      ASA_ELECTRONICS_BROWSER_GATE: ${{ inputs.qualification_profile == 'classroom-d13-v3' && 'gate:electronics-classroom-d13-v3:browser' || inputs.qualification_profile == 'classroom-d13-v2' && 'gate:electronics-classroom-d13:browser' || 'gate:electronics-m1:browser' }}
      ASA_ELECTRONICS_BROWSER_SHARD: ${{ matrix.browser_case.shard }}
      ASA_ELECTRONICS_BROWSER_FILTER: ${{ matrix.browser_case.shard != '' && '--grep-invert' || '' }}
      ASA_IMAGE_TAG: ${{ github.event.pull_request.head.sha || github.sha }}
      COMPOSE_PROJECT_NAME: asa-lab-electronics-${{ github.run_id }}-${{ matrix.browser_case.label }}
      ASA_TEST_UID: '1000'
      ASA_TEST_GID: '1000'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare writable evidence directories
        run: |
          mkdir -p e2e/artifacts/electronics-simulation reports
          chmod -R 0777 e2e/artifacts reports

      - name: Prepare and verify image-only PostgreSQL transport
        run: |
          python3 tools/test_ci_image_transport.py --prepare-electronics-postgres
          python3 tools/test_ci_image_transport.py --electronics-compose-model-check

      - name: Build isolated Electronics browser images
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/asa-electronics-postgres.yaml" --profile test
          build --build-arg NODE_IMAGE=mirror.gcr.io/library/node@sha256:43aeff40f4afc22e83f7589a2f37e111cff5ca84529571f1c8415bcc5fcc21b2 --build-arg CADDY_IMAGE=mirror.gcr.io/library/caddy@sha256:d8c17a862962def15cde69863a3a463f25a2664942eafd7bdbf050e9c3116b83 --build-arg BUILDKIT_SYNTAX=mirror.gcr.io/docker/dockerfile@sha256:b5f3b260a9678e1d83d2fce86eeddf79420b79147eaba2a25986f47133d73720 migration api web test-runner

      - name: Verify original base layers and exact source revision
        run: python3 tools/test_ci_image_transport.py --electronics-built-images

      - name: Start isolated PostgreSQL
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/asa-electronics-postgres.yaml" --profile test
          up -d --wait --wait-timeout 120 postgres

      - name: Verify original PostgreSQL image identity
        run: python3 tools/test_ci_image_transport.py --electronics-pulled-postgres

      - name: Apply isolated migrations
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/asa-electronics-postgres.yaml" --profile test
          run --rm --no-deps migration

      - name: Start Electronics API and Web without unrelated media services
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/asa-electronics-postgres.yaml" --profile test
          up -d --wait --wait-timeout 240 --no-deps api web

      - name: Sample strict browser runner resources before qualification
        if: ${{ env.ASA_ELECTRONICS_QUALIFICATION_PROFILE == 'strict-real-time' }}
        continue-on-error: true
        run: python3 tools/electronics-runner-timing.py host before >> reports/electronics-runner-host-timing.ndjson

      - name: Prequalify assigned Electronics clock runner
        if: ${{ env.ASA_ELECTRONICS_QUALIFICATION_PROFILE == 'strict-real-time' }}
        env:
          COHORT_SLOT: ${{ matrix.browser_case.label }}
        run: |
          mkdir -p reports/cohort
          chmod 0777 reports/cohort
          python3 -c 'import json,sys; print(json.dumps(sys.argv[1:]))' \
            "$ASA_ELECTRONICS_EXPECTED_SHA" "$COHORT_SLOT" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > reports/cohort/identity.json
          pattern="$(python3 tools/electronics-clock-reference.py pattern)"
          printf 'ASA_ELECTRONICS_REALTIME_TITLES=%s\n' "$pattern" >> "$GITHUB_ENV"
          compose=(docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/asa-electronics-postgres.yaml" --profile test)
          "${compose[@]}" run --rm --no-deps -T test-runner \
            python3 tools/electronics-runner-timing.py test-runner before > reports/cohort/assignment.json
          if [[ -n "$ASA_ELECTRONICS_BROWSER_SHARD" ]]; then
            "${compose[@]}" run --rm --no-deps -T -e NX_SKIP_NX_CACHE=true test-runner \
              python3 tools/electronics-clock-reference.py roster "$ASA_ELECTRONICS_BROWSER_SHARD" reports/cohort/universal-roster.json
          fi

      # Identical to the command registered in docs/testing/active-task-tests.yaml.
      # Named as its own gate because `gate:electronics-m1` deliberately does not
      # include it: that gate needs no browser stack, this one does.
      - name: Selected Electronics browser qualification
        id: selected_electronics_browser
        if: ${{ matrix.browser_case.label != 'arduino-realtime' && matrix.browser_case.label != 's3' }}
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/asa-electronics-postgres.yaml" --profile test
          run --rm --no-deps -e NX_SKIP_NX_CACHE=true -e ASA_ELECTRONICS_EXPECTED_SHA -e ASA_ELECTRONICS_QUALIFICATION_PROFILE -e ASA_ELECTRONICS_FAILURE_REPORT test-runner
          pnpm "$ASA_ELECTRONICS_BROWSER_GATE" ${ASA_ELECTRONICS_BROWSER_SHARD:+--shard=$ASA_ELECTRONICS_BROWSER_SHARD} ${ASA_ELECTRONICS_BROWSER_FILTER:+--workers=1 "$ASA_ELECTRONICS_BROWSER_FILTER" "$ASA_ELECTRONICS_REALTIME_TITLES"}

      - name: Sample strict browser runner resources after qualification
        if: ${{ always() && env.ASA_ELECTRONICS_QUALIFICATION_PROFILE == 'strict-real-time' }}
        continue-on-error: true
        run: python3 tools/electronics-runner-timing.py host after >> reports/electronics-runner-host-timing.ndjson

      - name: Show isolated stack state
        if: always()
        run: docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/asa-electronics-postgres.yaml" --profile test ps -a

      # The journal is flushed after each test, including before a job cancellation.
      # Keep it separately readable when retained traces make the full archive large.
      - name: Upload incremental browser failure evidence
        if: ${{ always() && matrix.browser_case.label != 'arduino-realtime' && matrix.browser_case.label != 's3' }}
        uses: actions/upload-artifact@v4
        with:
          name: electronics-r4-m1-failures-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.browser_case.label }}
          path: reports/electronics-failures.ndjson
          if-no-files-found: error
          retention-days: 14

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electronics-r4-m1-browser-${{ github.run_id }}-${{ matrix.browser_case.label }}
          path: |
            e2e/artifacts/electronics-simulation
            reports
          if-no-files-found: ignore
          retention-days: 14

      - name: Run all strict clock cases on each prequalified runner
        if: ${{ always() && env.ASA_ELECTRONICS_QUALIFICATION_PROFILE == 'strict-real-time' }}
        timeout-minutes: 30
        env:
          ORIGINAL_GATE_OUTCOME: ${{ steps.selected_electronics_browser.outcome }}
        run: |
          if [[ -n "$ASA_ELECTRONICS_BROWSER_SHARD" ]]; then
            python3 -c 'import json,os; print(json.dumps(os.environ["ORIGINAL_GATE_OUTCOME"]))' > reports/cohort/universal-exit.json
            if [[ -f reports/electronics-failures.ndjson ]]; then
              cp reports/electronics-failures.ndjson reports/cohort/universal.ndjson
            fi
          fi
          class="$(python3 tools/electronics-clock-reference.py classify reports/cohort/assignment.json)"
          if [[ "$class" != reference ]]; then
            printf 'Clock reference assignment: %s\n' "$class"
            exit 0
          fi
          output="$RUNNER_TEMP/asa-electronics-clock-reference"
          mkdir -p "$output/reports" "$output/artifacts"
          chmod 0777 "$output/reports" "$output/artifacts"
          compose=(docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/asa-electronics-postgres.yaml" --profile test)
          code=0
          "${compose[@]}" run --rm --no-deps -e NX_SKIP_NX_CACHE=true \
            -e ASA_ELECTRONICS_EXPECTED_SHA -e ASA_ELECTRONICS_QUALIFICATION_PROFILE \
            --volume "$output/reports:/workspace/reports" \
            --volume "$output/artifacts:/workspace/e2e/artifacts" \
            test-runner python3 tools/electronics-clock-reference.py reference || code=$?
          printf '%s\n' "$code" > reports/cohort/reference-exit.json
          if [[ -f "$output/reports/reference-before.json" ]]; then
            cp "$output/reports/reference-before.json" reports/cohort/reference-before.json
          fi
          if [[ -f "$output/reports/electronics-failures.ndjson" ]]; then
            cp "$output/reports/electronics-failures.ndjson" reports/cohort/reference.ndjson
          fi
          exit "$code"

      - name: Upload separate clock-reference qualification
        if: ${{ always() && env.ASA_ELECTRONICS_QUALIFICATION_PROFILE == 'strict-real-time' }}
        uses: actions/upload-artifact@v4
        with:
          name: electronics-r4-m1-clock-reference-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.browser_case.label }}
          path: ${{ runner.temp }}/asa-electronics-clock-reference
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify actual simulation pace under load
        if: >-
          ${{ always() && matrix.browser_case.label == 's4' &&
              env.ASA_ELECTRONICS_QUALIFICATION_PROFILE == 'strict-real-time' }}
        timeout-minutes: 3
        shell: bash
        run: |
          output="$RUNNER_TEMP/asa-electronics-overload/reports"
          mkdir -p "$output"
          chmod 0777 "$output"
          compose=(docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/asa-electronics-postgres.yaml" --profile test)
          "${compose[@]}" run --rm --no-deps -e NX_SKIP_NX_CACHE=true --volume "$output:/workspace/reports" \
            test-runner node apps/web/src/electronics/testing/simulation-speed.browser.mjs --overload

      - name: Upload actual simulation pace under load evidence
        if: >-
          ${{ always() && matrix.browser_case.label == 's4' &&
              env.ASA_ELECTRONICS_QUALIFICATION_PROFILE == 'strict-real-time' }}
        uses: actions/upload-artifact@v4
        with:
          name: electronics-r4-m1-overload-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/asa-electronics-overload/reports/electronics-overload
          if-no-files-found: error
          retention-days: 14

      - name: Verify actual simulation pace on a slow CPU
        if: >-
          ${{ always() && matrix.browser_case.label == 's4' &&
              env.ASA_ELECTRONICS_QUALIFICATION_PROFILE == 'strict-real-time' }}
        timeout-minutes: 3
        shell: bash
        run: |
          output="$RUNNER_TEMP/asa-electronics-slow-cpu/reports"
          mkdir -p "$output"
          chmod 0777 "$output"
          compose=(docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/asa-electronics-postgres.yaml" --profile test)
          "${compose[@]}" run --rm --no-deps -e NX_SKIP_NX_CACHE=true --volume "$output:/workspace/reports" \
            test-runner node apps/web/src/electronics/testing/simulation-speed.browser.mjs --slow-cpu

      - name: Upload actual simulation pace on a slow CPU evidence
        if: >-
          ${{ always() && matrix.browser_case.label == 's4' &&
              env.ASA_ELECTRONICS_QUALIFICATION_PROFILE == 'strict-real-time' }}
        uses: actions/upload-artifact@v4
        with:
          name: electronics-r4-m1-slow-cpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/asa-electronics-slow-cpu/reports/electronics-slow-cpu
          if-no-files-found: error
          retention-days: 14

      - name: Collect generic pace proof receipts
        if: ${{ always() && matrix.browser_case.label == 's4' && env.ASA_ELECTRONICS_QUALIFICATION_PROFILE == 'strict-real-time' }}
        run: |
          cp "$RUNNER_TEMP/asa-electronics-overload/reports/electronics-overload/receipt.json" reports/cohort/overload-receipt.json
          cp "$RUNNER_TEMP/asa-electronics-slow-cpu/reports/electronics-slow-cpu/receipt.json" reports/cohort/slow-cpu-receipt.json

      - name: Upload cohort journal
        if: ${{ always() && env.ASA_ELECTRONICS_QUALIFICATION_PROFILE == 'strict-real-time' }}
        uses: actions/upload-artifact@v4
        with:
          name: electronics-r4-m1-cohort-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.browser_case.label }}
          path: reports/cohort
          if-no-files-found: error
          retention-days: 14

      - name: Remove isolated test stack
        if: always()
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/asa-electronics-postgres.yaml" --profile test
          down -v --remove-orphans

  clock-qualification:
    name: Complete strict Electronics qualification
    needs: browser
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PROFILE: ${{ inputs.qualification_profile || 'strict-real-time' }}
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BROWSER_RESULT: ${{ needs.browser.result }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ env.PROFILE == 'strict-real-time' }}
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        if: ${{ env.PROFILE == 'strict-real-time' }}
        with:
          pattern: electronics-r4-m1-cohort-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: cohort

      - name: Verify exact universal and reference coverage
        if: ${{ always() && env.PROFILE == 'strict-real-time' }}
        run: |
          mkdir -p assigned
          for slot in s1 s2 s3 s4 arduino-realtime; do
            path="cohort/electronics-r4-m1-cohort-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$slot"
            if [[ -d "$path" ]]; then
              mv "$path" "assigned/$slot"
            fi
          done
          python3 tools/electronics-clock-reference.py aggregate "$EXPECTED_SHA" assigned \
            clock-qualification.json "$BROWSER_RESULT" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

      - uses: actions/upload-artifact@v4
        if: ${{ always() && env.PROFILE == 'strict-real-time' }}
        with:
          name: electronics-r4-m1-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: clock-qualification.json
          if-no-files-found: error
          retention-days: 14

  review-images:
    name: Package exact-head review images
    needs: [focused, benchmark, browser, clock-qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ASA_BUILD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      ASA_IMAGE_TAG: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Build exact API and Web review images
        run: docker compose -f compose.yaml -f .github/compose.registry-ci.yaml build --build-arg NODE_IMAGE=mirror.gcr.io/library/node@sha256:43aeff40f4afc22e83f7589a2f37e111cff5ca84529571f1c8415bcc5fcc21b2 --build-arg CADDY_IMAGE=mirror.gcr.io/library/caddy@sha256:d8c17a862962def15cde69863a3a463f25a2664942eafd7bdbf050e9c3116b83 --build-arg BUILDKIT_SYNTAX=mirror.gcr.io/docker/dockerfile@sha256:b5f3b260a9678e1d83d2fce86eeddf79420b79147eaba2a25986f47133d73720 api web

      - name: Verify original base layers for review images
        run: python3 tools/test_ci_image_transport.py --electronics-built-images

      - name: Verify exact revision labels
        shell: bash
        run: |
          set -euo pipefail
          api_revision="$(docker image inspect --format='{{ index .Config.Labels "org.opencontainers.image.revision" }}' "asa-lab-api:${ASA_IMAGE_TAG}")"
          web_revision="$(docker image inspect --format='{{ index .Config.Labels "org.opencontainers.image.revision" }}' "asa-lab-web:${ASA_IMAGE_TAG}")"
          test "$api_revision" = "$ASA_BUILD_REVISION"
          test "$web_revision" = "$ASA_BUILD_REVISION"

      - name: Export ready-to-load review images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p review-images
          docker save "asa-lab-api:${ASA_IMAGE_TAG}" | gzip -1 > "review-images/asa-lab-api-${ASA_IMAGE_TAG}.tar.gz"
          docker save "asa-lab-web:${ASA_IMAGE_TAG}" | gzip -1 > "review-images/asa-lab-web-${ASA_IMAGE_TAG}.tar.gz"
          printf 'revision=%s\napi=%s\nweb=%s\n' \
            "$ASA_BUILD_REVISION" \
            "asa-lab-api:${ASA_IMAGE_TAG}" \
            "asa-lab-web:${ASA_IMAGE_TAG}" > review-images/MANIFEST.txt
          sha256sum review-images/*.tar.gz > review-images/SHA256SUMS

      - name: Upload exact-head review images
        uses: actions/upload-artifact@v4
        with:
          name: electronics-review-images-${{ github.run_id }}
          path: review-images
          if-no-files-found: error
          retention-days: 14

  editor-messages:
    if: ${{ inputs.qualification_profile == 'arduino-editor-error' }}
    name: Actual vendor messages and built editor (API fixture)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CI: 'true'
      NX_SKIP_NX_CACHE: 'true'
      VITE_ASA_BUILD_REVISION: ${{ github.sha }}
      ASA_E2E_EXTERNAL: 'true'
      ASA_E2E_BASE_URL: http://127.0.0.1:4612
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nx build module-sdk
      - name: Actual vendor regression and unchanged persistence
        run: >-
          pnpm exec vitest run
          apps/web/src/electronics/testing/arduino-block-messages.spec.ts
          apps/web/src/electronics/testing/arduino-code-panel-persistence.spec.ts
          apps/web/src/electronics/testing/arduino-code-contract.spec.ts
          --maxWorkers=1
      - run: pnpm exec nx run web:typecheck
      - run: pnpm exec nx run web:build
      # The shared interactions file imports teacher seed helpers at discovery;
      # this profile never calls them, but their compiled identity import exists.
      - run: pnpm exec nx build identity
      - run: pnpm exec playwright install --with-deps chromium
      - name: Native workspace menus at four viewports
        run: |
          mkdir -p reports/interactions
          pnpm exec vite preview -c apps/web/vite.config.ts --host 127.0.0.1 --port 4612 --strictPort > reports/arduino-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4612/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4612/ > /dev/null
          pnpm exec playwright test e2e/electronics-interactions.spec.ts --grep 'Arduino workspace messages:' --workers=1
      - name: Preserve exact-run browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arduino-editor-messages-${{ github.sha }}
          path: reports
          if-no-files-found: ignore
          retention-days: 14
