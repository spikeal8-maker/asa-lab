name: Electronics R10 Frozen Worker and Exact Page CPU Diagnostic ONLY

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NX_SKIP_NX_CACHE: 'true'

concurrency:
  group: electronics-r10-worker-page-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser:
    name: One unchanged GPIO initial and cookies-reopen CPU diagnostic ONLY
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      ASA_BUILD_REVISION: 9df144e48165ee330ea43f547e2d52782964bd54
      ASA_IMAGE_TAG: 9df144e48165ee330ea43f547e2d52782964bd54
      COMPOSE_PROJECT_NAME: asa-lab-electronics-${{ github.run_id }}
      ASA_TEST_UID: '1000'
      ASA_TEST_GID: '1000'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: 9df144e48165ee330ea43f547e2d52782964bd54
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare writable evidence directories
        run: |
          mkdir -p e2e/artifacts/electronics-simulation reports
          chmod -R 0777 e2e/artifacts reports

      - name: Verify pinned PostgreSQL identity and prepare CI-only transport
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; assert 'public.ecr.aws/docker/library/postgres@sha256:e9243ab06e47223dedeb3c129fa9ece8d37f506bdc6ee943afb9335f98bb4854' in Path('.github/compose.registry-ci.yaml').read_text()"
          printf 'services:\n  postgres:\n    image: docker.io/library/postgres@sha256:e9243ab06e47223dedeb3c129fa9ece8d37f506bdc6ee943afb9335f98bb4854\n' > "$RUNNER_TEMP/electronics-postgres-transport.yaml"

      - name: Build isolated Electronics browser images
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/electronics-postgres-transport.yaml" --profile test
          build --build-arg NODE_IMAGE=docker.io/library/node@sha256:43aeff40f4afc22e83f7589a2f37e111cff5ca84529571f1c8415bcc5fcc21b2 --build-arg CADDY_IMAGE=docker.io/library/caddy@sha256:d8c17a862962def15cde69863a3a463f25a2664942eafd7bdbf050e9c3116b83 --build-arg BUILDKIT_SYNTAX=mirror.gcr.io/docker/dockerfile@sha256:b5f3b260a9678e1d83d2fce86eeddf79420b79147eaba2a25986f47133d73720 migration api web test-runner

      - name: Start isolated PostgreSQL
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/electronics-postgres-transport.yaml" --profile test
          up -d --wait --wait-timeout 120 postgres

      - name: Apply isolated migrations
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/electronics-postgres-transport.yaml" --profile test
          run --rm --no-deps migration

      - name: Start Electronics API and Web without unrelated media services
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/electronics-postgres-transport.yaml" --profile test
          up -d --wait --wait-timeout 240 --no-deps api web

      - name: Verify actual candidate checkout and built Web revision
        run: |
          test "$(git rev-parse HEAD)" = "$ASA_BUILD_REVISION"
          curl --fail --silent http://127.0.0.1:4612/build-metadata.json > reports/owner-arduino-timing-build-metadata.json
          python3 -c "import json,os; assert json.load(open('reports/owner-arduino-timing-build-metadata.json'))['revision'] == os.environ['ASA_BUILD_REVISION']"
          git rev-parse HEAD > reports/owner-arduino-timing-source-sha.txt
          sha256sum pnpm-lock.yaml compose.yaml compose.test.yaml .github/compose.registry-ci.yaml > reports/owner-arduino-timing-inputs.sha256

      # Canonical selection SHA is recorded before any dispatch; built product remains exact9df.
      - name: Freeze production identity and extract diagnostic-only instrumentation
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$ASA_BUILD_REVISION" -- apps/web contexts package.json pnpm-lock.yaml compose.yaml compose.test.yaml .github/compose.registry-ci.yaml Dockerfile.web Dockerfile.api playwright.config.ts e2e/electronics-ready-cadence.spec.ts
          git rev-parse "$ASA_BUILD_REVISION^{tree}" > reports/profile-production-tree.txt
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/electronics-postgres-transport.yaml" --profile test exec -T web sha256sum /srv/assets/simulation.worker-UAINFPw3.js > reports/profile-expected-worker.sha256
          test "$(cut -d ' ' -f 1 reports/profile-expected-worker.sha256)" = 56e995b8419b2265243e9adeab26e1e279f5f884397c8c6116fd59b7f1947b43
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/electronics-postgres-transport.yaml" --profile test images --format json > reports/profile-image-identities-before.json
          printf '%s\n' '${{ github.sha }}' > reports/profile-diagnostic-sha.txt
          printf '%s\n' '6bf3b9541be435c94f0156c3b8958f2b8320f729' > reports/profile-canonical-selection-sha.txt
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json
          target = Path('reports/profile-src')
          target.mkdir(parents=True, exist_ok=True)
          payloads = {'production-worker-profile.ts': '', 'electronics-ready-cadence.spec.ts': '', 'control-flow-proof.json': ''}
          manifest=[]
          for name, payload in payloads.items():
              data=base64.b64decode(payload)
              (target/name).write_bytes(data)
              manifest.append({'file':name,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)})
          original=Path('e2e/electronics-ready-cadence.spec.ts').read_bytes()
          proof=json.loads((target/'control-flow-proof.json').read_text())
          assert hashlib.sha256(original).hexdigest()==proof['originalSpecSha256']
          assert proof['reversibleInsertionIdentity']=='PASS'
          Path('reports/profile-instrumentation.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY

      - name: One original GPIO journey under CDP CPU sampling NOT acceptance gate
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/electronics-postgres-transport.yaml" --profile test
          run --rm --no-deps
          -e ASA_546_CPU_PROFILE=true
          -e ASA_546_EXPECTED_WORKER_SHA="$(cut -d ' ' -f 1 reports/profile-expected-worker.sha256)"
          -v "$PWD/reports/profile-src/production-worker-profile.ts:/workspace/e2e/production-worker-profile.ts:ro"
          -v "$PWD/reports/profile-src/electronics-ready-cadence.spec.ts:/workspace/e2e/electronics-ready-cadence.spec.ts:ro"
          test-runner pnpm exec playwright test e2e/electronics-ready-cadence.spec.ts
          --grep 'Canonical ready cadence: gpio sketch saved, observed completely and reopened with cookies only$'
          --workers=1

      - name: Verify immutable Worker and exact sampled page body identities after diagnostic
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/electronics-postgres-transport.yaml" --profile test exec -T web sha256sum /srv/assets/simulation.worker-UAINFPw3.js > reports/profile-actual-worker-after.sha256
          cmp reports/profile-expected-worker.sha256 reports/profile-actual-worker-after.sha256
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/electronics-postgres-transport.yaml" --profile test images --format json > reports/profile-image-identities-after.json
          cmp reports/profile-image-identities-before.json reports/profile-image-identities-after.json
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from urllib.parse import urlsplit
          import os, subprocess, json
          cmd=['docker','compose','-f','compose.yaml','-f','compose.test.yaml','-f','.github/compose.registry-ci.yaml','-f',os.environ['RUNNER_TEMP']+'/electronics-postgres-transport.yaml','--profile','test','exec','-T','web','sha256sum']
          receipts=[]
          profiles=list(Path('e2e/artifacts/electronics-simulation/ready-cadence').glob('gpio-*-profile-metadata.json'))
          if not profiles:
              profiles=list(Path('e2e/artifacts/electronics-simulation').rglob('gpio-*-profile-metadata.json'))
          assert profiles, 'No profile metadata retained'
          for metadata in profiles:
              data=json.loads(metadata.read_text())
              for row in data['scriptBodies']:
                  path=PurePosixPath(urlsplit(row['url']).path)
                  assert str(path).startswith('/assets/') and '..' not in path.parts and path.suffix=='.js'
                  frozen=subprocess.check_output(cmd+['/srv'+str(path)],text=True).split()[0]
                  receipt={'metadata':str(metadata),'url':row['url'],'label':row['label'],'imageSha256':frozen,'executedSha256':row['executedSha256'],'servedSha256':row['servedSha256'],'match':frozen==row['executedSha256']==row['servedSha256']}
                  receipts.append(receipt)
          Path('reports/profile-exact-sampled-assets.json').write_text(json.dumps(receipts,indent=2)+'\n')
          assert receipts and all(r['match'] for r in receipts), 'Exact script body/image mismatch'
          assert any(r['label']=='page' for r in receipts), 'No exact page body/image receipt'
          assert any(r['label']=='worker-0' for r in receipts), 'No exact worker body/image receipt'
          PY

      - name: Show isolated stack state
        if: always()
        run: |
          cp "$RUNNER_TEMP/electronics-postgres-transport.yaml" reports/compose.postgres-transport.yaml
          sha256sum reports/compose.postgres-transport.yaml > reports/compose.postgres-transport.sha256
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/electronics-postgres-transport.yaml" --profile test ps -a

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electronics-r10-worker-page-profile-${{ github.run_id }}
          path: |
            e2e/artifacts/electronics-simulation
            reports
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove isolated test stack
        if: always()
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/electronics-postgres-transport.yaml" --profile test
          down -v --remove-orphans
