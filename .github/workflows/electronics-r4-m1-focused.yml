name: Electronics R4-M1 Focused

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'contexts/electronics/**'
      - 'apps/web/src/electronics/**'
      - 'apps/web/vite.config.ts'
      - 'apps/web/tsconfig.json'
      - 'e2e/electronics-simulation.spec.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/electronics-r4-m1-focused.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electronics-r4-m1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Shared solver, editor contracts and build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Test shared Electronics simulation core
        run: pnpm test:electronics

      - name: Test actual editor integration contracts
        run: pnpm vitest run apps/web/src/electronics/testing

      - name: Typecheck applications and contexts
        run: pnpm typecheck

      - name: Production build
        run: pnpm build

  browser:
    name: Actual editor live simulation journey
    needs: focused
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      ASA_BUILD_REVISION: ${{ github.sha }}
      ASA_IMAGE_TAG: ${{ github.sha }}
      COMPOSE_PROJECT_NAME: asa-lab-electronics-${{ github.run_id }}
      ASA_TEST_UID: '1000'
      ASA_TEST_GID: '1000'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare writable evidence directories
        run: |
          mkdir -p e2e/artifacts/electronics-simulation reports
          chmod -R 0777 e2e/artifacts reports

      - name: Build isolated Electronics browser stack
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml --profile test
          build migration api web test-runner

      - name: Start isolated PostgreSQL, migrations, API and web
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml --profile test
          up -d --wait --wait-timeout 240 postgres api web

      - name: Run one real-editor simulation journey
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml --profile test
          run --rm --no-deps test-runner
          pnpm playwright test e2e/electronics-simulation.spec.ts

      - name: Show isolated stack state
        if: always()
        run: docker compose -f compose.yaml -f compose.test.yaml --profile test ps -a

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electronics-r4-m1-browser-${{ github.run_id }}
          path: |
            e2e/artifacts/electronics-simulation
            reports
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove isolated test stack
        if: always()
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml --profile test
          down -v --remove-orphans
