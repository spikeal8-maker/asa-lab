name: Electronics R16 Exact Native Worker Cost Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NX_SKIP_NX_CACHE: 'true'

concurrency:
  group: electronics-r16-native-worker-cost-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser:
    name: One unchanged no-delay case with native Worker CPU sampling
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      ASA_BUILD_REVISION: 3d159c656f9ee040b766697e87436baa5e135237
      ASA_IMAGE_TAG: 3d159c656f9ee040b766697e87436baa5e135237
      COMPOSE_PROJECT_NAME: asa-lab-electronics-${{ github.run_id }}
      ASA_TEST_UID: '1000'
      ASA_TEST_GID: '1000'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: 3d159c656f9ee040b766697e87436baa5e135237
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare writable evidence directories
        run: |
          mkdir -p e2e/artifacts/electronics-simulation reports
          chmod -R 0777 e2e/artifacts reports

      - name: Verify pinned PostgreSQL identity and prepare CI-only transport
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; assert 'public.ecr.aws/docker/library/postgres@sha256:e9243ab06e47223dedeb3c129fa9ece8d37f506bdc6ee943afb9335f98bb4854' in Path('.github/compose.registry-ci.yaml').read_text()"
          printf 'services:\n  postgres:\n    image: docker.io/library/postgres@sha256:e9243ab06e47223dedeb3c129fa9ece8d37f506bdc6ee943afb9335f98bb4854\n' > "$RUNNER_TEMP/electronics-postgres-transport.yaml"

      - name: Build isolated Electronics browser images
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/electronics-postgres-transport.yaml" --profile test
          build --build-arg NODE_IMAGE=docker.io/library/node@sha256:43aeff40f4afc22e83f7589a2f37e111cff5ca84529571f1c8415bcc5fcc21b2 --build-arg CADDY_IMAGE=docker.io/library/caddy@sha256:d8c17a862962def15cde69863a3a463f25a2664942eafd7bdbf050e9c3116b83 --build-arg BUILDKIT_SYNTAX=mirror.gcr.io/docker/dockerfile@sha256:b5f3b260a9678e1d83d2fce86eeddf79420b79147eaba2a25986f47133d73720 migration api web test-runner

      - name: Start isolated PostgreSQL
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/electronics-postgres-transport.yaml" --profile test
          up -d --wait --wait-timeout 120 postgres

      - name: Apply isolated migrations
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/electronics-postgres-transport.yaml" --profile test
          run --rm --no-deps migration

      - name: Start Electronics API and Web without unrelated media services
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/electronics-postgres-transport.yaml" --profile test
          up -d --wait --wait-timeout 240 --no-deps api web

      - name: Verify actual candidate checkout and built Web revision
        run: |
          test "$(git rev-parse HEAD)" = "$ASA_BUILD_REVISION"
          curl --fail --silent http://127.0.0.1:4612/build-metadata.json > reports/owner-arduino-timing-build-metadata.json
          python3 -c "import json,os; assert json.load(open('reports/owner-arduino-timing-build-metadata.json'))['revision'] == os.environ['ASA_BUILD_REVISION']"
          git rev-parse HEAD > reports/owner-arduino-timing-source-sha.txt
          sha256sum pnpm-lock.yaml compose.yaml compose.test.yaml .github/compose.registry-ci.yaml > reports/owner-arduino-timing-inputs.sha256

      - name: Prepare external diagnostic hooks after exact production build
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path
          p = json.loads('{"productSha":"3d159c656f9ee040b766697e87436baa5e135237","originalSha256":"74e45a784a4880a90834a92bda1034086721bf190f0f04179427544e4b8030e5","helperSha256":"295dbd8ef59be2f2fa5032fb80411129ef40c73b43845da52f4171b728e50dc2","instrumentedSha256":"b290be834a4f9282bf4fb07131d5b06b2ec866f5e33b37403082293bf666331b","helperBase64":"","suffixBase64":"Ci8vIFIxNiBleHRlcm5hbCBkaWFnbm9zdGljIHJlZ2lzdHJhdGlvbjsgb3JpZ2luYWwgZmlsZSBhYm92ZSBpcyBieXRlLWZvci1ieXRlIGludGFjdC4KaW1wb3J0IHsgaW5zdGFsbFdvcmtlclByb2ZpbGUgYXMgaW5zdGFsbFIxNldvcmtlclByb2ZpbGUgfSBmcm9tICcuL3IxNi1uYXRpdmUtd29ya2VyLXByb2ZpbGUuY2pzJzsKaW5zdGFsbFIxNldvcmtlclByb2ZpbGUodGVzdCk7Cg=="}')
          root = Path(os.environ['RUNNER_TEMP']) / 'r16-native-worker-cost'
          root.mkdir(parents=True, exist_ok=True)
          original = Path('e2e/electronics-ready-cadence.spec.ts').read_bytes()
          helper = base64.b64decode(p.pop('helperBase64'))
          suffix = base64.b64decode(p.pop('suffixBase64'))
          instrumented = original + suffix
          h = lambda b: hashlib.sha256(b).hexdigest()
          assert h(original) == p['originalSha256']
          assert h(helper) == p['helperSha256']
          assert h(instrumented) == p['instrumentedSha256']
          assert instrumented[:len(original)] == original
          (root / 'r16-native-worker-profile.cjs').write_bytes(helper)
          (root / 'instrumented.spec.ts').write_bytes(instrumented)
          p.update(originalBytes=len(original), suffixBytes=len(suffix), instrumentedBytes=len(instrumented), productionBuild='completed before diagnostic mounts; original checkout remains unchanged', originalPrefixExact=True)
          Path('reports/r16-instrumentation-manifest.json').write_text(json.dumps(p, indent=2) + '\n')
          PY
      - name: One no-delay CPU diagnostic NOT product acceptance
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/electronics-postgres-transport.yaml" --profile test
          run --rm --no-deps
          --volume "$RUNNER_TEMP/r16-native-worker-cost/instrumented.spec.ts:/workspace/e2e/electronics-ready-cadence.spec.ts:ro"
          --volume "$RUNNER_TEMP/r16-native-worker-cost/r16-native-worker-profile.cjs:/workspace/e2e/r16-native-worker-profile.cjs:ro"
          test-runner pnpm exec playwright test e2e/electronics-ready-cadence.spec.ts
          --workers=1 --grep 'no-delay realtime'

      - name: Show isolated stack state
        if: always()
        run: |
          cp "$RUNNER_TEMP/electronics-postgres-transport.yaml" reports/compose.postgres-transport.yaml
          sha256sum reports/compose.postgres-transport.yaml > reports/compose.postgres-transport.sha256
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/electronics-postgres-transport.yaml" --profile test ps -a

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electronics-r4-m1-browser-${{ github.run_id }}
          path: |
            e2e/artifacts/electronics-simulation
            reports
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove isolated test stack
        if: always()
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/electronics-postgres-transport.yaml" --profile test
          down -v --remove-orphans
