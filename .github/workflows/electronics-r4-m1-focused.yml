name: Electronics Arduino Blocks Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NX_SKIP_NX_CACHE: 'true'
  ASA_DIAGNOSTIC_REVISION: ${{ github.sha }}

concurrency:
  group: electronics-blocks-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser:
    name: Frozen Arduino Blocks diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      ASA_BUILD_REVISION: db96c92365913362ae225a09b41926f7015b30e0
      ASA_IMAGE_TAG: db96c92365913362ae225a09b41926f7015b30e0
      COMPOSE_PROJECT_NAME: asa-lab-blocks-diagnostic-${{ github.run_id }}
      ASA_TEST_UID: '1000'
      ASA_TEST_GID: '1000'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify frozen product and record source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          git diff --exit-code db96c92365913362ae225a09b41926f7015b30e0 HEAD -- . ':!e2e/electronics-arduino-blocks-diagnostic.spec.ts' ':!.github/workflows/electronics-r4-m1-focused.yml'
          git rev-parse HEAD > reports/blocks-diagnostic-head.txt
          git diff --stat db96c92365913362ae225a09b41926f7015b30e0 HEAD > reports/blocks-diagnostic-diff.txt
          git ls-tree -r db96c92365913362ae225a09b41926f7015b30e0 -- Dockerfile.api Dockerfile.web compose.yaml compose.test.yaml .github/compose.registry-ci.yaml package.json pnpm-lock.yaml > reports/blocks-frozen-build-inputs.txt
          sha256sum e2e/electronics-arduino-blocks-diagnostic.spec.ts .github/workflows/electronics-r4-m1-focused.yml > reports/blocks-diagnostic-source-sha256.txt

      - name: Prepare writable evidence directories
        run: |
          mkdir -p e2e/artifacts/electronics-simulation reports
          chmod -R 0777 e2e/artifacts reports

      - name: Build isolated Electronics browser images
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml --profile test
          build --build-arg NODE_IMAGE=docker.io/library/node@sha256:43aeff40f4afc22e83f7589a2f37e111cff5ca84529571f1c8415bcc5fcc21b2 --build-arg CADDY_IMAGE=docker.io/library/caddy@sha256:d8c17a862962def15cde69863a3a463f25a2664942eafd7bdbf050e9c3116b83 --build-arg BUILDKIT_SYNTAX=mirror.gcr.io/docker/dockerfile@sha256:b5f3b260a9678e1d83d2fce86eeddf79420b79147eaba2a25986f47133d73720 migration api web test-runner

      - name: Verify frozen API and Web revision labels
        shell: bash
        run: |
          set -euo pipefail
          for service in api web; do
            revision="$(docker image inspect --format='{{ index .Config.Labels "org.opencontainers.image.revision" }}' "asa-lab-${service}:${ASA_IMAGE_TAG}")"
            test "$revision" = "$ASA_BUILD_REVISION"
            printf '%s=%s\n' "$service" "$revision" >> reports/blocks-frozen-image-labels.txt
          done

      - name: Start isolated PostgreSQL
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml --profile test
          up -d --wait --wait-timeout 120 postgres

      - name: Apply isolated migrations
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml --profile test
          run --rm --no-deps migration

      - name: Start Electronics API and Web without unrelated media services
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml --profile test
          up -d --wait --wait-timeout 240 --no-deps api web

      # Diagnostic command only; this is not a focused or repository gate.
      - name: Observe one real Blockly scenario against frozen production
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml --profile test
          run --rm --no-deps
          -e ASA_DIAGNOSTIC_REVISION test-runner
          pnpm exec playwright test e2e/electronics-arduino-blocks-diagnostic.spec.ts --workers=1

      - name: Show isolated stack state
        if: always()
        run: docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml --profile test ps -a

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electronics-arduino-blocks-before-${{ github.run_id }}
          path: |
            e2e/artifacts/electronics-simulation
            reports
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove isolated test stack
        if: always()
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml --profile test
          down -v --remove-orphans
