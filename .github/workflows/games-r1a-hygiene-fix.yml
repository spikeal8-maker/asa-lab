name: Games R1A Hygiene Fix

on:
  push:
    branches:
      - diag/games-r1a-hygiene-fix

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Exclude hygiene scanner self-markers
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'tools/games-hygiene.mjs';
          const source = fs.readFileSync(file, 'utf8');
          const from = "  if (mode === '--changed' && SOURCE_EXT.test(file)) {";
          const to = "  if (\n    mode === '--changed' &&\n    SOURCE_EXT.test(file) &&\n    file !== 'tools/games-hygiene.mjs'\n  ) {";
          if (source.includes(from)) {
            fs.writeFileSync(file, source.replace(from, to));
          }
          NODE
          pnpm exec prettier --write tools/games-hygiene.mjs
      - name: Commit exact fix on diagnostic branch
        shell: bash
        run: |
          if git diff --quiet -- tools/games-hygiene.mjs; then
            exit 0
          fi
          git config user.name "games-r1a-diagnostic"
          git config user.email "games-r1a-diagnostic@users.noreply.github.com"
          git add tools/games-hygiene.mjs
          git commit -m "fix(games): avoid hygiene scanner self false positives"
          git push
      - name: Games Core focused tests
        run: pnpm test:games-core
      - name: Games Core typecheck
        run: pnpm typecheck:games-core
      - name: R1A changed-file hygiene
        run: pnpm games:hygiene --changed 9f2cb4cf02155e7c37e4e2d87fd82cedd12b2ee3
      - name: Games full hygiene report
        continue-on-error: true
        run: pnpm games:hygiene --full
