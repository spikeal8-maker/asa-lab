name: Format public homepage artifact

on:
  push:
    branches:
      - bot/format-public-homepage

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/src/pages/PublicEntryPage.tsx apps/web/index.html
      - name: Commit formatted files
        run: |
          if git diff --quiet -- apps/web/src/pages/PublicEntryPage.tsx apps/web/index.html; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/pages/PublicEntryPage.tsx apps/web/index.html
          git commit -m "style(web): format public homepage"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-public-homepage
          path: |
            apps/web/src/pages/PublicEntryPage.tsx
            apps/web/index.html
