name: Patch account C1 public heading

on:
  push:
    branches:
      - bot/restore-account-c1-home-heading

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Patch heading expectation only
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('e2e/account-c1.spec.ts')
          text = path.read_text()
          old = "page.getByRole('heading', { name: 'Создавай. Исследуй. Учись через действие.' }),"
          new = "page.getByRole('heading', { name: 'Идея есть? Сделай её.' }),"
          if old not in text:
              raise SystemExit('old heading expectation not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/account-c1.spec.ts
          git commit -m "test(web): align public entry heading"
          git push
