name: Classroom FB06 isolated candidate verification

'on':
  push:
    branches: ['work/classroom-fb06-candidate-20261113']

permissions:
  contents: read

concurrency:
  group: classroom-fb06-candidate-20261113
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'spikeal8-maker/asa-lab' && github.ref == 'refs/heads/work/classroom-fb06-candidate-20261113'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CI: 'true'
      NX_SKIP_NX_CACHE: 'true'
      NX_DAEMON: 'false'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frozen project and validator dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m pip install PyYAML==6.0.2 jsonschema==4.23.0
      - name: Preflight, guarded application and actual focused checks
        env:
          ASA_PYTHON: python
        run: python tools/testing/fb06-ci-20261113.py verify "$RUNNER_TEMP/fb06-evidence"
      - name: Preserve truthful source and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fb06-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fb06-evidence
          if-no-files-found: warn
          retention-days: 14

  publish-candidate-only:
    needs: verify
    if: success()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: fb06-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fb06-evidence
      - name: Verify tested Git bundle and publish only the dedicated branch
        run: python3 tools/testing/fb06-ci-20261113.py publish "$RUNNER_TEMP/fb06-evidence"
      - name: Preserve remote publication receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fb06-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fb06-evidence/published-receipt.json
          if-no-files-found: error
          retention-days: 14
