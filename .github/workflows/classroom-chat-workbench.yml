name: Classroom Chat Workbench

on:
  push:
    branches: [workbench/classroom-chat-1087]
    paths: [.github/workflows/classroom-chat-workbench.yml]

permissions:
  contents: read

concurrency:
  group: classroom-chat-workbench
  cancel-in-progress: false

jobs:
  preflight:
    name: Exact FB-06 planned-path preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d77b709c346702c0329a8ffbfbd384b619c9ea51
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML==6.0.3'
      - name: Check exact scope before editing the identical chat checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d77b709c346702c0329a8ffbfbd384b619c9ea51
          mkdir -p "$RUNNER_TEMP/classroom-chat-preflight"
          python tools/agent_preflight.py --scope classroom-visual-20261111 --check \
            --planned-path apps/web/src/components/ClassroomActionFeedback.tsx \
            --planned-path apps/web/src/components/ClassroomAiAccess.tsx \
            --planned-path apps/web/src/components/ClassroomGamesSettings.tsx \
            --planned-path apps/web/src/components/ClassroomProjectSettings.tsx \
            --planned-path apps/web/src/components/ClassroomParticipantPanels.tsx \
            --planned-path apps/web/src/components/ClassroomLearning.tsx \
            --planned-path apps/web/src/pages/ClassroomPage.tsx \
            --planned-path apps/web/src/components/testing/classroom-action-feedback.spec.ts \
            --planned-path apps/web/src/components/testing/classroom-action-flows.spec.ts \
            --planned-path e2e/classroom-nested-feedback.spec.ts \
            --planned-path .github/workflows/classroom-owner.yml \
            2>&1 | tee "$RUNNER_TEMP/classroom-chat-preflight/preflight.log"
          git rev-parse HEAD refs/remotes/origin/main HEAD^{tree} > "$RUNNER_TEMP/classroom-chat-preflight/revisions.txt"
      - name: Preserve the exact source permission check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classroom-chat-fb06-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/classroom-chat-preflight
          if-no-files-found: error
          retention-days: 3
