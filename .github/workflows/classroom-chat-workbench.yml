name: Classroom Chat Workbench

on:
  push:
    branches: [workbench/classroom-chat-1087]
    paths: [.github/workflows/classroom-chat-workbench.yml]

permissions:
  contents: read

concurrency:
  group: classroom-chat-workbench
  cancel-in-progress: false

jobs:
  frozen-test-dependencies:
    name: Portable frozen dependencies for isolated chat tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d77b709c346702c0329a8ffbfbd384b619c9ea51
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install unchanged lockfile dependencies
        run: pnpm install --frozen-lockfile
      - name: Install only the repository-pinned headless browser
        run: pnpm exec playwright install chromium
      - name: Package public dependencies, never credentials or Git configuration
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d77b709c346702c0329a8ffbfbd384b619c9ea51
          test -z "$(git status --porcelain)"
          out="$RUNNER_TEMP/classroom-chat-dependencies"
          mkdir -p "$out"
          find . -path './.git' -prune -o -type d -name node_modules -prune -print0 > "$RUNNER_TEMP/modules.list"
          tar --null -T "$RUNNER_TEMP/modules.list" -czf "$out/node-modules.tar.gz"
          tar -C "$HOME/.cache" -czf "$out/playwright-browsers.tar.gz" ms-playwright
          npm pack pnpm@9.15.9 --pack-destination "$out"
          sha256sum pnpm-lock.yaml > "$out/lockfile.sha256"
          git rev-parse HEAD > "$out/source-revision.txt"
          node --version > "$out/node-version.txt"
          pnpm --version > "$out/pnpm-version.txt"
          sha256sum "$out"/*.gz > "$out/archives.sha256"
          du -h "$out"/*.gz
      - uses: actions/upload-artifact@v4
        with:
          name: classroom-chat-frozen-dependencies-${{ github.run_id }}
          path: ${{ runner.temp }}/classroom-chat-dependencies
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
