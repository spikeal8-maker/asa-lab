name: Specification and Architecture Gates

"on":
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: spec-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-architecture:
    name: Validate architecture contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements.txt

      - name: Compile validator
        run: python -m compileall -q tools/validate_architecture.py

      - name: Validate architecture foundation
        run: python tools/validate_architecture.py
