name: Electronics Prettier Probe

"on":
  push:
    branches:
      - "codex/electronics-prettier-probe-377"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exact files
        run: |
          pnpm exec prettier --write \
            apps/web/src/electronics/use-electronics-workbench.ts \
            e2e/electronics-interactions.spec.ts
          mkdir -p formatter-output
          cp apps/web/src/electronics/use-electronics-workbench.ts formatter-output/
          cp e2e/electronics-interactions.spec.ts formatter-output/
          git diff -- apps/web/src/electronics/use-electronics-workbench.ts e2e/electronics-interactions.spec.ts > formatter-output/prettier.patch
      - uses: actions/upload-artifact@v4
        with:
          name: electronics-prettier-probe
          path: formatter-output
          if-no-files-found: error
          retention-days: 1
