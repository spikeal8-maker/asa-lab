name: ASA Lab Governance and Code Gates

"on":
  push:
    branches:
      - main
      - "agent/**"
      - "assistant/**"
  pull_request: {}

# Read-only, but wider than contents alone: the control-plane validator compares
# the recorded state against the pull request (head, body, draft state) and
# against the conclusions of previous workflow runs. Without pull-requests and
# actions the remote comparison cannot run, and with --require-github that is a
# failure rather than a silent skip.
permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: asa-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  governance:
    name: Governance contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements.txt

      # One gate per result: identical to `pnpm gate:governance` locally.
      # Add validators to tools/gate-governance.sh, never inline here.
      # GH_TOKEN makes the remote control-plane comparison mandatory rather than
      # silently skipped: PR head, PR body and recorded gate results are checked.
      - name: Governance gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/gate-governance.sh

  code:
    name: Format lint types contracts build
    needs: governance
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      # One gate per result: identical to `pnpm gate:code` locally.
      - name: Code gate
        run: pnpm gate:code

  postgres-tests:
    name: PostgreSQL tests and RLS
    needs: code
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate migration files
        run: pnpm db:migrate:check

      - name: Validate test Compose configuration
        run: docker compose -f compose.yaml -f compose.test.yaml --profile test config

      - name: Build migration and test images
        env:
          ASA_BUILD_REVISION: ${{ github.sha }}
          ASA_IMAGE_TAG: ${{ github.sha }}
          COMPOSE_PROJECT_NAME: asa-lab-ci-${{ github.run_id }}
        run: docker compose -f compose.yaml -f compose.test.yaml --profile test build migration test-runner

      - name: Start isolated PostgreSQL
        env:
          COMPOSE_PROJECT_NAME: asa-lab-ci-${{ github.run_id }}
        run: docker compose -f compose.yaml -f compose.test.yaml --profile test up -d postgres

      - name: Apply migrations and provision runtime role
        env:
          ASA_BUILD_REVISION: ${{ github.sha }}
          ASA_IMAGE_TAG: ${{ github.sha }}
          COMPOSE_PROJECT_NAME: asa-lab-ci-${{ github.run_id }}
        run: docker compose -f compose.yaml -f compose.test.yaml --profile test run --rm migration

      # One gate per result: `pnpm gate:data` is migrations, the complete Vitest
      # suite and the explicit RLS gate. Running it here as one command is what
      # makes a local PASS mean the same thing as this job.
      - name: Data gate
        env:
          ASA_BUILD_REVISION: ${{ github.sha }}
          ASA_IMAGE_TAG: ${{ github.sha }}
          COMPOSE_PROJECT_NAME: asa-lab-ci-${{ github.run_id }}
        run: docker compose -f compose.yaml -f compose.test.yaml --profile test run --rm --no-deps test-runner pnpm gate:data

      - name: Cleanup isolated test environment
        if: always()
        env:
          COMPOSE_PROJECT_NAME: asa-lab-ci-${{ github.run_id }}
        run: docker compose -f compose.yaml -f compose.test.yaml --profile test down -v --remove-orphans
