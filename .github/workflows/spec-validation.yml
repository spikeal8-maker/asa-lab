name: ASA One-time Format Exception

"on":
  push:
    branches:
      - main
      - "agent/**"
      - "assistant/**"
      - "codex/**"
  pull_request: {}

# Read-only, but wider than contents alone: the control-plane validator compares
# the recorded state against the pull request (head, body, draft state) and
# against the conclusions of previous workflow runs. Without pull-requests and
# actions the remote comparison cannot run, and with --require-github that is a
# failure rather than a silent skip.
permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: asa-gates-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CI: "true"
  NX_SKIP_NX_CACHE: "true"

jobs:
  governance:
    name: Governance contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: 63572ea959fb1f9fe543a3f5e06f4d3623582b6d
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements.txt

      # One gate per result: identical to `pnpm gate:governance` locally.
      # Add validators to tools/gate-governance.sh, never inline here.
      # GH_TOKEN makes the remote control-plane comparison mandatory rather than
      # silently skipped: PR head, PR body and recorded gate results are checked.
      - name: Governance gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/gate-governance.sh

  code:
    name: Format lint types contracts build
    needs: governance
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: 63572ea959fb1f9fe543a3f5e06f4d3623582b6d
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python for observability checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The canonical focused gate includes collector and browser transport tests.
      - name: Observability focused gate
        run: pnpm test:admin-logs

      # One gate per result: identical to `pnpm gate:code` locally.
      - name: Code gate
        run: |
          echo "OWNER EXCEPTION: skip only format:check, approved 2026-10-25"
          command="$(node -p "require('./package.json').scripts['gate:code']")"
          test "${command%% && *}" = "corepack pnpm format:check"
          bash -eo pipefail -c "${command#* && }"

  postgres-tests:
    name: PostgreSQL tests and RLS
    needs: code
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: 63572ea959fb1f9fe543a3f5e06f4d3623582b6d
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate migration files
        run: pnpm db:migrate:check

      - name: Validate test Compose configuration
        run: |
          python3 tools/test_ci_image_transport.py --prepare-general-postgres
          python3 tools/test_ci_image_transport.py --general-compose-model-check
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/asa-general-postgres.yaml" --profile test config

      - name: Build migration and test images
        env:
          ASA_BUILD_REVISION: 63572ea959fb1f9fe543a3f5e06f4d3623582b6d
          ASA_IMAGE_TAG: 63572ea959fb1f9fe543a3f5e06f4d3623582b6d
          COMPOSE_PROJECT_NAME: asa-lab-ci-${{ github.run_id }}
        run: |
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/asa-general-postgres.yaml" --profile test build --build-arg NODE_IMAGE=mirror.gcr.io/library/node@sha256:43aeff40f4afc22e83f7589a2f37e111cff5ca84529571f1c8415bcc5fcc21b2 --build-arg CADDY_IMAGE=public.ecr.aws/docker/library/caddy@sha256:d8c17a862962def15cde69863a3a463f25a2664942eafd7bdbf050e9c3116b83 --build-arg BUILDKIT_SYNTAX=mirror.gcr.io/docker/dockerfile@sha256:b5f3b260a9678e1d83d2fce86eeddf79420b79147eaba2a25986f47133d73720 migration test-runner
          python3 tools/test_ci_image_transport.py --built-images

      - name: Start isolated PostgreSQL
        env:
          COMPOSE_PROJECT_NAME: asa-lab-ci-${{ github.run_id }}
        run: |
          docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/asa-general-postgres.yaml" --profile test up -d postgres
          python3 tools/test_ci_image_transport.py --general-pulled-postgres

      - name: Apply migrations and provision runtime role
        env:
          ASA_BUILD_REVISION: 63572ea959fb1f9fe543a3f5e06f4d3623582b6d
          ASA_IMAGE_TAG: 63572ea959fb1f9fe543a3f5e06f4d3623582b6d
          COMPOSE_PROJECT_NAME: asa-lab-ci-${{ github.run_id }}
        run: docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/asa-general-postgres.yaml" --profile test run --rm migration

      # One gate per result: `pnpm gate:data` is migrations, the complete Vitest
      # suite and the explicit RLS gate. Running it here as one command is what
      # makes a local PASS mean the same thing as this job.
      # Observe the disposable test container; keep the mandatory gate itself
      # byte-for-byte unchanged, including command, environment and exit status.
      - name: Capture disposable test container output
        env:
          COMPOSE_PROJECT_NAME: asa-lab-ci-${{ github.run_id }}
        run: |
          mkdir -p reports/checks
          nohup bash -c '
            for attempt in $(seq 1 180); do
              id=$(docker ps -q --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" --filter "label=com.docker.compose.service=test-runner" | head -n 1)
              if [ -n "$id" ]; then
                exec docker logs --follow "$id"
              fi
              sleep 1
            done
            echo "No test-runner container observed."
          ' > reports/checks/full-data-gate.log 2>&1 &
          echo "$!" > reports/checks/log-observer.pid

      - name: Data gate
        env:
          ASA_BUILD_REVISION: 63572ea959fb1f9fe543a3f5e06f4d3623582b6d
          ASA_IMAGE_TAG: 63572ea959fb1f9fe543a3f5e06f4d3623582b6d
          COMPOSE_PROJECT_NAME: asa-lab-ci-${{ github.run_id }}
        run: docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/asa-general-postgres.yaml" --profile test run --rm --no-deps test-runner pnpm gate:data

      - name: Stop this job's log observer
        if: always()
        run: |
          if [ -f reports/checks/log-observer.pid ]; then
            kill "$(cat reports/checks/log-observer.pid)" 2>/dev/null || true
          fi

      - name: Preserve full data gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-data-gate-63572ea959fb1f9fe543a3f5e06f4d3623582b6d-${{ github.run_attempt }}
          path: reports/checks/full-data-gate.log
          retention-days: 14

      - name: Cleanup isolated test environment
        if: always()
        env:
          COMPOSE_PROJECT_NAME: asa-lab-ci-${{ github.run_id }}
        run: docker compose -f compose.yaml -f compose.test.yaml -f .github/compose.registry-ci.yaml -f "$RUNNER_TEMP/asa-general-postgres.yaml" --profile test down -v --remove-orphans

  access-a-browser:
    name: Access A real browser journeys
    needs: code
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: docker.io/library/postgres@sha256:75adc2a65806c96bc0e59030230bfe3f1c1b0d6d8f8181a8913e2b8b53bdc166
        env:
          POSTGRES_DB: asa_access_a_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: access-a-ci-isolated-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d asa_access_a_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:access-a-ci-isolated-test@127.0.0.1:5432/asa_access_a_test
      APP_TEST_DATABASE_URL: postgresql://asalab_app:access-a-ci-isolated-test@127.0.0.1:5432/asa_access_a_test
      MIGRATION_DATABASE_URL: postgresql://postgres:access-a-ci-isolated-test@127.0.0.1:5432/asa_access_a_test
      MIGRATION_EXPECT_DATABASE: asa_access_a_test
      MIGRATION_CONFIRM: APPLY:asa_access_a_test
      VITEST_MAX_WORKERS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 63572ea959fb1f9fe543a3f5e06f4d3623582b6d
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare Ubuntu mirror for browser dependencies
        run: |
          # Only this disposable Ubuntu runner; keep package signature checks.
          sudo python3 - <<'PY'
          from pathlib import Path
          directory = Path('/etc/apt/sources.list.d')
          sources = [Path('/etc/apt/sources.list'), *directory.glob('*.list'), *directory.glob('*.sources')]
          for source in sources:
              if not source.is_file():
                  continue
              original = source.read_text()
              updated = original.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
              updated = updated.replace('https://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
              if updated != original:
                  source.write_text(updated)
          Path('/etc/apt/apt.conf.d/80-asa-browser-network').write_text(
              'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "1";\n')
          PY
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Migrate isolated database and provision restricted runtime
        run: |
          pnpm db:migrate
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE asalab_app WITH LOGIN PASSWORD 'access-a-ci-isolated-test'"
      - run: pnpm test:access-a
      - name: Access A launcher contracts
        run: pnpm test:access-a-launcher
      - name: Complete Access A journeys and isolated whole NAT admission
        run: pnpm e2e:access-a
      - name: Account settings synthetic UI and layout regression
        run: pnpm e2e:settings-ui
      - name: Preserve synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: access-a-browser-63572ea959fb1f9fe543a3f5e06f4d3623582b6d
          path: |
            e2e/artifacts/owner-preview/access-a
            reports/playwright/access-a
            reports/playwright/settings-ui
            e2e/artifacts/owner-preview/access-a-ui
            reports/playwright/portal-compact-shell-r2-20261008/
            e2e/artifacts/owner-preview/classroom-profile-completion/
          retention-days: 14
      - name: Preserve Access A aggregate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: access-a-summary-63572ea959fb1f9fe543a3f5e06f4d3623582b6d
          path: reports/playwright/access-a-summary.json
          retention-days: 14
          if-no-files-found: error

  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tools/deployment -p "test_*.py" -v
      - run: python tools/test_collect_logs.py
  build:
    needs: [governance, code, postgres-tests, access-a-browser, contracts]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        include:
          - {service: api, file: Dockerfile.api, target: runtime}
          - {service: web, file: Dockerfile.web, target: runtime}
          - {service: scratch, file: infra/scratch-editor/Dockerfile, target: ''}
          - {service: minio, file: infra/minio/Dockerfile, target: ''}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 63572ea959fb1f9fe543a3f5e06f4d3623582b6d
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ matrix.service != 'web' }}
          load: ${{ matrix.service == 'web' }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:63572ea959fb1f9fe543a3f5e06f4d3623582b6d
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            ASA_BUILD_REVISION=63572ea959fb1f9fe543a3f5e06f4d3623582b6d
            ASA_BLOCKS_PARENT_ORIGIN=http://127.0.0.1:4610
            ASA_BLOCKS_RUNTIME_ORIGIN=http://localhost:4613
          cache-from: type=gha,scope=portable-${{ matrix.service }}
          cache-to: type=gha,scope=portable-${{ matrix.service }},mode=max
      - name: Export encrypted symbols from the exact web build
        if: matrix.service == 'web'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          target: web-symbols
          platforms: linux/amd64
          outputs: type=local,dest=.asa/web-symbols
          build-args: |
            ASA_BUILD_REVISION=63572ea959fb1f9fe543a3f5e06f4d3623582b6d
            ASA_BLOCKS_PARENT_ORIGIN=http://127.0.0.1:4610
            ASA_BLOCKS_RUNTIME_ORIGIN=http://localhost:4613
          cache-from: type=gha,scope=portable-web
      - name: Verify exported symbols before publishing the web image
        if: matrix.service == 'web'
        env:
          WEB_IMAGE: ghcr.io/${{ github.repository }}/web:63572ea959fb1f9fe543a3f5e06f4d3623582b6d
          REVISION: 63572ea959fb1f9fe543a3f5e06f4d3623582b6d
        run: |
          symbolWebId=$(docker create "$WEB_IMAGE")
          docker cp "$symbolWebId:/srv" .asa/web-runtime
          docker rm "$symbolWebId"
          node tools/verify-web-symbols.mjs .asa/web-runtime ".asa/web-symbols/web-symbols-$REVISION.manifest.json" "$REVISION"
      - name: Retain encrypted maps (no plaintext in public repository artifacts)
        if: matrix.service == 'web'
        uses: actions/upload-artifact@v4
        with:
          name: web-symbols-63572ea959fb1f9fe543a3f5e06f4d3623582b6d
          path: .asa/web-symbols/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish verified web image
        if: matrix.service == 'web'
        env:
          WEB_IMAGE: ghcr.io/${{ github.repository }}/web:63572ea959fb1f9fe543a3f5e06f4d3623582b6d
        run: docker push "$WEB_IMAGE"
  publish:
    needs: [build]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ASA_BUILD_REVISION: 63572ea959fb1f9fe543a3f5e06f4d3623582b6d
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 63572ea959fb1f9fe543a3f5e06f4d3623582b6d
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: python -m unittest discover -s tools/deployment -p "test_*.py" -v
      - run: python tools/deployment/ci_manifest.py
      - name: Verify the exact images before promoting stable
        run: python tools/deployment/ci_smoke.py .asa/release/release.json
      - name: Prevent a delayed workflow from rolling the channel backward
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'tools')
          from deployment.system import run
          from deployment.contracts import require
          latest = run(['git', 'ls-remote', 'origin', 'refs/heads/main'], capture=True).split()[0]
          require(latest == os.environ['ASA_BUILD_REVISION'], 'STALE_RELEASE',
                  'Main advanced during the build; keep stable unchanged and publish the next green main.')
          PY
      - uses: docker/build-push-action@v6
        with:
          context: .asa/release
          file: infra/deployment/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}/deployment:63572ea959fb1f9fe543a3f5e06f4d3623582b6d
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
