name: ASA Owner-directed Ready Update

"on":
  push:
    branches:
      - main
      - "agent/**"
      - "assistant/**"
      - "codex/**"
  pull_request: {}

# Read-only, but wider than contents alone: the control-plane validator compares
# the recorded state against the pull request (head, body, draft state) and
# against the conclusions of previous workflow runs. Without pull-requests and
# actions the remote comparison cannot run, and with --require-github that is a
# failure rather than a silent skip.
permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: asa-gates-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CI: "true"
  NX_SKIP_NX_CACHE: "true"

jobs:
  evidence:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify completed source, build and security evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, subprocess
          def api(path):
              return json.loads(subprocess.check_output(['gh','api','repos/spikeal8-maker/asa-lab/'+path]))
          prior=api('actions/runs/40137755268/jobs?per_page=100')['jobs']
          by_name={j['name']:j for j in prior}
          for name in ['contracts (windows-latest)','contracts (ubuntu-latest)','Governance contracts','Format lint types contracts build']:
              assert by_name[name]['conclusion']=='success', name
          steps={s['name']:s['conclusion'] for s in by_name['Access A real browser journeys']['steps']}
          assert steps['Complete Access A journeys and isolated whole NAT admission']=='success'
          latest=api('actions/runs/40139289366/jobs?per_page=100')['jobs']
          names=['evidence','PostgreSQL tests and RLS','build (api, Dockerfile.api, runtime)','build (web, Dockerfile.web, runtime)','build (scratch, infra/scratch-editor/Dockerfile)','build (minio, infra/minio/Dockerfile)']
          by_name={j['name']:j for j in latest}
          for name in names:
              assert by_name[name]['conclusion']=='success', name
          print('OWNER-DIRECTED UPDATE: unchanged source63572ea9; formatting and two disclosed test failures excepted; completed tests reused; settings UI qualification remains separate, not claimed PASS.')
          PY

  publish:
    needs: [evidence]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ASA_BUILD_REVISION: 63572ea959fb1f9fe543a3f5e06f4d3623582b6d
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 63572ea959fb1f9fe543a3f5e06f4d3623582b6d
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: python -m unittest discover -s tools/deployment -p "test_*.py" -v
      - run: python tools/deployment/ci_manifest.py
      - name: Verify the exact images before promoting stable
        run: python tools/deployment/ci_smoke.py .asa/release/release.json
      - name: Prevent a delayed workflow from rolling the channel backward
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'tools')
          from deployment.system import run
          from deployment.contracts import require
          latest = run(['git', 'ls-remote', 'origin', 'refs/heads/main'], capture=True).split()[0]
          require(latest == os.environ['ASA_BUILD_REVISION'], 'STALE_RELEASE',
                  'Main advanced during the build; keep stable unchanged and publish the next green main.')
          PY
      - uses: docker/build-push-action@v6
        with:
          context: .asa/release
          file: infra/deployment/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}/deployment:63572ea959fb1f9fe543a3f5e06f4d3623582b6d
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
