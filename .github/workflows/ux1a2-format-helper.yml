name: UX1A2 GitHub Formatter

on:
  push:
    branches:
      - ux/learning-published-image-385

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format UX1A2 proof
        run: |
          pnpm exec prettier --write tests/courses/learning-activity-version-media.pg.spec.ts
          echo "UX1A2_FORMATTED_B64=$(base64 -w0 tests/courses/learning-activity-version-media.pg.spec.ts)"
