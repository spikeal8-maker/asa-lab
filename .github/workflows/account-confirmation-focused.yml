name: Account Confirmation Focused

on:
  push:
    branches: [main, 'codex/account-confirmation-*', 'codex/auth-readiness-*']
    paths:
      - 'apps/api/src/**'
      - 'apps/web/src/**'
      - 'apps/web/index.html'
      - 'apps/web/public/email-proof-bootstrap.js'
      - 'migrations/**'
      - 'tests/account/**'
      - 'tests/admin/admin-user-catalog.pg.spec.ts'
      - 'tests/admin/admin-user-history.pg.spec.ts'
      - 'tests/admin/crm-user-cards.pg.spec.ts'
      - 'tests/admin/crm-directory.pg.spec.ts'
      - 'tests/admin/crm-retained-detail.pg.spec.ts'
      - 'tests/admin/crm-responsibilities.pg.spec.ts'
      - 'tests/admin/crm-acquisition.pg.spec.ts'
      - 'tests/migration/**'
      - 'e2e/auth-confirmation-ui.spec.ts'
      - 'e2e/access-account-ui.spec.ts'
      - 'e2e/admin-dashboard-ui.spec.ts'
      - 'e2e/classroom-owner-ui.spec.ts'
      - 'playwright.auth-confirmation.config.ts'
      - 'playwright.settings-ui.config.ts'
      - 'schemas/openapi.yaml'
      - 'compose.staging.yaml'
      - '.env.example'
      - 'tools/asa-lab.sh'
      - 'tools/asa-lab.ps1'
      - 'tools/provision-settings-key.mjs'
      - 'tools/deployment/test_auth_installer.py'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/account-confirmation-focused.yml'
  pull_request:
    paths:
      - 'apps/api/src/**'
      - 'apps/web/src/**'
      - 'apps/web/index.html'
      - 'apps/web/public/email-proof-bootstrap.js'
      - 'migrations/**'
      - 'tests/account/**'
      - 'tests/admin/admin-user-catalog.pg.spec.ts'
      - 'tests/admin/admin-user-history.pg.spec.ts'
      - 'tests/admin/crm-user-cards.pg.spec.ts'
      - 'tests/admin/crm-directory.pg.spec.ts'
      - 'tests/admin/crm-retained-detail.pg.spec.ts'
      - 'tests/admin/crm-responsibilities.pg.spec.ts'
      - 'tests/admin/crm-acquisition.pg.spec.ts'
      - 'tests/migration/**'
      - 'e2e/auth-confirmation-ui.spec.ts'
      - 'e2e/access-account-ui.spec.ts'
      - 'e2e/admin-dashboard-ui.spec.ts'
      - 'e2e/classroom-owner-ui.spec.ts'
      - 'playwright.auth-confirmation.config.ts'
      - 'playwright.settings-ui.config.ts'
      - 'schemas/openapi.yaml'
      - 'compose.staging.yaml'
      - '.env.example'
      - 'tools/asa-lab.sh'
      - 'tools/asa-lab.ps1'
      - 'tools/provision-settings-key.mjs'
      - 'tools/deployment/test_auth_installer.py'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/account-confirmation-focused.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: account-confirmation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NX_SKIP_NX_CACHE: 'true'
  NX_DAEMON: 'false'
  ASA_BUILD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  applicability:
    name: Account applicability (no tests executed)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      route: ${{ steps.selection.outputs.route }}
      source_sha: ${{ steps.selection.outputs.source_sha }}
      source_digest: ${{ steps.selection.outputs.source_digest }}
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify exact source before dependencies
        id: changes
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], stderr=subprocess.DEVNULL)
          head, base = os.environ['SOURCE_SHA'], os.environ.get('BASE_SHA', '')
          if not re.fullmatch(r'[0-9a-f]{40}', head) or head == '0' * 40 or git('rev-parse', 'HEAD').decode().strip() != head:
              raise SystemExit('Checkout does not match the exact event HEAD')
          if git('status', '--porcelain', '--untracked-files=all'):
              raise SystemExit('Dirty source cannot authorize applicability')
          candidate, merge_base, reason = False, '', 'Manual or unknown impact retains the complete suite'
          if os.environ['EVENT_NAME'] in ('pull_request', 'push') and re.fullmatch(r'[0-9a-f]{40}', base) and base != '0' * 40:
              try:
                  if git('rev-parse', '--verify', base + '^{commit}').decode().strip() != base:
                      raise ValueError('Base identity mismatch')
                  merge_base = git('merge-base', base, head).decode().strip()
                  tokens = git('diff', '--name-status', '-z', '--no-renames', merge_base, head, '--').decode('utf-8').split('\0')
                  if tokens[-1] != '' or len(tokens[:-1]) % 2:
                      raise ValueError('Malformed change set')
                  production = {'apps/web/src/components/CollectPicker.tsx', 'apps/web/src/components/collect-picker.css'}
                  changes = list(zip(tokens[:-1:2], tokens[1:-1:2]))
                  candidate = bool(changes) and all((status == 'M' and name in production) or (status == 'A' and re.fullmatch(r'apps/web/src/components/CollectPicker\.[A-Za-z0-9][A-Za-z0-9-]*\.spec\.ts', name)) for status, name in changes)
                  # An older branch cannot reuse an obsolete proof or CI contract.
                  controls = ['tools/devex-local-ui.mjs', 'package.json', 'pnpm-lock.yaml', '.prettierrc.json', '.prettierignore', 'docs/architecture/DEVEX_LOCAL_UI_PROFILE_CONTRACT.md', 'playwright.settings-ui.config.ts', 'e2e/fixtures/project-collections.ts', 'e2e/project-collections-baseline.spec.ts', '.github/workflows/spec-validation.yml', '.github/workflows/devex-changed.yml', '.github/workflows/account-confirmation-focused.yml', '.github/workflows/learning-e1-focused.yml', '.github/workflows/projects-publication.yml']
                  if candidate:
                      candidate = all(git('rev-parse', f'{base}:{name}') == git('rev-parse', f'{head}:{name}') for name in controls)
                  reason = 'Candidate requires the existing AST/source proof' if candidate else 'Unsupported change or control drift retains the complete suite'
              except (subprocess.CalledProcessError, ValueError, UnicodeError):
                  candidate, reason = False, 'Unknown base or change set retains the complete suite'
          directory = Path('.asa/devex')
          directory.mkdir(parents=True, exist_ok=True)
          receipt = {'source_sha': head, 'base_sha': base, 'merge_base': merge_base, 'candidate': candidate, 'reason': reason}
          (directory / 'focused-selection.json').write_text(json.dumps(receipt, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'candidate={str(candidate).lower()}\nmerge_base={merge_base}\n')
          PY
      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.candidate == 'true'
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.candidate == 'true'
        with:
          node-version: '22'
          cache: pnpm
      - name: Exact dependencies for effect proof only
        if: steps.changes.outputs.candidate == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Reuse the existing CollectPicker effect proof
        if: steps.changes.outputs.candidate == 'true'
        env:
          MERGE_BASE: ${{ steps.changes.outputs.merge_base }}
        run: node tools/devex-local-ui.mjs --prove "$MERGE_BASE" > .asa/devex/focused-proof.json
      - name: Record applicability without a focused-test PASS
        id: selection
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          receipt_path = Path('.asa/devex/focused-selection.json')
          receipt = json.loads(receipt_path.read_text())
          head = os.environ['SOURCE_SHA']
          if receipt['source_sha'] != head or subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip() != head or subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=all']):
              raise SystemExit('Source changed during applicability proof')
          route, digest = 'FULL', ''
          if receipt['candidate']:
              proof = json.loads(Path('.asa/devex/focused-proof.json').read_text())
              if type(proof.get('eligible')) is not bool:
                  raise SystemExit('Malformed existing effect proof')
              receipt['reason'] = proof.get('fallback_reason') or 'Only an executed L0/L1 effect can exclude unrelated suites'
              if proof['eligible'] and proof.get('local_effect_class') in ('L0_LOCAL_UI', 'L1_UI_BEHAVIOR'):
                  tests = proof.get('test_files')
                  if proof.get('profile_id') != 'collect-picker-presentation-v1' or type(proof.get('version')) is not int or proof['version'] != 1 or proof.get('surface_id') != 'SURF-PROJECT-COLLECTION-PICKER' or proof.get('test_ids') != ['TST-COLLECT-PICKER-FORMAT-001', 'TST-COLLECT-PICKER-LINT-001', 'TST-COLLECT-PICKER-UNIT-001'] or proof.get('ci_test_files') != ['e2e/project-collections-baseline.spec.ts'] or proof.get('ci_test_ids') != ['TST-COLLECT-PICKER-BROWSER-001']:
                      raise SystemExit('Effect proof is not the reviewed concrete profile')
                  if not isinstance(tests, list) or not tests or len(tests) != len(set(tests)) or any(not isinstance(name, str) or not re.fullmatch(r'apps/web/src/components/CollectPicker(?:\.[A-Za-z0-9][A-Za-z0-9-]*)?\.spec\.ts', name) for name in tests):
                      raise SystemExit('Effect proof has an invalid component family')
                  protected = sorted(['apps/web/src/components/CollectPicker.tsx', 'apps/web/src/components/collect-picker.css', *tests, 'playwright.settings-ui.config.ts', 'e2e/fixtures/project-collections.ts', 'e2e/project-collections-baseline.spec.ts'])
                  if proof.get('protected_paths') != protected:
                      raise SystemExit('Effect proof has incomplete source bindings')
                  observed = hashlib.sha256()
                  for name in protected:
                      observed.update(name.encode()); observed.update(b'\0'); observed.update(Path(name).read_bytes()); observed.update(b'\0')
                  digest = observed.hexdigest()
                  if proof.get('source_digest') != digest:
                      raise SystemExit('Effect proof source digest changed')
                  route = 'NOT_APPLICABLE'
                  receipt.update(profile_id=proof['profile_id'], local_effect_class=proof['local_effect_class'], reason='Reviewed source-bound CollectPicker effect does not affect this suite')
          receipt.update(route=route, status='NOT_APPLICABLE' if route == 'NOT_APPLICABLE' else 'FULL_REQUIRED', focused_tests_state='NOT_APPLICABLE' if route == 'NOT_APPLICABLE' else 'NOT_RUN', checks_executed=0, source_digest=digest, canonical_risk='RETAINED_WITH_UNKNOWNS', full_general='REQUIRED', integration_ready=False, release_ready=False)
          receipt_path.write_text(json.dumps(receipt, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'route={route}\nsource_sha={head}\nsource_digest={digest}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Focused tests: **{receipt['focused_tests_state']}**, executed: **0**. Full General CI remains required.\n\n```json\n{json.dumps(receipt, indent=2)}\n```\n")
          PY
      - name: Preserve source-bound applicability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devex-applicability-account-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .asa/devex/focused-selection.json
            .asa/devex/focused-proof.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  authentication:
    needs: [applicability]
    if: needs.applicability.outputs.route == 'FULL'
    name: Policy, providers and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: docker.io/library/postgres@sha256:75adc2a65806c96bc0e59030230bfe3f1c1b0d6d8f8181a8913e2b8b53bdc166
        env:
          POSTGRES_DB: asa_auth_confirmation_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: auth-confirmation-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d asa_auth_confirmation_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:auth-confirmation-ci-only@127.0.0.1:5432/asa_auth_confirmation_test
      APP_TEST_DATABASE_URL: postgresql://asalab_app:auth-confirmation-ci-only@127.0.0.1:5432/asa_auth_confirmation_test
      MIGRATION_DATABASE_URL: postgresql://postgres:auth-confirmation-ci-only@127.0.0.1:5432/asa_auth_confirmation_test
      MIGRATION_EXPECT_DATABASE: asa_auth_confirmation_test
      MIGRATION_CONFIRM: APPLY:asa_auth_confirmation_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nx run api:build --skip-nx-cache
      - run: pnpm contracts:check
      - name: Migrate disposable database and provision restricted runtime
        run: |
          pnpm db:migrate
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE asalab_app WITH LOGIN PASSWORD 'auth-confirmation-ci-only'"
      - run: pnpm db:migrate:check
      - name: Authentication unit regressions
        run: pnpm test:auth-confirmation --reporter=default --reporter=json --outputFile=reports/auth-confirmation-unit.json
      - name: Unified catalog API regression
        run: pnpm exec vitest run apps/api/src/admin-user-catalog.spec.ts apps/api/src/admin-user-history.spec.ts apps/api/src/crm-user.controller.spec.ts apps/api/src/crm-responsibilities.controller.spec.ts apps/api/src/acquisition-envelope.spec.ts apps/api/src/product-analytics-v2.controller.spec.ts apps/api/src/product-analytics.service.spec.ts apps/api/src/app.factory.spec.ts apps/api/src/analytics-request-isolation.spec.ts apps/api/src/owned-pool-lifecycle.spec.ts
      - name: Application logs without an optional host collector
        run: pnpm exec vitest run apps/api/src/application-log-store.spec.ts apps/api/src/admin-logs.worker.spec.ts apps/api/src/admin-logs.service.spec.ts apps/api/src/admin-logs.controller.spec.ts
      - name: Real database, session and HTTP regressions
        run: pnpm test:auth-confirmation:pg --reporter=default --reporter=json --outputFile=reports/auth-confirmation-postgres.json
      - name: Joint supported-prefix history and rejected out-of-order upgrade
        run: pnpm exec vitest run tests/migration/learning-main-prefix-history-upgrade.pg.spec.ts --maxWorkers=1
      - name: Verified email isolated PostgreSQL proof
        run: pnpm test:email-verification:pg
      - name: Unified user catalog isolated PostgreSQL proof
        run: pnpm exec vitest run tests/admin/admin-user-catalog.pg.spec.ts tests/admin/admin-user-history.pg.spec.ts tests/admin/crm-user-cards.pg.spec.ts tests/admin/crm-directory.pg.spec.ts tests/admin/crm-retained-detail.pg.spec.ts tests/admin/crm-responsibilities.pg.spec.ts tests/admin/crm-acquisition.pg.spec.ts
      - name: Retained publication visibility and moderation boundaries
        run: pnpm exec vitest run tests/portal/public-project-moderation.pg.spec.ts
      - name: Authorized per-user dashboard and retained activity summaries
        run: pnpm exec vitest run tests/admin/crm-user-dashboard.pg.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-confirmation-server-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: reports/auth-confirmation-*.json
          if-no-files-found: warn
          retention-days: 14

  browser:
    needs: [applicability]
    if: needs.applicability.outputs.route == 'FULL'
    name: Built sign-in and admin interface
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Administrator overview unit regression
        run: pnpm exec vitest run apps/web/src/acquisition-observation.spec.ts apps/web/src/analytics-runtime.spec.ts apps/web/src/analytics-delivery.spec.ts apps/web/src/admin/testing/catalog-analytics.spec.ts apps/web/src/admin/testing/admin-dashboard.spec.ts apps/web/src/admin/testing/admin-user-catalog.spec.ts apps/web/src/admin/testing/admin-user-history.spec.ts apps/web/src/admin/testing/crm-user-card.spec.ts apps/web/src/admin/testing/crm-seat-detail.spec.ts apps/web/src/admin/testing/crm-responsibilities.spec.ts apps/web/src/admin/testing/admin-shell.spec.ts apps/web/src/admin/testing/admin-page.spec.ts apps/web/src/admin/testing/admin-crm-panel.spec.ts apps/web/src/admin/testing/admin-navigation.spec.ts apps/web/src/admin/testing/email-settings.spec.ts apps/web/src/email-api.spec.ts
      - name: Publication loading and legacy format interface
        run: pnpm exec vitest run apps/web/src/admin/testing/admin-publications.spec.ts
      - name: User card dialog lifecycle
        run: pnpm exec vitest run apps/web/src/admin/testing/crm-user-dialog.spec.ts apps/web/src/admin/testing/admin-log-coverage.spec.ts
      - name: Personal dashboard states and stale-response isolation
        run: pnpm exec vitest run apps/web/src/admin/testing/crm-user-dashboard.spec.ts
      - run: pnpm exec nx run web:typecheck --skip-nx-cache
      - name: Install Chromium without an unbounded package mirror wait
        run: |
          # Hosted runners already contain browser libraries. If the OS mirror
          # stalls, actual Chromium launches below still prove dependencies work.
          timeout --kill-after=15s 180s pnpm exec playwright install-deps chromium || echo "::warning::OS dependency setup did not finish; browser launch checks remain mandatory."
          pnpm exec playwright install chromium
      - name: Build the exact web application
        run: pnpm exec nx run web:build --skip-nx-cache
      - name: Sign-in, confirmation, outage fallback and responsive administration
        run: pnpm e2e:auth-confirmation
      - name: Existing Account security and settings composition
        run: pnpm e2e:settings-ui --grep 'R3 Account compact composition'
      - name: Administrator navigation, overview and responsive evidence
        run: pnpm e2e:settings-ui e2e/admin-dashboard-ui.spec.ts
      - name: Existing classroom mobile header and drawer
        run: >-
          pnpm e2e:settings-ui e2e/classroom-owner-ui.spec.ts
          --grep 'single header keeps all global actions and a working drawer$'
      - name: Preserve screenshots, traces and build identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-confirmation-ui-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            reports/auth-confirmation
            reports/playwright
            playwright-report
            test-results
            e2e/artifacts/auth-confirmation
            apps/web/dist/build-metadata.json
          if-no-files-found: warn
          retention-days: 14

  installation:
    needs: [applicability]
    if: needs.applicability.outputs.route == 'FULL'
    name: Authentication installation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve credentials and test bootstrap on temporary fixtures
        run: pnpm test:auth-confirmation:installation
      - name: Portable log collection and diagnostic volume boundaries
        run: python -m unittest tools.deployment.test_collector tools.deployment.test_backup_mounts
