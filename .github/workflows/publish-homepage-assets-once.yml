name: Publish homepage assets once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-homepage-assets-once.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish current screenshots into web public assets
        run: |
          mkdir -p apps/web/public/landing
          cp e2e/artifacts/readme-2026-09-07/home-dashboard.png apps/web/public/landing/home-dashboard.png
          cp e2e/artifacts/readme-2026-09-07/electronics-simulation.png apps/web/public/landing/electronics-simulation.png
          cp e2e/artifacts/readme-2026-09-07/electronics-blocks.png apps/web/public/landing/electronics-blocks.png
          cp e2e/artifacts/readme-2026-09-07/electronics-cpp.png apps/web/public/landing/electronics-cpp.png
          cp e2e/artifacts/readme-2026-09-07/three-d-bus.png apps/web/public/landing/three-d-bus.png
          cp e2e/artifacts/readme-2026-09-07/three-d-house.png apps/web/public/landing/three-d-house.png
          cp e2e/artifacts/classroom-management/assignment-progress.png apps/web/public/landing/assignment-progress.png

          python - <<'PY'
          from pathlib import Path
          import re

          page = Path('apps/web/src/pages/PublicEntryPage.tsx')
          source = page.read_text(encoding='utf-8')
          source = re.sub(
              r"import (?:homeDashboard|electronicsSimulation|electronicsBlocks|electronicsCpp|threeDBus|threeDHouse|assignmentProgress) from '[^']+';\n",
              '',
              source,
          )
          marker = "import './PublicEntryPage.css';\n"
          constants = """

const homeDashboard = '/landing/home-dashboard.png';
const electronicsSimulation = '/landing/electronics-simulation.png';
const electronicsBlocks = '/landing/electronics-blocks.png';
const electronicsCpp = '/landing/electronics-cpp.png';
const threeDBus = '/landing/three-d-bus.png';
const threeDHouse = '/landing/three-d-house.png';
const assignmentProgress = '/landing/assignment-progress.png';
"""
          if marker not in source:
              raise SystemExit('PublicEntryPage.css import marker missing')
          source = source.replace(marker, marker + constants, 1)
          page.write_text(source, encoding='utf-8')
          PY

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format homepage source
        run: pnpm exec prettier --write apps/web/src/pages/PublicEntryPage.tsx

      - name: Verify copied images are byte-identical
        run: |
          cmp e2e/artifacts/readme-2026-09-07/home-dashboard.png apps/web/public/landing/home-dashboard.png
          cmp e2e/artifacts/readme-2026-09-07/electronics-simulation.png apps/web/public/landing/electronics-simulation.png
          cmp e2e/artifacts/readme-2026-09-07/electronics-blocks.png apps/web/public/landing/electronics-blocks.png
          cmp e2e/artifacts/readme-2026-09-07/electronics-cpp.png apps/web/public/landing/electronics-cpp.png
          cmp e2e/artifacts/readme-2026-09-07/three-d-bus.png apps/web/public/landing/three-d-bus.png
          cmp e2e/artifacts/readme-2026-09-07/three-d-house.png apps/web/public/landing/three-d-house.png
          cmp e2e/artifacts/classroom-management/assignment-progress.png apps/web/public/landing/assignment-progress.png

      - name: Commit assets and source fix
        run: |
          git config user.name "ASA Lab automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/public/landing apps/web/src/pages/PublicEntryPage.tsx
          git commit -m "fix(web): serve homepage screenshots from public assets"
          git push origin HEAD:main
