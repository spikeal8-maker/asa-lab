name: One-time Polza UI acceptance test formatting
on:
  push:
    branches:
      - feature/asa-polza-transcription-admin-20261029
    paths:
      - .github/workflows/polza-ui-final-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write e2e/ai-generation-policy.spec.ts
      - name: Commit test formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- e2e/ai-generation-policy.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(ai-admin): exact Prettier for responsive acceptance test'
            git push origin 'HEAD:refs/heads/feature/asa-polza-transcription-admin-20261029'
          fi
