name: Scratch Runtime Security

on:
  pull_request:
    paths:
      - 'infra/scratch-editor/**'
      - '.github/workflows/scratch-runtime-security.yml'
  push:
    branches: [main]
    paths:
      - 'infra/scratch-editor/**'
      - '.github/workflows/scratch-runtime-security.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scratch-runtime-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  NX_SKIP_NX_CACHE: 'true'

jobs:
  assembled-runtime:
    name: Exact Scratch image, isolation smoke and full vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Fail-closed scanner receipt regression tests
        run: node --test infra/scratch-editor/tests/runtime-security.test.mjs

      - name: Build the full candidate runtime rather than scanning its base
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          mkdir -p reports/scratch-runtime-security
          docker build --pull -f infra/scratch-editor/Dockerfile \
            --build-arg ASA_BUILD_REVISION="$CANDIDATE_SHA" \
            --iidfile reports/scratch-runtime-security/image-id.txt \
            -t asa-scratch-security:candidate .
          image_id="$(cat reports/scratch-runtime-security/image-id.txt)"
          test "$(docker image inspect --format '{{.Id}}' asa-scratch-security:candidate)" = "$image_id"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image_id")" = "$CANDIDATE_SHA"
          docker save "$image_id" --output "$RUNNER_TEMP/scratch-candidate.tar"

      - name: Install pinned official Trivy with asset checksum validation
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz \
            --output "$RUNNER_TEMP/trivy.tar.gz"
          printf '%s  %s\n' c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0 "$RUNNER_TEMP/trivy.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/trivy"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/trivy" trivy
          "$RUNNER_TEMP/trivy/trivy" --version | tee reports/scratch-runtime-security/scanner-version.txt

      - name: Scan every runtime package and enforce image/source/OS/freshness gates
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/trivy/trivy" image --input "$RUNNER_TEMP/scratch-candidate.tar" \
            --scanners vuln --list-all-pkgs --format json --exit-code 0 --timeout 15m \
            --output reports/scratch-runtime-security/runtime-scan.json
          node infra/scratch-editor/security/verify-runtime-scan.mjs \
            reports/scratch-runtime-security/runtime-scan.json "$CANDIDATE_SHA" \
            "$(cat reports/scratch-runtime-security/image-id.txt)" \
            | tee reports/scratch-runtime-security/security-summary.json

      - name: Exercise the same scanned bytes as non-root with a read-only filesystem
        run: |
          set -euo pipefail
          image_id="$(cat reports/scratch-runtime-security/image-id.txt)"
          docker run -d --name scratch-runtime-security --user 101:101 --read-only \
            --tmpfs /var/cache/nginx:uid=101,gid=101,mode=0700,size=64m \
            --tmpfs /var/run:uid=101,gid=101,mode=0700,size=8m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -e ASA_BLOCKS_PARENT_ORIGIN=http://127.0.0.1:4612 \
            -p 127.0.0.1:4613:8080 "$image_id"
          test "$(docker inspect --format '{{.Image}}' scratch-runtime-security)" = "$image_id"
          docker exec scratch-runtime-security nginx -t
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4613/healthz; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4613/healthz
          curl --fail --silent http://127.0.0.1:4613/asa-commit.txt | grep -Fx "$CANDIDATE_SHA"
          curl --fail --silent http://127.0.0.1:4613/index.html | grep -F 'content="http://127.0.0.1:4612"'
          curl --fail --silent --output /dev/null http://127.0.0.1:4613/vendor/scratch/scratch-gui-standalone.js
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4613/library-assets/not-present.wav)" = 404
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base = 'http://127.0.0.1:4613';
          const response = await fetch(base + '/library-assets/library-assets-manifest.json');
          assert.equal(response.status, 200);
          assert.match(response.headers.get('content-type'), /^application\/json/);
          const manifest = await response.json();
          for (const [suffix, type] of [['.wav', 'audio/wav'], ['.svg', 'image/svg+xml']]) {
            const name = manifest.assets.find((asset) => asset.endsWith(suffix));
            assert.ok(name, 'Pinned library must contain ' + suffix);
            const asset = await fetch(base + '/library-assets/' + name, {method: 'HEAD'});
            assert.equal(asset.status, 200);
            assert.ok(asset.headers.get('content-type').startsWith(type));
          }
          const packed = await fetch(base + '/vendor/scratch/scratch-gui-standalone.js', {
            method: 'HEAD', headers: {'Accept-Encoding': 'gzip'},
          });
          assert.equal(packed.status, 200);
          assert.equal(packed.headers.get('content-encoding'), 'gzip');
          NODE
          docker exec scratch-runtime-security sh -c 'test "$(id -u)" = 101; test ! -w /etc/nginx/conf.d/default.conf'
          docker logs scratch-runtime-security > reports/scratch-runtime-security/runtime.log 2>&1

      - name: Preserve exact image identity, full report and smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scratch-runtime-security-${{ github.event.pull_request.head.sha || github.sha }}
          path: reports/scratch-runtime-security/
          if-no-files-found: error
          retention-days: 14

      - name: Remove only the isolated CI runtime
        if: always()
        run: docker rm -f scratch-runtime-security 2>/dev/null || true
