name: Scratch Focused

on:
  push:
    branches:
      - main
    paths:
      - 'contexts/blocks/**'
      - 'apps/api/package.json'
      - 'apps/api/src/module-registry.ts'
      - 'apps/api/src/modules.controller.spec.ts'
      - 'infra/scratch-editor/**'
      - 'docs/architecture/ADR-VSCR-001-SCRATCH-EDITOR-INTEGRATION.md'
      - 'packages/module-sdk/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/scratch-focused.yml'
  pull_request:
    paths:
      - 'contexts/blocks/**'
      - 'apps/api/package.json'
      - 'apps/api/src/module-registry.ts'
      - 'apps/api/src/modules.controller.spec.ts'
      - 'infra/scratch-editor/**'
      - 'docs/architecture/ADR-VSCR-001-SCRATCH-EDITOR-INTEGRATION.md'
      - 'packages/module-sdk/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/scratch-focused.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NX_SKIP_NX_CACHE: 'true'

jobs:
  contracts:
    name: Module contract and API typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Focused Blocks M1-001 gate
        run: pnpm gate:blocks-m1-001

  runtime-image:
    name: Pinned upstream image and health smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    concurrency:
      group: scratch-runtime-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Build pinned Scratch Editor image
        run: docker build -f infra/scratch-editor/Dockerfile -t asa-lab-scratch-editor:m0 .

      - name: Start isolated Scratch Editor
        run: docker run -d --name asa-lab-scratch-editor -p 127.0.0.1:4613:8080 asa-lab-scratch-editor:m0

      - name: Verify health and editor document
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4613/healthz; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:4613/healthz
          curl --fail --silent --show-error http://127.0.0.1:4613/ | grep -F 'Scratch 3.0 GUI'

      - name: Show runtime logs
        if: always()
        run: docker logs asa-lab-scratch-editor || true

      - name: Remove isolated runtime
        if: always()
        run: docker rm -f asa-lab-scratch-editor || true
