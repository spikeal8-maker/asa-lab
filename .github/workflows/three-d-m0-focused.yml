name: 3D Core Focused

on:
  push:
    branches:
      - main
    paths:
      - 'contexts/three-d/**'
      - 'apps/api/src/module-registry.ts'
      - 'apps/api/src/three-d.controller.spec.ts'
      - 'apps/web/src/modules/**'
      - 'apps/web/src/three-d/**'
      - 'apps/web/vite.config.ts'
      - 'apps/web/tsconfig.json'
      - 'e2e/three-d-m0.spec.ts'
      - 'tests/three-d/**'
      - 'tools/run-three-d-benchmark.mjs'
      - 'docs/product/ASA_3D_OPTIMIZATION_EXECUTION_PLAN.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/three-d-m0-focused.yml'
  pull_request:
    paths:
      - 'contexts/three-d/**'
      - 'apps/api/src/module-registry.ts'
      - 'apps/api/src/three-d.controller.spec.ts'
      - 'apps/web/src/modules/**'
      - 'apps/web/src/three-d/**'
      - 'apps/web/vite.config.ts'
      - 'apps/web/tsconfig.json'
      - 'e2e/three-d-m0.spec.ts'
      - 'tests/three-d/**'
      - 'tools/run-three-d-benchmark.mjs'
      - 'docs/product/ASA_3D_OPTIMIZATION_EXECUTION_PLAN.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/three-d-m0-focused.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: three-d-m0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Domain, integration, bundle isolation and build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Focused 3D OPT-1 gate
        run: pnpm gate:three-d-opt-1

  browser:
    name: Desktop, tablet and mobile save-reload journey
    needs: focused
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      ASA_BUILD_REVISION: ${{ github.sha }}
      ASA_IMAGE_TAG: ${{ github.sha }}
      COMPOSE_PROJECT_NAME: asa-lab-three-d-${{ github.run_id }}
      ASA_TEST_UID: '1000'
      ASA_TEST_GID: '1000'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare writable evidence directories
        run: |
          mkdir -p e2e/artifacts/three-d reports
          chmod -R 0777 e2e/artifacts reports

      - name: Build isolated 3D browser stack
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml --profile test
          build migration api web test-runner

      - name: Start isolated PostgreSQL, migrations, API and web
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml --profile test
          up -d --wait --wait-timeout 240 postgres api web

      - name: 3D M0 browser gate
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml --profile test
          run --rm --no-deps test-runner
          pnpm gate:three-d-m0:browser

      - name: Show isolated stack state
        if: always()
        run: docker compose -f compose.yaml -f compose.test.yaml --profile test ps -a

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-d-m0-browser-${{ github.run_id }}
          path: |
            e2e/artifacts/three-d
            reports
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove isolated test stack
        if: always()
        run: >-
          docker compose -f compose.yaml -f compose.test.yaml --profile test
          down -v --remove-orphans
