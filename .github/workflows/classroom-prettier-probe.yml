name: Temporary Classroom Formatter Diff

"on":
  push:
    branches:
      - assistant/classroom-safe-gallery-publish-20261015
    paths:
      - .github/workflows/classroom-prettier-probe.yml

permissions:
  contents: read

jobs:
  prettier-exact:
    name: Show exact Prettier-only diff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Show exact formatted source delta, do not write to GitHub
        run: |
          pnpm exec prettier --write tests/portal/classroom-safe-gallery-publish.pg.spec.ts
          git diff --no-ext-diff -- tests/portal/classroom-safe-gallery-publish.pg.spec.ts
