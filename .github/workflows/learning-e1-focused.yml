name: Learning E1 Convergence

on:
  pull_request:
    paths:
      - 'contexts/learning/**'
      - 'contexts/identity/**'
      - 'apps/api/**'
      - 'apps/web/src/**'
      - 'migrations/**'
      - 'tests/courses/**'
      - 'tests/account/**'
      - 'e2e/learning-*.spec.ts'
      - 'e2e/courses-sharing.spec.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/learning-e1-focused.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-e1-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CI: 'true'
  NX_SKIP_NX_CACHE: 'true'
  NX_DAEMON: 'false'

jobs:
  learning-e1:
    name: Learning fresh upgrade and real browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: asa_learning_e1_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: learning-e1-ci-isolated-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d asa_learning_e1_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:learning-e1-ci-isolated-test@127.0.0.1:5432/asa_learning_e1_test
      APP_TEST_DATABASE_URL: postgresql://asalab_app:learning-e1-ci-isolated-test@127.0.0.1:5432/asa_learning_e1_test
      MIGRATION_DATABASE_URL: postgresql://postgres:learning-e1-ci-isolated-test@127.0.0.1:5432/asa_learning_e1_test
      MIGRATION_EXPECT_DATABASE: asa_learning_e1_test
      MIGRATION_CONFIRM: APPLY:asa_learning_e1_test
      NODE_ENV: test
      ASA_SEED_DEMO: 'false'
      ASA_BLOCKS_RUNTIME_ORIGIN: http://127.0.0.1:4613
      ASA_BLOCKS_RUNTIME_SIGNING_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      VITE_ASA_BLOCKS_RUNTIME_ORIGIN: http://127.0.0.1:4613
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Fresh schema and restricted runtime
        run: |
          pnpm db:migrate
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE asalab_app WITH LOGIN PASSWORD 'learning-e1-ci-isolated-test'"
      - name: Existing E1 and populated upgrade regressions
        run: pnpm test:learning-e1
      - name: Build pinned Scratch standalone host image
        run: >-
          docker build -f infra/scratch-editor/Dockerfile
          --build-arg ASA_BUILD_REVISION=${{ github.event.pull_request.head.sha || github.sha }}
          --build-arg ASA_BLOCKS_PARENT_ORIGIN=http://127.0.0.1:4612
          -t asa-lab-scratch-editor:learning-e1 .
      - name: Start isolated Scratch host
        run: >-
          docker run -d --name asa-lab-scratch-editor-learning-e1
          --user 101:101 --read-only
          --tmpfs /var/cache/nginx:uid=101,gid=101,mode=0700,size=64m
          --tmpfs /var/run:uid=101,gid=101,mode=0700,size=8m
          --cap-drop ALL --security-opt no-new-privileges:true
          -p 127.0.0.1:4613:8080 asa-lab-scratch-editor:learning-e1
      - name: Verify isolated Scratch host
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4613/healthz; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:4613/healthz
      - name: Real author Account Seat and exact project journeys
        env:
          ASA_WEB_PORT: '4612'
          ASA_WEB_ORIGIN: http://127.0.0.1:4612
          ASA_BLOCKS_RUNTIME_ORIGIN: http://127.0.0.1:4612
          ASA_BLOCKS_UPSTREAM_ORIGIN: http://127.0.0.1:4613
        shell: bash
        run: |
          set -euo pipefail

          # Keep the package script's complete selectors and original argument order.
          original_first_batch=(
            e2e/learning-author-preview.spec.ts
            e2e/learning-course-01.spec.ts
            e2e/courses-sharing.spec.ts
          )
          second_batch=(
            e2e/learning-learner-submits-project-assignment.spec.ts
            e2e/learning-surface-convergence.spec.ts
            e2e/learning-teacher-assigns-activity.spec.ts
          )
          expected_script="playwright test ${original_first_batch[*]} --workers=1 && playwright test ${second_batch[*]} --workers=1"
          node - "$expected_script" <<'NODE'
          const { readFileSync } = require('node:fs');
          const actual = JSON.parse(readFileSync('package.json', 'utf8')).scripts?.['e2e:learning-e1'];
          if (actual !== process.argv[2]) {
            console.error('Learning E1 package script changed: review the complete batch matrix before running.');
            process.exit(1);
          }
          NODE

          # Playwright discovers these files in lexical order, not argument order.
          ordered_specs="$(printf '%s\n' "${original_first_batch[@]}" | LC_ALL=C sort)"
          mapfile -t first_batch <<< "$ordered_specs"

          run_batch() {
            local batch="$1"
            shift
            local destination="reports/playwright/learning-e1/$batch"
            local test_status=0
            local evidence_status=0
            local area
            mkdir -p "$destination/artifact-snapshot" || evidence_status=$?
            printf '::group::Learning E1 %s\n' "$batch"

            # Each invocation owns a fresh ordinary config.webServer lifecycle.
            # A unique output leaf prevents Playwright from clearing earlier traces.
            pnpm exec playwright test "$@" --workers=1 --output "$destination/results" || test_status=$?

            # Snapshots include existing files; they are not a claim of new screenshots.
            # Copy before a later batch can overwrite a shared screenshot path.
            for area in learning courses; do
              if [[ -d "e2e/artifacts/$area" ]]; then
                cp -a "e2e/artifacts/$area" "$destination/artifact-snapshot/$area" || evidence_status=$?
              fi
            done
            printf '{"batch":"%s","testExitCode":%d,"snapshotExitCode":%d}\n' \
              "$batch" "$test_status" "$evidence_status" > "$destination/exit.json" || evidence_status=$?
            printf '::endgroup::\n'
            if (( test_status != 0 )); then
              return "$test_status"
            fi
            return "$evidence_status"
          }

          first_status=0
          batch_index=0
          for spec in "${first_batch[@]}"; do
            batch_index=$((batch_index + 1))
            name="${spec##*/}"
            batch="$(printf '%02d-%s' "$batch_index" "${name%.spec.ts}")"
            if run_batch "$batch" "$spec"; then
              :
            else
              batch_status=$?
              if (( first_status == 0 )); then
                first_status=$batch_status
              fi
            fi
          done
          if (( first_status != 0 )); then
            printf 'First Learning E1 batch failed; the original second batch is NOT_RUN.\n'
            exit "$first_status"
          fi

          batch_index=$((batch_index + 1))
          run_batch "$(printf '%02d-second-batch' "$batch_index")" "${second_batch[@]}"
      - name: Show isolated Scratch host logs
        if: always()
        run: docker logs asa-lab-scratch-editor-learning-e1 || true
      - name: Remove isolated Scratch host
        if: always()
        run: docker rm -f asa-lab-scratch-editor-learning-e1 || true
      - name: Preserve synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-e1-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            e2e/artifacts/learning
            e2e/artifacts/courses
            reports/playwright
          retention-days: 14
