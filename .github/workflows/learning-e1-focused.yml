# TEMPORARY DIAGNOSTIC BRANCH ONLY: E1-BASELINE-PG-TIMING-PROBE-01.
# NEVER MERGE THIS WORKFLOW INTO MAIN. This measures two complete PG files,
# not E1 acceptance; a reduced-context PASS does not resolve the General failure.
name: Learning E1 PG timing probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-e1-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CI: 'true'
  NX_SKIP_NX_CACHE: 'true'
  NX_DAEMON: 'false'

jobs:
  learning-e1:
    name: Diagnostic only — 34 existing PG cases
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: asa_learning_e1_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: learning-e1-ci-isolated-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d asa_learning_e1_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:learning-e1-ci-isolated-test@127.0.0.1:5432/asa_learning_e1_test
      APP_TEST_DATABASE_URL: postgresql://asalab_app:learning-e1-ci-isolated-test@127.0.0.1:5432/asa_learning_e1_test
      MIGRATION_DATABASE_URL: postgresql://postgres:learning-e1-ci-isolated-test@127.0.0.1:5432/asa_learning_e1_test
      MIGRATION_EXPECT_DATABASE: asa_learning_e1_test
      MIGRATION_CONFIRM: APPLY:asa_learning_e1_test
      NODE_ENV: test
      ASA_SEED_DEMO: 'false'
      ASA_BLOCKS_RUNTIME_ORIGIN: http://127.0.0.1:4613
      ASA_BLOCKS_RUNTIME_SIGNING_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      VITE_ASA_BLOCKS_RUNTIME_ORIGIN: http://127.0.0.1:4613
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Fresh schema and restricted runtime
        run: |
          pnpm db:migrate
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE asalab_app WITH LOGIN PASSWORD 'learning-e1-ci-isolated-test'"
      - name: Measure both complete files with unchanged test deadlines
        shell: bash
        run: |
          mkdir -p reports/checks
          set -o pipefail
          pnpm exec vitest run tests/courses/learning-direct-project-attempts.pg.spec.ts tests/portal/classroom-participants.pg.spec.ts --maxWorkers=1 2>&1 | tee reports/checks/pg-timing-probe.log
      - name: Preserve diagnostic output including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-e1-pg-timing-${{ github.sha }}-${{ github.run_attempt }}
          path: reports/checks/pg-timing-probe.log
          retention-days: 14
          if-no-files-found: error
