name: ASA Portable Release
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery_revision && format('Recovery candidate {0}', inputs.recovery_revision) || format('Release {0}', github.event.workflow_run.head_sha || github.sha) }}

'on':
  workflow_run:
    workflows: ['ASA Lab Governance and Code Gates']
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      recovery_revision:
        description: 'Recovery source SHA (leave empty for a normal main release)'
        type: string
      recovery_base:
        description: 'Main revision whose application source the recovery candidate preserves'
        type: string
      recovery_target:
        description: 'Main revision whose complete migration tree the candidate preserves'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: asa-stable-release
  cancel-in-progress: false
  queue: max

jobs:
  contracts:
    needs: gate
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tools/deployment -p "test_*.py" -v
      - run: python tools/test_collect_logs.py
  gate:
    if: (github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository))) || (github.event_name == 'workflow_dispatch' && inputs.recovery_revision != '')
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      recovery: ${{ steps.source.outputs.recovery }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ inputs.recovery_revision || github.event.workflow_run.head_sha || github.sha }}
          RECOVERY_REVISION: ${{ inputs.recovery_revision }}
          RECOVERY_BASE: ${{ inputs.recovery_base }}
          RECOVERY_TARGET: ${{ inputs.recovery_target }}
          PYTHONPATH: ${{ github.workspace }}/tools
        run: |
          python -P - <<'PY'
          import os, re
          from deployment.releases import assert_general_ci
          from deployment.publication import canonical_main, is_ancestor, verify_recovery_source
          from deployment.contracts import require
          from deployment.system import run
          revision = os.environ.get('REVISION', '')
          require(re.fullmatch(r'[a-f0-9]{40}', revision), 'RELEASE_SOURCE', 'Invalid candidate revision.')
          main = canonical_main()
          recovery = bool(os.environ['RECOVERY_REVISION'])
          if recovery:
              base, target = os.environ['RECOVERY_BASE'], os.environ['RECOVERY_TARGET']
              run(['git', 'fetch', '--no-tags', 'origin', revision])
              verify_recovery_source(revision, base, target, main)
              assert_general_ci(base)
              assert_general_ci(target)
          else:
              require(not os.environ['RECOVERY_BASE'] and not os.environ['RECOVERY_TARGET'], 'RELEASE_SOURCE',
                      'Supply all three recovery revisions together.')
              require(is_ancestor(revision, main), 'RELEASE_SOURCE',
                      'Candidate must belong to the canonical main history.')
              assert_general_ci(revision)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'revision={revision}\nrecovery={str(recovery).lower()}\n')
          PY
  build:
    needs: [gate, contracts]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        include:
          - { service: api, file: Dockerfile.api, target: runtime }
          - { service: web, file: Dockerfile.web, target: runtime }
          - { service: scratch, file: infra/scratch-editor/Dockerfile, target: '' }
          - { service: minio, file: infra/minio/Dockerfile, target: '' }
          - { service: search, file: infra/search/Dockerfile, target: '' }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.revision }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ matrix.service != 'web' }}
          load: ${{ matrix.service == 'web' }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ needs.gate.outputs.revision }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            ASA_BUILD_REVISION=${{ needs.gate.outputs.revision }}
            ASA_BLOCKS_PARENT_ORIGIN=http://127.0.0.1:4610
            ASA_BLOCKS_RUNTIME_ORIGIN=http://localhost:4613
          cache-from: type=gha,scope=portable-${{ matrix.service }}
          cache-to: type=gha,scope=portable-${{ matrix.service }},mode=max
      - name: Export encrypted symbols from the exact web build
        if: matrix.service == 'web'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          target: web-symbols
          platforms: linux/amd64
          outputs: type=local,dest=.asa/web-symbols
          build-args: |
            ASA_BUILD_REVISION=${{ needs.gate.outputs.revision }}
            ASA_BLOCKS_PARENT_ORIGIN=http://127.0.0.1:4610
            ASA_BLOCKS_RUNTIME_ORIGIN=http://localhost:4613
          cache-from: type=gha,scope=portable-web
      - name: Verify exported symbols before publishing the web image
        if: matrix.service == 'web'
        env:
          WEB_IMAGE: ghcr.io/${{ github.repository }}/web:${{ needs.gate.outputs.revision }}
          REVISION: ${{ needs.gate.outputs.revision }}
        run: |
          symbolWebId=$(docker create "$WEB_IMAGE")
          docker cp "$symbolWebId:/srv" .asa/web-runtime
          docker rm "$symbolWebId"
          node tools/verify-web-symbols.mjs .asa/web-runtime ".asa/web-symbols/web-symbols-$REVISION.manifest.json" "$REVISION"
      - name: Retain encrypted maps (no plaintext in public repository artifacts)
        if: matrix.service == 'web'
        uses: actions/upload-artifact@v4
        with:
          name: web-symbols-${{ needs.gate.outputs.revision }}
          path: .asa/web-symbols/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish verified web image
        if: matrix.service == 'web'
        env:
          WEB_IMAGE: ghcr.io/${{ github.repository }}/web:${{ needs.gate.outputs.revision }}
        run: docker push "$WEB_IMAGE"
  publish:
    needs: [gate, build]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ASA_BUILD_REVISION: ${{ needs.gate.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.revision }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: python -m unittest discover -s tools/deployment -p "test_*.py" -v
      - run: python tools/deployment/ci_manifest.py
      - name: Verify the exact images before promoting stable
        run: python tools/deployment/ci_smoke.py .asa/release/release.json
      - uses: actions/checkout@v4
        if: needs.gate.outputs.recovery == 'false'
        with:
          ref: ${{ github.workflow_sha }}
          path: .asa/publication-tools
          sparse-checkout: tools/deployment
          persist-credentials: false
      - name: Compare the qualified candidate with the published channel
        if: needs.gate.outputs.recovery == 'false'
        id: promotion
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/.asa/publication-tools/tools
        run: python -P -m deployment.publication
      - uses: docker/build-push-action@v6
        if: needs.gate.outputs.recovery == 'false' && steps.promotion.outputs.promote == 'true'
        with:
          context: .asa/release
          file: infra/deployment/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}/deployment:${{ needs.gate.outputs.revision }}
            ghcr.io/${{ github.repository }}/deployment:stable
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Publish isolated recovery candidate
        if: needs.gate.outputs.recovery == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .asa/release
          file: infra/deployment/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository }}/deployment:recovery-${{ needs.gate.outputs.revision }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
