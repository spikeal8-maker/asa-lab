name: ASA Owner Approved Pinned Release
run-name: Owner approved release 0d182b88

"on":
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: asa-owner-release-0d182b88
  cancel-in-progress: false

jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0d182b88a52440358b99c98bd277110dc761100c
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tools/deployment -p "test_*.py" -v
      - run: python tools/test_collect_logs.py
  gate:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/spikeal8-maker/asa-lab/actions/runs/40228416329 > /tmp/focused.json
          python - <<'PYVERIFY'
          import json, os
          r=json.load(open('/tmp/focused.json'))
          sha='0d182b88a52440358b99c98bd277110dc761100c'
          assert r['head_sha']==sha and r['status']=='completed' and r['conclusion']=='success'
          assert r['path']=='.github/workflows/account-confirmation-focused.yml'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('revision='+sha+'\n')
          PYVERIFY
          echo 'Owner explicitly approved cancelled general-CI exception for 0d182b88; all image and backup/restore checks retained.' >> "$GITHUB_STEP_SUMMARY"
  build:
    needs: [gate, contracts]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        include:
          - {service: api, file: Dockerfile.api, target: runtime}
          - {service: web, file: Dockerfile.web, target: runtime}
          - {service: scratch, file: infra/scratch-editor/Dockerfile, target: ''}
          - {service: minio, file: infra/minio/Dockerfile, target: ''}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.revision }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ matrix.service != 'web' }}
          load: ${{ matrix.service == 'web' }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ needs.gate.outputs.revision }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            ASA_BUILD_REVISION=${{ needs.gate.outputs.revision }}
            ASA_BLOCKS_PARENT_ORIGIN=http://127.0.0.1:4610
            ASA_BLOCKS_RUNTIME_ORIGIN=http://localhost:4613
          cache-from: type=gha,scope=portable-${{ matrix.service }}
          cache-to: type=gha,scope=portable-${{ matrix.service }},mode=max
      - name: Export encrypted symbols from the exact web build
        if: matrix.service == 'web'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          target: web-symbols
          platforms: linux/amd64
          outputs: type=local,dest=.asa/web-symbols
          build-args: |
            ASA_BUILD_REVISION=${{ needs.gate.outputs.revision }}
            ASA_BLOCKS_PARENT_ORIGIN=http://127.0.0.1:4610
            ASA_BLOCKS_RUNTIME_ORIGIN=http://localhost:4613
          cache-from: type=gha,scope=portable-web
      - name: Verify exported symbols before publishing the web image
        if: matrix.service == 'web'
        env:
          WEB_IMAGE: ghcr.io/${{ github.repository }}/web:${{ needs.gate.outputs.revision }}
          REVISION: ${{ needs.gate.outputs.revision }}
        run: |
          symbolWebId=$(docker create "$WEB_IMAGE")
          docker cp "$symbolWebId:/srv" .asa/web-runtime
          docker rm "$symbolWebId"
          node tools/verify-web-symbols.mjs .asa/web-runtime ".asa/web-symbols/web-symbols-$REVISION.manifest.json" "$REVISION"
      - name: Retain encrypted maps (no plaintext in public repository artifacts)
        if: matrix.service == 'web'
        uses: actions/upload-artifact@v4
        with:
          name: web-symbols-${{ needs.gate.outputs.revision }}
          path: .asa/web-symbols/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish verified web image
        if: matrix.service == 'web'
        env:
          WEB_IMAGE: ghcr.io/${{ github.repository }}/web:${{ needs.gate.outputs.revision }}
        run: docker push "$WEB_IMAGE"
  publish:
    needs: [gate, build]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ASA_BUILD_REVISION: ${{ needs.gate.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.revision }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: python -m unittest discover -s tools/deployment -p "test_*.py" -v
      - run: python tools/deployment/ci_manifest.py
      - name: Verify the exact images before promoting stable
        run: python tools/deployment/ci_smoke.py .asa/release/release.json
      - uses: docker/build-push-action@v6
        with:
          context: .asa/release
          file: infra/deployment/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}/deployment:${{ needs.gate.outputs.revision }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
