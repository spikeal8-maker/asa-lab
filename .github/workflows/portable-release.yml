name: ASA Portable Release
run-name: Release ${{ github.event.workflow_run.head_sha || github.sha }}

'on':
  workflow_run:
    workflows: ['ASA Lab Governance and Code Gates']
    branches: [main]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: asa-stable-release
  cancel-in-progress: false

jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tools/deployment -p "test_*.py" -v
      - run: python tools/test_collect_logs.py
  gate:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          python - <<'PY'
          import json, os, subprocess, time
          for attempt in range(90):
              runs = json.loads(subprocess.check_output(['gh', 'api', 'repos/' + os.environ['REPOSITORY'] + '/actions/runs?head_sha=' + os.environ['REVISION'] + '&branch=main&per_page=100']))['workflow_runs']
              complete = True
              for name in ('ASA Lab Governance and Code Gates', 'Runtime Image Security'):
                  required = sorted((r for r in runs if r['name'] == name and r['head_sha'] == os.environ['REVISION'] and r['head_branch'] == 'main'), key=lambda r: (r['run_number'], r.get('run_attempt', 0)), reverse=True)
                  if not required or required[0]['status'] != 'completed':
                      complete = False
                  else:
                      assert required[0]['conclusion'] == 'success', 'Exact-SHA required CI failed: ' + name
              if complete:
                  break
              assert attempt < 89, 'Timed out waiting for exact-SHA security/general CI'
              time.sleep(20)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('revision=' + os.environ['REVISION'] + '\n')
          PY
  build:
    needs: [gate, contracts]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        include:
          - { service: api, file: Dockerfile.api, target: runtime }
          - { service: postgres, file: infra/postgres/Dockerfile, target: runtime }
          - { service: web, file: Dockerfile.web, target: runtime }
          - { service: scratch, file: infra/scratch-editor/Dockerfile, target: '' }
          - { service: minio, file: infra/minio/Dockerfile, target: '' }
          - { service: search, file: infra/search/Dockerfile, target: '' }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.revision }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ !contains(fromJSON('["api","web","postgres"]'), matrix.service) }}
          load: ${{ contains(fromJSON('["api","web","postgres"]'), matrix.service) }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ needs.gate.outputs.revision }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            ASA_BUILD_REVISION=${{ needs.gate.outputs.revision }}
            ASA_BLOCKS_PARENT_ORIGIN=http://127.0.0.1:4610
            ASA_BLOCKS_RUNTIME_ORIGIN=http://localhost:4613
          cache-from: type=gha,scope=portable-${{ matrix.service }}
          cache-to: type=gha,scope=portable-${{ matrix.service }},mode=max
      - name: Qualify the actual published PostgreSQL image
        if: matrix.service == 'postgres'
        env:
          IMAGE: ghcr.io/${{ github.repository }}/postgres:${{ needs.gate.outputs.revision }}
        run: python tools/deployment/ci_postgres_security_smoke.py "$IMAGE"
      - name: Scan the actual runtime image before publication
        if: contains(fromJSON('["api","web","postgres"]'), matrix.service)
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ needs.gate.outputs.revision }}
        run: |
          curl -fsSL https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz -o "$RUNNER_TEMP/trivy.tar.gz"
          printf '%s  %s\n' c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0 "$RUNNER_TEMP/trivy.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          "$RUNNER_TEMP/trivy" image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --timeout 10m --format json --output scan-published-runtime.json "$IMAGE"
          python - <<'PY'
          import json
          operating_system = json.load(open('scan-published-runtime.json')).get('Metadata', {}).get('OS', {})
          assert operating_system.get('Family') in ('debian', 'alpine')
          assert not operating_system.get('EOSL', False)
          PY
      - name: Retain actual publication scan evidence
        if: always() && contains(fromJSON('["api","web","postgres"]'), matrix.service)
        uses: actions/upload-artifact@v4
        with:
          name: published-security-${{ matrix.service }}-${{ needs.gate.outputs.revision }}
          path: scan-published-runtime.json
          if-no-files-found: warn
      - name: Export encrypted symbols from the exact web build
        if: matrix.service == 'web'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          target: web-symbols
          platforms: linux/amd64
          outputs: type=local,dest=.asa/web-symbols
          build-args: |
            ASA_BUILD_REVISION=${{ needs.gate.outputs.revision }}
            ASA_BLOCKS_PARENT_ORIGIN=http://127.0.0.1:4610
            ASA_BLOCKS_RUNTIME_ORIGIN=http://localhost:4613
          cache-from: type=gha,scope=portable-web
      - name: Verify exported symbols before publishing the web image
        if: matrix.service == 'web'
        env:
          WEB_IMAGE: ghcr.io/${{ github.repository }}/web:${{ needs.gate.outputs.revision }}
          REVISION: ${{ needs.gate.outputs.revision }}
        run: |
          symbolWebId=$(docker create "$WEB_IMAGE")
          docker cp "$symbolWebId:/srv" .asa/web-runtime
          docker rm "$symbolWebId"
          node tools/verify-web-symbols.mjs .asa/web-runtime ".asa/web-symbols/web-symbols-$REVISION.manifest.json" "$REVISION"
      - name: Retain encrypted maps (no plaintext in public repository artifacts)
        if: matrix.service == 'web'
        uses: actions/upload-artifact@v4
        with:
          name: web-symbols-${{ needs.gate.outputs.revision }}
          path: .asa/web-symbols/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish scanned runtime image
        if: contains(fromJSON('["api","web","postgres"]'), matrix.service)
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ needs.gate.outputs.revision }}
        run: docker push "$IMAGE"
  publish:
    needs: [gate, build]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ASA_BUILD_REVISION: ${{ needs.gate.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.revision }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: python -m unittest discover -s tools/deployment -p "test_*.py" -v
      - run: python tools/deployment/ci_manifest.py
      - name: Verify the exact images before promoting stable
        run: python tools/deployment/ci_smoke.py .asa/release/release.json
      - name: Prevent a delayed workflow from rolling the channel backward
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'tools')
          from deployment.system import run
          from deployment.contracts import require
          latest = run(['git', 'ls-remote', 'origin', 'refs/heads/main'], capture=True).split()[0]
          require(latest == os.environ['ASA_BUILD_REVISION'], 'STALE_RELEASE',
                  'Main advanced during the build; keep stable unchanged and publish the next green main.')
          PY
      - uses: docker/build-push-action@v6
        with:
          context: .asa/release
          file: infra/deployment/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}/deployment:${{ needs.gate.outputs.revision }}
            ghcr.io/${{ github.repository }}/deployment:stable
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
