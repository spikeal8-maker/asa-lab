name: FRP Health Contract

on:
  pull_request:
    paths:
      - 'tools/deployment/frp-release.json'
      - 'tools/frp-client-stage.ps1'
      - 'tools/test_frp_health_contract.py'
      - 'docs/deployment/FRP_HEALTH_COUNTER.md'
      - '.github/workflows/frp-health-contract.yml'
  push:
    branches: [main]
    paths:
      - 'tools/deployment/frp-release.json'
      - 'tools/frp-client-stage.ps1'
      - 'tools/test_frp_health_contract.py'
      - 'docs/deployment/FRP_HEALTH_COUNTER.md'
      - '.github/workflows/frp-health-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frp-health-contract-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Real FRP baseline, candidate, HTTP, reconnect and native Windows staging
        run: python tools/test_frp_health_contract.py --output-dir tmp/frp-health-contract
      - name: Preserve bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frp-health-contract-${{ matrix.os }}
          path: tmp/frp-health-contract
          if-no-files-found: error
          retention-days: 14
