name: Temporary AI CSS normalization
"on":
  push:
    branches:
      - feature/ai-chat-gpt-integration-20261014
    paths:
      - .github/workflows/ai-css-normalize-once.yml
permissions:
  contents: write
jobs:
  normalize:
    if: github.repository == 'spikeal8-maker/asa-lab' && github.ref == 'refs/heads/feature/ai-chat-gpt-integration-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-chat-gpt-integration-20261014
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Converge donor CSS with strict Prettier check
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            echo "Attempt $attempt"
            pnpm exec prettier --write apps/web/src/ai/izo-chat-design.css
            if pnpm exec prettier --check apps/web/src/ai/izo-chat-design.css; then
              echo "Prettier stable"
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Prettier not idempotent for donor CSS; needs manual investigation"
              exit 1
            fi
          done
          git add apps/web/src/ai/izo-chat-design.css
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(ai): converge donated CSS formatting"
            git push origin HEAD:refs/heads/feature/ai-chat-gpt-integration-20261014
          fi
