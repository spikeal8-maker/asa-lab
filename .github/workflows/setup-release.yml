name: ASA Unified Setup
run-name: Setup ${{ github.event.pull_request.head.sha || github.sha }}

'on':
  pull_request:
    paths:
      - 'asa-setup.sh'
      - 'tools/asa_setup*.py'
      - 'tools/deployment/**'
      - 'tools/asa_manager.py'
      - 'docs/deployment/UNIFIED_SETUP.md'
      - '.github/workflows/setup-release.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish an attested installer release from this exact green main commit (creates a setup tag)'
        type: boolean
        default: false
      docker_acceptance:
        description: 'Run the disposable Docker synthetic backup/restore test'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: asa-setup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Same focused contract gate as local review
        run: python -m unittest discover -s tools/deployment -p 'test_*.py' -v
      - name: Check launcher and whitespace
        run: |
          bash -n asa-setup.sh
          git diff --check
      - name: Assemble immutable candidate (does not publish)
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tools/deployment/setup_bundle.py build --revision "$SOURCE_REVISION" --output "dist/asa-setup-$SOURCE_REVISION.tar.gz"
          python tools/deployment/setup_bundle.py inspect --revision "$SOURCE_REVISION" --archive "dist/asa-setup-$SOURCE_REVISION.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: asa-setup-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/asa-setup-*.tar.gz
          if-no-files-found: error
          retention-days: 30

  docker-synthetic:
    needs: contracts
    if: github.event_name == 'pull_request' || inputs.docker_acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install AGE only in the disposable CI runner
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends age
      - name: Prepare the pinned real browser acceptance component
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Run real synthetic complete backup and restore
        env:
          GH_TOKEN: ${{ github.token }}
          NX_SKIP_NX_CACHE: 'true'
        run: python tools/deployment/ci_setup_smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: asa-setup-synthetic-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/setup-synthetic/evidence.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [contracts, docker-synthetic]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      attestations: write
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Require the exact published application and green canonical CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from deployment.contracts import require, validate_release
          from deployment.releases import assert_ci
          from deployment.system import run
          revision = os.environ['GITHUB_SHA']
          reference = 'ghcr.io/spikeal8-maker/asa-lab/deployment:' + revision
          run(['docker', 'pull', reference], capture=True)
          image = run(['docker', 'image', 'inspect', '--format', '{{.Id}}', reference], capture=True)
          container = run(['docker', 'create', '--network', 'none', image, '/not-executed'], capture=True)
          try:
              with tempfile.TemporaryDirectory(prefix='setup-release-') as directory:
                  manifest = Path(directory) / 'release.json'
                  run(['docker', 'cp', container + ':/release.json', str(manifest)], capture=True)
                  release = validate_release(json.loads(manifest.read_text()))
                  require(release['revision'] == revision, 'RELEASE_REVISION', 'Published application differs from the setup source.')
                  assert_ci(release)
          finally:
              run(['docker', 'rm', container], capture=True)
          PY
      - name: Build complete distribution
        run: python tools/deployment/setup_bundle.py build --revision "$GITHUB_SHA" --output "dist/asa-setup-$GITHUB_SHA.tar.gz"
      - name: Attest repository, workflow, source and exact artifact bytes
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/asa-setup-*.tar.gz
      - name: Publish only by this explicit manual choice, never overwrite a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          revision = os.environ['GITHUB_SHA']
          Path('dist/release-notes.md').write_text(
              'ASA Lab unified setup\n\nSource: `' + revision + '`\n\n'
              'Verify the GitHub artifact attestation before executing privileged code. '
              'Required signer: spikeal8-maker/asa-lab/.github/workflows/setup-release.yml; '
              'source ref: refs/heads/main; exact source digest: ' + revision + '.\n\n'
              'A published artifact does not itself prove acceptance on an existing '
              'server or a clean Ubuntu 24.04 host with 1Panel. See UNIFIED_SETUP.md.\n',
              encoding='utf-8')
          PY
          gh release create "setup-$GITHUB_SHA" "dist/asa-setup-$GITHUB_SHA.tar.gz" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ASA Setup $GITHUB_SHA" --notes-file dist/release-notes.md
