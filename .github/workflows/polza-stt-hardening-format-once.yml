name: One-time Polza STT security and UI formatting
on:
  push:
    branches:
      - feature/asa-polza-transcription-admin-20261029
    paths:
      - .github/workflows/polza-stt-hardening-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format scoped changes only
        run: pnpm exec prettier --write apps/api/src/ai-polza.service.ts apps/api/src/ai-polza.controller.ts apps/api/src/ai-polza.spec.ts apps/web/src/ai/AiVoiceInput.tsx apps/web/src/ai/ai-voice-input.spec.tsx apps/web/src/admin/ai-admin.css apps/web/src/admin/ai-media-admin.css apps/web/src/admin/AdminAiTranscription.tsx
      - name: Commit scoped formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/api/src/ai-polza.service.ts apps/api/src/ai-polza.controller.ts apps/api/src/ai-polza.spec.ts apps/web/src/ai/AiVoiceInput.tsx apps/web/src/ai/ai-voice-input.spec.tsx apps/web/src/admin/ai-admin.css apps/web/src/admin/ai-media-admin.css apps/web/src/admin/AdminAiTranscription.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'style(ai-stt): format secure Polza API and responsive controls'
            git push origin 'HEAD:refs/heads/feature/asa-polza-transcription-admin-20261029'
          fi
