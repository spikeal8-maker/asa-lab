name: Verify published README
on:
  push:
    branches: [docs/readme-materials-20260907]
    paths: [.github/workflows/readme-materials-import.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install browser inspection tools
        run: |
          python -m pip install playwright==1.55.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Verify published files and capture GitHub page
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, io, json, os, pathlib, re, urllib.request
          from PIL import Image
          from playwright.sync_api import sync_playwright
          repo = 'spikeal8-maker/asa-lab'
          expected_commit = '45a480cfaeebd434b8c5af7960557512c43af007'
          expected_readme = '15b6f670b9529ca668162ad95e8309ac0dcaadc6'
          root = 'e2e/artifacts/readme-2026-09-07/'
          out = pathlib.Path('readme-verification')
          out.mkdir(exist_ok=True)
          def api(path):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + path, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'ASA-Lab-README-verification'})
              with urllib.request.urlopen(request, timeout=90) as response:
                  return json.load(response)
          main_sha = api('/git/ref/heads/main')['object']['sha']
          readme_record = api('/contents/README.md?ref=main')
          assert readme_record['sha'] == expected_readme, 'README changed since publication'
          readme = base64.b64decode(readme_record['content']).decode()
          assert 'https://vk.ru/asalabru' in readme and 'https://asa-lab.ru/' in readme
          assert 'docker-electronics.png' not in readme
          manifest_record = api('/contents/' + root + 'manifest.json?ref=main')
          manifest = json.loads(base64.b64decode(manifest_record['content']))
          report = {'main_commit': main_sha, 'published_commit': expected_commit, 'readme_blob': expected_readme, 'images': []}
          for entry in manifest['assets']:
              url = 'https://raw.githubusercontent.com/' + repo + '/' + main_sha + '/' + root + entry['file']
              with urllib.request.urlopen(url, timeout=90) as response:
                  data = response.read()
              assert hashlib.sha256(data).hexdigest() == entry['sha256'], entry['file'] + ': SHA-256 mismatch'
              with Image.open(io.BytesIO(data)) as image:
                  image.load()
                  assert image.format == 'PNG'
                  assert image.size == (entry['width'], entry['height'])
              assert len(data) == entry['bytes']
              report['images'].append({'file': entry['file'], 'sha256_match': True, 'decode': 'PASS', 'size': len(data), 'width': entry['width'], 'height': entry['height']})
          print('All seven remote PNG files decode and match the original checksums.')
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={'width': 1440, 'height': 1000}, device_scale_factor=1)
              url = 'https://github.com/' + repo + '/tree/' + expected_commit
              page.goto(url, wait_until='domcontentloaded', timeout=90000)
              article = page.locator('article.markdown-body').first
              article.wait_for(timeout=45000)
              assert article.get_by_text('Сообщество ВКонтакте', exact=True).count() > 0
              images = article.locator('img[src*="readme-2026-09-07"]')
              assert images.count() == 7, 'Expected seven new images on the rendered page'
              image_states = []
              for image in images.all():
                  image.scroll_into_view_if_needed()
                  image.evaluate('(img) => img.complete ? Promise.resolve() : new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; })')
                  state = image.evaluate('(img) => ({src: img.getAttribute("src"), width: img.naturalWidth, height: img.naturalHeight, renderedWidth: img.getBoundingClientRect().width})')
                  assert state['width'] > 1500, state
                  image_states.append(state)
              report['rendered_images'] = image_states
              article.screenshot(path=str(out / 'github-readme-desktop.png'), timeout=90000)
              article.scroll_into_view_if_needed()
              page.screenshot(path=str(out / 'github-desktop-viewport.png'))
              report['desktop'] = {'viewport_width': 1440, 'horizontal_overflow': page.evaluate('document.documentElement.scrollWidth > window.innerWidth')}
              page.set_viewport_size({'width': 390, 'height': 844})
              page.wait_for_timeout(1500)
              article.screenshot(path=str(out / 'github-readme-mobile.png'), timeout=90000)
              report['mobile'] = {'viewport_width': 390, 'horizontal_overflow': page.evaluate('document.documentElement.scrollWidth > window.innerWidth')}
              (out / 'github-readme.html').write_text(article.inner_html(), encoding='utf-8')
              browser.close()
          (out / 'verification.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2))
      - name: Save inspection screenshots and verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asa-lab-published-readme-verification
          path: readme-verification/
          retention-days: 7
