name: One-time SQL parser repair
"on":
  push:
    branches:
      - feature/ai-chat-gpt-integration-20261014
    paths:
      - .github/workflows/ai-sql-repair-once.yml
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'spikeal8-maker/asa-lab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-chat-gpt-integration-20261014
          persist-credentials: true
      - name: Fix SQL dollar-quote pair and verify balanced delimiters
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("migrations/0213_ai_assistant_text_chat.sql")
          s = p.read_text(encoding="utf-8")
          single = "AS " + chr(36) + "\n"
          double = "AS " + chr(36) * 2 + "\n"
          assert s.count(single) == 2, f"Unexpected malformed SQL delimiters: {s.count(single)}"
          fixed = s.replace(single, double)
          assert fixed.count(chr(36) * 2) == 18, "Function SQL quotes are not balanced"
          p.write_text(fixed, encoding="utf-8")
          PY
          git diff --check
          git add -- migrations/0213_ai_assistant_text_chat.sql
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ai): restore two SQL dollar-quote pairs for migration 0213"
          git push origin HEAD:refs/heads/feature/ai-chat-gpt-integration-20261014
