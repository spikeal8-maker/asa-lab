server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Scratch GUI's playground build uses relative public paths, so it is safe
    # to serve as an isolated origin during M0 without rewriting bundle URLs.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
