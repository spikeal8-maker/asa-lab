name: ${COMPOSE_PROJECT_NAME:-asa-lab}

services:
  postgres:
    image: postgres:17.7-bookworm
    user: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asalab}
      POSTGRES_USER: ${POSTGRES_USER:-asalab_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asa-local-admin-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - database
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  migration:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: runtime
      args:
        ASA_BUILD_REVISION: ${ASA_BUILD_REVISION:-unknown}
    image: asa-lab-api:${ASA_IMAGE_TAG:-local}
    entrypoint: ['/app/docker/migrate-entrypoint.sh']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL-}
      MIGRATION_EXPECT_DATABASE: ${MIGRATION_EXPECT_DATABASE-}
      MIGRATION_CONFIRM: ${MIGRATION_CONFIRM-}
      ASA_APP_DB_PASSWORD: ${ASA_APP_DB_PASSWORD:-asa-local-runtime-change-me}
      ASA_SEED_DEV: ${ASA_SEED_DEV:-false}
      ASA_SEED_WORKSPACE: ${ASA_SEED_WORKSPACE:-school-1580}
      ASA_SEED_TEACHER_EMAIL: ${ASA_SEED_TEACHER_EMAIL:-teacher@school-1580.local}
      ASA_SEED_TEACHER_PASSWORD: ${ASA_SEED_TEACHER_PASSWORD:-asa-local-teacher-change-me}
      LOCALAPPDATA: /tmp/asa-lab-devenv
    tmpfs:
      - /tmp
    read_only: true
    user: node
    networks:
      - database
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${ASA_OBJECT_STORAGE_ACCESS_KEY:-asa-local-blocks}
      MINIO_ROOT_PASSWORD: ${ASA_OBJECT_STORAGE_SECRET_KEY:-asa-local-blocks-secret-change-me}
    volumes:
      - blocks-object-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - application
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    environment:
      ASA_OBJECT_STORAGE_ACCESS_KEY: ${ASA_OBJECT_STORAGE_ACCESS_KEY:-asa-local-blocks}
      ASA_OBJECT_STORAGE_SECRET_KEY: ${ASA_OBJECT_STORAGE_SECRET_KEY:-asa-local-blocks-secret-change-me}
      ASA_OBJECT_STORAGE_BUCKET: ${ASA_OBJECT_STORAGE_BUCKET:-asa-blocks}
    entrypoint:
      - /bin/sh
      - -eu
      - -c
      - >-
        mc alias set local http://minio:9000 "$$ASA_OBJECT_STORAGE_ACCESS_KEY" "$$ASA_OBJECT_STORAGE_SECRET_KEY";
        mc mb --ignore-existing "local/$$ASA_OBJECT_STORAGE_BUCKET";
        mc anonymous set none "local/$$ASA_OBJECT_STORAGE_BUCKET"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    networks:
      - application
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: runtime
      args:
        ASA_BUILD_REVISION: ${ASA_BUILD_REVISION:-unknown}
    image: asa-lab-api:${ASA_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 4611
      ASA_WEB_PORT: ${ASA_WEB_PORT:-4610}
      ASA_EXPECTED_SCHEMA_VERSION: ${ASA_EXPECTED_SCHEMA_VERSION:-}
      APP_DATABASE_URL: ${APP_DATABASE_URL:-postgres://asalab_app:asa-local-runtime-change-me@postgres:5432/asalab}
      ASA_SETTINGS_ENCRYPTION_KEY: ${ASA_SETTINGS_ENCRYPTION_KEY:-}
      ASA_BLOCKS_RUNTIME_SIGNING_KEY: ${ASA_BLOCKS_RUNTIME_SIGNING_KEY:-}
      ASA_BLOCKS_RUNTIME_ORIGIN: ${ASA_BLOCKS_RUNTIME_ORIGIN:-http://localhost:${ASA_BLOCKS_PORT:-4613}}
      ASA_OBJECT_STORAGE_ENDPOINT: ${ASA_OBJECT_STORAGE_ENDPOINT:-http://minio:9000}
      ASA_OBJECT_STORAGE_REGION: ${ASA_OBJECT_STORAGE_REGION:-us-east-1}
      ASA_OBJECT_STORAGE_BUCKET: ${ASA_OBJECT_STORAGE_BUCKET:-asa-blocks}
      ASA_OBJECT_STORAGE_ACCESS_KEY: ${ASA_OBJECT_STORAGE_ACCESS_KEY:-asa-local-blocks}
      ASA_OBJECT_STORAGE_SECRET_KEY: ${ASA_OBJECT_STORAGE_SECRET_KEY:-asa-local-blocks-secret-change-me}
      ASA_OBJECT_STORAGE_FORCE_PATH_STYLE: ${ASA_OBJECT_STORAGE_FORCE_PATH_STYLE:-true}
      ASA_TRUSTED_PROXY_CIDRS: ${ASA_TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      ASA_BLOCKS_PREVIEW: ${ASA_BLOCKS_PREVIEW:-0}
    expose:
      - '4611'
    tmpfs:
      - /tmp
    read_only: true
    user: node
    networks:
      - application
      - database
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: runtime
      args:
        ASA_BUILD_REVISION: ${ASA_BUILD_REVISION:-unknown}
        ASA_BLOCKS_PREVIEW: ${ASA_BLOCKS_PREVIEW:-0}
        ASA_BLOCKS_RUNTIME_ORIGIN: ${ASA_BLOCKS_RUNTIME_ORIGIN:-http://localhost:${ASA_BLOCKS_PORT:-4613}}
    image: asa-lab-web:${ASA_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
      scratch:
        condition: service_healthy
    ports:
      - '127.0.0.1:${ASA_WEB_PORT:-4610}:8080'
    tmpfs:
      - /tmp
    read_only: true
    user: '65534:65534'
    networks:
      - application
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  scratch:
    build:
      context: .
      dockerfile: infra/scratch-editor/Dockerfile
      args:
        ASA_BUILD_REVISION: ${ASA_BUILD_REVISION:-unknown}
        ASA_BLOCKS_PARENT_ORIGIN: ${ASA_BLOCKS_PARENT_ORIGIN:-http://127.0.0.1:${ASA_WEB_PORT:-4610}}
    image: asa-lab-scratch:${ASA_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    user: '101:101'
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0700,size=64m
      - /var/run:uid=101,gid=101,mode=0700,size=8m
    ports:
      - '127.0.0.1:${ASA_BLOCKS_PORT:-4613}:8080'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - scratch-runtime

networks:
  # Dedicated bridge: no API/DB membership. It must permit the loopback published port.
  scratch-runtime:
  application:
  database:
    internal: true

volumes:
  postgres-data:
  blocks-object-data:
